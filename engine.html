<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Trading Engine</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608;--bg2:#0a0c10;--bg3:#0f1216;
  --bd:rgba(255,255,255,.06);--bdh:rgba(255,255,255,.14);
  --ac:#00ffd5;--acD:rgba(0,255,213,.08);
  --g:#00ff88;--r:#ff2a5f;--y:#ffcc00;--b:#00d4ff;--p:#8b5cf6;
  --t1:#eaeaea;--t2:#a0a4ac;--t3:#6b7280;
  --ui:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --tr:all .2s cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);color:var(--t1);font-family:var(--ui);overflow:hidden;font-size:12px}
#app{display:grid;grid-template-rows:42px 1fr;width:100vw;height:100vh;overflow:hidden}

#top{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;overflow-y:visible;scrollbar-width:none;flex-shrink:0;position:relative;z-index:100}
#top::-webkit-scrollbar{display:none}
.ci{background:rgba(0,0,0,.6);border:1px solid rgba(0,255,213,.22);color:#fff;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono);text-transform:uppercase;width:82px;text-align:center;transition:var(--tr);flex-shrink:0}
.ci:focus{outline:none;border-color:var(--ac);box-shadow:0 0 12px var(--acD)}
.tfs{display:flex;gap:1px;background:rgba(0,0,0,.5);padding:2px;border-radius:5px;border:1px solid var(--bd);flex-shrink:0}
.tf{background:transparent;border:none;color:var(--t3);padding:4px 7px;border-radius:3px;font-size:10px;font-weight:700;font-family:var(--mono);cursor:pointer;transition:var(--tr)}
.tf:hover{color:#fff;background:rgba(255,255,255,.05)}
.tf.active{background:var(--acD);color:var(--ac)}
.sp{flex:1;min-width:6px}
.hud{display:flex;gap:14px;align-items:center;flex-shrink:0}
.hud-it{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.hud-lb{font-size:7px;color:var(--t3);letter-spacing:1px;font-weight:700}
.hud-vl{font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:-.3px}
.ib{background:transparent;border:1px solid var(--bd);color:var(--t3);width:28px;height:28px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:var(--tr);flex-shrink:0}
.ib:hover{color:var(--ac);border-color:var(--ac);background:var(--acD)}
.ib.active{color:var(--ac);border-color:var(--ac);background:var(--acD)}

.ddm{position:fixed;z-index:9999;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:3px;min-width:180px;display:none;box-shadow:0 16px 44px rgba(0,0,0,.85);animation:mi .14s cubic-bezier(.16,1,.3,1)}
.ddm.open{display:block}
@keyframes mi{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.ddh{padding:5px 9px 3px;font-size:8px;font-weight:800;color:var(--t3);letter-spacing:1.3px;text-transform:uppercase}
.ddi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:4px;font-size:10px;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--tr)}
.ddi:hover{background:var(--acD);color:var(--ac)}
.ddi.on{color:var(--ac);background:rgba(0,255,213,.04)}
.ddi i{width:12px;font-size:10px;text-align:center}
.ddi .chk{width:10px;font-size:8px;color:var(--ac);opacity:0;transition:var(--tr)}
.ddi.on .chk{opacity:1}
.ddsep{height:1px;background:var(--bd);margin:3px 0}

#main{display:flex;overflow:hidden;min-height:0}
#stack{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative;min-width:0}
#ctrl{width:200px;background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;padding:8px;gap:8px;scrollbar-width:thin}
#ctrl::-webkit-scrollbar{width:4px}
#ctrl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

.lb{background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.lb-hd{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);padding-bottom:5px;border-bottom:1px solid var(--bd)}
.lb-hd i{font-size:10px}
.lb-hd.alert i{color:var(--b)}
.lb-hd.vol i{color:#fff}
.lb-hd.liq i{color:var(--r)}
.lb-hd .cnt{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--r);font-weight:700}
.lb-row{display:flex;gap:4px;align-items:center}
.lb-lbl{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.5px;flex-shrink:0}
.lb-in{flex:1;min-width:0;background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--t1);padding:4px 6px;border-radius:4px;font-size:10px;font-family:var(--mono);text-align:right;font-weight:600}
.lb-in:focus{outline:none;border-color:var(--ac)}
.lb-in::-webkit-outer-spin-button,.lb-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lb-in[type=number]{-moz-appearance:textfield}
.lb-btn{flex:1;padding:5px;background:transparent;border:1px solid var(--bd);color:var(--t2);border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.8px;cursor:pointer;transition:var(--tr);font-family:var(--ui);text-transform:uppercase}
.lb-btn:hover{color:var(--ac);border-color:var(--ac);background:var(--acD)}
.lb-btn.set:hover{color:var(--g);border-color:var(--g);background:rgba(0,255,136,.08)}
.lb-btn.clr:hover{color:var(--r);border-color:var(--r);background:rgba(255,42,95,.08)}
.lb-st{font-size:9px;color:var(--t3);text-align:center;font-family:var(--mono);min-height:11px;letter-spacing:.4px}
.lb-st.ok{color:var(--g)}
.lb-st.warn{color:var(--y)}

.lb-liq{flex:1 1 auto;min-height:120px;overflow:hidden}
.liq-feed{flex:1 1 auto;overflow-y:auto;margin:0 -6px;padding:0 6px;min-height:0;scrollbar-width:thin}
.liq-feed::-webkit-scrollbar{width:3px}
.liq-feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.liq-empty{text-align:center;color:var(--t3);font-size:9px;padding:20px 4px;font-family:var(--mono)}
.liq-it{display:grid;grid-template-columns:52px 44px 1fr;gap:4px;padding:4px 2px;font-family:var(--mono);font-size:9px;border-bottom:1px solid rgba(255,255,255,.03);align-items:center;animation:liqIn .3s ease-out;border-radius:3px}
@keyframes liqIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.liq-it .tm{color:var(--t3);font-size:8px;letter-spacing:-.3px}
.liq-it .sd{font-weight:800;font-size:8px;letter-spacing:.3px;padding:1px 3px;border-radius:2px;text-align:center}
.liq-it .sd.long{color:var(--g);background:rgba(0,255,136,.1)}
.liq-it .sd.short{color:var(--r);background:rgba(255,42,95,.1)}
.liq-it .am{font-weight:800;color:var(--t1);text-align:right;font-size:9px}
.liq-it.big .am{color:var(--y);text-shadow:0 0 8px rgba(255,204,0,.4)}

.pnl{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg);flex-shrink:0}
.pnl.main{flex:1 1 auto;min-height:150px}
.pnl.extra{flex:0 0 auto;height:110px}
.pnl-hd{display:flex;align-items:center;justify-content:space-between;height:22px;padding:0 8px;background:rgba(0,0,0,.32);border-bottom:1px solid var(--bd);font-size:9px;font-weight:700;letter-spacing:1px;color:var(--t3);flex-shrink:0;user-select:none}
.pnl-ttl{display:flex;align-items:center;gap:5px;text-transform:uppercase}
.pnl-ttl i{font-size:9px}
.pnl-acts{display:flex;gap:1px;opacity:.5;transition:opacity .2s}
.pnl:hover .pnl-acts{opacity:1}
.pnl-acts button{background:transparent;border:none;color:var(--t3);width:18px;height:18px;border-radius:3px;cursor:pointer;font-size:9px;transition:var(--tr)}
.pnl-acts button:hover{color:var(--ac);background:rgba(255,255,255,.06)}
.pnl-acts button.del:hover{color:var(--r)}
.pnl-body{flex:1;position:relative;min-height:0;overflow:hidden}
.pnl-body>.lw{width:100%;height:100%}

.rz{height:6px;background:transparent;cursor:ns-resize;flex-shrink:0;position:relative;transition:background .15s;touch-action:none}
.rz:hover{background:rgba(0,255,213,.15)}
.rz::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;transition:background .15s}
.rz:hover::after{background:var(--ac)}

#cursor-lbl{position:absolute;display:none;align-items:center;background:rgba(11,14,17,.96);border:1px solid rgba(0,255,213,.4);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:10px;font-weight:700;color:#eaeaea;pointer-events:none;z-index:6;white-space:nowrap;box-shadow:0 2px 14px rgba(0,0,0,.7);transform:translateY(-50%);line-height:1.2}
#cursor-lbl .sep{color:#3a3f47;margin:0 6px;font-weight:400}
#cursor-lbl .pct.pos{color:#00ff88}
#cursor-lbl .pct.neg{color:#ff2a5f}
#cursor-lbl .pct.zero{color:#6b7280}

#alert-lbl{position:absolute;display:none;align-items:center;background:rgba(11,14,17,.96);border:1px solid rgba(0,212,255,.5);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:10px;font-weight:700;color:#eaeaea;pointer-events:none;z-index:7;white-space:nowrap;box-shadow:0 2px 14px rgba(0,0,0,.7);transform:translateY(-50%);line-height:1.2}
#alert-lbl .sep{color:#3a3f47;margin:0 6px;font-weight:400}
#alert-lbl .tag{color:#00d4ff;font-size:8px;letter-spacing:1px;font-weight:800;margin-right:6px}
#alert-lbl .pct.pos{color:#00ff88}
#alert-lbl .pct.neg{color:#ff2a5f}
#alert-lbl .pct.zero{color:#6b7280}

#ctx{position:fixed;z-index:10000;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:3px;display:none;min-width:180px;box-shadow:0 14px 44px rgba(0,0,0,.85)}
#ctx>div{display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:10px;color:var(--t2);cursor:pointer;border-radius:4px;transition:var(--tr)}
#ctx>div:hover{background:var(--acD);color:var(--ac)}
#ctx i{width:12px;text-align:center;font-size:10px}

#ld{position:absolute;inset:0;background:rgba(5,6,8,.9);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:400;pointer-events:none}
#ld.on{display:flex}
.spin{width:28px;height:28px;border:2px solid rgba(0,255,213,.15);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ld .lt{font-size:9px;font-weight:800;letter-spacing:3px;color:var(--ac)}

#tst{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:10000;pointer-events:none}
.tst{background:var(--bg3);border:1px solid var(--bd);border-left:2px solid var(--ac);padding:8px 12px;border-radius:5px;font-size:10px;font-weight:600;color:var(--t1);box-shadow:0 8px 28px rgba(0,0,0,.65);animation:ti .25s cubic-bezier(.16,1,.3,1);pointer-events:auto;max-width:260px}
.tst.e{border-left-color:var(--r)}
.tst.w{border-left-color:var(--y)}
@keyframes ti{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

#mr{position:absolute;display:none;pointer-events:none;z-index:6;border:1px dashed var(--g);background:rgba(0,255,136,.08);border-radius:2px;box-sizing:border-box}
#ml{position:absolute;display:none;pointer-events:none;z-index:9;background:rgba(0,0,0,.92);border:1px solid rgba(0,255,136,.5);padding:3px 7px;border-radius:4px;font-family:var(--mono);font-size:10px;white-space:nowrap;transform:translate(-50%,-100%);text-align:center;font-weight:700;margin-top:-7px}
#ml .pc{font-size:12px;line-height:1.1}
#ml .sb{font-size:8px;color:#999;font-weight:500;margin-top:1px}
#vpc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4}

@media(max-width:720px){
  #top{gap:6px;padding:0 6px}
  .ci{width:64px;font-size:10px;padding:3px 6px}
  .tf{padding:3px 6px;font-size:9px}
  .ib{width:26px;height:26px;font-size:10px}
  .hud-it:not(.keep){display:none}
  .hud-vl{font-size:11px}
  #ctrl{width:150px;padding:6px;gap:6px}
  .lb{padding:6px;gap:5px}
  .lb-in{font-size:9px;padding:3px 5px}
  .lb-btn{font-size:8px;padding:4px}
  .pnl.extra{height:80px}
  #cursor-lbl,#alert-lbl{font-size:9px;padding:2px 6px}
  .liq-it{grid-template-columns:42px 38px 1fr;font-size:8px;padding:3px 1px}
  .liq-it .tm{font-size:7px}
}
@media(max-width:480px){
  #ctrl{width:130px}
  .tf:nth-child(n+5){display:none}
  .liq-it{grid-template-columns:40px 1fr}
  .liq-it .tm{display:none}
}
body.emb #top{gap:6px;padding:0 6px}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <input type="text" id="ci" class="ci" value="BTC" spellcheck="false" maxlength="14" autocomplete="off">
    <div class="tfs" id="tfs">
      <button class="tf" data-tf="1m">1M</button>
      <button class="tf active" data-tf="5m">5M</button>
      <button class="tf" data-tf="15m">15M</button>
      <button class="tf" data-tf="1h">1H</button>
      <button class="tf" data-tf="4h">4H</button>
      <button class="tf" data-tf="1d">1D</button>
    </div>
    <div class="sp"></div>
    <div class="hud">
      <div class="hud-it keep"><span class="hud-lb">PRICE</span><span class="hud-vl" id="hp">--</span></div>
      <div class="hud-it keep"><span class="hud-lb">24H</span><span class="hud-vl" id="hc">--</span></div>
    </div>
    <button class="ib" id="bi" title="Indicators"><i class="fa-solid fa-chart-simple"></i></button>
    <button class="ib" id="bs" title="Chart Style"><i class="fa-solid fa-chart-line"></i></button>
  </header>

  <div id="main">
    <div id="stack">
      <div class="pnl main" id="p-main">
        <div class="pnl-body">
          <div class="lw" id="c-main"></div>
          <canvas id="vpc"></canvas>
          <div id="cursor-lbl"><span class="price">--</span><span class="sep">│</span><span class="pct zero">0.00%</span></div>
          <div id="alert-lbl"><span class="tag">ALERT</span><span class="price">--</span><span class="sep">│</span><span class="pct zero">0.00%</span></div>
          <div id="mr"></div>
          <div id="ml"></div>
        </div>
      </div>
    </div>

    <aside id="ctrl">
      <div class="lb">
        <div class="lb-hd alert"><i class="fa-solid fa-bell"></i><span>Price Alert</span></div>
        <div class="lb-row"><input type="number" id="pa" class="lb-in" placeholder="price" step="any"></div>
        <div class="lb-row">
          <button class="lb-btn set" id="pa-set">Set</button>
          <button class="lb-btn clr" id="pa-clr">Clear</button>
        </div>
        <div class="lb-st" id="pa-st"></div>
      </div>

      <div class="lb">
        <div class="lb-hd vol"><i class="fa-solid fa-chart-bar"></i><span>Volume</span></div>
        <div class="lb-row">
          <span class="lb-lbl">THR</span>
          <input type="number" id="vt" class="lb-in" value="0" step="100">
        </div>
        <div class="lb-st" id="vt-st">off</div>
      </div>

      <div class="lb lb-liq">
        <div class="lb-hd liq"><i class="fa-solid fa-droplet"></i><span>Liq Tracker</span><span class="cnt" id="lq-cnt">0</span></div>
        <div class="lb-row">
          <span class="lb-lbl">MIN $</span>
          <input type="number" id="lq" class="lb-in" value="50000" step="10000">
        </div>
        <div class="liq-feed" id="lq-feed">
          <div class="liq-empty">Waiting for liquidations...</div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="ddm" id="mi">
  
  <div class="ddh">Overlays</div>
  <div class="ddi" data-ov="sma"><span>SMA 20 / 50</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-ov="ema"><span>EMA 12 / 26</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-ov="bb"><span>Bollinger Bands</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddsep"></div>
  <div class="ddh">Tools</div>
  <div class="ddi" data-tool="vp"><span><i class="fa-solid fa-chart-bar"></i> Volume Profile</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-tool="heat"><span><i class="fa-solid fa-fire"></i> Liq Heatmap</span><i class="fa-solid fa-check chk"></i></div>
</div>

<div class="ddm" id="ms">
  <div class="ddh">Chart Style</div>
  <div class="ddi on" data-st="candles"><span>Candles</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-st="hollow"><span>Hollow</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-st="heiken"><span>Heiken Ashi</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-st="line"><span>Line</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-st="area"><span>Area</span><i class="fa-solid fa-check chk"></i></div>
  <div class="ddi" data-st="bars"><span>Bars</span><i class="fa-solid fa-check chk"></i></div>
</div>

<div id="ld"><div class="spin"></div><div class="lt">SYNCING</div></div>
<div id="ctx">
  <div data-a="price"><i class="fa-solid fa-copy" style="color:var(--g)"></i> Copy Price</div>
  <div data-a="shot"><i class="fa-solid fa-camera"></i> Copy Screenshot</div>
  <div data-a="save"><i class="fa-solid fa-download"></i> Save Screenshot</div>
</div>
<div id="tst"></div>

<script>
const ENGINE = (() => {
  'use strict';

  const CFG = {
    rest:'https://fapi.binance.com/fapi/v1',
    spot:'https://api.binance.com/api/v3',
    ws:'wss://fstream.binance.com/market/ws/',
    C:{
      g:'#00ff88', r:'#ff2a5f', y:'#ffcc00', b:'#00d4ff', p:'#8b5cf6',
      vol:'rgba(255,255,255,0.42)',
      spotUp:'#00d4ff', spotDn:'#ff2a5f'
    }
  };
  const LK = 'eng9_layout_v1';
  const SK = 'eng9_settings_v1';

  const S = {
    symbol:'BTCUSDT', tf:'5m', style:'candles', tz:'auto',
    charts:{}, series:{}, panels:{}, order:[],
    prices:[], spotBars:new Map(),
    rawBars:new Map(), oldestTime:null, loadingHist:false,
    oiRaw:[], lsrRaw:[], liqRaw:[], wsK:null, wsL:null,
    liqMarkers:[], heatLines:[],
    overlays:{}, heatOn:false,
    vp:{ en:false, cv:null, ctx:null, w:80, offR:68, lastKey:'' },
    alert:{ price:null, line:null, last:null },
    tg:{ token:'', chat:'' },
    thr:{ liq:50000, vol:0 },
    _sync:false, livePrice:0, _crosshairLock:false,
    _restoreOverlays:[], _restoreVP:false, _restoreHeat:false
  };

  const $  = (s,r=document) => r.querySelector(s);
  const $$ = (s,r=document) => [...r.querySelectorAll(s)];

  const fmtP = p => {
    if(!isFinite(p)) return '--';
    const a = Math.abs(p);
    if(a>=1000) return p.toFixed(2);
    if(a>=100)  return p.toFixed(3);
    if(a>=1)    return p.toFixed(4);
    if(a>=0.01) return p.toFixed(5);
    if(a>=0.0001) return p.toFixed(6);
    if(a>=1e-6) return p.toFixed(8);
    return p.toPrecision(6);
  };
  const fmtU = v => {
    if(v>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
    if(v>=1e6) return '$'+(v/1e6).toFixed(2)+'M';
    if(v>=1e3) return '$'+(v/1e3).toFixed(1)+'K';
    return '$'+v.toFixed(0);
  };
  const toast = (m,k='') => {
    const w = $('#tst');
    const e = document.createElement('div');
    e.className = 'tst '+k; e.textContent = m;
    w.appendChild(e);
    setTimeout(()=>{e.style.opacity='0';e.style.transform='translateX(16px)'},2400);
    setTimeout(()=>e.remove(),2800);
  };
  const load = on => $('#ld').classList.toggle('on', !!on);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const tfSec = tf => ({'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400})[tf]||300;
  const oiPer = tf => ({'1m':'5m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'})[tf]||'5m';

  async function get(url){
    const s = url.includes('?')?'&':'?';
    const r = await fetch(url+s+'t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }

  function applyTz(){
    const tz = S.tz==='auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone : S.tz;
    Object.values(S.charts).forEach(c=>{
      try{ c.applyOptions({ localization:{ timeFormatter: ts =>
        new Date(ts*1000).toLocaleString('en-GB',{ timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false })
      }}); }catch(e){}
    });
  }

  function mkChart(container, opts={}){
    const cross = opts.crosshair || {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine:{ color:'rgba(0,255,213,0.4)', width:1, style:1, labelBackgroundColor:'#0a0c10' },
      horzLine:{ color:'rgba(0,255,213,0.28)', width:1, style:1, labelBackgroundColor:'#0a0c10', labelVisible: opts.hideHzLabel === true ? false : true }
    };
    return LightweightCharts.createChart(container, {
      layout:{ background:{color:'transparent'}, textColor:'#6b7280', fontFamily:'JetBrains Mono, monospace', fontSize:10 },
      grid:{ vertLines:{color:'rgba(255,255,255,0.025)'}, horzLines:{color:'rgba(255,255,255,0.025)'} },
      crosshair: cross,
      timeScale:{ timeVisible:true, secondsVisible:false, borderColor:'rgba(255,255,255,0.06)', rightOffset:6, barSpacing:7, fixLeftEdge:false, lockVisibleTimeRangeOnResize:true, visible: opts.timeAxis !== false },
      rightPriceScale:{ borderColor:'rgba(255,255,255,0.06)', scaleMargins: opts.margins || { top:0.12, bottom:0.12 }, autoScale:true },
      handleScroll:{ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:false },
      handleScale:{ axisPressedMouseMove:true, mouseWheel:true, pinch:true }
    });
  }

  function linkTime(){
    Object.values(S.charts).forEach(src => {
      src.timeScale().subscribeVisibleLogicalRangeChange(range => {
        if(S._sync || !range) return;
        S._sync = true;
        Object.values(S.charts).forEach(dst => {
          if(dst === src) return;
          try{ dst.timeScale().setVisibleLogicalRange(range); }catch(e){}
        });
        S._sync = false;
        updateAlertLabel();
      });
    });
  }

  function updateTimeAxis(){
    const order = ['main', ...S.order];
    const last = order[order.length-1];
    order.forEach(id => {
      const c = S.charts[id];
      if(!c) return;
      try{ c.timeScale().applyOptions({ visible: id === last }); }catch(e){}
    });
  }

  function buildMain(){
    const container = $('#c-main');
    container.innerHTML = '';
    const ch = mkChart(container, { margins:{ top:0.06, bottom:0.28 }, hideHzLabel:true });
    S.charts.main = ch;

    const candle = ch.addCandlestickSeries({
      upColor:CFG.C.g, downColor:CFG.C.r, borderVisible:false,
      wickUpColor:CFG.C.g, wickDownColor:CFG.C.r,
      priceFormat:{ type:'custom', formatter:fmtP, minMove:1e-8 }
    });

    const vol = ch.addHistogramSeries({
      color:CFG.C.vol, priceFormat:{ type:'volume' },
      priceScaleId:'vol', lastValueVisible:false, priceLineVisible:false
    });
    ch.priceScale('vol').applyOptions({ scaleMargins:{ top:0.78, bottom:0 }, visible:false });

    S.series.candle = candle;
    S.series.volume = vol;

    const ro = new ResizeObserver(()=>{
      ch.applyOptions({ width:container.clientWidth, height:container.clientHeight });
    });
    ro.observe(container);
    S._mainRO = ro;

    ch.timeScale().subscribeVisibleLogicalRangeChange(r => {
      if(!r) return;
      if(r.from < 25 && !S.loadingHist && S.oldestTime) loadHistory();
    });

    setupCursorTracker(ch);
    setupGlobalCrosshairSync();
  }

  function setupCursorTracker(ch){
    const lbl = $('#cursor-lbl');
    if(!lbl) return;
    ch.subscribeCrosshairMove(param => {
      if(!param || !param.point || param.time === undefined){ lbl.style.display = 'none'; return; }
      let price;
      try{ price = S.series.candle.coordinateToPrice(param.point.y); }catch(e){ price = null; }
      if(price == null || !isFinite(price)){ lbl.style.display = 'none'; return; }
      const live = S.livePrice || (S.prices.length ? S.prices[S.prices.length-1].close : price);
      const pct = live ? ((price - live) / live) * 100 : 0;
      const cls = pct > 0.005 ? 'pos' : pct < -0.005 ? 'neg' : 'zero';
      const sign = pct > 0 ? '+' : '';
      lbl.querySelector('.price').textContent = fmtP(price);
      const pctEl = lbl.querySelector('.pct');
      pctEl.textContent = sign + pct.toFixed(2) + '%';
      pctEl.className = 'pct ' + cls;
      let pw = 60;
      try{ pw = S.charts.main.priceScale('right').width() || 60; }catch(e){}
      lbl.style.right = (pw + 6) + 'px';
      lbl.style.top = param.point.y + 'px';
      lbl.style.display = 'flex';
    });
  }

  /* Bidirectional crosshair sync — vertical line synced by TIME across all panels */
  function setupGlobalCrosshairSync(){
    Object.entries(S.charts).forEach(([id, ch]) => {
      if(ch._cxHooked) return;
      ch._cxHooked = true;
      ch.subscribeCrosshairMove(param => {
        if(S._crosshairLock) return;
        const time = (param && param.time !== undefined) ? param.time : null;
        S._crosshairLock = true;
        Object.entries(S.charts).forEach(([otherId, otherCh]) => {
          if(otherId === id) return;
          const s = getPrimarySeries(otherId);
          if(!s) return;
          try{
            if(time === null) otherCh.clearCrosshairPosition();
            else otherCh.setCrosshairPosition(0, time, s);
          }catch(e){}
        });
        S._crosshairLock = false;
      });
    });
  }

  function getPrimarySeries(id){
    if(id === 'main') return S.series.candle;
    const p = S.panels[id];
    if(!p) return null;
    const o = p.obj;
    return o.s || o.fut || null;
  }

  function updateAlertLabel(){
    const lbl = $('#alert-lbl');
    if(!lbl) return;
    if(!S.alert.price || !S.charts.main || !S.series.candle){ lbl.style.display = 'none'; return; }
    let y;
    try{ y = S.series.candle.priceToCoordinate(S.alert.price); }catch(e){ y = null; }
    const ct = $('#c-main');
    if(y == null || y < 0 || y > ct.clientHeight){ lbl.style.display = 'none'; return; }
    const live = S.livePrice || 0;
    const pct = live ? ((S.alert.price - live) / live) * 100 : 0;
    const cls = pct > 0.005 ? 'pos' : pct < -0.005 ? 'neg' : 'zero';
    const sign = pct > 0 ? '+' : '';
    lbl.querySelector('.price').textContent = fmtP(S.alert.price);
    const pctEl = lbl.querySelector('.pct');
    pctEl.textContent = sign + pct.toFixed(2) + '%';
    pctEl.className = 'pct ' + cls;
    let pw = 60;
    try{ pw = S.charts.main.priceScale('right').width() || 60; }catch(e){}
    lbl.style.right = (pw + 6) + 'px';
    lbl.style.top = y + 'px';
    lbl.style.display = 'flex';
  }

  /* ═══════════ PANEL DEFS ═══════════ */
  const PDEF = {
    oi:{ t:'OPEN INTEREST', i:'fa-chart-line', c:'#00ff88',
      build(ch){ return { s: ch.addCandlestickSeries({
        upColor:CFG.C.g, downColor:CFG.C.r,
        borderVisible:false,
        wickUpColor:CFG.C.g, wickDownColor:CFG.C.r,
        priceFormat:{ type:'volume' }, lastValueVisible:true, priceLineVisible:false
      }) }; },
      render(o,d){ o.s.setData(d.oiC); }
    },
    oid:{ t:'OI DELTA', i:'fa-exchange', c:'#00ff88',
      build(ch){ return { s: ch.addHistogramSeries({
        priceFormat:{ type:'volume' }, lastValueVisible:false, priceLineVisible:false
      }) }; },
      render(o,d){ o.s.setData(d.oiD); }
    },
    bsd:{ t:'B/S DELTA', i:'fa-layer-group', c:'#00d4ff',
      build(ch){
        const fut = ch.addHistogramSeries({
          priceFormat:{ type:'volume' }, priceScaleId:'bs',
          lastValueVisible:false, priceLineVisible:false
        });
        const spot = ch.addHistogramSeries({
          priceFormat:{ type:'volume' }, priceScaleId:'bs',
          lastValueVisible:false, priceLineVisible:false
        });
        return { fut, spot };
      },
      render(o,d){ o.fut.setData(d.bsdFut); o.spot.setData(d.bsdSpot); }
    },
    lsr:{ t:'L/S RATIO', i:'fa-balance-scale', c:'#00d4ff',
      build(ch){ return { s: ch.addLineSeries({
        color:'#00d4ff', lineWidth:2, lastValueVisible:true, priceLineVisible:false,
        priceFormat:{ type:'price', precision:3, minMove:0.001 }
      }) }; },
      render(o,d){ o.s.setData(d.lsr); }
    },
    rsi:{ t:'RSI (14)', i:'fa-wave-square', c:'#8b5cf6',
      build(ch){
        const s = ch.addLineSeries({
          color:'#8b5cf6', lineWidth:2, lastValueVisible:true, priceLineVisible:false,
          priceFormat:{ type:'price', precision:2, minMove:0.01 }
        });
        s.createPriceLine({ price:70, color:'rgba(139,92,246,0.25)', lineStyle:2, axisLabelVisible:false });
        s.createPriceLine({ price:30, color:'rgba(139,92,246,0.25)', lineStyle:2, axisLabelVisible:false });
        return { s };
      },
      render(o,d){ o.s.setData(d.rsi); }
    }
  };

  function addPanel(type, opts={}){
    if(!PDEF[type]){ toast('Unknown panel: '+type, 'e'); return; }
    if(S.panels[type]){ return; }
    const def = PDEF[type];
    const el = document.createElement('div');
    el.className = 'pnl extra';
    el.id = 'p-'+type;
    el.innerHTML = `
      <div class="rz" data-rz></div>
      <div class="pnl-hd">
        <div class="pnl-ttl"><i class="fa-solid ${def.i}" style="color:${def.c}"></i><span>${def.t}</span></div>
        <div class="pnl-acts">
          <button data-mv="-1" title="Up"><i class="fa-solid fa-chevron-up"></i></button>
          <button data-mv="1" title="Down"><i class="fa-solid fa-chevron-down"></i></button>
          <button data-del class="del" title="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="pnl-body"><div class="lw" id="c-${type}"></div></div>
    `;
    $('#stack').appendChild(el);
    const container = el.querySelector('.lw');
    const ch = mkChart(container, {
      margins:{ top:0.15, bottom:0.15 },
      timeAxis:false,
      crosshair:{
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine:{ color:'rgba(0,255,213,0.4)', width:1, style:1, labelVisible:false },
        horzLine:{ color:'rgba(0,255,213,0.28)', width:1, style:1, labelVisible:false }
      }
    });
    const obj = def.build(ch);
    S.charts[type] = ch;
    S.panels[type] = { type, def, ch, obj, el, container };
    const ro = new ResizeObserver(()=>{
      ch.applyOptions({ width:container.clientWidth, height:container.clientHeight });
    });
    ro.observe(container);
    S.panels[type]._ro = ro;
    el.querySelector('[data-del]').addEventListener('click', ()=>removePanel(type));
    el.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', ()=>movePanel(type, +b.dataset.mv)));
    setupRz(el.querySelector('[data-rz]'), el);
    if(!opts.silent) S.order.push(type);
    if(opts.height) el.style.height = opts.height + 'px';
    linkTime();
    setupGlobalCrosshairSync();  // <-- critical: hook this new chart to crosshair sync
    updateTimeAxis();
    setTimeout(()=>{
      renderPanel(type);
      try{
        const mr = S.charts.main.timeScale().getVisibleLogicalRange();
        if(mr) ch.timeScale().setVisibleLogicalRange(mr);
      }catch(e){}
    }, 30);
    const mi = document.querySelector(`#mi [data-panel="${type}"]`);
    if(mi) mi.classList.add('on');
    if(!opts.silent){ saveLayout(); toast(def.t + ' opened'); }
  }

  function removePanel(type){
    const p = S.panels[type];
    if(!p) return;
    try{ p._ro && p._ro.disconnect(); }catch(e){}
    try{ p.ch.remove(); }catch(e){}
    p.el.remove();
    delete S.charts[type];
    delete S.panels[type];
    S.order = S.order.filter(x => x !== type);
    updateTimeAxis();
    saveLayout();
    toast(PDEF[type].t + ' closed');
    const mi = document.querySelector(`#mi [data-panel="${type}"]`);
    if(mi) mi.classList.remove('on');
  }

  function togglePanel(type){
    if(S.panels[type]) removePanel(type);
    else addPanel(type);
  }

  function movePanel(type, dir){
    const i = S.order.indexOf(type);
    if(i < 0) return;
    const n = i + dir;
    if(n < 0 || n >= S.order.length) return;
    [S.order[i], S.order[n]] = [S.order[n], S.order[i]];
    const st = $('#stack');
    S.order.forEach(t=>{
      const e = document.getElementById('p-'+t);
      if(e) st.appendChild(e);
    });
    updateTimeAxis();
    saveLayout();
  }

  function setupRz(handle, panel){
    let sy=0, sh=0, act=false, pid=null;
    const onDown = e => {
      act = true;
      sy = e.clientY;
      sh = panel.clientHeight;
      pid = e.pointerId;
      try{ handle.setPointerCapture(pid); }catch(err){}
      handle.style.background = 'rgba(0,255,213,0.25)';
      e.preventDefault();
    };
    const onMove = e => {
      if(!act || e.pointerId !== pid) return;
      const d = sy - e.clientY;
      const h = Math.max(50, Math.min(sh + d, window.innerHeight - 160));
      panel.style.height = h + 'px';
    };
    const onUp = e => {
      if(!act) return;
      act = false;
      try{ handle.releasePointerCapture(pid); }catch(err){}
      handle.style.background = '';
      pid = null;
      saveLayout();
    };
    handle.addEventListener('pointerdown', onDown);
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  }

  /* ═══════════ DATA BUILDERS ═══════════ */
  function buildOIC(){
    if(!S.oiRaw.length || !S.prices.length) return [];
    const period = tfSec(oiPer(S.tf));
    const m = new Map();
    S.oiRaw.forEach(o => {
      const t = Math.floor((o.timestamp/1000)/period) * period;
      m.set(t, parseFloat(o.sumOpenInterestValue));
    });
    const out = [];
    let prev = null;
    S.prices.forEach(b => {
      const bucket = Math.floor(b.time/period) * period;
      const v = m.get(bucket);
      if(v == null){ out.push({ time:b.time }); return; }
      const o = prev == null ? v : prev;
      out.push({ time:b.time, open:o, high:Math.max(o,v), low:Math.min(o,v), close:v });
      prev = v;
    });
    return out;
  }
  function buildOID(){
    const cs = buildOIC();
    const out = [];
    let prev = null;
    cs.forEach(c => {
      if(c.close == null){ out.push({ time:c.time }); return; }
      if(prev == null){ out.push({ time:c.time, value:0, color:'#6b7280' }); prev = c.close; return; }
      const d = c.close - prev;
      out.push({ time:c.time, value: d, color: d >= 0 ? CFG.C.g : CFG.C.r });
      prev = c.close;
    });
    return out;
  }
  function buildBSDFutures(){
    return S.prices.map(b => {
      const d = (b.takerBuy||0) - (b.takerSell||0);
      return { time:b.time, value: d, color: d >= 0 ? CFG.C.g : CFG.C.r };
    });
  }
  function buildBSDSpot(){
    if(!S.spotBars.size) return S.prices.map(p => ({ time:p.time, value:0 }));
    return S.prices.map(b => {
      const sp = S.spotBars.get(b.time);
      if(!sp) return { time:b.time, value:0 };
      const d = (sp.takerBuy||0) - (sp.takerSell||0);
      return { time:b.time, value: d, color: d >= 0 ? CFG.C.spotUp : CFG.C.spotDn };
    });
  }
  function buildLSR(){
    if(!S.lsrRaw.length) return S.prices.map(p => ({ time:p.time }));
    const period = tfSec(oiPer(S.tf));
    const m = new Map();
    S.lsrRaw.forEach(o => {
      const t = Math.floor((o.timestamp/1000)/period) * period;
      m.set(t, parseFloat(o.longShortRatio));
    });
    return S.prices.map(p => {
      const bucket = Math.floor(p.time/period) * period;
      const v = m.get(bucket);
      return v == null ? { time:p.time } : { time:p.time, value:v };
    });
  }
  function buildRSI(){
    const out = [];
    let aG=0, aL=0;
    const period = 14;
    for(let i=0;i<S.prices.length;i++){
      if(i === 0){ out.push({ time:S.prices[0].time }); continue; }
      const d = S.prices[i].close - S.prices[i-1].close;
      const g = d>0 ? d : 0;
      const l = d<0 ? -d : 0;
      aG = (aG*(period-1)+g)/period;
      aL = (aL*(period-1)+l)/period;
      if(i < period){ out.push({ time:S.prices[i].time }); continue; }
      out.push({ time:S.prices[i].time, value: 100 - 100/(1 + aG/(aL||1)) });
    }
    return out;
  }
  function renderPanel(type){
    const p = S.panels[type];
    if(!p) return;
    const d = {
      oiC: buildOIC(), oiD: buildOID(),
      bsdFut: buildBSDFutures(), bsdSpot: buildBSDSpot(),
      lsr: buildLSR(), rsi: buildRSI()
    };
    try{ p.def.render(p.obj, d); }catch(e){ console.warn(type, e); }
  }
  function renderAllPanels(){ S.order.forEach(renderPanel); }

  function calcSMA(period){
    const out = [];
    for(let i=0;i<S.prices.length;i++){
      if(i < period-1){ out.push({ time:S.prices[i].time }); continue; }
      let s=0; for(let j=i-period+1;j<=i;j++) s += S.prices[j].close;
      out.push({ time:S.prices[i].time, value: s/period });
    }
    return out;
  }
  function calcEMA(period){
    const k = 2/(period+1);
    const out = []; let ema = null;
    for(let i=0;i<S.prices.length;i++){
      const p = S.prices[i].close;
      ema = ema == null ? p : p*k + ema*(1-k);
      if(i < period-1){ out.push({ time:S.prices[i].time }); continue; }
      out.push({ time:S.prices[i].time, value:ema });
    }
    return out;
  }
  function calcBB(period=20, m=2){
    const up=[], lo=[];
    for(let i=0;i<S.prices.length;i++){
      if(i < period-1){ up.push({ time:S.prices[i].time }); lo.push({ time:S.prices[i].time }); continue; }
      let s=0; for(let j=i-period+1;j<=i;j++) s += S.prices[j].close;
      const mean = s/period;
      let sd=0; for(let j=i-period+1;j<=i;j++) sd += Math.pow(S.prices[j].close-mean, 2);
      sd = Math.sqrt(sd/period);
      up.push({ time:S.prices[i].time, value:mean+sd*m });
      lo.push({ time:S.prices[i].time, value:mean-sd*m });
    }
    return { up, lo };
  }

  function toggleOverlay(kind){
    const el = document.querySelector(`#mi [data-ov="${kind}"]`);
    if(S.overlays[kind]){
      S.overlays[kind].forEach(s => { try{ S.charts.main.removeSeries(s); }catch(e){} });
      delete S.overlays[kind];
      el && el.classList.remove('on');
      toast(kind.toUpperCase()+' off');
      saveLayout();
      return;
    }
    if(!S.prices.length){ toast('No data yet','w'); return; }
    const arr = [];
    if(kind === 'sma'){
      const a = S.charts.main.addLineSeries({ color:'#ffcc00', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      const b = S.charts.main.addLineSeries({ color:'#ff7a00', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      a.setData(calcSMA(20)); b.setData(calcSMA(50));
      arr.push(a, b);
    } else if(kind === 'ema'){
      const a = S.charts.main.addLineSeries({ color:'#00d4ff', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      const b = S.charts.main.addLineSeries({ color:'#8b5cf6', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      a.setData(calcEMA(12)); b.setData(calcEMA(26));
      arr.push(a, b);
    } else if(kind === 'bb'){
      const { up, lo } = calcBB();
      const a = S.charts.main.addLineSeries({ color:'rgba(0,212,255,0.5)', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      const b = S.charts.main.addLineSeries({ color:'rgba(0,212,255,0.5)', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      a.setData(up); b.setData(lo);
      arr.push(a, b);
    }
    S.overlays[kind] = arr;
    el && el.classList.add('on');
    toast(kind.toUpperCase()+' on');
    saveLayout();
  }
  function refreshOverlays(){
    if(S.overlays.sma){ S.overlays.sma[0].setData(calcSMA(20)); S.overlays.sma[1].setData(calcSMA(50)); }
    if(S.overlays.ema){ S.overlays.ema[0].setData(calcEMA(12)); S.overlays.ema[1].setData(calcEMA(26)); }
    if(S.overlays.bb){ const { up, lo } = calcBB(); S.overlays.bb[0].setData(up); S.overlays.bb[1].setData(lo); }
  }

  function setStyle(st){
    S.style = st;
    const c = S.series.candle;
    if(!c) return;
    const g = CFG.C.g, r = CFG.C.r;
    c.applyOptions({ upColor:g, downColor:r, borderUpColor:g, borderDownColor:r, wickUpColor:g, wickDownColor:r, borderVisible:false, visible:true });
    if(S._stS){ try{ S.charts.main.removeSeries(S._stS); }catch(e){} S._stS = null; }
    if(st === 'hollow'){
      c.applyOptions({ upColor:'transparent', borderUpColor:g, wickUpColor:g, downColor:'transparent', borderDownColor:r, wickDownColor:r, borderVisible:true });
      c.setData(S.prices);
    } else if(st === 'heiken'){
      const ha = [];
      S.prices.forEach((p,i)=>{
        if(i===0){ ha.push({ time:p.time, open:p.open, high:p.high, low:p.low, close:p.close }); return; }
        const prev = ha[i-1];
        const o = (prev.open+prev.close)/2;
        const cl = (p.open+p.high+p.low+p.close)/4;
        ha.push({ time:p.time, open:o, high:Math.max(p.high,o,cl), low:Math.min(p.low,o,cl), close:cl });
      });
      c.setData(ha);
    } else if(st === 'line' || st === 'area'){
      c.applyOptions({ visible:false });
      const opts = st === 'line'
        ? { color:g, lineWidth:2, lastValueVisible:true, priceLineVisible:true }
        : { lineColor:g, topColor:'rgba(0,255,136,0.25)', bottomColor:'rgba(0,255,136,0)', lineWidth:2 };
      S._stS = st === 'line' ? S.charts.main.addLineSeries(opts) : S.charts.main.addAreaSeries(opts);
      S._stS.setData(S.prices.map(p => ({ time:p.time, value:p.close })));
    } else if(st === 'bars'){
      c.applyOptions({ visible:false });
      S._stS = S.charts.main.addBarSeries({ upColor:g, downColor:r });
      S._stS.setData(S.prices);
    } else {
      c.applyOptions({ visible:true });
      c.setData(S.prices);
    }
    $$('#ms .ddi').forEach(el => el.classList.toggle('on', el.dataset.st === st));
    saveLayout();
  }

  /* ═══ VOLUME PROFILE (RAF loop) ═══ */
  function initVP(){
    const cv = $('#vpc');
    S.vp.cv = cv;
    S.vp.ctx = cv.getContext('2d');
    const resize = ()=>{
      cv.width = cv.parentElement.clientWidth;
      cv.height = cv.parentElement.clientHeight;
      if(S.vp.en) drawVP();
    };
    window.addEventListener('resize', resize);
    resize();
    const loop = () => {
      if(S.vp.en && S.charts.main && S.series.candle && S.prices.length){
        const cv = S.vp.cv;
        const s = S.series.candle;
        const vr = S.charts.main.timeScale().getVisibleRange();
        if(vr && cv){
          const vis = S.prices.filter(p => p.time >= vr.from && p.time <= vr.to);
          if(vis.length >= 3){
            const minP = Math.min(...vis.map(c => c.low));
            const maxP = Math.max(...vis.map(c => c.high));
            let yT = 0, yB = 0;
            try{ yT = s.priceToCoordinate(maxP) || 0; yB = s.priceToCoordinate(minP) || 0; }catch(e){}
            const key = `${vr.from}|${vr.to}|${cv.width}x${cv.height}|${yT}|${yB}|${vis.length}`;
            if(key !== S.vp.lastKey){
              S.vp.lastKey = key;
              drawVP();
            }
          }
        }
      } else {
        S.vp.lastKey = '';
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  function drawVP(){
    const vp = S.vp;
    if(!vp.ctx || !S.prices.length) return;
    const cv = vp.cv, ctx = vp.ctx;
    ctx.clearRect(0,0,cv.width,cv.height);
    const vr = S.charts.main.timeScale().getVisibleRange();
    if(!vr) return;
    const vis = S.prices.filter(p => p.time >= vr.from && p.time <= vr.to);
    if(vis.length < 3) return;
    const minP = Math.min(...vis.map(c => c.low));
    const maxP = Math.max(...vis.map(c => c.high));
    const range = maxP - minP;
    if(range <= 0) return;
    const panelH = cv.height;
    const buckets = Math.max(50, Math.min(200, Math.floor(panelH / 3)));
    const bucket = range / buckets;
    const hist = new Array(buckets).fill(0);
    vis.forEach(c => {
      const lo = c.low, hi = c.high;
      const tp = (hi + lo + c.close) / 3;
      const cRange = hi - lo;
      if(cRange <= 0){
        const b = Math.min(buckets-1, Math.max(0, Math.floor((c.close - minP)/bucket)));
        hist[b] += c.volume;
        return;
      }
      const b1 = Math.max(0, Math.floor((lo - minP) / bucket));
      const b2 = Math.min(buckets-1, Math.floor((hi - minP) / bucket));
      let totalW = 0;
      const weights = [];
      for(let b = b1; b <= b2; b++){
        const center = minP + (b + 0.5) * bucket;
        const dist = Math.abs(center - tp) / (cRange / 2);
        const w = Math.max(0.05, 1 - Math.min(1, dist));
        weights.push(w);
        totalW += w;
      }
      if(totalW <= 0) return;
      for(let i = 0; i < weights.length; i++){
        hist[b1 + i] += c.volume * (weights[i] / totalW);
      }
    });
    const maxV = Math.max(...hist);
    if(maxV <= 0) return;
    let poc = 0;
    for(let i=1;i<buckets;i++) if(hist[i] > hist[poc]) poc = i;
    const rightEdge = cv.width - vp.offR;
    const s = S.series.candle;
    for(let i=0;i<buckets;i++){
      const lowP = minP + i*bucket;
      const highP = lowP + bucket;
      let yT, yB;
      try{ yT = s.priceToCoordinate(highP); yB = s.priceToCoordinate(lowP); }catch(e){ continue; }
      if(yT == null || yB == null) continue;
      const y = Math.min(yT,yB);
      const h = Math.max(1, Math.abs(yB-yT)-1);
      if(y+h < 0 || y > cv.height) continue;
      const intensity = hist[i]/maxV;
      const len = intensity * vp.w;
      if(i === poc){ ctx.fillStyle = 'rgba(255,204,0,0.85)'; }
      else { ctx.fillStyle = `rgba(0,255,213,${0.10 + intensity*0.55})`; }
      ctx.fillRect(rightEdge - len, y, len, h);
    }
    const pocPrice = minP + poc*bucket + bucket/2;
    let pocY;
    try{ pocY = s.priceToCoordinate(pocPrice); }catch(e){ pocY = null; }
    if(pocY != null){
      ctx.strokeStyle = 'rgba(255,204,0,0.25)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(0,pocY); ctx.lineTo(rightEdge,pocY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '9px JetBrains Mono, monospace';
      ctx.fillStyle = 'rgba(255,204,0,0.9)';
      ctx.textAlign = 'right';
      ctx.fillText('POC '+fmtP(pocPrice), rightEdge-2, pocY-3);
    }
  }

  function updateHeat(){
    S.heatLines.forEach(s => { try{ S.charts.main.removeSeries(s); }catch(e){} });
    S.heatLines = [];
    if(!S.heatOn || !S.prices.length) return;
    const levs = [10,20,35,50,100];
    const raw = [];
    S.prices.slice(-200).forEach(c=>{
      if(c.volume < 15) return;
      levs.forEach(l=>{
        raw.push({ price: c.low*(1-1/l), time:c.time, w:c.volume/l });
        raw.push({ price: c.high*(1+1/l), time:c.time, w:c.volume/l });
      });
    });
    raw.sort((a,b)=>b.w-a.w).slice(0,28).forEach((lvl,i)=>{
      const col = i<5 ? 'rgba(255,204,0,0.32)' : i<14 ? 'rgba(0,212,255,0.2)' : 'rgba(139,92,246,0.14)';
      const line = S.charts.main.addLineSeries({ color:col, lineWidth:1, lastValueVisible:false, priceLineVisible:false, crosshairMarkerVisible:false });
      const endT = Math.floor(Date.now()/1000) + 86400*2;
      line.setData([{ time:lvl.time, value:lvl.price }, { time:endT, value:lvl.price }]);
      S.heatLines.push(line);
    });
  }

  function toggleHeat(){
    S.heatOn = !S.heatOn;
    const el = document.querySelector('#mi [data-tool="heat"]');
    el && el.classList.toggle('on', S.heatOn);
    updateHeat();
    toast('Liq Heatmap ' + (S.heatOn ? 'on' : 'off'));
    saveLayout();
  }

  async function fetchSpot(tf, limit){
    try{
      const u = `${CFG.spot}/klines?symbol=${S.symbol}&interval=${tf}&limit=${limit}`;
      const r = await get(u);
      if(!Array.isArray(r)) return [];
      return r.map(k => {
        const vol = parseFloat(k[5]);
        const tb = parseFloat(k[9]);
        return {
          time: Math.floor(k[0]/1000),
          open:+k[1], high:+k[2], low:+k[3], close:+k[4],
          volume:vol, takerBuy:tb, takerSell:vol-tb
        };
      });
    }catch(e){ return []; }
  }

  async function fetchInit(){
    load(true);
    try{
      const sym = S.symbol, tf = S.tf;
      const [kl, tk, spot] = await Promise.all([
        get(`${CFG.rest}/klines?symbol=${sym}&interval=${tf}&limit=1000`),
        get(`${CFG.rest}/ticker/24hr?symbol=${sym}`).catch(()=>null),
        fetchSpot(tf, 1000)
      ]);
      if(!Array.isArray(kl) || !kl.length) throw new Error('No klines');
      const bars = kl.map(k => {
        const vol = parseFloat(k[5]);
        const tb = parseFloat(k[9]);
        return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
      });
      S.rawBars.clear();
      bars.forEach(b => S.rawBars.set(b.time, b));
      S.spotBars.clear();
      (spot||[]).forEach(b => S.spotBars.set(b.time, b));
      S.oldestTime = kl[0][0];

      const [oi, lsr] = await Promise.all([
        fetchAllOI(tf, kl[0][0]).catch(()=>[]),
        fetchAllLSR(tf, kl[0][0]).catch(()=>[])
      ]);
      S.oiRaw = oi.slice().sort((a,b)=>a.timestamp-b.timestamp);
      S.lsrRaw = lsr.slice().sort((a,b)=>a.timestamp-b.timestamp);

      rebuild();
      const last = S.prices[S.prices.length-1];
      if(last){
        S.livePrice = last.close;
        const n = S.prices.length;
        S.charts.main.timeScale().setVisibleLogicalRange({ from:Math.max(0,n-150), to:n+5 });
        updateHUD(last.close, tk ? parseFloat(tk.priceChangePercent) : null);
      }
      refreshOverlays();
      if(S.heatOn) updateHeat();
      if(S.alert.price) drawAlertLine();
      updateAlertLabel();
      // VP will be drawn by RAF loop
      S.vp.lastKey = '';
    }catch(e){
      console.error(e);
      toast('Fetch error: '+e.message, 'e');
    }finally{ load(false); }
  }

  async function fetchAllOI(tf, targetMs){
    const per = oiPer(tf);
    let all = [], end = null;
    const MAX = 30;
    for(let i = 0; i < MAX; i++){
      try{
        const u = `https://fapi.binance.com/futures/data/openInterestHist?symbol=${S.symbol}&period=${per}&limit=500${end?'&endTime='+end:''}`;
        const r = await get(u);
        if(!Array.isArray(r) || !r.length) break;
        all = r.concat(all);
        if(r.length < 500) break;
        end = r[0].timestamp - 1;
        if(targetMs && r[0].timestamp <= targetMs) break;
        await sleep(60);
      }catch(e){ break; }
    }
    return all;
  }
  async function fetchAllLSR(tf, targetMs){
    const per = oiPer(tf);
    let all = [], end = null;
    const MAX = 30;
    for(let i = 0; i < MAX; i++){
      try{
        const u = `https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${S.symbol}&period=${per}&limit=500${end?'&endTime='+end:''}`;
        const r = await get(u);
        if(!Array.isArray(r) || !r.length) break;
        all = r.concat(all);
        if(r.length < 500) break;
        end = r[0].timestamp - 1;
        if(targetMs && r[0].timestamp <= targetMs) break;
        await sleep(60);
      }catch(e){ break; }
    }
    return all;
  }

  async function loadHistory(){
    S.loadingHist = true;
    try{
      const tf = S.tf;
      const end = S.oldestTime - 1;
      const [kl, spot] = await Promise.all([
        get(`${CFG.rest}/klines?symbol=${S.symbol}&interval=${tf}&limit=500&endTime=${end}`),
        fetchSpot(tf, 500).catch(()=>[])
      ]);
      if(!Array.isArray(kl) || !kl.length){ S.loadingHist = false; return; }
      const bars = kl.map(k => {
        const vol = parseFloat(k[5]);
        const tb = parseFloat(k[9]);
        return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
      });
      bars.forEach(b => S.rawBars.set(b.time, b));
      (spot||[]).forEach(b => S.spotBars.set(b.time, b));
      S.oldestTime = kl[0][0];
      const [oi, lsr] = await Promise.all([
        fetchAllOI(tf, kl[0][0]).catch(()=>[]),
        fetchAllLSR(tf, kl[0][0]).catch(()=>[])
      ]);
      const om = new Map(S.oiRaw.map(o => [o.timestamp, o]));
      oi.forEach(o => om.set(o.timestamp, o));
      S.oiRaw = [...om.values()].sort((a,b)=>a.timestamp-b.timestamp);
      const lm = new Map(S.lsrRaw.map(o => [o.timestamp, o]));
      lsr.forEach(o => lm.set(o.timestamp, o));
      S.lsrRaw = [...lm.values()].sort((a,b)=>a.timestamp-b.timestamp);
      const vr = S.charts.main.timeScale().getVisibleLogicalRange();
      const oldLen = S.prices.length;
      rebuild();
      renderAllPanels();
      refreshOverlays();
      const newLen = S.prices.length;
      if(vr && newLen > oldLen){
        const shift = newLen - oldLen;
        const nr = { from:vr.from+shift, to:vr.to+shift };
        S._sync = true;
        S.charts.main.timeScale().setVisibleLogicalRange(nr);
        Object.entries(S.charts).forEach(([id,c])=>{
          if(id === 'main') return;
          try{ c.timeScale().setVisibleLogicalRange(nr); }catch(e){}
        });
        S._sync = false;
      }
      if(S.heatOn) updateHeat();
    }catch(e){ console.warn(e); }
    S.loadingHist = false;
  }

  function rebuild(){
    const raw = Array.from(S.rawBars.values()).sort((a,b)=>a.time-b.time);
    S.prices = raw.map(b => ({...b}));
    if(S.prices.length) S.livePrice = S.prices[S.prices.length-1].close;
    S.series.candle.setData(S.prices);
    S.series.volume.setData(S.prices.map(p => ({ time:p.time, value:p.volume, color:CFG.C.vol })));
    if(S.style === 'hollow' || S.style === 'heiken') setStyle(S.style);
    S.vp.lastKey = '';
  }

  /* ═══ LIQ FEED UI ═══ */
  function pushLiqToFeed(side, usd, price, ts){
    const feed = $('#lq-feed');
    if(!feed) return;
    const empty = feed.querySelector('.liq-empty');
    if(empty) empty.remove();
    const el = document.createElement('div');
    const isBig = usd >= 500000;
    el.className = 'liq-it' + (isBig ? ' big' : '');
    const t = new Date(ts*1000);
    const tm = t.toTimeString().slice(0,8);
    el.innerHTML = `
      <span class="tm">${tm}</span>
      <span class="sd ${side === 'LONG' ? 'long' : 'short'}">${side}</span>
      <span class="am">${fmtU(usd)}</span>
    `;
    feed.insertBefore(el, feed.firstChild);
    while(feed.children.length > 60) feed.removeChild(feed.lastChild);
    const cnt = $('#lq-cnt');
    if(cnt) cnt.textContent = S.liqRaw.length;
  }

  function startWS(){
    if(S.wsK){ try{ S.wsK.close(); }catch(e){} }
    if(S.wsL){ try{ S.wsL.close(); }catch(e){} }
    try{
      S.wsK = new WebSocket(`${CFG.ws}${S.symbol.toLowerCase()}@kline_${S.tf}`);
      S.wsK.onmessage = e => {
        try{
          const k = JSON.parse(e.data).k;
          const t = Math.floor(k.t/1000);
          const bar = { time:t, open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, takerBuy:+k.V, takerSell:+k.v - +k.V };
          S.rawBars.set(t, bar);
          upsert(bar);
        }catch(err){}
      };
      S.wsK.onclose = ()=>setTimeout(()=>{ if(S.wsK && S.wsK.readyState === WebSocket.CLOSED) startWS(); }, 3000);
    }catch(e){}
    try{
      S.wsL = new WebSocket('wss://fstream.binance.com/market/ws/!forceOrder@arr');
      S.wsL.onmessage = e => {
        try{
          const m = JSON.parse(e.data).o;
          if(!m || m.s !== S.symbol) return;
          const usd = +m.q * +m.p;
          if(usd < S.thr.liq) return;   // <-- MIN LIQ $ filter controls everything
          const isL = m.S === 'SELL';
          const side = isL ? 'LONG' : 'SHORT';
          const time = Math.floor((m.T || Date.now())/1000);
          const px = +m.p;

          S.liqRaw.push({ time, side, usd, price:px });
          if(S.liqRaw.length > 3000) S.liqRaw.shift();

          const last = S.prices[S.prices.length-1];
          const mt = last ? last.time : time;
          S.liqMarkers.push({ time:mt, position: isL ? 'belowBar' : 'aboveBar', color: isL ? CFG.C.g : CFG.C.r, shape:'circle', text:fmtU(usd) });
          if(S.liqMarkers.length > 60) S.liqMarkers.shift();
          S.series.candle.setMarkers(S.liqMarkers);

          pushLiqToFeed(side, usd, px, time);

          beep(isL ? 880 : 440);
          if(usd >= 200000) toast(`${isL?'🟢 LONG':'🔴 SHORT'} LIQ: ${fmtU(usd)}`, 'w');

          if(S.tg.token && S.tg.chat) sendTg(`🩸 <b>${side} LIQ</b>\n${S.symbol}\nSize: ${fmtU(usd)}\nPrice: ${fmtP(px)}`);
        }catch(err){}
      };
      S.wsL.onclose = ()=>setTimeout(()=>{ if(S.wsL && S.wsL.readyState === WebSocket.CLOSED) startWS(); }, 3000);
    }catch(e){}
  }

  function upsert(bar){
    const last = S.prices[S.prices.length-1];
    if(!last || last.time < bar.time){ S.prices.push(bar); if(S.prices.length > 2000) S.prices.shift(); }
    else if(last.time === bar.time){ S.prices[S.prices.length-1] = bar; }
    else return;
    S.livePrice = bar.close;
    S.series.candle.update(bar);
    S.series.volume.update({ time:bar.time, value:bar.volume, color:CFG.C.vol });
    updateHUD(bar.close, null);
    checkAlert(bar.close);
    updateAlertLabel();
    if(S.panels.bsd){
      const d = (bar.takerBuy||0) - (bar.takerSell||0);
      S.panels.bsd.obj.fut.update({ time:bar.time, value:d, color: d>=0 ? CFG.C.g : CFG.C.r });
      const sp = S.spotBars.get(bar.time);
      if(sp){
        const sd = (sp.takerBuy||0) - (sp.takerSell||0);
        S.panels.bsd.obj.spot.update({ time:bar.time, value:sd, color: sd>=0 ? CFG.C.spotUp : CFG.C.spotDn });
      }
    }
    if(S.panels.rsi){
      const rsi = buildRSI();
      const l = rsi[rsi.length-1];
      if(l && l.value != null) S.panels.rsi.obj.s.update(l);
    }
    if(S.panels.oi) renderPanel('oi');
    if(S.panels.oid) renderPanel('oid');
    S.vp.lastKey = '';
  }

  function updateHUD(p, ch){
    const pe = $('#hp');
    if(pe){ pe.textContent = fmtP(p); pe.style.color = ch != null ? (ch>=0 ? CFG.C.g : CFG.C.r) : '#eaeaea'; }
    if(ch != null && isFinite(ch)){
      const ce = $('#hc');
      if(ce){ ce.textContent = (ch>0?'+':'')+ch.toFixed(2)+'%'; ce.style.color = ch>=0 ? CFG.C.g : CFG.C.r; }
    }
  }

  function drawAlertLine(){
    if(!S.alert.price) return;
    if(S.alert.line){ try{ S.series.candle.removePriceLine(S.alert.line); }catch(e){} }
    S.alert.line = S.series.candle.createPriceLine({ price:S.alert.price, color:CFG.C.b, lineWidth:2, lineStyle:2, axisLabelVisible:false, title:'' });
    updateAlertLabel();
  }
  function setAlert(){
    const v = parseFloat($('#pa').value);
    if(!isFinite(v) || v <= 0){ toast('Invalid price','e'); return; }
    S.alert.price = v;
    S.alert.last = null;
    drawAlertLine();
    const st = $('#pa-st');
    st.textContent = 'set @ '+fmtP(v);
    st.classList.add('warn');
    st.classList.remove('ok');
  }
  function clearAlert(){
    if(S.alert.line){ try{ S.series.candle.removePriceLine(S.alert.line); }catch(e){} }
    S.alert.line = null;
    S.alert.price = null;
    S.alert.last = null;
    const st = $('#pa-st');
    st.textContent = 'cleared';
    st.classList.remove('warn','ok');
    const lbl = $('#alert-lbl');
    if(lbl) lbl.style.display = 'none';
  }
  function checkAlert(p){
    const t = S.alert.price;
    if(!t){ S.alert.last = p; return; }
    const prev = S.alert.last;
    S.alert.last = p;
    if(prev == null) return;
    const crossed = (prev < t && p >= t) || (prev > t && p <= t);
    if(crossed){
      beep(1200);
      toast('🔔 Alert: '+fmtP(p), 'w');
      sendTg(`🔔 PRICE ALERT\n${S.symbol} crossed ${fmtP(t)}\nNow: ${fmtP(p)}`);
      const st = $('#pa-st');
      st.textContent = 'hit @ '+fmtP(p);
      st.classList.add('ok');
      st.classList.remove('warn');
      if(S.alert.line){ try{ S.series.candle.removePriceLine(S.alert.line); }catch(e){} S.alert.line = null; }
      S.alert.price = null;
      const lbl = $('#alert-lbl');
      if(lbl) lbl.style.display = 'none';
    }
  }

  function sendTg(msg){
    if(!S.tg.token || !S.tg.chat) return;
    fetch(`https://api.telegram.org/bot${S.tg.token}/sendMessage`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id:S.tg.chat, text:msg, parse_mode:'HTML' })
    }).catch(()=>{});
  }

  let _ac = null;
  function beep(f=880){
    try{
      if(!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)();
      if(_ac.state === 'suspended') _ac.resume();
      const o = _ac.createOscillator();
      const g = _ac.createGain();
      o.frequency.value = f;
      g.gain.value = 0.06;
      o.connect(g); g.connect(_ac.destination);
      o.start(); o.stop(_ac.currentTime + 0.12);
    }catch(e){}
  }

  function setupMeasure(){
    const ct = $('#c-main');
    const rect = $('#mr'), lbl = $('#ml');
    let msr = false, sx=0, sy=0, sp=0, shift = false;
    const lock = v => {
      S.charts.main.applyOptions({ handleScroll:!v, handleScale:!v });
      ct.style.cursor = v ? 'crosshair' : '';
    };
    window.addEventListener('keydown', e => { if(e.key === 'Shift' && !shift){ shift = true; lock(true); } });
    window.addEventListener('keyup', e => { if(e.key === 'Shift'){ shift = false; if(!msr) lock(false); } });
    window.addEventListener('blur', ()=>{ if(shift && !msr){ shift = false; lock(false); } });
    ct.addEventListener('mousedown', e => {
      if(!e.shiftKey || e.button !== 0) return;
      const rc = ct.getBoundingClientRect();
      sx = e.clientX - rc.left; sy = e.clientY - rc.top;
      try{ sp = S.series.candle.coordinateToPrice(sy); }catch(err){ return; }
      if(sp == null) return;
      msr = true; lock(true);
      rect.style.display = 'block'; lbl.style.display = 'block';
      e.preventDefault(); e.stopPropagation();
    }, true);
    window.addEventListener('mousemove', e => {
      if(!msr) return;
      const rc = ct.getBoundingClientRect();
      const cx = e.clientX - rc.left, cy = e.clientY - rc.top;
      let cp;
      try{ cp = S.series.candle.coordinateToPrice(cy); }catch(err){ return; }
      if(cp == null) return;
      const l = Math.min(sx,cx), t = Math.min(sy,cy);
      const w = Math.abs(cx-sx), h = Math.abs(cy-sy);
      rect.style.left = l+'px'; rect.style.top = t+'px';
      rect.style.width = w+'px'; rect.style.height = h+'px';
      const up = cp >= sp;
      const col = up ? CFG.C.g : CFG.C.r;
      rect.style.borderColor = col;
      rect.style.background = up ? 'rgba(0,255,136,0.08)' : 'rgba(255,42,95,0.08)';
      const pct = ((cp-sp)/sp)*100;
      lbl.innerHTML = `<div class="pc" style="color:${col}">${pct>0?'+':''}${pct.toFixed(2)}%</div><div class="sb">${fmtP(sp)} → ${fmtP(cp)}</div>`;
      lbl.style.left = (l+w/2)+'px';
      lbl.style.top = (t+h/2)+'px';
      lbl.style.borderColor = col;
      e.preventDefault(); e.stopPropagation();
    }, true);
    window.addEventListener('mouseup', e => {
      if(!msr) return;
      msr = false;
      setTimeout(()=>{ if(!msr){ rect.style.display = 'none'; lbl.style.display = 'none'; } }, 2000);
      if(!e.shiftKey && !shift) lock(false);
      e.preventDefault(); e.stopPropagation();
    }, true);
  }

  function setupCtx(){
    const ct = $('#c-main'), menu = $('#ctx');
    let price = null;
    const open = (x,y)=>{
      menu.style.left = Math.min(x, window.innerWidth-190)+'px';
      menu.style.top = Math.min(y, window.innerHeight-130)+'px';
      menu.style.display = 'block';
    };
    const close = ()=>{ menu.style.display = 'none'; };
    ct.addEventListener('contextmenu', e => {
      e.preventDefault();
      const rc = ct.getBoundingClientRect();
      try{ price = S.series.candle.coordinateToPrice(e.clientY - rc.top); }catch(err){ price = null; }
      open(e.clientX, e.clientY);
    });
    let tmr = null;
    ct.addEventListener('touchstart', e => {
      if(e.touches.length !== 1) return;
      const t = e.touches[0];
      tmr = setTimeout(()=>{
        const rc = ct.getBoundingClientRect();
        try{ price = S.series.candle.coordinateToPrice(t.clientY - rc.top); }catch(err){ price = null; }
        open(t.clientX, t.clientY);
      }, 550);
    }, { passive:true });
    ct.addEventListener('touchend', ()=>clearTimeout(tmr));
    ct.addEventListener('touchmove', ()=>clearTimeout(tmr));
    document.addEventListener('mousedown', e => { if(menu.style.display === 'block' && !menu.contains(e.target)) close(); });
    document.addEventListener('touchstart', e => { if(menu.style.display === 'block' && !menu.contains(e.target)) close(); }, { passive:true });
    menu.addEventListener('click', e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if(!a) return;
      close();
      if(a === 'price'){
        if(price == null){ toast('No price','e'); return; }
        let s = price.toPrecision(6);
        if(s.includes('.')) s = parseFloat(s).toString();
        navigator.clipboard.writeText(s).then(()=>toast('Copied: '+s));
      } else if(a === 'shot') copyShot();
      else if(a === 'save') saveShot();
    });
  }

  function copyShot(){
    const el = $('#stack');
    const m = ['#mr','#ml','#cursor-lbl','#alert-lbl'].map(s => $(s));
    m.forEach(x => x && (x.style.display = 'none'));
    html2canvas(el, { backgroundColor:'#050608', scale:2, logging:false, useCORS:true })
      .then(cv => {
        cv.toBlob(b => {
          navigator.clipboard.write([new ClipboardItem({ [b.type]:b })])
            .then(()=>toast('Screenshot copied'))
            .catch(()=>toast('Copy failed','e'));
        });
      })
      .finally(()=>{
        m.forEach(x => x && (x.style.display = ''));
        updateAlertLabel();
      });
  }
  function saveShot(){
    const el = $('#stack');
    const m = ['#mr','#ml','#cursor-lbl','#alert-lbl'].map(s => $(s));
    m.forEach(x => x && (x.style.display = 'none'));
    html2canvas(el, { backgroundColor:'#050608', scale:2, logging:false, useCORS:true })
      .then(cv => {
        const a = document.createElement('a');
        a.download = S.symbol + '_' + Date.now() + '.png';
        a.href = cv.toDataURL('image/png');
        a.click();
      })
      .finally(()=>{
        m.forEach(x => x && (x.style.display = ''));
        updateAlertLabel();
      });
  }

  let openMenu = null;
  function openDropdown(menu, btn){
    if(openMenu === menu){ closeDropdown(); return; }
    closeDropdown();
    const r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 6) + 'px';
    const rightOffset = window.innerWidth - r.right;
    if(rightOffset + 200 < window.innerWidth - 16){
      menu.style.right = rightOffset + 'px';
      menu.style.left = 'auto';
    } else {
      menu.style.left = '8px';
      menu.style.right = 'auto';
    }
    menu.classList.add('open');
    btn.classList.add('active');
    openMenu = menu;
  }
  function closeDropdown(){
    if(openMenu){
      openMenu.classList.remove('open');
      openMenu = null;
      document.querySelectorAll('.ib.active').forEach(b => b.classList.remove('active'));
    }
  }

  function saveLayout(){
    try{
      const panels = {};
      S.order.forEach(t => {
        const p = S.panels[t];
        if(p) panels[t] = { height:p.el.clientHeight };
      });
      localStorage.setItem(LK, JSON.stringify({
        symbol:S.symbol, tf:S.tf, style:S.style, tz:S.tz,
        order:S.order, panels,
        overlays:Object.keys(S.overlays),
        vp:S.vp.en, heat:S.heatOn
      }));
    }catch(e){}
  }
  function loadLayout(){
    try{ const r = localStorage.getItem(LK); return r ? JSON.parse(r) : null; } catch(e){ return null; }
  }
  function saveSettings(){
    try{ localStorage.setItem(SK, JSON.stringify({ tg:S.tg, tz:S.tz, thr:S.thr })); }catch(e){}
  }
  function loadSettings(){
    try{
      const r = localStorage.getItem(SK);
      if(!r) return;
      const o = JSON.parse(r);
      if(o.tg) S.tg = o.tg;
      if(o.tz) S.tz = o.tz;
      if(o.thr) S.thr = { ...S.thr, ...o.thr };
    }catch(e){}
  }

  function bindUI(){
    const ci = $('#ci');
    const commit = ()=>{
      let v = ci.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!v){ ci.value = S.symbol.replace('USDT',''); return; }
      if(!v.endsWith('USDT')) v += 'USDT';
      S.symbol = v;
      ci.value = v.replace('USDT','');
      reload();
    };
    ci.addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); commit(); } });
    ci.addEventListener('blur', commit);
    $$('#tfs .tf').forEach(b => {
      b.addEventListener('click', ()=>{
        $$('#tfs .tf').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        S.tf = b.dataset.tf;
        reload();
      });
    });
    $('#bi').addEventListener('click', e => { e.stopPropagation(); openDropdown($('#mi'), e.currentTarget); });
    $('#bs').addEventListener('click', e => { e.stopPropagation(); openDropdown($('#ms'), e.currentTarget); });
    document.addEventListener('click', e => {
      if(openMenu && !openMenu.contains(e.target) && !e.target.closest('.ib')) closeDropdown();
    });
    $$('#mi .ddi').forEach(el => {
      el.addEventListener('click', ()=>{
        if(el.dataset.panel) togglePanel(el.dataset.panel);
        else if(el.dataset.ov) toggleOverlay(el.dataset.ov);
        else if(el.dataset.tool === 'vp') toggleVP();
        else if(el.dataset.tool === 'heat') toggleHeat();
        closeDropdown();
      });
    });
    $$('#ms .ddi').forEach(el => {
      el.addEventListener('click', ()=>{ setStyle(el.dataset.st); closeDropdown(); });
    });
    $('#pa-set').addEventListener('click', setAlert);
    $('#pa-clr').addEventListener('click', clearAlert);
    $('#vt').addEventListener('change', e => {
      S.thr.vol = +e.target.value || 0;
      const st = $('#vt-st');
      st.textContent = S.thr.vol > 0 ? 'vol ≥ '+S.thr.vol : 'off';
      st.classList.toggle('warn', S.thr.vol > 0);
      saveSettings();
    });
    $('#lq').addEventListener('change', e => {
      S.thr.liq = +e.target.value || 0;
      saveSettings();
    });
    window.addEventListener('message', e => {
      const d = e.data;
      if(!d || typeof d !== 'object') return;
      if(d.type === 'SET_SYMBOL' && d.symbol){
        let s = String(d.symbol).toUpperCase();
        if(!s.endsWith('USDT')) s += 'USDT';
        if(s !== S.symbol){ S.symbol = s; ci.value = s.replace('USDT',''); reload(); }
      } else if(d.type === 'SET_TF' && d.tf){
        S.tf = String(d.tf);
        $$('#tfs .tf').forEach(b => b.classList.toggle('active', b.dataset.tf === S.tf));
        reload();
      } else if(d.type === 'SET_STYLE' && d.style){ setStyle(String(d.style)); }
    });
    window.addEventListener('resize', ()=>{
      Object.entries(S.charts).forEach(([id,c])=>{
        const ct = id === 'main' ? $('#c-main') : S.panels[id]?.container;
        if(ct) c.applyOptions({ width:ct.clientWidth, height:ct.clientHeight });
      });
      closeDropdown();
      updateAlertLabel();
    });
  }

  async function reload(){
    document.title = S.symbol;
    try{ S.wsK && S.wsK.close(); }catch(e){}
    try{ S.wsL && S.wsL.close(); }catch(e){}
    S.liqMarkers = [];
    S.liqRaw = [];
    S.lsrRaw = [];
    S.oiRaw = [];
    S.spotBars = new Map();
    S.series.candle && S.series.candle.setMarkers([]);
    S.vp.lastKey = '';
    const feed = $('#lq-feed');
    if(feed) feed.innerHTML = '<div class="liq-empty">Waiting for liquidations...</div>';
    const cnt = $('#lq-cnt');
    if(cnt) cnt.textContent = '0';
    await fetchInit();
    renderAllPanels();     // re-render existing panels with new data
    updateTimeAxis();
    startWS();
  }

  async function init(){
    try{ if(window.self !== window.top) document.body.classList.add('emb'); }catch(e){}
    buildMain();
    initVP();
    setupMeasure();
    setupCtx();
    bindUI();
    loadSettings();
    $('#vt').value = S.thr.vol;
    $('#lq').value = S.thr.liq;

    // Determine what to load
    const L = loadLayout();
    let panelsToAdd = [];
    if(L){
      if(L.symbol) S.symbol = L.symbol;
      if(L.tf) S.tf = L.tf;
      if(L.style) S.style = L.style;
      if(L.tz){ S.tz = L.tz; applyTz(); }
      $('#ci').value = S.symbol.replace('USDT','');
      $$('#tfs .tf').forEach(b => b.classList.toggle('active', b.dataset.tf === S.tf));
      if(Array.isArray(L.order)) panelsToAdd = L.order.map(t => ({ t, h: L.panels?.[t]?.height }));
      S._restoreOverlays = L.overlays || [];
      S._restoreVP = !!L.vp;
      S._restoreHeat = !!L.heat;
    } else {
      // First load — defaults
      S.symbol = 'BTCUSDT';
      S.tf = '5m';
      $('#ci').value = 'BTC';
      $$('#tfs .tf').forEach(b => b.classList.toggle('active', b.dataset.tf === '5m'));
      panelsToAdd = [{ t: 'oi' }, { t: 'oid' }, { t: 'bsd' }];
      S._restoreVP = true;   // VP default ON
    }

    // URL params override
    try{
      const p = new URLSearchParams(location.search);
      const sym = p.get('symbol');
      if(sym){
        let s = sym.toUpperCase();
        if(!s.endsWith('USDT')) s += 'USDT';
        S.symbol = s;
        $('#ci').value = s.replace('USDT','');
      }
      const tf = p.get('tf');
      if(tf && ['1m','5m','15m','1h','4h','1d'].includes(tf)){
        S.tf = tf;
        $$('#tfs .tf').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
      }
    }catch(e){}

    applyTz();

    // ═══ KEY FIX: fetch data FIRST, then add panels ═══
    await fetchInit();

    // NOW add panels (after data is loaded — no more "2 candles at start")
    panelsToAdd.forEach(p => addPanel(p.t, { silent: true, height: p.h }));
    // Mark menu items as .on
    panelsToAdd.forEach(p => {
      const mi = document.querySelector(`#mi [data-panel="${p.t}"]`);
      if(mi) mi.classList.add('on');
    });

    // Restore overlays / VP / heat now that data is present
    setTimeout(() => {
      S._restoreOverlays.forEach(o => toggleOverlay(o));
      if(S._restoreVP && !S.vp.en){
        S.vp.en = true;
        const vpItem = document.querySelector('#mi [data-tool="vp"]');
        if(vpItem) vpItem.classList.add('on');
      }
      if(S._restoreHeat && !S.heatOn){
        S.heatOn = true;
        const heatItem = document.querySelector('#mi [data-tool="heat"]');
        if(heatItem) heatItem.classList.add('on');
        updateHeat();
      }
      if(S.style) setStyle(S.style);
      S.vp.lastKey = '';
      if(S.vp.en) drawVP();
    }, 80);

    startWS();

    console.log('%c⚡ ENGINE v9',
      'background:linear-gradient(90deg,#00ffd5,#00d4ff);color:#000;padding:5px 14px;border-radius:4px;font-weight:800;letter-spacing:2px;');
    console.log('  ✓ Panels load AFTER data (no 2-candle flash)');
    console.log('  ✓ Default: OI + OI Delta + B/S Delta + VP ON');
    console.log('  ✓ Liq Tracker + MIN $ filter (controls list, markers, alerts)');
    console.log('  ✓ Crosshair sync by TIME across all panels (bidirectional)');
  }

  return {
    init, addPanel, removePanel, togglePanel, setStyle,
    toggleVP, toggleHeat, toggleOverlay,
    setSymbol: s => {
      let sym = String(s).toUpperCase();
      if(!sym.endsWith('USDT')) sym += 'USDT';
      S.symbol = sym;
      const ci = $('#ci'); if(ci) ci.value = sym.replace('USDT','');
      reload();
    },
    setTF: tf => {
      S.tf = tf;
      $$('#tfs .tf').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
      reload();
    }
  };
})();

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', () => ENGINE.init());
} else {
  ENGINE.init();
}
</script>
</body>
</html>
