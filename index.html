<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 1% Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #ffffff;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://drive.google.com/uc?export=download&id=1lwsl0uCBJ8d4eL7XfzAmtdKk_GnBjMfF') no-repeat center center;
            background-size: cover;
            opacity: 0.15;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            animation: fadeIn 2s ease-in-out;
            padding-top: 10vh; /* Moved up */
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: #f3f3f3;
            animation: textGlow 2s infinite alternate;
            text-shadow: 0 0 1px rgba(13, 110, 253, 0.2), 0 0 3px rgba(13, 110, 253, 0.3);
        }

        .hero h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0 0 1.5rem 0;
            color: #e0e0e0;
        }

        .cta-button {
            display: inline-block;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            background: #0D6EFD;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .cta-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 15px 30px rgba(13, 110, 253, 0.7);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            position: relative;
            z-index: 4;
        }

        .social-icons a {
            color: #ccc;
            font-size: 24px;
            transition: transform 0.2s ease, color 0.2s ease;
            text-decoration: none;
            margin: 0 15px;
        }

        .social-icons a:hover {
            color: #0D6EFD;
            transform: translateY(-2px) scale(1.1);
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #b5b5b5;
            position: relative;
            z-index: 4;
        }

        .footer-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 1px rgba(13, 110, 253, 0.2), 0 0 3px rgba(13, 110, 253, 0.3);
            }
            100% {
                text-shadow: 0 0 2px rgba(13, 110, 253, 0.3), 0 0 5px rgba(13, 110, 253, 0.4);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0px 0px 10px rgba(0, 136, 204, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0px 0px 20px rgba(0, 136, 204, 0.7);
            }
            100% {
                transform: scale(1);
                box-shadow: 0px 0px 10px rgba(0, 136, 204, 0.4);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>Top 1% Club</h1>
            <h2>Your Path to Unstoppable Success</h2>
            <a href="https://t.me/toponeinsiderbot" class="cta-button">Telegram</a>
        </div>
    </div>
    <div class="footer-container">
        <div class="social-icons">
            <a href="https://www.instagram.com/alishan.youtube/" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://x.com/AlishanYoutube" target="_blank" title="X">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="https://www.youtube.com/@alishan.youtube" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://www.tiktok.com/@alishan.youtube" target="_blank" title="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
        </div>
        <footer>
            &copy; 2023 All rights reserved.
        </footer>
    </div>
</body>
</html>
