<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 1 Club - Path to Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: #ffffff;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: url('your-background-video-or-image.mp4') no-repeat center center/cover;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: fadeIn 2s ease-in-out;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(90deg, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 2s infinite alternate;
        }

        .hero h2 {
            font-size: 2rem;
            font-weight: 400;
            margin: 1rem 0;
            opacity: 0.8;
            animation: fadeIn 2s ease 1s;
        }

        .cta-button {
            display: inline-block;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #000;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: bounceIn 2s ease 2s;
        }

        .cta-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 15px 30px rgba(243, 156, 18, 0.7);
        }

        .telegram-section {
            margin-top: 3rem;
            animation: fadeIn 2s ease 3s;
        }

        .telegram-button {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #0088cc;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .telegram-button:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(0, 136, 204, 0.7);
        }

        footer {
            text-align: center;
            padding: 1.5rem 0;
            font-size: 0.9rem;
            background: #0a0a0a;
            color: #666;
        }

        footer a {
            color: #f39c12;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 10px #f39c12, 0 0 20px #e67e22, 0 0 30px #f39c12;
            }
            100% {
                text-shadow: 0 0 20px #f39c12, 0 0 30px #e67e22, 0 0 40px #f39c12;
            }
        }

        @keyframes bounceIn {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>Join the Top 1 Club</h1>
            <h2>Your Path to Unstoppable Success</h2>
            <a href="#" class="cta-button">Join the Club</a>
            <div class="telegram-section">
                <a href="https://t.me/yourgroup" class="telegram-button">Join Our Telegram</a>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2025 Top 1 Club. All Rights Reserved. <a href="#">Privacy Policy</a>
    </footer>
</body>
</html>
