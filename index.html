<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 1 Club - Path to Success</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
            color: #fff;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: url('your-background-video-or-image.jpg') no-repeat center center/cover;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: bold;
            margin: 0;
            animation: fadeIn 2s ease;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 300;
            margin: 1rem 0;
            animation: fadeIn 2s ease 1s;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #e67e22, #f39c12);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 2s ease 2s;
        }

        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(243, 156, 18, 0.7);
        }

        .telegram-section {
            margin-top: 3rem;
            animation: fadeIn 2s ease 3s;
        }

        .telegram-button {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: #0088cc;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .telegram-button:hover {
            transform: translateY(-3px);
            box-shadow: 0px 8px 16px rgba(0, 136, 204, 0.7);
        }

        footer {
            text-align: center;
            padding: 1rem 0;
            font-size: 0.8rem;
            background: #0f0f0f;
            color: #666;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>Join the Top 1 Club</h1>
            <h2>Your Path to Success</h2>
            <a href="#" class="cta-button">Join the Club</a>
            <div class="telegram-section">
                <a href="https://t.me/yourgroup" class="telegram-button">Join Our Telegram</a>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2025 Top 1 Club. All Rights Reserved.
    </footer>
</body>
</html>
