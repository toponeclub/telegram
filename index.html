<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 1 Club</title>
    <style>
        /* General Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: #fff;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
            color: #aaa;
        }

        .cta-btn {
            padding: 15px 30px;
            background-color: #ff6000;
            border: none;
            color: white;
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
        }

        .cta-btn:hover {
            background-color: #ff8c00;
            transform: translateY(-5px);
        }

        .telegram-btn {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #0088cc;
            color: white;
            font-size: 20px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
        }

        .telegram-btn:hover {
            background-color: #33b5e5;
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join the Top 1 Club</h1>
        <p>Your Path to Success — 20,000+ People Already on the Path to Success with Us.</p>
        <button class="cta-btn" onclick="window.location.href='https://t.me/toponeinsiderbot'">Join the Club</button>
        <p style="margin-top: 20px;">Get exclusive access to the best strategies, resources, and support for your success.</p>
        <button class="telegram-btn" onclick="window.location.href='https://t.me/toponeinsiderbot'">Access Telegram Channel</button>
    </div>
    <footer>
        <p>&copy; 2025 Top 1 Club. All rights reserved.</p>
    </footer>
</body>
</html>
