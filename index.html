<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 1% Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #ffffff;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: black;
        }

        .hero video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            z-index: 1;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            animation: fadeIn 2s ease-in-out;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin: 0;
            color: #f3f3f3;
            animation: textGlow 2s infinite alternate;
            text-shadow: 0 0 8px rgba(243, 243, 243, 0.4);
        }

        .hero h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 1rem 0;
            color: #e0e0e0;
        }

        .cta-button {
            display: inline-block;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #000;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .cta-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 15px 30px rgba(243, 156, 18, 0.7);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 5px #f39c12, 0 0 10px #e67e22;
            }
            100% {
                text-shadow: 0 0 10px #f39c12, 0 0 15px #e67e22;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0px 0px 10px rgba(243, 156, 18, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0px 0px 20px rgba(243, 156, 18, 0.7);
            }
            100% {
                transform: scale(1);
                box-shadow: 0px 0px 10px rgba(243, 156, 18, 0.4);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <video autoplay loop muted>
            <source src="https://drive.google.com/uc?export=download&id=1-WV-XYa-UQ8GdRQvKNg2QPbuB1chKAm0" type="video/mp4">
        </video>
        <div class="hero-content">
            <h1>Top 1% Club</h1>
            <h2>20,000+ on their way to success</h2>
            <a href="https://t.me/yourgroup" class="cta-button">Telegram</a>
        </div>
    </div>
</body>
</html>
