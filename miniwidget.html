<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sparkline · MiniWidget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #030303;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-tap-highlight-color: transparent;
        color: #f0f0f0;
    }

    .spark-widget {
        --accent: #00ffd5;
        --accent-dim: rgba(0,255,213,0.08);
        --accent-border: rgba(0,255,213,0.2);
        --text-main: #f0f0f0;
        --text-muted: #666;
        --border-thin: rgba(255,255,255,0.06);
        --bg-chart: rgba(0,0,0,0.4);
        --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
        --up: #00ffc8;
        --down: #a855f7;
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        padding: 14px;
        position: relative;
        overflow: hidden;
    }

    /* ── HEADER ── */
    .sp-header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        flex-shrink: 0;
    }
    .sp-title {
        display: flex; align-items: center; gap: 7px;
        min-width: 0;
    }
    .sp-bolt { width: 14px; height: 14px; color: var(--accent); flex-shrink: 0; }
    .sp-input {
        background: transparent;
        color: var(--text-main);
        border: none;
        border-bottom: 1px dashed var(--border-thin);
        padding: 0 0 1px;
        font-size: 12px;
        font-weight: 800;
        font-family: var(--font-mono);
        width: 90px;
        text-transform: uppercase;
        outline: none;
        transition: border-color 0.25s ease;
    }
    .sp-input:focus { border-color: var(--accent); }
    .sp-live {
        display: flex; align-items: center; gap: 4px;
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--accent);
        background: var(--accent-dim);
        border: 1px solid var(--accent-border);
        padding: 2px 6px;
        border-radius: 4px;
        flex-shrink: 0;
    }
    .sp-live-dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 5px var(--accent);
        animation: sp-pulse 1.5s infinite;
    }
    @keyframes sp-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* ── PRICE ── */
    .sp-price-row {
        display: flex; justify-content: flex-end; align-items: flex-start;
        gap: 10px;
        margin-bottom: 10px;
        flex-shrink: 0;
    }
    .sp-price {
        font-family: var(--font-mono);
        font-size: clamp(18px, 5.5vw, 28px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -1px;
        text-shadow: 0 0 20px rgba(255,255,255,0.08);
        transition: color 0.3s ease;
    }
    .sp-change {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 5px;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        white-space: nowrap;
    }

    /* ── CHART ── */
    .sp-chart-wrap {
        flex: 1;
        position: relative;
        background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.4) 100%);
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.03);
        overflow: hidden;
        margin-bottom: 10px;
        min-height: 60px;
    }
    #chartCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .sp-loading, .sp-error {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 700;
        text-align: center;
        pointer-events: none;
        z-index: 5;
    }
    .sp-loading { color: var(--accent); text-shadow: 0 0 10px var(--accent); display: none; }
    .sp-error   { color: #ff2a5f; text-shadow: 0 0 10px rgba(255,42,95,0.5); display: none; }
    .sp-tooltip {
        position: absolute;
        background: rgba(10,10,12,0.95);
        color: var(--text-main);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 10px;
        font-family: var(--font-mono);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s ease;
        transform: translate(-50%, -100%);
        border: 1px solid var(--accent-dim);
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        z-index: 20;
        white-space: nowrap;
        text-align: center;
    }

    /* ── FOOTER ── */
    .sp-footer {
        display: flex; justify-content: space-between; align-items: center;
        gap: 8px;
        flex-shrink: 0;
        flex-wrap: wrap;
    }
    .sp-hl { display: flex; gap: 10px; font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); }
    .sp-hl strong { color: var(--text-main); }
    .sp-tfs { display: flex; gap: 4px; }
    .sp-tab {
        background: transparent;
        border: 1px solid var(--border-thin);
        color: var(--text-muted);
        padding: 4px 8px;
        font-size: 9px;
        font-weight: 700;
        border-radius: 5px;
        cursor: pointer;
        font-family: var(--font-mono);
        letter-spacing: 0.4px;
        transition: all 0.2s ease;
    }
    .sp-tab:hover { color: var(--text-main); border-color: rgba(255,255,255,0.15); }
    .sp-tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

    @media (max-width: 260px) {
        .spark-widget { padding: 10px; }
        .sp-price { font-size: 16px; }
        .sp-hl { display: none; }
    }
</style>
</head>
<body>
<div class="spark-widget" id="root">
    <div class="sp-header">
        <div class="sp-title">
            <svg class="sp-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <input type="text" id="coinInput" class="sp-input" value="BTCUSDT" list="coinList" spellcheck="false" autocomplete="off" autocapitalize="characters">
            <datalist id="coinList"></datalist>
        </div>
        <div class="sp-live"><span class="sp-live-dot"></span> LIVE</div>
    </div>

    <div class="sp-price-row">
        <div class="sp-price" id="priceEl">--</div>
        <div class="sp-change" id="changeEl">--</div>
    </div>

    <div class="sp-chart-wrap" id="chartWrap">
        <div class="sp-loading" id="loadingEl">SYNCING...</div>
        <div class="sp-error" id="errorEl">⚠ API UNREACHABLE</div>
        <canvas id="chartCanvas"></canvas>
        <div class="sp-tooltip" id="tooltipEl"></div>
    </div>

    <div class="sp-footer">
        <div class="sp-hl">
            <span>H: <strong id="highEl">--</strong></span>
            <span>L: <strong id="lowEl">--</strong></span>
        </div>
        <div class="sp-tfs" id="tfSelector">
            <button class="sp-tab active" data-interval="1h" data-limit="24">24H</button>
            <button class="sp-tab" data-interval="4h" data-limit="42">7D</button>
            <button class="sp-tab" data-interval="1d" data-limit="30">1M</button>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    /* ═══════════════════════════════════════════════════════
       CONFIG
       ═══════════════════════════════════════════════════════ */
    const API_BASE = 'https://api.binance.com/api/v3';
    const DPI = window.devicePixelRatio || 1;
    const PULSE_DURATION = 2000;
    const DEFAULT_SYMBOL = 'BTCUSDT';
    const DEFAULT_INTERVAL = '1h';
    const DEFAULT_LIMIT = 24;
    const REFRESH_MS = 30000;

    const SYMBOL_NAMES = {
        'BTCUSDT': 'BITCOIN', 'ETHUSDT': 'ETHEREUM', 'SOLUSDT': 'SOLANA',
        'BNBUSDT': 'BNB', 'XRPUSDT': 'RIPPLE', 'DOGEUSDT': 'DOGECOIN',
        'ADAUSDT': 'CARDANO', 'AVAXUSDT': 'AVALANCHE', 'LINKUSDT': 'CHAINLINK'
    };

    /* ═══════════════════════════════════════════════════════
       URL PARSING — /miniwidget/BTCUSDT  |  ?symbol=  |  #hash
       ═══════════════════════════════════════════════════════ */
    function parseUrl() {
        const params = new URLSearchParams(location.search);
        const hash = location.hash.replace(/^#\/?/, '').trim();
        const pathParts = location.pathname.split('/').filter(Boolean);
        const lastPath = (pathParts[pathParts.length - 1] || '').trim();

        const IGNORE = ['miniwidget', 'tickername', 'sparkline', 'widget', 'index', ''];
        const isSymbolLike = /^[A-Za-z0-9]{2,12}$/.test(lastPath) &&
                             !IGNORE.includes(lastPath.toLowerCase());

        let symbol = '';
        let explicit = false;

        if (params.get('symbol'))      { symbol = params.get('symbol'); explicit = true; }
        else if (params.get('s'))      { symbol = params.get('s');      explicit = true; }
        else if (hash)                 { symbol = hash;                 explicit = true; }
        else if (isSymbolLike)         { symbol = lastPath;             explicit = true; }

        symbol = symbol.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (symbol && !symbol.includes('USDT') && !symbol.includes('USD')) symbol += 'USDT';
        if (!symbol) symbol = DEFAULT_SYMBOL;

        return {
            symbol,
            interval: params.get('interval') || params.get('tf') || DEFAULT_INTERVAL,
            limit: parseInt(params.get('limit')) || DEFAULT_LIMIT,
            explicit
        };
    }

    /* ═══════════════════════════════════════════════════════
       DOM
       ═══════════════════════════════════════════════════════ */
    const $ = (s) => document.querySelector(s);
    const els = {
        input:     $('#coinInput'),
        datalist:  $('#coinList'),
        price:     $('#priceEl'),
        change:    $('#changeEl'),
        high:      $('#highEl'),
        low:       $('#lowEl'),
        loading:   $('#loadingEl'),
        error:     $('#errorEl'),
        canvas:    $('#chartCanvas'),
        chartWrap: $('#chartWrap'),
        tooltip:   $('#tooltipEl'),
        tfs:       document.querySelectorAll('#tfSelector .sp-tab')
    };
    const ctx = els.canvas.getContext('2d');

    /* ═══════════════════════════════════════════════════════
       STATE
       ═══════════════════════════════════════════════════════ */
    const url = parseUrl();
    const state = {
        symbol: url.symbol,
        interval: url.interval,
        limit: url.limit,
        destroyed: false
    };

    let priceData = [];
    let rawPrices = [];
    let animId = null;
    let pulseId = null;
    let pulseStart = null;
    let lastMouseX = -1;
    let refreshTimer = null;
    const dataCache = new Map();   // cacheKey → { marketData, chartData }

    const config = {
        padding: { top: 15, right: 10, bottom: 10, left: 10 },
        hoverLineColor: 'rgba(255,255,255,0.15)'
    };

    /* ═══════════════════════════════════════════════════════
       HELPERS
       ═══════════════════════════════════════════════════════ */
    function formatPrice(price) {
        const num = parseFloat(price);
        if (!isFinite(num)) return '--';
        return new Intl.NumberFormat('en-US', {
            style: 'currency', currency: 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: num > 100 ? 2 : 6
        }).format(num);
    }
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
    const lsGet = (k)    => { try { return localStorage.getItem(k); } catch(e) { return null; } };

    function notifyParent(type, data) {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(Object.assign({ type }, data || {}), '*');
            }
        } catch (e) {}
    }

    /* ═══════════════════════════════════════════════════════
       FETCH
       ═══════════════════════════════════════════════════════ */
    async function fetchChartData(symbol, interval, limit) {
        const url = `${API_BASE}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
        const data = await fetch(url, { cache: 'no-store' }).then(r => r.json());
        if (!Array.isArray(data)) return [];
        return data.map(k => [parseInt(k[0]), parseFloat(k[4])]);
    }

    function applyMarketData(d) {
        if (!d || d.code) return;
        const chg = parseFloat(d.priceChangePercent);
        els.price.textContent = formatPrice(d.lastPrice);
        const isUp = chg >= 0;
        const upCol = '#00ffc8', dnCol = '#a855f7';
        els.price.style.color = isUp ? upCol : dnCol;
        els.change.textContent = `${isUp ? '+' : ''}${chg.toFixed(2)}%`;
        els.change.style.color = isUp ? upCol : dnCol;
        els.change.style.background = isUp ? 'rgba(0,255,200,0.1)' : 'rgba(168,85,247,0.1)';
        els.change.style.border = isUp ? '1px solid rgba(0,255,200,0.2)' : '1px solid rgba(168,85,247,0.2)';
        els.high.textContent = formatPrice(d.highPrice);
        els.low.textContent  = formatPrice(d.lowPrice);
    }

    async function updateWidget(symbol) {
        if (state.destroyed) return;

        const cacheKey = `${symbol}:${state.interval}:${state.limit}`;
        const cached = dataCache.get(cacheKey);

        // ⚡ Instant paint from cache (եթե կա)
        if (cached) {
            applyMarketData(cached.marketData);
            priceData = cached.chartData;
            rawPrices = priceData.map(p => p[1]);
            els.loading.style.display = 'none';
            if (!pulseId) pulseId = requestAnimationFrame(animatePulse);
        } else if (!rawPrices.length) {
            els.loading.style.display = 'block';
        }

        els.error.style.display = 'none';

        try {
            const [marketData, chartData] = await Promise.all([
                fetch(`${API_BASE}/ticker/24hr?symbol=${symbol}`, { cache: 'no-store' }).then(r => r.json()),
                fetchChartData(symbol, state.interval, state.limit)
            ]);
            if (state.destroyed) return;

            if (!marketData || marketData.code) {
                if (!cached) showError();
                return;
            }

            dataCache.set(cacheKey, { marketData, chartData });

            applyMarketData(marketData);
            priceData = chartData;
            rawPrices = priceData.map(p => p[1]);
            els.loading.style.display = 'none';

            if (!pulseId) pulseId = requestAnimationFrame(animatePulse);
        } catch (e) {
            if (state.destroyed) return;
            if (!cached) showError();
        }
    }

    function showError() {
        els.loading.style.display = 'none';
        els.error.style.display = 'block';
        if (!rawPrices.length) {
            els.price.textContent = '--';
            els.change.textContent = '--';
        }
    }

    /* ═══════════════════════════════════════════════════════
       DRAW
       ═══════════════════════════════════════════════════════ */
    function drawSparkline(hoverX, pulseScale) {
        if (state.destroyed || !rawPrices.length) return;
        hoverX = (hoverX === undefined) ? -1 : hoverX;
        pulseScale = (pulseScale === undefined) ? 1 : pulseScale;

        const rect = els.chartWrap.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        els.canvas.width  = rect.width  * DPI;
        els.canvas.height = rect.height * DPI;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(DPI, DPI);

        ctx.clearRect(0, 0, rect.width, rect.height);
        if (rawPrices.length < 2) return;

        const width  = rect.width  - config.padding.left - config.padding.right;
        const height = rect.height - config.padding.top  - config.padding.bottom;
        if (width <= 0 || height <= 0) return;

        const max = Math.max(...rawPrices);
        const min = Math.min(...rawPrices);
        const range = max - min;
        if (range <= 0) return;

        const isUp = rawPrices[rawPrices.length - 1] >= rawPrices[0];
        const lineColor = isUp ? '#00ffc8' : '#a855f7';

        const xScale = width / (rawPrices.length - 1);
        const yScale = height / range;
        const getX = i => config.padding.left + i * xScale;
        const getY = p => config.padding.top + height - (p - min) * yScale;

        // fill
        ctx.beginPath();
        ctx.moveTo(config.padding.left, rect.height);
        ctx.lineTo(getX(0), getY(rawPrices[0]));
        for (let i = 0; i < rawPrices.length - 1; i++) {
            ctx.quadraticCurveTo((getX(i)+getX(i+1))/2, getY(rawPrices[i]), getX(i+1), getY(rawPrices[i+1]));
        }
        ctx.lineTo(config.padding.left + width, rect.height);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, config.padding.top, 0, rect.height);
        grad.addColorStop(0, lineColor + '60');
        grad.addColorStop(1, lineColor + '00');
        ctx.fillStyle = grad;
        ctx.fill();

        // stroke
        ctx.beginPath();
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = lineColor;
        ctx.shadowBlur = 8;
        ctx.moveTo(getX(0), getY(rawPrices[0]));
        for (let i = 0; i < rawPrices.length - 1; i++) {
            ctx.quadraticCurveTo((getX(i)+getX(i+1))/2, getY(rawPrices[i]), getX(i+1), getY(rawPrices[i+1]));
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // pulse tip
        const lastX = getX(rawPrices.length - 1);
        const lastY = getY(rawPrices[rawPrices.length - 1]);
        if (pulseScale > 1) {
            ctx.beginPath();
            ctx.arc(lastX, lastY, 12 * pulseScale, 0, Math.PI * 2);
            const alpha = Math.round((0.8 / pulseScale) * 255).toString(16).padStart(2, '0');
            ctx.strokeStyle = lineColor + alpha;
            ctx.lineWidth = Math.max(0.5, 2 * (2 - pulseScale));
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        // hover
        if (hoverX > -1) {
            const idx = Math.min(Math.round((hoverX - config.padding.left) / xScale), rawPrices.length - 1);
            if (idx >= 0) {
                const px = getX(idx), py = getY(rawPrices[idx]);
                ctx.beginPath();
                ctx.strokeStyle = config.hoverLineColor;
                ctx.setLineDash([3, 3]);
                ctx.moveTo(px, config.padding.top);
                ctx.lineTo(px, rect.height - config.padding.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                return { x: px, y: py, price: rawPrices[idx], time: priceData[idx][0] };
            }
        }
    }

    function animatePulse(t) {
        if (state.destroyed) return;
        if (!pulseStart) pulseStart = t;
        let progress = (t - pulseStart) / PULSE_DURATION;
        if (progress >= 1) {
            drawSparkline(lastMouseX, 1);
            pulseId = null;
            return;
        }
        drawSparkline(lastMouseX, 1 + 0.6 * Math.sin(progress * Math.PI));
        pulseId = requestAnimationFrame(animatePulse);
    }

    /* ═══════════════════════════════════════════════════════
       INTERACTION
       ═══════════════════════════════════════════════════════ */
    function showTooltip(hx) {
        const h = drawSparkline(hx, 1);
        if (!h) return;
        const trendColor = h.price >= rawPrices[0] ? '#00ffc8' : '#a855f7';
        const timeStr = new Date(h.time).toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric'
        });
        els.tooltip.innerHTML =
            `<span style="font-weight:800;font-size:12px;color:${trendColor};">${formatPrice(h.price)}</span>` +
            `<br><span style="color:var(--text-muted);opacity:0.8;">${timeStr}</span>`;

        let tipX = h.x + els.canvas.offsetLeft;
        let tipY = h.y + els.canvas.offsetTop - 15;
        const tipW = els.tooltip.offsetWidth || 80;
        if (tipY < 40) {
            tipY = h.y + els.canvas.offsetTop + 20;
            els.tooltip.style.transform = 'translate(-50%, 0)';
        } else {
            els.tooltip.style.transform = 'translate(-50%, -100%)';
        }
        if (tipX < tipW / 2 + 5) tipX = tipW / 2 + 5;
        if (tipX > els.canvas.offsetWidth - tipW / 2 - 5) tipX = els.canvas.offsetWidth - tipW / 2 - 5;
        els.tooltip.style.left = tipX + 'px';
        els.tooltip.style.top  = tipY + 'px';
        els.tooltip.style.opacity = '1';
    }

    function onMove(clientX) {
        lastMouseX = clientX - els.canvas.getBoundingClientRect().left;
        if (pulseId) { cancelAnimationFrame(pulseId); pulseId = null; pulseStart = null; }
        if (!animId) {
            animId = requestAnimationFrame(() => { animId = null; showTooltip(lastMouseX); });
        }
    }
    function onLeave() {
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        els.tooltip.style.opacity = '0';
        lastMouseX = -1;
        if (!pulseId) pulseId = requestAnimationFrame(animatePulse);
    }

    els.canvas.addEventListener('mousemove', e => onMove(e.clientX));
    els.canvas.addEventListener('mouseleave', onLeave);
    els.canvas.addEventListener('touchstart', e => { if (e.touches.length) onMove(e.touches[0].clientX); }, { passive: true });
    els.canvas.addEventListener('touchmove',  e => { if (e.touches.length) onMove(e.touches[0].clientX); }, { passive: true });
    els.canvas.addEventListener('touchend', onLeave);

    /* ═══════════════════════════════════════════════════════
       PUBLIC API
       ═══════════════════════════════════════════════════════ */
    function setSymbol(symbol) {
        let val = String(symbol || '').toUpperCase().trim();
        if (!val) return false;
        if (val.length > 2 && !val.includes('USDT') && !val.includes('USD')) val += 'USDT';
        state.symbol = val;
        els.input.value = val;
        lsSet('spark_last_symbol', val);
        updateWidget(val);
        notifyParent('spark:symbolChanged', { symbol: val });
        return true;
    }

    function setTimeframe(interval, limit) {
        if (!interval) return false;
        state.interval = interval;
        state.limit = parseInt(limit) || state.limit;
        els.tfs.forEach(b => b.classList.toggle('active',
            b.dataset.interval === interval && parseInt(b.dataset.limit) === state.limit));
        updateWidget(state.symbol);
        notifyParent('spark:timeframeChanged', { interval: state.interval, limit: state.limit });
        return true;
    }

    window.SparklineWidget = {
        setSymbol, setTimeframe,
        refresh: () => updateWidget(state.symbol),
        getSymbol: () => state.symbol,
        getState:  () => ({ ...state }),
        destroy: () => {
            state.destroyed = true;
            if (pulseId) cancelAnimationFrame(pulseId);
            if (animId) cancelAnimationFrame(animId);
            if (refreshTimer) clearInterval(refreshTimer);
        }
    };

    // postMessage listener (parent → iframe)
    window.addEventListener('message', e => {
        const d = e.data;
        if (!d || typeof d !== 'object' || !d.type) return;
        switch (d.type) {
            case 'spark:setSymbol':    if (d.symbol) setSymbol(d.symbol); break;
            case 'spark:setTimeframe': if (d.interval) setTimeframe(d.interval, d.limit); break;
            case 'spark:refresh':      updateWidget(state.symbol); break;
            case 'spark:setTheme':
                if (d.accent)    document.documentElement.style.setProperty('--accent', d.accent);
                if (d.accentDim) document.documentElement.style.setProperty('--accent-dim', d.accentDim);
                break;
        }
    });

    /* ═══════════════════════════════════════════════════════
       INPUT & TABS
       ═══════════════════════════════════════════════════════ */
    let debounce;
    els.input.addEventListener('input', e => {
        clearTimeout(debounce);
        debounce = setTimeout(() => {
            let val = e.target.value.trim().toUpperCase();
            if (val.length > 2 && !val.includes('USDT') && !val.includes('USD')) val += 'USDT';
            if (val) setSymbol(val);
        }, 500);
    });

    els.tfs.forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        els.tfs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setTimeframe(btn.dataset.interval, btn.dataset.limit);
    }));

    // datalist
    Object.keys(SYMBOL_NAMES).forEach(id => {
        const o = document.createElement('option');
        o.value = id; o.textContent = SYMBOL_NAMES[id];
        els.datalist.appendChild(o);
    });

    // resize
    const ro = new ResizeObserver(() => { if (!state.destroyed) drawSparkline(lastMouseX, 1); });
    ro.observe(els.chartWrap);

    /* ═══════════════════════════════════════════════════════
       BOOT
       ═══════════════════════════════════════════════════════ */
    if (!url.explicit) {
        const saved = lsGet('spark_last_symbol');
        if (saved) state.symbol = saved.toUpperCase();
    }
    els.input.value = state.symbol;
    els.tfs.forEach(b => b.classList.toggle('active',
        b.dataset.interval === state.interval && parseInt(b.dataset.limit) === state.limit));

    updateWidget(state.symbol);                          // ⚡ անմիջապես
    refreshTimer = setInterval(() => {
        if (!state.destroyed && document.visibilityState === 'visible') updateWidget(state.symbol);
    }, REFRESH_MS);

    notifyParent('spark:ready', { symbol: state.symbol });
    console.log('%c✦ Sparkline MiniWidget · ' + state.symbol, 'color:#00ffd5;font-family:monospace;');
})();
</script>
</body>
</html>
