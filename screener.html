<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Intelligence & SCREENER</title>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #020407; --bg2: #11141b; --bg3: #161a22;
    --bg-elev: rgba(14, 18, 26, 0.6);
    --border: rgba(255,255,255,0.07); --border-hi: rgba(255,255,255,0.12);
    --green: #00ff9d; --red: #ff0055; --gold: #ffbe0b; --blue: #00d4ff; --purple: #a855f7;
    --text: #f5f7fa; --muted: #6b7280; --muted-2: #4b5563;
    --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter', -apple-system, sans-serif;
    --bd: rgba(255,255,255,.05); --ac: #00ffd5; --acD: rgba(0,255,213,.08);
    --up: #00ffc8; --dn: #a855f7; --yel: #ffd60a; --rsi: #6366f1;
    --t1: #e6e7ea; --t2: #9ca0a9; --t3: #6b7280;
    --tr: all .2s cubic-bezier(.16,1,.3,1);
    --tr-smooth: all .4s cubic-bezier(.16,1,.3,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; min-height: 100vh; overflow-x: hidden; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 800px 500px at 10% 0%, rgba(0,255,157,0.08), transparent 60%), radial-gradient(ellipse 800px 500px at 90% 20%, rgba(0,212,255,0.06), transparent 60%), radial-gradient(ellipse 1000px 600px at 50% 100%, rgba(168,85,247,0.05), transparent 60%); pointer-events: none; z-index: 0; }
body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 80%); }

.wrap { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; padding: 20px 24px 60px; }

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 4px 4px 16px;
    margin-bottom: 4px;
    flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 3px; font-size: 12px; color: #fff; }
.brand i { color: var(--ac); font-size: 15px; }
.brand span { color: var(--muted); font-size: 9px; letter-spacing: 2px; font-weight: 700; margin-left: 4px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.tb-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; color: var(--muted); font-weight: 800;
    letter-spacing: 1.2px; text-transform: uppercase;
    padding: 6px 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 8px;
    backdrop-filter: blur(10px);
}
.tb-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s ease-in-out infinite; }
.tb-status .dot.paused { background: var(--muted-2); box-shadow: none; animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.tb-status b { color: var(--text); font-weight: 800; }
.tb-status .sep { color: var(--muted-2); margin: 0 2px; }

.tb-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px; font-size: 10px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px; cursor: pointer;
    transition: var(--tr);
    backdrop-filter: blur(10px);
    font-family: var(--font-mono);
}
.tb-btn:hover { color: var(--ac); border-color: var(--ac); background: var(--acD); }
.tb-btn.tb-primary { color: #000; background: var(--ac); border-color: var(--ac); }
.tb-btn.tb-primary:hover { color: #000; filter: brightness(1.1); }
.tb-btn.tb-icon { padding: 7px 10px; }
.tb-btn.spin i { animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.tb-select {
    padding: 7px 26px 7px 12px; font-size: 10.5px; font-weight: 700;
    font-family: var(--font-mono); letter-spacing: 0.5px;
    background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; cursor: pointer;
    outline: none; transition: var(--tr);
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 12px) 13px, calc(100% - 8px) 13px;
    background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
    backdrop-filter: blur(10px);
}
.tb-select:hover, .tb-select:focus { border-color: var(--ac); }
.tb-select option { background: var(--bg2); color: var(--text); }

/* ============================================================
   BENTO GRID
   ============================================================ */
.bento-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
    grid-auto-rows: 210px;        /* ← FIXED բարձրություն, աճ չկա */
    grid-auto-flow: row dense;
    align-items: stretch;
}
.bento-grid.hidden { display: none; }

.module {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;           /* ← թույլ ենք տալիս shrink (չի բարձրանա) */
    height: 100%;            /* ← լցնում ենք grid cell-ը ուղիղ */
    will-change: auto;
}

/* ▶ ԱՆՎՏԱՆԳՈՒԹՅՈՒՆ — ամեն ներքին flex-չիլդ պիտի shrink ընդունի */
.module > * {
    min-height: 0;
}
.module:hover { border-color: var(--border-hi); }

/* ============================================================
   SIZE VARIANTS
   ============================================================ */
.module[data-size="1x1"] { grid-column: span 1; grid-row: span 1; }
.module[data-size="2x1"] { grid-column: span 2; grid-row: span 1; }
.module[data-size="3x1"] { grid-column: span 3; grid-row: span 1; }
.module[data-size="4x1"] { grid-column: span 4; grid-row: span 1; }

.module[data-size="1x2"] { grid-column: span 1; grid-row: span 2; }
.module[data-size="2x2"] { grid-column: span 2; grid-row: span 2; }
.module[data-size="3x2"] { grid-column: span 3; grid-row: span 2; }
.module[data-size="4x2"] { grid-column: span 4; grid-row: span 2; }

.module[data-size="1x3"] { grid-column: span 1; grid-row: span 3; }
.module[data-size="2x3"] { grid-column: span 2; grid-row: span 3; }
.module[data-size="3x3"] { grid-column: span 3; grid-row: span 3; }

.module[data-size="full"]   { grid-column: 1 / -1; grid-row: span 2; }
.module[data-size="hero"]   { grid-column: 1 / -1; grid-row: span 3; }
.module[data-size="screen"] { grid-column: 1 / -1; grid-row: span 3; }  /* ≈ 658px */

@media (max-width: 780px) {
    .bento-grid { grid-auto-rows: 180px; }
    .module[data-size="screen"] { grid-row: span 3; }
}

@media (max-width: 1400px) {
    .module[data-size="4x1"], .module[data-size="4x2"], .module[data-size="3x3"] { grid-column: span 3; }
}
@media (max-width: 1100px) {
    .module[data-size="3x1"], .module[data-size="3x2"], .module[data-size="3x3"],
    .module[data-size="4x1"], .module[data-size="4x2"] { grid-column: span 2; }
}

/* ============================================================
   WIDGET CONTROLS (floating top-right)
   ============================================================ */
.widget-controls {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 3px;
    opacity: 0; transition: opacity 0.25s var(--tr);
    z-index: 20;
    pointer-events: none;
}
.module:hover .widget-controls { opacity: 1; pointer-events: auto; }

.widget-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer; font-size: 9px;
    transition: var(--tr);
}
.widget-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border-hi); }
.widget-btn.grip { cursor: grab; touch-action: none; }
.widget-btn.grip:active { cursor: grabbing; }
.widget-btn.danger:hover { color: var(--red); border-color: rgba(255,0,85,0.4); background: rgba(255,0,85,0.15); }

/* ============================================================
   RESIZE HANDLE
   ============================================================ */
.resize-handle {
    position: absolute; bottom: 6px; right: 6px;
    width: 18px; height: 18px;
    cursor: nwse-resize;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 20;
}
.module:hover .resize-handle { opacity: 0.5; }
.resize-handle:hover { opacity: 1 !important; }
.resize-handle::after {
    content: '';
    position: absolute; bottom: 3px; right: 3px;
    width: 8px; height: 8px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    border-radius: 0 0 2px 0;
    transition: border-color 0.2s;
}
.resize-handle:hover::after { border-color: var(--ac); }

body.is-resizing { cursor: nwse-resize !important; }
body.is-resizing * { cursor: nwse-resize !important; user-select: none !important; }
body.is-resizing .module { transition: none !important; }

.resize-hint {
    position: fixed;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(10px);
    color: var(--ac);
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    padding: 5px 11px;
    border-radius: 7px;
    border: 1px solid var(--ac);
    pointer-events: none;
    z-index: 99999;
    box-shadow: 0 0 24px var(--acD), 0 8px 24px rgba(0,0,0,0.6);
    white-space: nowrap;
}

/* ============================================================
   DRAG / DROP
   ============================================================ */
.module.dragging { opacity: 0.2; transform: scale(0.97); pointer-events: none; }
.module.drop-target {
    border-color: var(--ac) !important;
    box-shadow: 0 0 0 2px var(--acD), 0 0 40px var(--acD), inset 0 0 30px var(--acD) !important;
    transform: scale(1.02) !important;
    z-index: 5;
}
.module.entering { animation: cardIn 0.45s var(--tr-smooth); }
@keyframes cardIn {
    from { opacity: 0; transform: scale(0.94) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

.drag-ghost {
    position: fixed !important;
    top: 0; left: 0;
    margin: 0 !important;
    pointer-events: none !important;
    z-index: 9999 !important;
    opacity: 0;
    border-radius: 14px;
    border: 1px solid var(--ac) !important;
    background: var(--bg2) !important;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 0 1px var(--acD), 0 0 40px var(--acD) !important;
    transform-origin: top left;
    will-change: transform;
    overflow: hidden;
    transition: opacity 0.12s ease;
}
body.is-dragging .drag-ghost { opacity: 1; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
body.is-dragging iframe { pointer-events: none !important; }

/* ============================================================
   SIZE PICKER
   ============================================================ */
.size-picker {
    position: absolute;
    top: calc(100% + 5px);
    right: 0;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    min-width: 210px;
    z-index: 200;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0,255,213,0.06);
    animation: sizePickerIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sizePickerIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.size-picker-btn {
    padding: 7px 4px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 800; letter-spacing: 0.3px;
    cursor: pointer; text-align: center; line-height: 1;
    transition: var(--tr);
}
.size-picker-btn:hover { color: var(--ac); border-color: var(--ac); background: var(--acD); }
.size-picker-btn.active { color: var(--ac); border-color: var(--ac); background: var(--acD); box-shadow: 0 0 12px var(--acD); }

/* ============================================================
   WIDGET LIBRARY
   ============================================================ */
.library-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: var(--tr-smooth); z-index: 900; }
.library-overlay.open { opacity: 1; pointer-events: auto; }

.widget-library {
    position: fixed; top: 0; right: 0;
    width: 400px; max-width: 92vw; height: 100vh;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    z-index: 950; display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
.widget-library.open { transform: translateX(0); }
.library-header { padding: 24px 24px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.library-title { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 10px; }
.library-title i { color: var(--ac); }
.library-close { width: 30px; height: 30px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; transition: var(--tr); }
.library-close:hover { color: var(--text); border-color: var(--border-hi); }
.library-subtitle { padding: 12px 24px; font-size: 10px; color: var(--muted); line-height: 1.6; border-bottom: 1px solid var(--border); background: rgba(0,255,213,0.015); }
.library-subtitle strong { color: var(--ac); font-weight: 700; }
.library-body { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
.library-category { margin-bottom: 26px; }
.library-category-title { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); font-weight: 800; margin-bottom: 12px; }
.library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.library-item {
    background: rgba(255,255,255,0.015);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 13px;
    cursor: pointer; transition: var(--tr);
    display: flex; flex-direction: column; gap: 8px;
    position: relative; user-select: none; min-height: 100px;
}
.library-item:hover { border-color: var(--ac); background: var(--acD); transform: translateY(-2px); }
.library-item.active { border-color: var(--ac); background: var(--acD); opacity: 0.55; cursor: not-allowed; }
.library-item-icon { width: 26px; height: 26px; background: var(--acD); color: var(--ac); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.library-item-name { font-size: 10.5px; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }
.library-item-desc { font-size: 9px; color: var(--muted); line-height: 1.4; }

/* ============================================================
   TRASH ZONE
   ============================================================ */
.trash-zone {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(140px);
    padding: 13px 28px;
    background: rgba(255, 0, 85, 0.12);
    border: 2px dashed rgba(255, 0, 85, 0.5);
    border-radius: 50px; color: var(--red);
    font-weight: 800; font-size: 10.5px;
    letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
    z-index: 1200; transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none; backdrop-filter: blur(10px);
}
.trash-zone.active { transform: translateX(-50%) translateY(0); pointer-events: auto; }
.trash-zone.hot { background: rgba(255, 0, 85, 0.4); border-color: var(--red); border-style: solid; transform: translateX(-50%) translateY(-10px) scale(1.08); box-shadow: 0 0 60px rgba(255, 0, 85, 0.6); }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-dashboard {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 30px; text-align: center;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,0.005);
    min-height: 260px;
    transition: var(--tr-smooth);
}
.empty-dashboard.hidden { display: none; }
.empty-dashboard.highlight { border-color: var(--ac); background: var(--acD); }
.empty-icon { font-size: 2.2rem; color: var(--muted); margin-bottom: 18px; opacity: 0.6; }
.empty-title { font-size: 12px; font-weight: 800; color: var(--text); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.empty-desc { font-size: 11px; color: var(--muted); max-width: 400px; line-height: 1.6; margin-bottom: 22px; }
.empty-cta { background: var(--ac); color: #000; border: none; padding: 11px 24px; border-radius: 50px; font-weight: 800; font-size: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: var(--tr); }
.empty-cta:hover { transform: scale(1.05); box-shadow: 0 0 24px var(--acD); }

/* ============================================================
   TOASTS
   ============================================================ */
.toasts { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; }
.toast {
    padding: 10px 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-left: 2px solid var(--ac);
    border-radius: 8px;
    font-size: 11px; font-weight: 600;
    color: var(--text);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: flex; align-items: center; gap: 10px;
    animation: toastIn 0.35s var(--tr-smooth);
    pointer-events: auto; max-width: 320px;
    backdrop-filter: blur(20px);
}
.toast i { color: var(--ac); }
.toast.out { animation: toastOut 0.3s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(20px); } }

/* ============================================================
   WIDGET INTERNAL STYLES (ported from original)
   ============================================================ */
.card-title { display: flex; align-items: center; gap: 8px; padding: 14px 18px 10px; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card-title i { color: var(--accent, var(--green)); font-size: 11px; }
.card-title .badge { margin-left: auto; font-size: 9px; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.05); color: var(--muted); letter-spacing: 0.5px; font-weight: 700; }

.btc-card-content { padding: 20px 22px; display: flex; flex-direction: column; height: 100%; }
.btc-live { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 10px; color: var(--muted); letter-spacing: 1.5px; font-weight: 700; }
.btc-live .live-dot { width: 7px; height: 7px; border-radius: 50%; }
.btc-price { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; margin-bottom: 8px; transition: color 0.4s ease; }
.btc-delta { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.btc-delta > span { transition: color 0.4s ease; }
.btc-spark { flex: 1; min-height: 42px; width: 100%; }

.kpi-content { padding: 18px; display: flex; flex-direction: column; height: 100%; position: relative; }
.kpi-content::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--accent, var(--green)), transparent); opacity: 0.7; }
.kpi-lbl { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; }
.kpi-num { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1; margin-bottom: 6px; color: #fff; transition: color 0.4s ease; }
.kpi-sub { font-size: 10px; color: var(--muted); font-weight: 600; margin-bottom: auto; }
.kpi-bar { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 10px; position: relative; }
.kpi-bar > div { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
.kpi-content.kpi-gold   { --accent: var(--gold); }

.pos { color: var(--green); }

};
const CORR_SYMBOLS = ['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX'];

const state = {

    tickers: [], tickersMap: {}, funding: {},
    screenerMode: 'volume', screenerSearch: '',
    liqTotalCount: 0,
    refreshMs: 30000, refreshTimer: null, lastUpdateAt: null,

/* ════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => 'w_' + Math.random().toString(36).slice(2, 9);

function toast(msg, kind = '') {
    const w = $('toasts'); if (!w) return;
    const e = document.createElement('div');
    e.className = 'toast ' + kind;
    e.innerHTML = `<i class="fas fa-circle-check"></i><span>${msg}</span>`;
    w.appendChild(e);
    setTimeout(() => { e.style.opacity = '0'; }, 2400);
    setTimeout(() => e.remove(), 2800);
}

function fmtUSD(v, digits = 2) {
    if (!isFinite(v)) return '--';
    const a = Math.abs(v);
    if (a >= 1e12) return '$' + (v/1e12).toFixed(digits) + 'T';
    if (a >= 1e9)  return '$' + (v/1e9).toFixed(digits) + 'B';
    if (a >= 1e6)  return '$' + (v/1e6).toFixed(digits) + 'M';
    if (a >= 1e3)  return '$' + (v/1e3).toFixed(digits) + 'K';
    return '$' + v.toFixed(digits);
}
function fmtPrice(v) {
    if (!isFinite(v)) return '--';
    const a = Math.abs(v);
    if (a >= 10000) return v.toLocaleString('en-US', {maximumFractionDigits: 0});
    if (a >= 1000) return v.toLocaleString('en-US', {maximumFractionDigits: 2});
    if (a >= 100) return v.toFixed(2);
    if (a >= 1) return v.toFixed(4);
    if (a >= 0.01) return v.toFixed(5);
    if (a >= 0.0001) return v.toFixed(6);
    return v.toFixed(8);
}
function fmtPct(v, digits = 2) { return !isFinite(v) ? '--' : (v >= 0 ? '+' : '') + v.toFixed(digits) + '%'; }
function pnlClass(v) { return v >= 0 ? 'pos' : 'neg'; }
function timeShort(ts) { return new Date(ts).toTimeString().slice(0, 8); }

function sparkSVG(values, opts = {}) {
    if (!values || values.length < 2) return '';
    const w = opts.width || 100, h = opts.height || 24, pad = 2;
    const min = Math.min(...values), max = Math.max(...values), range = max - min || 1;
    const step = (w - pad*2) / (values.length - 1);
    const pts = values.map((v, i) => [pad + i * step, h - pad - ((v - min) / range) * (h - pad*2)]);
    const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ` L${(pad + (values.length-1)*step).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
    const color = opts.color || 'var(--green)';
    const fill = opts.fill || (color === 'var(--green)' ? 'rgba(0,255,157,0.15)' : 'rgba(255,0,85,0.15)');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:100%; display:block;"><path d="${area}" fill="${fill}" /><path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></svg>`;
}

/* ─── Ticker · click = CoinGlass · long-press = Mini Widget ─── */
/* ─── Long-press · Desktop (mousedown 500ms) + Mobile (touchstart 500ms) ─── */
/* ─── Ticker · click = CoinGlass · long-press = Mini Widget ─── */
/* ─── Ticker · Desktop hover → mini spark · Mobile long-press → mini spark ─── */
function attachLongPress(el, symbol) {
    let timer = null;
    let startX = 0, startY = 0;
    let longPressed = false;
    const isTouchOnly = () => matchMedia('(hover: none)').matches;

    const clearPress = () => { if (timer) { clearTimeout(timer); timer = null; } };

    /* ═══════════════ DESKTOP · hover triggers ═══════════════ */
    el.addEventListener('mouseenter', (e) => {
        if (isTouchOnly()) return;
        miniWidget.open(symbol, e.clientX, e.clientY, false);
    });
    el.addEventListener('mousemove', (e) => {
        if (isTouchOnly()) return;
        if (miniWidget.isOpen()) miniWidget.open(symbol, e.clientX, e.clientY, false);
    });
    el.addEventListener('mouseleave', () => {
        if (isTouchOnly()) return;
        miniWidget.scheduleHide(120);
    });
    /* Desktop click → CoinGlass */
    el.addEventListener('click', () => {
        if (isTouchOnly()) return;
        window.open(`https://www.coinglass.com/tv/Binance_${symbol}`, '_blank');
    });

    /* ═══════════════ MOBILE · long-press only ═══════════════ */
    el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        longPressed = false;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        clearPress();
        timer = setTimeout(() => {
            longPressed = true;
            try { if (navigator.vibrate) navigator.vibrate(15); } catch (_) {}
            miniWidget.open(symbol, startX, startY, true);
        }, 500);
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
        if (!timer || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearPress();
    }, { passive: true });

    el.addEventListener('touchend', (e) => {
        clearPress();
        const wasLong = longPressed;
        longPressed = false;
        e.preventDefault();                 // kill ghost-click
        if (!wasLong) {
            window.open(`https://www.coinglass.com/tv/Binance_${symbol}`, '_blank');
        }
    });

    el.addEventListener('touchcancel', () => { clearPress(); longPressed = false; });
}

function computeScreenerList() {
    let list = [...state.tickers];
    if (state.screenerSearch) {
        const q = state.screenerSearch.toUpperCase();
        list = list.filter(t => t.base.includes(q) || t.symbol.includes(q));
    }
    if (state.screenerMode === 'volume') list.sort((a,b) => b.volume - a.volume);
    else if (state.screenerMode === 'gainers') list.sort((a,b) => b.change - a.change);
    else if (state.screenerMode === 'losers') list.sort((a,b) => a.change - b.change);
    else if (state.screenerMode === 'volatile') list = list.filter(t => t.volume > 5e6).sort((a,b) => Math.abs(b.change) - Math.abs(a.change));
    else if (state.screenerMode === 'funding_pos') list.sort((a,b) => (state.funding[b.symbol]||0) - (state.funding[a.symbol]||0));
    else if (state.screenerMode === 'funding_neg') list.sort((a,b) => (state.funding[a.symbol]||0) - (state.funding[b.symbol]||0));
    return list.slice(0, 200);
}

function patchScreener() {
    const tbody = $('scr-body');
    if (!tbody) return;
    const wrap = tbody.closest('.screener-table');
    const scrollTop = wrap ? wrap.scrollTop : 0;
    const list = computeScreenerList();

    const beforeTops = new Map();
    const existing = new Map();
    [...tbody.children].forEach(tr => {
        beforeTops.set(tr.dataset.sym, tr.getBoundingClientRect().top);
        existing.set(tr.dataset.sym, tr);
    });
    const isInitial = beforeTops.size === 0;

    const wanted = new Set(list.map(t => t.symbol));
    for (const [sym, tr] of existing) {
        if (!wanted.has(sym)) { tr.remove(); existing.delete(sym); }
    }

    const prevPrices = state._prevPrices;
    list.forEach((t, i) => {
        let tr = existing.get(t.symbol);
        if (!tr) { tr = createScreenerRow(t); existing.set(t.symbol, tr); }
        updateScreenerRow(tr, t, i, prevPrices);
        tbody.appendChild(tr);
        prevPrices.set(t.symbol, t.price);
    });

    [...tbody.children].forEach(tr => {
        const sym = tr.dataset.sym;
        const before = beforeTops.get(sym);
        if (before == null) {
            if (isInitial) { tr.style.opacity = '1'; }
            else {
                tr.style.opacity = '0';
                requestAnimationFrame(() => {
                    tr.style.transition = 'opacity 0.4s cubic-bezier(0.22,1,0.36,1)';
                    tr.style.opacity = '1';
                    setTimeout(() => { tr.style.transition = ''; tr.style.opacity = ''; }, 500);
                });
            }
            return;
        }
        const after = tr.getBoundingClientRect().top;
        const delta = before - after;
        if (Math.abs(delta) < 1) return;
        tr.style.transition = 'none';
        tr.style.transform = `translateY(${delta}px)`;
        void tr.offsetWidth;
        requestAnimationFrame(() => {
            tr.style.transition = 'transform 0.42s cubic-bezier(0.22,1,0.36,1)';
            tr.style.transform = '';
            setTimeout(() => { tr.style.transition = ''; }, 460);
        });
    });

    if (wrap) wrap.scrollTop = scrollTop;
    const cnt = $('scr-count');
    if (cnt) cnt.textContent = list.length + ' pairs';
}

/* ─── Correlation ─── */
async function buildCorrelation() {
    try {
        const closes = await Promise.all(CORR_SYMBOLS.map(sym => fetchKlines(sym + 'USDT', '1d', 31).then(k => k.map(c => parseFloat(c[4])))));
        const returns = closes.map(arr => {
            const r = [];
            for (let i = 1; i < arr.length; i++) r.push(Math.log(arr[i] / arr[i-1]));
            return r;
        });
        const n = CORR_SYMBOLS.length, grid = $('corr-grid');
        if (!grid) return;
        grid.style.gridTemplateColumns = `38px repeat(${n}, 1fr)`;
        let html = '<div class="corr-cell hdr"></div>';
        CORR_SYMBOLS.forEach(s => { html += `<div class="corr-cell hdr">${s}</div>`; });
        for (let i = 0; i < n; i++) {
            html += `<div class="corr-cell hdr">${CORR_SYMBOLS[i]}</div>`;
            for (let j = 0; j < n; j++) {
                let c = 1;
                if (i !== j) {
                    const a = returns[i], b = returns[j], len = Math.min(a.length, b.length);
                    const ma = a.reduce((s,x)=>s+x,0)/len, mb = b.reduce((s,x)=>s+x,0)/len;
                    let num = 0, da = 0, db = 0;
                    for (let k = 0; k < len; k++) { const x = a[k]-ma, y = b[k]-mb; num += x*y; da += x*x; db += y*y; }
                    c = num / Math.sqrt(da * db || 1);
                }
                const bg = c >= 0
                    ? `rgba(0, 255, 157, ${(0.08 + c * 0.72).toFixed(3)})`
                    : `rgba(255, 0, 85, ${(0.08 + (-c) * 0.72).toFixed(3)})`;
                html += `<div class="corr-cell" style="background:${bg}; color:#fff;">${i===j?'—':c.toFixed(2)}</div>`;
            }
        }
        grid.innerHTML = html;
    } catch(e) {}
}

function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ widgets: state.widgets })); } catch(e) {}
}
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const s = JSON.parse(raw);
        state.widgets = (s.widgets || []).filter(w => WIDGET_REGISTRY[w.type]);
        return true;
    } catch(e) { return false; }
}

/* ════════════════════════════════════════════════════════════
   GRID RENDER
   ════════════════════════════════════════════════════════════ */
function renderGrid() {
    /* Cleanup old widgets */
    Object.values(widgetCleanup).forEach(fn => { try { fn(); } catch(e) {} });
    Object.keys(widgetCleanup).forEach(k => delete widgetCleanup[k]);

    const grid = $('bento-grid');
    const emptyEl = $('empty-dashboard');
    const topbar = document.querySelector('.topbar');
    if (!grid) return;

    /* ═════ STEP 1 · Capture refresh controls BEFORE the grid wipe ═════ */
    /* They may currently be in .topbar-actions OR already in .inline-refresh */
    const statusEl   = document.querySelector('.tb-status');
    const selectEl   = document.querySelector('.tb-select');
    const refreshBtn = document.querySelector('#refresh-now');
    const resetBtn   = document.querySelector('#btn-reset');
    const controls   = [statusEl, selectEl, refreshBtn, resetBtn].filter(Boolean);

    /* ═════ STEP 2 · Park them in a hidden container so they survive ═════ */
    let park = document.getElementById('_refresh-park');
    if (!park) {
        park = document.createElement('div');
        park.id = '_refresh-park';
        park.style.display = 'none';
        document.body.appendChild(park);
    }
    controls.forEach(el => park.appendChild(el));

    /* ═════ STEP 3 · Wipe grid ═════ */
    grid.innerHTML = '';

    /* ═════ STEP 4 · Empty dashboard → return controls to topbar ═════ */
    if (!state.widgets.length) {
        grid.classList.add('hidden');
        if (emptyEl) emptyEl.classList.remove('hidden');
        returnControlsToTopbar(park, topbar);
        return;
    }
    grid.classList.remove('hidden');
    if (emptyEl) emptyEl.classList.add('hidden');

    /* ═════ STEP 5 · Render all widgets ═════ */
    state.widgets.forEach((w, idx) => {
        const reg = WIDGET_REGISTRY[w.type];
        if (!reg) return;
        const el = document.createElement('div');
        el.className = 'module entering';
        el.dataset.widgetId = w.id;
        el.dataset.widgetType = w.type;
        el.dataset.size = w.size;
        el.style.animationDelay = (idx * 0.03) + 's';

        el.innerHTML = `
            <div class="widget-controls">
                <button class="widget-btn grip" title="Drag to move"><i class="fa-solid fa-grip-vertical"></i></button>
                <button class="widget-btn size-btn" title="Change size"><i class="fa-solid fa-expand"></i></button>
                <button class="widget-btn danger remove-btn" title="Remove"><i class="fa-solid fa-xmark"></i></button>
            </div>
            ${reg.render(w)}
            <div class="resize-handle" title="Drag to resize"></div>`;

        grid.appendChild(el);

        el.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); removeWidget(w.id); });
        el.querySelector('.size-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openSizePicker(e.currentTarget, w.id);
        });
        const rh = el.querySelector('.resize-handle');
        if (rh) rh.addEventListener('pointerdown', onResizeStart);
        const grip = el.querySelector('.widget-btn.grip');
        if (grip) grip.addEventListener('pointerdown', onGripPointerDown);

        el.addEventListener('dragover', onModuleDragOver);
        el.addEventListener('dragleave', onModuleDragLeave);
        el.addEventListener('drop', onModuleDrop);

        if (typeof reg.init === 'function') {
            setTimeout(() => { try { reg.init(w, el); } catch(e) { console.warn('widget init', e); } }, 60);
        }

        widgetCleanup[w.id] = () => { };
        setTimeout(() => el.classList.remove('entering'), 500 + idx * 30);
    });

    /* ═════ STEP 6 · Attach refresh controls into screener's card-title ═════ */
    const screenerWidget = document.querySelector('[data-widget-type="screener"]');
    if (screenerWidget) {
        const cardTitle = screenerWidget.querySelector('.card-title');

        /* Reuse existing inline-refresh container or create a new one */
        let inline = cardTitle?.querySelector('.inline-refresh');
        if (!inline && cardTitle) {
            inline = document.createElement('div');
            inline.className = 'inline-refresh';
            cardTitle.appendChild(inline);
        }

        if (inline) {
            controls.forEach(el => inline.appendChild(el));
            /* Hide the now-empty topbar completely */
            if (topbar) topbar.style.display = 'none';
        } else {
            /* Fallback · screener rendered but no .card-title found */
            returnControlsToTopbar(park, topbar);
        }
    } else {
        /* No screener widget · return controls to topbar and show it */
        returnControlsToTopbar(park, topbar);
    }
}

/* ── Helper · return controls to topbar and show it ── */
function returnControlsToTopbar(park, topbar) {
    if (!topbar) return;
    let actions = topbar.querySelector('.topbar-actions');
    if (!actions) {
        actions = document.createElement('div');
        actions.className = 'topbar-actions';
        topbar.appendChild(actions);
    }
    [...park.children].forEach(el => actions.appendChild(el));
    topbar.style.display = '';
}



/* ════════════════════════════════════════════════════════════
   ADD / REMOVE
   ════════════════════════════════════════════════════════════ */
function addWidget(type, position) {
    const reg = WIDGET_REGISTRY[type];
    if (!reg) return;
    const id = uid();
    const widget = { id, type, size: reg.size };
    if (typeof position === 'number' && position >= 0) state.widgets.splice(position, 0, widget);
    else state.widgets.push(widget);
    saveState();
    renderGrid();
    toast(`Added: ${reg.name}`);
    closeLibrary();
}

function removeWidget(widgetId) {
    const idx = state.widgets.findIndex(x => x.id === widgetId);
    if (idx === -1) return;
    if (widgetCleanup[widgetId]) { try { widgetCleanup[widgetId](); } catch(e) {} delete widgetCleanup[widgetId]; }
    const el = document.querySelector(`[data-widget-id="${widgetId}"]`);
    if (el) {
        el.style.transition = 'all 0.25s var(--tr-smooth)';
        el.style.transform = 'scale(0.85)';
        el.style.opacity = '0';
    }
    setTimeout(() => {
        state.widgets.splice(idx, 1);
        saveState();
        renderGrid();
        toast('Widget removed');
    }, 240);
}

/* ════════════════════════════════════════════════════════════
   SET WIDGET SIZE
   ════════════════════════════════════════════════════════════ */
function setWidgetSize(widgetId, sizeKey) {
    const w = state.widgets.find(x => x.id === widgetId);
    if (!w) return;
    if (!SIZE_CATALOG.find(s => s.key === sizeKey)) return;
    w.size = sizeKey;
    saveState();
    const el = document.querySelector(`[data-widget-id="${widgetId}"]`);
    if (el) el.dataset.size = w.size;
    const meta = SIZE_CATALOG.find(s => s.key === w.size);
    toast(`Size: ${meta ? meta.desc : w.size}`);
}

/* ════════════════════════════════════════════════════════════
   SIZE PICKER
   ════════════════════════════════════════════════════════════ */
function openSizePicker(btn, widgetId) {
    closeSizePicker();
    const w = state.widgets.find(x => x.id === widgetId);
    if (!w) return;
    const picker = document.createElement('div');
    picker.className = 'size-picker';
    picker.innerHTML = SIZE_CATALOG.map(s => `
        <button class="size-picker-btn ${s.key === w.size ? 'active' : ''}" data-size="${s.key}" title="${s.desc}">${s.label}</button>
    `).join('');
    picker.addEventListener('click', (e) => {
        e.stopPropagation();
        const size = e.target.closest('[data-size]')?.dataset.size;
        if (size) { setWidgetSize(widgetId, size); closeSizePicker(); }
    });
    const wrap = btn.closest('.widget-controls');
    if (wrap) {
        if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
        wrap.appendChild(picker);
    }
    setTimeout(() => document.addEventListener('click', onSizePickerOutside, { once: true }), 10);
}
function onSizePickerOutside(e) {
    if (e.target.closest('.size-picker')) {
        document.addEventListener('click', onSizePickerOutside, { once: true });
        return;
    }
    closeSizePicker();
}
function closeSizePicker() {
    document.querySelectorAll('.size-picker').forEach(p => p.remove());
}

/* ════════════════════════════════════════════════════════════
   DRAG & DROP (pointer-based reorder)
   ════════════════════════════════════════════════════════════ */
let dragState = null;
let draggingFromLibrary = false;

function onGripPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const grip = e.currentTarget;
    const widget = grip.closest('.module');
    if (!widget) return;
    const rect = widget.getBoundingClientRect();
    dragState = {
        active: false,
        widgetId: widget.dataset.widgetId,
        element: widget,
        ghost: null,
        rect,
        startX: e.clientX, startY: e.clientY,
        offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
        target: null, overTrash: false
    };
    e.preventDefault();
    document.addEventListener('pointermove', onDragPointerMove);
    document.addEventListener('pointerup', onDragPointerUp);
    document.addEventListener('pointercancel', onDragPointerUp);
    document.addEventListener('keydown', onDragKeyDown);
}

function onDragPointerMove(e) {
    if (!dragState) return;
    if (!dragState.active) {
        const dx = Math.abs(e.clientX - dragState.startX);
        const dy = Math.abs(e.clientY - dragState.startY);
        if (dx < 6 && dy < 6) return;
        activateDrag();
    }
    const x = e.clientX - dragState.offsetX;
    const y = e.clientY - dragState.offsetY;
    dragState.ghost.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1.03) rotate(0.4deg)`;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const target = el ? el.closest('.module') : null;

    if (target && target !== dragState.element && !dragState.overTrash) {
        if (dragState.target !== target) {
            if (dragState.target) dragState.target.classList.remove('drop-target');
            dragState.target = target;
            target.classList.add('drop-target');
        }
    } else if (dragState.target) {
        dragState.target.classList.remove('drop-target');
        dragState.target = null;
    }

    const trash = $('trash-zone');
    if (trash && trash.classList.contains('active')) {
        const tr = trash.getBoundingClientRect();
        const overTrash = e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top && e.clientY <= tr.bottom;
        if (overTrash !== dragState.overTrash) {
            dragState.overTrash = overTrash;
            trash.classList.toggle('hot', overTrash);
            if (overTrash && dragState.target) {
                dragState.target.classList.remove('drop-target');
                dragState.target = null;
            }
        }
    }
}

function activateDrag() {
    if (!dragState || dragState.active) return;
    dragState.active = true;
    const el = dragState.element;
    const rect = dragState.rect;
    const ghost = el.cloneNode(true);
    ghost.classList.remove('entering', 'dragging');
    ghost.classList.add('drag-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
    ghost.querySelectorAll('button, input, textarea, select, iframe, a').forEach(x => {
        x.setAttribute('tabindex', '-1');
        x.style.pointerEvents = 'none';
    });
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    el.classList.add('dragging');
    const trash = $('trash-zone');
    if (trash) trash.classList.add('active');
    document.body.classList.add('is-dragging');
}

function onDragPointerUp() {
    if (!dragState) return;
    const wasActive = dragState.active;
    const targetId = dragState.target ? dragState.target.dataset.widgetId : null;
    const overTrash = dragState.overTrash;
    const widgetId = dragState.widgetId;
    cleanupDrag();
    if (!wasActive) return;
    if (overTrash) removeWidget(widgetId);
    else if (targetId && targetId !== widgetId) reorderWidget(widgetId, targetId);
}

function onDragKeyDown(e) {
    if (e.key === 'Escape' && dragState && dragState.active) cleanupDrag();
}

function cleanupDrag() {
    if (!dragState) return;
    if (dragState.ghost) dragState.ghost.remove();
    if (dragState.element) dragState.element.classList.remove('dragging');
    if (dragState.target) dragState.target.classList.remove('drop-target');
    const trash = $('trash-zone');
    if (trash) trash.classList.remove('active', 'hot');
    document.body.classList.remove('is-dragging');
    document.removeEventListener('pointermove', onDragPointerMove);
    document.removeEventListener('pointerup', onDragPointerUp);
    document.removeEventListener('pointercancel', onDragPointerUp);
    document.removeEventListener('keydown', onDragKeyDown);
    dragState = null;
}

/* ─── Surgical reorder (no grid re-render) ─── */
function reorderWidget(fromId, toId) {
    const fromIdx = state.widgets.findIndex(w => w.id === fromId);
    const toIdx = state.widgets.findIndex(w => w.id === toId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const [moved] = state.widgets.splice(fromIdx, 1);
    state.widgets.splice(toIdx, 0, moved);
    saveState();

    const grid = $('bento-grid');
    if (!grid) return;
    const fromEl = grid.querySelector(`[data-widget-id="${fromId}"]`);
    const toEl = grid.querySelector(`[data-widget-id="${toId}"]`);
    if (!fromEl || !toEl) return;
    if (fromIdx < toIdx) {
        toEl.parentNode.insertBefore(fromEl, toEl.nextSibling);
    } else {
        toEl.parentNode.insertBefore(fromEl, toEl);
    }
}

/* ─── Library → dashboard drop ─── */
function onModuleDragOver(e) {
    if (!draggingFromLibrary) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    this.classList.add('drop-target');
}
function onModuleDragLeave(e) {
    if (!this.contains(e.relatedTarget)) this.classList.remove('drop-target');
}
function onModuleDrop(e) {
    if (!draggingFromLibrary) return;
    e.preventDefault();
    this.classList.remove('drop-target');
    const type = e.dataTransfer.getData('widget-type');
    if (!type || !WIDGET_REGISTRY[type]) { draggingFromLibrary = false; return; }
    const targetId = this.dataset.widgetId;
    const toIdx = state.widgets.findIndex(x => x.id === targetId);
    addWidget(type, toIdx);
    draggingFromLibrary = false;
}

function initDashboardDropZone() {
    const grid = $('bento-grid');
    const emptyEl = $('empty-dashboard');
    if (!grid) return;

    const onDragOver = (e) => {
        if (!draggingFromLibrary) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        if (emptyEl) emptyEl.classList.add('highlight');
    };
    const onDragLeave = (e) => {
        if (grid.contains(e.relatedTarget)) return;
        if (emptyEl && emptyEl.contains(e.relatedTarget)) return;
        if (emptyEl) emptyEl.classList.remove('highlight');
    };
    const onDrop = (e) => {
        e.preventDefault();
        if (emptyEl) emptyEl.classList.remove('highlight');
        const type = e.dataTransfer.getData('widget-type');
        if (!type || !WIDGET_REGISTRY[type]) { draggingFromLibrary = false; return; }
        addWidget(type);
        draggingFromLibrary = false;
    };

    [grid, emptyEl].filter(Boolean).forEach(el => {
        el.addEventListener('dragover', onDragOver);
        el.addEventListener('dragleave', onDragLeave);
        el.addEventListener('drop', onDrop);
    });
}

/* ─── Trash zone ─── */
function initTrashZone() {
    const trash = $('trash-zone');
    if (!trash) return;
    trash.addEventListener('dragover', (e) => { e.preventDefault(); trash.classList.add('hot'); });
    trash.addEventListener('dragleave', (e) => { if (!trash.contains(e.relatedTarget)) trash.classList.remove('hot'); });
    trash.addEventListener('drop', (e) => {
        e.preventDefault();
        trash.classList.remove('hot');
        const wid = e.dataTransfer.getData('text/plain');
        if (wid && state.widgets.find(w => w.id === wid)) removeWidget(wid);
    });
}

/* ════════════════════════════════════════════════════════════
   RESIZE (snap to grid cells)
   ════════════════════════════════════════════════════════════ */
let resizeState = null;

function getGridInfo() {
    const grid = $('bento-grid');
    if (!grid) return { cellW: 340, gap: 14, maxCols: 4 };
    const cs = getComputedStyle(grid);
    const gap = parseFloat(cs.columnGap) || 14;
    const cols = (cs.gridTemplateColumns || '').split(' ').filter(s => s && s !== 'none').length || 1;
    const totalW = grid.clientWidth;
    const cellW = (totalW - (cols - 1) * gap) / cols;
    return { cellW, gap, maxCols: Math.max(1, cols) };
}

function pickSizeKey(cols, rows) {
    if (rows === 1) cols = Math.min(cols, 4);
    else if (rows === 2) cols = Math.min(cols, 4);
    else if (rows >= 3) { rows = 3; cols = Math.min(cols, 3); }
    return `${cols}x${rows}`;
}

function onResizeStart(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const handle = e.currentTarget;
    const widget = handle.closest('.module');
    if (!widget) return;

    resizeState = {
        widgetId: widget.dataset.widgetId,
        element: widget,
        handle,
        startX: e.clientX, startY: e.clientY,
        startW: widget.offsetWidth, startH: widget.offsetHeight,
        pointerId: e.pointerId,
        pendingSize: widget.dataset.size
    };

    let hint = document.getElementById('resizeHint');
    if (!hint) {
        hint = document.createElement('div');
        hint.id = 'resizeHint';
        hint.className = 'resize-hint';
        document.body.appendChild(hint);
    }
    hint.textContent = (widget.dataset.size || '1x1').toUpperCase();

    document.body.classList.add('is-resizing');
    document.addEventListener('pointermove', onResizeMove);
    document.addEventListener('pointerup', onResizeEnd);
    document.addEventListener('pointercancel', onResizeEnd);
}

function onResizeMove(e) {
    if (!resizeState) return;
    const { startX, startY, startW, startH, element } = resizeState;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const newW = Math.max(200, startW + dx);
    const newH = Math.max(140, startH + dy);

    const g = getGridInfo();
    const rawCols = (newW + g.gap) / (g.cellW + g.gap);
    const cols = Math.max(1, Math.min(g.maxCols, Math.round(rawCols)));
    const ROW_H = 200;
    const rows = Math.max(1, Math.min(3, Math.round((newH + 20) / ROW_H)));
    const sizeKey = pickSizeKey(cols, rows);
    resizeState.pendingSize = sizeKey;

    element.style.width = newW + 'px';
    element.style.height = newH + 'px';
    element.style.zIndex = '20';
    element.style.transform = 'none';
    element.style.transition = 'none';
    element.style.boxShadow = '0 24px 70px rgba(0,0,0,0.7), 0 0 0 2px var(--ac)';

    const hint = document.getElementById('resizeHint');
    if (hint) {
        const meta = SIZE_CATALOG.find(s => s.key === sizeKey);
        hint.textContent = `${sizeKey.toUpperCase()}${meta ? ' · ' + meta.desc : ''}`;
        hint.style.left = (e.clientX + 18) + 'px';
        hint.style.top = (e.clientY + 18) + 'px';
    }
}

function onResizeEnd() {
    if (!resizeState) return;
    const { widgetId, element, pendingSize } = resizeState;
    element.style.width = '';
    element.style.height = '';
    element.style.zIndex = '';
    element.style.transform = '';
    element.style.transition = '';
    element.style.boxShadow = '';

    const hint = document.getElementById('resizeHint');
    if (hint) hint.remove();

    document.body.classList.remove('is-resizing');
    document.removeEventListener('pointermove', onResizeMove);
    document.removeEventListener('pointerup', onResizeEnd);
    document.removeEventListener('pointercancel', onResizeEnd);

    if (pendingSize) setWidgetSize(widgetId, pendingSize);
    resizeState = null;
}

/* ════════════════════════════════════════════════════════════
   WIDGET LIBRARY
   ════════════════════════════════════════════════════════════ */
function renderLibrary() {
    const body = $('library-body');
    if (!body) return;
    const presentTypes = new Set(state.widgets.map(w => w.type));
    body.innerHTML = '';

    CATEGORIES.forEach(cat => {
        const widgets = Object.values(WIDGET_REGISTRY).filter(w => w.category === cat);
        if (!widgets.length) return;
        const catEl = document.createElement('div');
        catEl.className = 'library-category';
        catEl.innerHTML = `
            <div class="library-category-title">${cat}</div>
            <div class="library-grid">
                ${widgets.map(w => {
                    const isActive = presentTypes.has(w.id);
                    return `
                        <div class="library-item ${isActive ? 'active' : ''}" draggable="${isActive ? 'false' : 'true'}" data-widget-type="${w.id}" title="${isActive ? 'Already on dashboard' : 'Click to add'}">
                            <div class="library-item-icon"><i class="fa-solid ${w.icon}"></i></div>
                            <div class="library-item-name">${w.name}</div>
                            <div class="library-item-desc">${w.desc}</div>
                        </div>`;
                }).join('')}
            </div>`;
        body.appendChild(catEl);
    });

    $$('.library-item').forEach(el => {
        if (el.classList.contains('active')) return;
        el.addEventListener('click', () => {
            addWidget(el.dataset.widgetType);
        });
        el.addEventListener('dragstart', (e) => {
            draggingFromLibrary = true;
            e.dataTransfer.effectAllowed = 'copy';
            e.dataTransfer.setData('widget-type', el.dataset.widgetType);
        });
        el.addEventListener('dragend', () => { draggingFromLibrary = false; });
    });
}

function openLibrary() {
    $('widget-library').classList.add('open');
    $('library-overlay').classList.add('open');
}
function closeLibrary() {
    $('widget-library').classList.remove('open');
    $('library-overlay').classList.remove('open');
    const ed = $('empty-dashboard');
    if (ed) ed.classList.remove('highlight');
}

/* ════════════════════════════════════════════════════════════
   REFRESH SYSTEM
   ════════════════════════════════════════════════════════════ */
function updateRefreshIndicator() {
    const dot = $('refresh-dot');
    const stateEl = $('refresh-state');
    const lbl = $('refresh-label');
    const last = $('refresh-last');
    if (!dot) return;
    const off = state.refreshMs === 0;
    const paused = document.hidden;
    dot.classList.toggle('paused', off || paused);
    if (stateEl) stateEl.textContent = off ? 'OFF' : (paused ? 'PAUSED' : 'LIVE');
    if (lbl) {
        if (off) lbl.textContent = '—';
        else if (state.refreshMs >= 60000) lbl.textContent = (state.refreshMs/60000) + ' min';
        else lbl.textContent = (state.refreshMs/1000) + ' sec';
    }
    if (last && state.lastUpdateAt) {
        last.textContent = new Date(state.lastUpdateAt).toTimeString().slice(0,8);
    }
}

async function refreshPrices() {
    const btn = $('refresh-now');
    if (btn) btn.classList.add('spin');
    try {
        const [tickers, funding] = await Promise.all([fetchTickers(), fetchFunding()]);
        state.tickers = tickers;
        state.tickersMap = {};
        tickers.forEach(t => { state.tickersMap[t.symbol] = t; });
        state.funding = funding;
        state.lastUpdateAt = Date.now();

        updateBTCHeroFast();
        patchScreener();
        renderSectors(tickers);
        renderVolume(tickers);
        updateRefreshIndicator();
    } catch(e) { console.warn('Refresh failed:', e); }
    finally { if (btn) setTimeout(() => btn.classList.remove('spin'), 400); }
}

function startAutoRefresh() {
    if (state.refreshTimer) { clearInterval(state.refreshTimer); state.refreshTimer = null; }
    if (state.refreshMs > 0) {
        state.refreshTimer = setInterval(() => { if (!document.hidden) refreshPrices(); }, state.refreshMs);
    }
    updateRefreshIndicator();
}

async function loadInitial() {
    try {
        const [tickers, funding, fng, global] = await Promise.all([fetchTickers(), fetchFunding(), fetchFNG(), fetchGlobal()]);
        state.tickers = tickers;
        state.tickersMap = {};
        tickers.forEach(t => { state.tickersMap[t.symbol] = t; });
        state.funding = funding;
        state.lastUpdateAt = Date.now();

        updateBTCHeroFast();
        await refreshBTCSparkline();
        renderFNG(fng);
        renderGlobal(global);
        renderVolume(tickers);
        renderSectors(tickers);
        patchScreener();
        updateRefreshIndicator();
    } catch(e) { console.warn('Initial load failed:', e); }
}

async function refreshMacroLoop() {
    try {
        const [global, fng] = await Promise.all([fetchGlobal(), fetchFNG()]);
        renderGlobal(global);
        renderFNG(fng);
    } catch(e) {}
    setTimeout(refreshMacroLoop, 90000);
}
async function refreshBTCSparkLoop() {
    if (!document.hidden) await refreshBTCSparkline();
    setTimeout(refreshBTCSparkLoop, 60000);
}
async function refreshCorrelationLoop() {
    if (!document.hidden) { try { await buildCorrelation(); } catch(e) {} }
    setTimeout(refreshCorrelationLoop, 1800000);
}
function refreshSparkCacheLoop() {
    sparkCache.clear();
    setTimeout(refreshSparkCacheLoop, 300000);
}

/* ════════════════════════════════════════════════════════════
   BOOT BINDINGS
   ════════════════════════════════════════════════════════════ */
function bindTopbarUI() {
    const sel = $('refresh-interval');
    if (sel) {
        sel.value = String(state.refreshMs);
        sel.addEventListener('change', () => {
            state.refreshMs = parseInt(sel.value, 10) || 0;
            startAutoRefresh();
        });
    }
    const btn = $('refresh-now');
    if (btn) btn.addEventListener('click', () => refreshPrices());

    document.addEventListener('visibilitychange', () => {
        updateRefreshIndicator();
        if (!document.hidden) refreshPrices();
    });

    const libBtn = $('btn-library');
    if (libBtn) libBtn.addEventListener('click', () => {
        const lib = $('widget-library');
        if (lib.classList.contains('open')) closeLibrary();
        else { renderLibrary(); openLibrary(); }
    });

    const libClose = $('library-close');
    if (libClose) libClose.addEventListener('click', closeLibrary);

    const overlay = $('library-overlay');
    if (overlay) overlay.addEventListener('click', closeLibrary);

    const resetBtn = $('btn-reset');
    if (resetBtn) resetBtn.addEventListener('click', () => {
        if (!confirm('Reset layout to default?')) return;
        state.widgets = getDefaultLayout();
        saveState();
        renderGrid();
        toast('Layout reset to default');
    });

    const emptyCta = $('empty-cta');
    if (emptyCta) emptyCta.addEventListener('click', () => { renderLibrary(); openLibrary(); });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLibrary();
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            renderLibrary();
            openLibrary();
        }
    });
}

   MINI SPARKLINE POPUP · տեղական · առանց iframe
   ════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════
   MINI SPARKLINE POPUP · տեղական · առանց iframe
   ════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════
   MINI SPARKLINE · floating tooltip · near cursor / touch
   ════════════════════════════════════════════════════════════ */
const miniWidget = (() => {
    let el, symEl, priceEl, chgEl, bodyEl;
    let currentSym = null;
    let fetchToken = 0;
    let hideTimer = null;
    let opened = false;
    let mobileMode = false;

    function init() {
        el      = document.getElementById('miniSpark');
        symEl   = document.getElementById('miniSparkSym');
        priceEl = document.getElementById('miniSparkPrice');
        chgEl   = document.getElementById('miniSparkChg');
        bodyEl  = document.getElementById('miniSparkBody');
        if (!el) return;

        /* Desktop · keep alive while hovering over the mini widget itself */
        el.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        el.addEventListener('mouseleave', () => { if (!mobileMode) scheduleHide(90); });

        /* Mobile · tap outside closes */
        document.addEventListener('touchstart', (e) => {
            if (!mobileMode || !opened) return;
            if (el.contains(e.target)) return;
            if (e.target.closest && e.target.closest('.clickable-ticker')) return;
            hide();
        }, { passive: true });
    }

    function scheduleHide(ms) {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => hide(), ms || 120);
    }

    /* Keep the tooltip inside viewport, offset from cursor */
    function place(x, y) {
        if (!el) return;
        const w = el.offsetWidth  || 280;
        const h = el.offsetHeight || 150;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const OFF = 14;

        let px = x + OFF;
        let py = y + OFF;
        if (px + w + 8 > vw) px = x - w - OFF;
        if (px < 8)          px = 8;
        if (py + h + 8 > vh) py = y - h - OFF;
        if (py < 8)          py = 8;

        el.style.transform = `translate3d(${px}px, ${py}px, 0) scale(${opened ? 1 : 0.96})`;
    }

    function hide() {
        if (!el) return;
        clearTimeout(hideTimer);
        el.classList.remove('show');
        opened = false;
        currentSym = null;
        fetchToken++;
    }

    async function open(symbol, x, y, mobile) {
        if (!el) return;

        let sym = String(symbol || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!sym) return;
        if (!sym.endsWith('USDT')) sym += 'USDT';

        mobileMode = !!mobile;

        /* Same symbol already visible → just move it */
        if (opened && currentSym === sym) {
            place(x, y);
            return;
        }

        /* New symbol → reset & fetch */
        const token = ++fetchToken;
        currentSym = sym;

        if (symEl)   symEl.textContent = sym.replace('USDT', '');
        if (priceEl) { priceEl.textContent = '--'; priceEl.style.color = 'var(--muted)'; }
        if (chgEl) {
            chgEl.textContent = '--';
            chgEl.style.color = 'var(--muted)';
            chgEl.style.background = 'transparent';
            chgEl.style.border = '1px solid var(--border)';
        }
        if (bodyEl) bodyEl.innerHTML = '<div class="mini-spark-loading">…</div>';

        /* Position first, then reveal */
        place(x, y);
        el.classList.add('show');
        opened = true;

        let mkt = null, klines = null;
        try {
            [mkt, klines] = await Promise.all([
                fetch(`${API.binance}/fapi/v1/ticker/24hr?symbol=${sym}`)
                    .then(r => r.json()).catch(() => null),
                fetch(`${API.binance}/fapi/v1/klines?symbol=${sym}&interval=1h&limit=48`)
                    .then(r => r.json()).catch(() => null)
            ]);
        } catch (_) {}

        if (token !== fetchToken) return;   // user moved to another ticker

        /* Header */
        if (mkt && !mkt.code) {
            const price = parseFloat(mkt.lastPrice);
            const chg   = parseFloat(mkt.priceChangePercent);
            const isUp  = chg >= 0;
            if (priceEl) {
                priceEl.textContent = '$' + fmtPrice(price);
                priceEl.style.color = isUp ? 'var(--up)' : 'var(--dn)';
            }
            if (chgEl) {
                chgEl.textContent = (isUp ? '+' : '') + chg.toFixed(2) + '%';
                chgEl.style.color      = isUp ? 'var(--up)' : 'var(--dn)';
                chgEl.style.background = isUp ? 'rgba(0,255,200,0.10)' : 'rgba(168,85,247,0.10)';
                chgEl.style.border     = isUp ? '1px solid rgba(0,255,200,0.25)' : '1px solid rgba(168,85,247,0.25)';
            }
        }

        /* Body */
        if (!Array.isArray(klines) || klines.length < 2) {
            if (bodyEl) bodyEl.innerHTML = '<div class="mini-spark-loading">NO DATA</div>';
            return;
        }

        const closes = klines.map(k => parseFloat(k[4]));
        const isUp   = closes[closes.length - 1] >= closes[0];
        const color  = isUp ? '#00ffc8' : '#a855f7';
        const gradId = 'msg_' + token;

        const W = 280, H = 110, pad = 6;
        const min = Math.min(...closes), max = Math.max(...closes);
        const range = max - min || 1;
        const step  = (W - pad * 2) / (closes.length - 1);
        const pts = closes.map((v, i) => [
            pad + i * step,
            H - pad - ((v - min) / range) * (H - pad * 2)
        ]);
        const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
        const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pts[0][0].toFixed(1)} ${H-pad} Z`;

        if (bodyEl) bodyEl.innerHTML = `
            <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%"   stop-color="${color}" stop-opacity="0.30"/>
                        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <path d="${area}" fill="url(#${gradId})" />
                <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6"
                      stroke-linejoin="round" stroke-linecap="round" />
                <circle cx="${pts[pts.length-1][0].toFixed(1)}"
                        cy="${pts[pts.length-1][1].toFixed(1)}"
                        r="3" fill="${color}" stroke="#fff" stroke-width="1.2"/>
            </svg>`;
    }

    return {
        init, open, hide, scheduleHide,
        isOpen: () => opened
    };
})();
