<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Intelligence & SCREENER</title>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #020407; --bg2: #11141b; --bg3: #161a22;
    --bg-elev: rgba(14, 18, 26, 0.6);
    --border: rgba(255,255,255,0.07); --border-hi: rgba(255,255,255,0.12);
    --green: #00ff9d; --red: #ff0055; --gold: #ffbe0b; --blue: #00d4ff; --purple: #a855f7;
    --text: #f5f7fa; --muted: #6b7280; --muted-2: #4b5563;
    --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter', -apple-system, sans-serif;
    --bd: rgba(255,255,255,.05); --ac: #00ffd5; --acD: rgba(0,255,213,.08);
    --up: #00ffc8; --dn: #a855f7; --yel: #ffd60a; --rsi: #6366f1;
    --t1: #e6e7ea; --t2: #9ca0a9; --t3: #6b7280;
    --tr: all .2s cubic-bezier(.16,1,.3,1);
    --tr-smooth: all .4s cubic-bezier(.16,1,.3,1);
    /* ─── Hub CSS var aliases · for 1:1 ported widgets ─── */
--accent: var(--ac);
--accent-dim: var(--acD);
--text-main: var(--text);
--text-muted: var(--muted);
--text-hover: var(--t2);
--border-thin: var(--border);
--bg-deep: var(--bg);
--bg-surface: var(--bg2);
--bg-elevated: var(--bg3);
--transition-smooth: all .4s cubic-bezier(.16,1,.3,1);
}

/* ─── Ported from Hub · for BTC sparkline widget ─── */
.mod-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; gap: 10px; flex-shrink: 0; min-width: 0;
    padding-right: 90px;
}
.mod-title {
    font-size: 0.7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
}
.mod-title i { color: var(--accent); flex-shrink: 0; }

.scr-tab {
    padding: 5px 12px; font-size: 10px; font-weight: 700;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; cursor: pointer;
    transition: var(--tr); letter-spacing: 0.5px;
    font-family: var(--font-sans);
}
.scr-tab:hover { color: var(--text); border-color: var(--border-hi); }
.scr-tab.active {
    color: var(--accent); border-color: var(--accent);
    background: var(--accent-dim);
}

@keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
}



* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; min-height: 100vh; overflow-x: hidden; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 800px 500px at 10% 0%, rgba(0,255,157,0.08), transparent 60%), radial-gradient(ellipse 800px 500px at 90% 20%, rgba(0,212,255,0.06), transparent 60%), radial-gradient(ellipse 1000px 600px at 50% 100%, rgba(168,85,247,0.05), transparent 60%); pointer-events: none; z-index: 0; }
body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 80%); }

.wrap { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; padding: 20px 24px 60px; }

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 4px 4px 16px;
    margin-bottom: 4px;
    flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 3px; font-size: 12px; color: #fff; }
.brand i { color: var(--ac); font-size: 15px; }
.brand span { color: var(--muted); font-size: 9px; letter-spacing: 2px; font-weight: 700; margin-left: 4px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.tb-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; color: var(--muted); font-weight: 800;
    letter-spacing: 1.2px; text-transform: uppercase;
    padding: 6px 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 8px;
    backdrop-filter: blur(10px);
}
.tb-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s ease-in-out infinite; }
.tb-status .dot.paused { background: var(--muted-2); box-shadow: none; animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.tb-status b { color: var(--text); font-weight: 800; }
.tb-status .sep { color: var(--muted-2); margin: 0 2px; }

.tb-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px; font-size: 10px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px; cursor: pointer;
    transition: var(--tr);
    backdrop-filter: blur(10px);
    font-family: var(--font-mono);
}
.tb-btn:hover { color: var(--ac); border-color: var(--ac); background: var(--acD); }
.tb-btn.tb-primary { color: #000; background: var(--ac); border-color: var(--ac); }
.tb-btn.tb-primary:hover { color: #000; filter: brightness(1.1); }
.tb-btn.tb-icon { padding: 7px 10px; }
.tb-btn.spin i { animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.tb-select {
    padding: 7px 26px 7px 12px; font-size: 10.5px; font-weight: 700;
    font-family: var(--font-mono); letter-spacing: 0.5px;
    background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; cursor: pointer;
    outline: none; transition: var(--tr);
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 12px) 13px, calc(100% - 8px) 13px;
    background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
    backdrop-filter: blur(10px);
}
.tb-select:hover, .tb-select:focus { border-color: var(--ac); }
.tb-select option { background: var(--bg2); color: var(--text); }

/* ============================================================
   BENTO GRID
   ============================================================ */
.bento-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
    grid-auto-rows: 210px;        /* ← FIXED բարձրություն, աճ չկա */
    grid-auto-flow: row dense;
    align-items: stretch;
}
.bento-grid.hidden { display: none; }

.module {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;           /* ← թույլ ենք տալիս shrink (չի բարձրանա) */
    height: 100%;            /* ← լցնում ենք grid cell-ը ուղիղ */
    will-change: auto;
}

/* ▶ ԱՆՎՏԱՆԳՈՒԹՅՈՒՆ — ամեն ներքին flex-չիլդ պիտի shrink ընդունի */
.module > * {
    min-height: 0;
}
.module:hover { border-color: var(--border-hi); }

/* ============================================================
   SIZE VARIANTS
   ============================================================ */
.module[data-size="1x1"] { grid-column: span 1; grid-row: span 1; }
.module[data-size="2x1"] { grid-column: span 2; grid-row: span 1; }
.module[data-size="3x1"] { grid-column: span 3; grid-row: span 1; }
.module[data-size="4x1"] { grid-column: span 4; grid-row: span 1; }

.module[data-size="1x2"] { grid-column: span 1; grid-row: span 2; }
.module[data-size="2x2"] { grid-column: span 2; grid-row: span 2; }
.module[data-size="3x2"] { grid-column: span 3; grid-row: span 2; }
.module[data-size="4x2"] { grid-column: span 4; grid-row: span 2; }

.module[data-size="1x3"] { grid-column: span 1; grid-row: span 3; }
.module[data-size="2x3"] { grid-column: span 2; grid-row: span 3; }
.module[data-size="3x3"] { grid-column: span 3; grid-row: span 3; }

.module[data-size="full"]   { grid-column: 1 / -1; grid-row: span 2; }
.module[data-size="hero"]   { grid-column: 1 / -1; grid-row: span 3; }
.module[data-size="screen"] { grid-column: 1 / -1; grid-row: span 3; }  /* ≈ 658px */

@media (max-width: 780px) {
    .bento-grid { grid-auto-rows: 180px; }
    .module[data-size="screen"] { grid-row: span 3; }
}

@media (max-width: 1400px) {
    .module[data-size="4x1"], .module[data-size="4x2"], .module[data-size="3x3"] { grid-column: span 3; }
}
@media (max-width: 1100px) {
    .module[data-size="3x1"], .module[data-size="3x2"], .module[data-size="3x3"],
    .module[data-size="4x1"], .module[data-size="4x2"] { grid-column: span 2; }
}

/* ============================================================
   WIDGET CONTROLS (floating top-right)
   ============================================================ */
.widget-controls {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 3px;
    opacity: 0; transition: opacity 0.25s var(--tr);
    z-index: 20;
    pointer-events: none;
}
.module:hover .widget-controls { opacity: 1; pointer-events: auto; }

.widget-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer; font-size: 9px;
    transition: var(--tr);
}
.widget-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border-hi); }
.widget-btn.grip { cursor: grab; touch-action: none; }
.widget-btn.grip:active { cursor: grabbing; }
.widget-btn.danger:hover { color: var(--red); border-color: rgba(255,0,85,0.4); background: rgba(255,0,85,0.15); }

/* ============================================================
   RESIZE HANDLE
   ============================================================ */
.resize-handle {
    position: absolute; bottom: 6px; right: 6px;
    width: 18px; height: 18px;
    cursor: nwse-resize;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 20;
}
.module:hover .resize-handle { opacity: 0.5; }
.resize-handle:hover { opacity: 1 !important; }
.resize-handle::after {
    content: '';
    position: absolute; bottom: 3px; right: 3px;
    width: 8px; height: 8px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    border-radius: 0 0 2px 0;
    transition: border-color 0.2s;
}
.resize-handle:hover::after { border-color: var(--ac); }

body.is-resizing { cursor: nwse-resize !important; }
body.is-resizing * { cursor: nwse-resize !important; user-select: none !important; }
body.is-resizing .module { transition: none !important; }

.resize-hint {
    position: fixed;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(10px);
    color: var(--ac);
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    padding: 5px 11px;
    border-radius: 7px;
    border: 1px solid var(--ac);
    pointer-events: none;
    z-index: 99999;
    box-shadow: 0 0 24px var(--acD), 0 8px 24px rgba(0,0,0,0.6);
    white-space: nowrap;
}

/* ============================================================
   DRAG / DROP
   ============================================================ */
.module.dragging { opacity: 0.2; transform: scale(0.97); pointer-events: none; }
.module.drop-target {
    border-color: var(--ac) !important;
    box-shadow: 0 0 0 2px var(--acD), 0 0 40px var(--acD), inset 0 0 30px var(--acD) !important;
    transform: scale(1.02) !important;
    z-index: 5;
}
.module.entering { animation: cardIn 0.45s var(--tr-smooth); }
@keyframes cardIn {
    from { opacity: 0; transform: scale(0.94) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

.drag-ghost {
    position: fixed !important;
    top: 0; left: 0;
    margin: 0 !important;
    pointer-events: none !important;
    z-index: 9999 !important;
    opacity: 0;
    border-radius: 14px;
    border: 1px solid var(--ac) !important;
    background: var(--bg2) !important;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 0 1px var(--acD), 0 0 40px var(--acD) !important;
    transform-origin: top left;
    will-change: transform;
    overflow: hidden;
    transition: opacity 0.12s ease;
}
body.is-dragging .drag-ghost { opacity: 1; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
body.is-dragging iframe { pointer-events: none !important; }

/* ============================================================
   SIZE PICKER
   ============================================================ */
.size-picker {
    position: absolute;
    top: calc(100% + 5px);
    right: 0;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    min-width: 210px;
    z-index: 200;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0,255,213,0.06);
    animation: sizePickerIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sizePickerIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.size-picker-btn {
    padding: 7px 4px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 800; letter-spacing: 0.3px;
    cursor: pointer; text-align: center; line-height: 1;
    transition: var(--tr);
}
.size-picker-btn:hover { color: var(--ac); border-color: var(--ac); background: var(--acD); }
.size-picker-btn.active { color: var(--ac); border-color: var(--ac); background: var(--acD); box-shadow: 0 0 12px var(--acD); }

/* ============================================================
   WIDGET LIBRARY
   ============================================================ */
.library-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: var(--tr-smooth); z-index: 900; }
.library-overlay.open { opacity: 1; pointer-events: auto; }

.widget-library {
    position: fixed; top: 0; right: 0;
    width: 400px; max-width: 92vw; height: 100vh;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    z-index: 950; display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
.widget-library.open { transform: translateX(0); }
.library-header { padding: 24px 24px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.library-title { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 10px; }
.library-title i { color: var(--ac); }
.library-close { width: 30px; height: 30px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; transition: var(--tr); }
.library-close:hover { color: var(--text); border-color: var(--border-hi); }
.library-subtitle { padding: 12px 24px; font-size: 10px; color: var(--muted); line-height: 1.6; border-bottom: 1px solid var(--border); background: rgba(0,255,213,0.015); }
.library-subtitle strong { color: var(--ac); font-weight: 700; }
.library-body { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
.library-category { margin-bottom: 26px; }
.library-category-title { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); font-weight: 800; margin-bottom: 12px; }
.library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.library-item {
    background: rgba(255,255,255,0.015);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 13px;
    cursor: pointer; transition: var(--tr);
    display: flex; flex-direction: column; gap: 8px;
    position: relative; user-select: none; min-height: 100px;
}
.library-item:hover { border-color: var(--ac); background: var(--acD); transform: translateY(-2px); }
.library-item.active { border-color: var(--ac); background: var(--acD); opacity: 0.55; cursor: not-allowed; }
.library-item-icon { width: 26px; height: 26px; background: var(--acD); color: var(--ac); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.library-item-name { font-size: 10.5px; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }
.library-item-desc { font-size: 9px; color: var(--muted); line-height: 1.4; }

/* ============================================================
   TRASH ZONE
   ============================================================ */
.trash-zone {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(140px);
    padding: 13px 28px;
    background: rgba(255, 0, 85, 0.12);
    border: 2px dashed rgba(255, 0, 85, 0.5);
    border-radius: 50px; color: var(--red);
    font-weight: 800; font-size: 10.5px;
    letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
    z-index: 1200; transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none; backdrop-filter: blur(10px);
}
.trash-zone.active { transform: translateX(-50%) translateY(0); pointer-events: auto; }
.trash-zone.hot { background: rgba(255, 0, 85, 0.4); border-color: var(--red); border-style: solid; transform: translateX(-50%) translateY(-10px) scale(1.08); box-shadow: 0 0 60px rgba(255, 0, 85, 0.6); }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-dashboard {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 30px; text-align: center;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,0.005);
    min-height: 260px;
    transition: var(--tr-smooth);
}
.empty-dashboard.hidden { display: none; }
.empty-dashboard.highlight { border-color: var(--ac); background: var(--acD); }
.empty-icon { font-size: 2.2rem; color: var(--muted); margin-bottom: 18px; opacity: 0.6; }
.empty-title { font-size: 12px; font-weight: 800; color: var(--text); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.empty-desc { font-size: 11px; color: var(--muted); max-width: 400px; line-height: 1.6; margin-bottom: 22px; }
.empty-cta { background: var(--ac); color: #000; border: none; padding: 11px 24px; border-radius: 50px; font-weight: 800; font-size: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: var(--tr); }
.empty-cta:hover { transform: scale(1.05); box-shadow: 0 0 24px var(--acD); }

/* ============================================================
   TOASTS
   ============================================================ */
.toasts { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; }
.toast {
    padding: 10px 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-left: 2px solid var(--ac);
    border-radius: 8px;
    font-size: 11px; font-weight: 600;
    color: var(--text);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: flex; align-items: center; gap: 10px;
    animation: toastIn 0.35s var(--tr-smooth);
    pointer-events: auto; max-width: 320px;
    backdrop-filter: blur(20px);
}
.toast i { color: var(--ac); }
.toast.out { animation: toastOut 0.3s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(20px); } }

/* ============================================================
   WIDGET INTERNAL STYLES (ported from original)
   ============================================================ */
.card-title { display: flex; align-items: center; gap: 8px; padding: 14px 18px 10px; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card-title i { color: var(--accent, var(--green)); font-size: 11px; }
.card-title .badge { margin-left: auto; font-size: 9px; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.05); color: var(--muted); letter-spacing: 0.5px; font-weight: 700; }

.btc-card-content { padding: 20px 22px; display: flex; flex-direction: column; height: 100%; }
.btc-live { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 10px; color: var(--muted); letter-spacing: 1.5px; font-weight: 700; }
.btc-live .live-dot { width: 7px; height: 7px; border-radius: 50%; }
.btc-price { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; margin-bottom: 8px; transition: color 0.4s ease; }
.btc-delta { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.btc-delta > span { transition: color 0.4s ease; }
.btc-spark { flex: 1; min-height: 42px; width: 100%; }

.kpi-content { padding: 18px; display: flex; flex-direction: column; height: 100%; position: relative; }
.kpi-content::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--accent, var(--green)), transparent); opacity: 0.7; }
.kpi-lbl { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; }
.kpi-num { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1; margin-bottom: 6px; color: #fff; transition: color 0.4s ease; }
.kpi-sub { font-size: 10px; color: var(--muted); font-weight: 600; margin-bottom: auto; }
.kpi-bar { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 10px; position: relative; }
.kpi-bar > div { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
.kpi-content.kpi-gold   { --accent: var(--gold); }
.kpi-content.kpi-blue   { --accent: var(--blue); }
.kpi-content.kpi-purple { --accent: var(--purple); }

/* ============================================================
   DOMINANCE WIDGET · BTC / ETH / ALTS / STABLES
   ============================================================ */
.dominance-wrap {
    padding: 0 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.doughnut-svg {
    width: 130px;
    height: 130px;
    transform: rotate(-90deg);
    flex-shrink: 0;
}

.doughnut-svg circle {
    fill: none;
    stroke-linecap: round;
    transition: stroke-dasharray 0.9s cubic-bezier(0.22,1,0.36,1),
                stroke-dashoffset 0.9s cubic-bezier(0.22,1,0.36,1);
}

/* ▶ Overlay տեքստը SVG-ի կենտրոնում · margin-ների գումարը = -text_height */
.doughnut-center {
    position: relative;
    margin-top: -84px;
    margin-bottom: 46px;
    text-align: center;
    pointer-events: none;
}

.doughnut-big {
    font-size: 22px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: -1px;
    line-height: 1;
    text-shadow: 0 0 30px rgba(255,190,11,0.35);
}

.doughnut-lbl {
    font-size: 8px;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 3px;
}

.legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    width: 100%;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--muted);
}

.legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
}

.legend-item b {
    color: #fff;
    margin-left: auto;
    font-weight: 700;
}

.sector-list { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
.sector-row { display: grid; grid-template-columns: 70px 1fr 60px; gap: 10px; align-items: center; font-size: 11px; }
.sector-name { font-weight: 700; color: #ccc; letter-spacing: 0.5px; }
.sector-bar { height: 22px; background: rgba(255,255,255,0.03); border-radius: 4px; position: relative; overflow: hidden; }
.sector-fill { height: 100%; display: flex; align-items: center; padding-left: 8px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; border-radius: 4px; transition: width 0.9s cubic-bezier(0.22,1,0.36,1); min-width: 40px; }
.sector-fill.pos { background: linear-gradient(90deg, rgba(0,255,157,0.35), rgba(0,255,157,0.08)); color: var(--green); }
.sector-fill.neg { background: linear-gradient(90deg, rgba(255,0,85,0.35), rgba(255,0,85,0.08)); color: var(--red); }
.sector-pct { text-align: right; font-weight: 800; transition: color 0.4s ease; }

.pos { color: var(--green); }
.neg { color: var(--red); }

/* Liquidations widget */

/* Screener widget */
.screener-controls { display: flex; gap: 6px; padding: 4px 18px 14px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.tab { padding: 5px 12px; font-size: 10px; font-weight: 700; letter-spacing: 1px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
.tab:hover { color: #fff; border-color: var(--border-hi); }
.tab.active { color: var(--green); border-color: var(--green); background: rgba(0,255,157,0.08); }
.screener-search { margin-left: auto; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-family: var(--font-mono); width: 180px; outline: none; transition: 0.2s; }
.screener-search:focus { border-color: var(--green); }
.screener-table { flex: 1; overflow-y: auto; min-height: 0; }
.screener-table table { width: 100%; border-collapse: collapse; font-size: 11px; }
.screener-table thead { position: sticky; top: 0; background: rgba(2, 4, 7, 0.98); backdrop-filter: blur(10px); z-index: 5; }
.screener-table th { text-align: left; padding: 11px 16px; font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 800; border-bottom: 1px solid var(--border); user-select: none; white-space: nowrap; }
.screener-table th.num { text-align: right; }
.screener-table td { padding: 11px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); white-space: nowrap; }
.screener-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.screener-table tbody tr { transition: background 0.15s; }
.screener-table tbody tr:hover { background: rgba(0,255,157,0.04); }

@keyframes cellFlashUp { 0% { background: rgba(0,255,157,0.22); } 100% { background: transparent; } }
@keyframes cellFlashDn { 0% { background: rgba(255,0,85,0.22); } 100% { background: transparent; } }
td.c-price.flash-up { animation: cellFlashUp 0.9s cubic-bezier(0.22,1,0.36,1); }
td.c-price.flash-dn { animation: cellFlashDn 0.9s cubic-bezier(0.22,1,0.36,1); }
td.c-change, td.c-vol, td.c-fund { transition: color 0.4s ease; }

.spark { display: block; width: 60px; height: 20px; }
.screener-sym { display: flex; align-items: center; gap: 8px; }
.screener-sym .clickable-ticker { transition: color 0.2s; cursor: pointer; }
.screener-sym .clickable-ticker:hover { color: var(--ac); }
.screener-sym .perp { font-size: 8px; color: var(--muted); background: rgba(255,255,255,0.05); padding: 1px 5px; border-radius: 3px; letter-spacing: 0.5px; font-weight: 700; }
.chart-icon-btn { cursor: pointer; color: var(--muted); transition: color 0.15s, transform 0.15s; }
.chart-icon-btn:hover { color: var(--ac); transform: scale(1.1); }
.dex-links { display: flex; gap: 4px; flex-wrap: wrap; }
.dex-links a { color: var(--muted); text-decoration: none; transition: 0.15s; font-size: 9px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; }
.dex-links a:hover { color: var(--ac); border-color: var(--ac); background: rgba(0,255,213,0.1); }
.sk { background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; border-radius: 4px; color: transparent !important; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Engine widget */
.engine-body { flex: 1; min-height: 0; padding: 0 6px 6px; }
.engine-body iframe { width: 100%; height: 100%; border: none; background: var(--bg); display: block; border-radius: 0 0 12px 12px; }

/* Correlation widget */
.corr-wrap { padding: 6px 18px 18px; overflow-x: auto; flex: 1; }
.corr-desc { text-align: center; font-size: 10px; color: var(--muted); max-width: 620px; margin: 4px auto 16px; line-height: 1.6; letter-spacing: 0.2px; }
.corr-desc b { color: #fff; font-weight: 700; }
.corr-desc .g { color: var(--green); font-weight: 700; }
.corr-desc .r { color: var(--red); font-weight: 700; }
.corr-grid { display: grid; gap: 3px; min-width: 520px; margin: 0 auto; max-width: 720px; }
.corr-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 9px; font-weight: 800; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; user-select: none; }
.corr-cell:not(.hdr):hover { transform: scale(1.15); z-index: 10; box-shadow: 0 0 16px rgba(255,255,255,0.35); }
.corr-cell.hdr { background: transparent !important; color: var(--muted); font-size: 9px; letter-spacing: 0.5px; cursor: default !important; font-weight: 800; }
.corr-cell.hdr:hover { transform: none; box-shadow: none; }
.corr-legend { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; font-size: 9px; color: var(--muted); letter-spacing: 1px; font-weight: 700; }
.corr-bar { width: 260px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff0055 0%, #2a2a2a 50%, #00ff9d 100%); }

/* Mobile */
@media (max-width: 780px) {
    .wrap { padding: 12px 12px 40px; }
    .topbar-actions { width: 100%; justify-content: space-between; }
    .library-grid { grid-template-columns: 1fr; }
    .module[data-size="full"], .module[data-size="hero"], .module[data-size="screen"] { min-height: 60vh; }
}

/* ════════════════════════════════════════════════════════════
   TV OTHERS · TradingView widget (flex-fills its .module cell)
   ════════════════════════════════════════════════════════════ */

   /* ════════════════════════════════════════════════════════════
   INLINE REFRESH · refresh controls inside screener's card-title
   ════════════════════════════════════════════════════════════ */
.inline-refresh {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
    animation: inlineIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes inlineIn {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: translateX(0); }
}
.inline-refresh .tb-status {
    padding: 4px 10px;
    font-size: 9px;
    letter-spacing: 1px;
    gap: 5px;
}
.inline-refresh .tb-status .dot { width: 6px; height: 6px; }
.inline-refresh .tb-select {
    padding: 4px 22px 4px 10px;
    font-size: 10px;
    background-position: calc(100% - 10px) 10px, calc(100% - 7px) 10px;
}
.inline-refresh .tb-btn {
    padding: 4px 9px;
    font-size: 10px;
}
.inline-refresh .tb-btn.tb-icon {
    padding: 4px 8px;
}


.tv-wrap {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 6px 6px;
    display: flex;
    overflow: hidden;
    border-radius: 0 0 12px 12px;
}
.tv-embed {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    border-radius: 8px;
    overflow: hidden;
    background: #0d1017;   /* ← փոխված #0F0F0F-ից */
}
.tv-embed .tradingview-widget-container,
.tv-embed .tradingview-widget-container__widget {
    width: 100% !important;
    height: 100% !important;
}
.tv-embed iframe {
    width: 100% !important;
    height: 100% !important;
    border: none;

}
@media (max-width: 780px) {
    .module[data-widget-type="tv_others"] { min-height: 65vh; }
}

/* ════════════════════════════════════════════════════════════
   MINI SPARKLINE · floating tooltip (near cursor / touch)
   ════════════════════════════════════════════════════════════ */
.mini-spark {
    position: fixed;
    top: 0; left: 0;
    width: 280px;
    background: rgba(14, 18, 26, 0.96);
    border: 1px solid var(--border-hi);
    border-radius: 10px;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(-9999px, -9999px, 0) scale(0.96);
    transition: opacity 0.15s ease, transform 0.15s ease;
    box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(0, 255, 213, 0.08),
        0 0 40px rgba(0, 255, 213, 0.06);
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    will-change: transform, opacity;
}
.mini-spark.show {
    opacity: 1;
    pointer-events: auto;
    /* transform-ը կառավարվում է JS-ով, այստեղ միայն scale-ի համար */
}

.mini-spark-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 11px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 0.8px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
}
.mini-spark-sym {
    color: var(--text);
    letter-spacing: 0.5px;
    font-weight: 800;
}
.mini-spark-price {
    margin-left: auto;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.2px;
    color: var(--text);
    transition: color 0.2s ease;
}
.mini-spark-chg {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.2px;
    transition: all 0.2s ease;
}

.mini-spark-body {
    width: 100%;
    height: 110px;
    background: #0d1017;
    position: relative;
}
.mini-spark-body svg {
    width: 100%;
    height: 100%;
    display: block;
}
.mini-spark-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ac);
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 800;
    animation: pulse 1.4s ease-in-out infinite;
}



@media (max-width: 780px) {
    .mini-spark { width: 230px; }
    .mini-spark-body { height: 88px; }
    .mini-spark-head { font-size: 9px; padding: 7px 9px; }
    .mini-spark-price { font-size: 11px; }
}

/* ════════════════════════════════════════════════════════════
   Prevent native long-press context menu on tickers
   ════════════════════════════════════════════════════════════ */
.clickable-ticker {
    -webkit-touch-callout: none;      /* iOS */
    -webkit-user-select: none;         /* Safari */
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    touch-action: manipulation;
}

/* ════════════════════════════════════════════════════════════
   MARKET MONITOR (MM) · 5 cards · purple Apple-style switches
   ════════════════════════════════════════════════════════════ */
.mm-root {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

.mm-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(0,0,0,0.25);
}
.mm-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 800;
  color: var(--text);
  text-transform: uppercase;
}
.mm-title i { color: var(--ac); font-size: 13px; }
.mm-badge {
  font-size: 9px;
  padding: 2px 8px;
  border-radius: 12px;
  background: rgba(168,85,247,0.12);
  color: #c084fc;
  border: 1px solid rgba(168,85,247,0.3);
  font-weight: 800;
}
.mm-topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
}
.mm-status {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
}

/* ▶ Unique purple Apple-style switch */
.mm-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.mm-switch input {
  opacity: 0;
  position: absolute;
  width: 0; height: 0;
}
.mm-switch-track {
  position: relative;
  display: inline-block;
  width: 34px;
  height: 18px;
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  border: 1px solid rgba(168,85,247,0.18);
  transition: all 0.28s cubic-bezier(0.16,1,0.3,1);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
}
.mm-switch-thumb {
  position: absolute;
  top: 1.5px;
  left: 1.5px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #6b21a8;
  transition: all 0.28s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 1px 4px rgba(0,0,0,0.7), inset 0 0 4px rgba(168,85,247,0.3);
}
.mm-switch input:checked + .mm-switch-track {
  background: rgba(168,85,247,0.32);
  border-color: rgba(168,85,247,0.65);
  box-shadow: inset 0 0 10px rgba(168,85,247,0.35), 0 0 10px rgba(168,85,247,0.2);
}
.mm-switch input:checked + .mm-switch-track .mm-switch-thumb {
  transform: translateX(16px);
  background: #d8b4fe;
  box-shadow: 0 1px 4px rgba(0,0,0,0.7), 0 0 10px rgba(216,180,254,0.9);
}
.mm-switch-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.2s;
}
.mm-switch input:checked ~ .mm-switch-label {
  color: #d8b4fe;
}

/* ▶ Cards grid */
.mm-cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}
.mm-card {
  display: flex;
  flex-direction: column;
  min-height: 180px;
  min-width: 0;
  background: rgba(0,0,0,0.22);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.25s;
  position: relative;
}
.mm-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--mm-accent, rgba(255,255,255,0.1));
  opacity: 0.7;
}
.mm-card[data-card="pump_dump"]     { --mm-accent: var(--green); }
.mm-card[data-card="vol_spike"]     { --mm-accent: var(--gold); }
.mm-card[data-card="oi_raise"]      { --mm-accent: var(--blue); }
.mm-card[data-card="divergence"]    { --mm-accent: #ff8f1f; }
.mm-card[data-card="liquidations"]  { --mm-accent: var(--red); grid-column: span 2; }
.mm-card.off { opacity: 0.5; }
.mm-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.mm-card-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9.5px;
  letter-spacing: 1.5px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text);
  margin-right: auto;
}
.mm-card-title i {
  color: var(--mm-accent);
  font-size: 11px;
}
.mm-card-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.mm-in-num, .mm-pool-sel {
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  padding: 3px 6px;
  border-radius: 4px;
  outline: none;
  transition: var(--tr);
  text-align: center;
}
.mm-in-num { width: 42px; }
.mm-pool-sel {
  padding-right: 20px;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 9px) 8px, calc(100% - 5px) 8px;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}

/* ═══════════════════════════════════════════════════════════════
   T1_BUS · SENDER (ScreenerPro)
   ═══════════════════════════════════════════════════════════════ */
window.T1_BUS = (function () {
  const bc = new BroadcastChannel('t1prime-bus');
  const pending = new Map();
  bc.onmessage = (e) => {
    const m = e.data;
    if (!m || !m.reqId || !pending.has(m.reqId)) return;
    const { resolve, timer } = pending.get(m.reqId);
    clearTimeout(timer);
    pending.delete(m.reqId);
    resolve(m);
  };
  function req(type, payload, timeoutMs = 25000) {
    return new Promise((resolve, reject) => {
      const reqId = type.split('_')[0] + '_' +
                    Date.now().toString(36) + '_' +
                    Math.random().toString(36).slice(2, 6);
      const timer = setTimeout(() => {
        pending.delete(reqId);
        reject(new Error('timeout — Watchlist բաց չէ՞'));
      }, timeoutMs);
      pending.set(reqId, { resolve, timer });
      bc.postMessage({ type, reqId, ...payload });
    });
  }
  return {
    snap: (opts) => req('snap_request', opts, 25000),
    ping: ()       => req('ping', {}, 3000),
  };
})();
console.log('[T1_BUS] sender ready', Object.keys(window.T1_BUS));
</script>

/* ════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => 'w_' + Math.random().toString(36).slice(2, 9);

function toast(msg, kind = '') {
    const w = $('toasts'); if (!w) return;
    const e = document.createElement('div');
    e.className = 'toast ' + kind;
    e.innerHTML = `<i class="fas fa-circle-check"></i><span>${msg}</span>`;
    w.appendChild(e);
    setTimeout(() => { e.style.opacity = '0'; }, 2400);
    setTimeout(() => e.remove(), 2800);
}

function fmtUSD(v, digits = 2) {
    if (!isFinite(v)) return '--';
    const a = Math.abs(v);
    if (a >= 1e12) return '$' + (v/1e12).toFixed(digits) + 'T';
    if (a >= 1e9)  return '$' + (v/1e9).toFixed(digits) + 'B';
    if (a >= 1e6)  return '$' + (v/1e6).toFixed(digits) + 'M';
    if (a >= 1e3)  return '$' + (v/1e3).toFixed(digits) + 'K';
    return '$' + v.toFixed(digits);
}
function fmtPrice(v) {
    if (!isFinite(v)) return '--';
    const a = Math.abs(v);
    if (a >= 10000) return v.toLocaleString('en-US', {maximumFractionDigits: 0});
    if (a >= 1000) return v.toLocaleString('en-US', {maximumFractionDigits: 2});
    if (a >= 100) return v.toFixed(2);
    if (a >= 1) return v.toFixed(4);
    if (a >= 0.01) return v.toFixed(5);
    if (a >= 0.0001) return v.toFixed(6);
    return v.toFixed(8);
}
function fmtPct(v, digits = 2) { return !isFinite(v) ? '--' : (v >= 0 ? '+' : '') + v.toFixed(digits) + '%'; }
function pnlClass(v) { return v >= 0 ? 'pos' : 'neg'; }
function timeShort(ts) { return new Date(ts).toTimeString().slice(0, 8); }

function sparkSVG(values, opts = {}) {
    if (!values || values.length < 2) return '';
    const w = opts.width || 100, h = opts.height || 24, pad = 2;
    const min = Math.min(...values), max = Math.max(...values), range = max - min || 1;
    const step = (w - pad*2) / (values.length - 1);
    const pts = values.map((v, i) => [pad + i * step, h - pad - ((v - min) / range) * (h - pad*2)]);
    const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ` L${(pad + (values.length-1)*step).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
    const color = opts.color || 'var(--green)';
    const colorHex = color === 'var(--green)' ? '#00ff9d'
                   : color === 'var(--red)'   ? '#ff0055'
                   : color;

    const vols = opts.volumes;
    const useVolume = Array.isArray(vols) && vols.length === values.length && vols.some(v => v > 0);

    let fillAttr = opts.fill || (color === 'var(--green)' ? 'rgba(0,255,157,0.15)' : 'rgba(255,0,85,0.15)');
    let defs = '';
    let maskAttr = '';

    if (useVolume) {
        const maxV = Math.max(...vols), minV = Math.min(...vols);
        const logMax = Math.log(1 + maxV), logMin = Math.log(1 + minV);
        const logRange = logMax - logMin || 1;
        const N = vols.length;
        const uid = 'g' + Math.random().toString(36).slice(2, 8);
        const precise = !!opts.precise;

        /* ★ STOPS · precise=1 per candle (HubDL-ի պես) · default=5 buckets */
        const STOPS = precise ? N : 5;

        let stops = '';
        for (let b = 0; b < STOPS; b++) {
            const idx = precise ? b : Math.round(b * (N - 1) / (STOPS - 1));
            const nv = (Math.log(1 + vols[idx]) - logMin) / logRange;   // ← SAME FORMULA
            const alpha = (0.05 + nv * 0.7).toFixed(3);                 // ← SAME FORMULA
            const p = precise ? (b / (N - 1)) * 100 : (b / (STOPS - 1)) * 100;
            stops += `<stop offset="${p.toFixed(2)}%" stop-color="${colorHex}" stop-opacity="${alpha}"/>`;
        }

        defs = `<defs><linearGradient id="vg_${uid}" x1="0" y1="0" x2="1" y2="0">${stops}</linearGradient>`;

        /* ★ Vertical fade — HubDL-ի destination-out-ի SVG համարժեքը */
        if (precise) {
            defs += `
                <linearGradient id="fg_${uid}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="white" stop-opacity="1"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0"/>
                </linearGradient>
                <mask id="mk_${uid}" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}">
                    <rect x="0" y="0" width="${w}" height="${h}" fill="url(#fg_${uid})"/>
                </mask>`;
            maskAttr = ` mask="url(#mk_${uid})"`;
        }
        defs += `</defs>`;
        fillAttr = `url(#vg_${uid})`;
    }

    const dot = opts.dot && pts.length
        ? `<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="${color}" stroke="#fff" stroke-width="1.2"/>`
        : '';

    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%;display:block;">${defs}<path d="${area}" fill="${fillAttr}"${maskAttr}/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>${dot}</svg>`;
}

/* ════════════════════════════════════════════════════════════

async function fetchTickers() {
    const r = await fetch(API.binance + '/fapi/v1/ticker/24hr').then(x => x.json());
    return r.filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('_')).map(t => ({

    })).filter(t => t.price > 0 && isFinite(t.volume));
}
async function fetchFunding() {
    const r = await fetch(API.binance + '/fapi/v1/premiumIndex').then(x => x.json());
    const map = {};

}
async function fetchFNG()    { return (await fetch(API.fng + '?limit=1').then(x => x.json())).data[0]; }

/* ════════════════════════════════════════════════════════════
   TELEGRAM
   ════════════════════════════════════════════════════════════ */
async function sendTg(msg, verbose) {
    if (!TG.token || !TG.chat) { if (verbose) toast('Set Telegram token & chat id'); return false; }
    try {
        const r = await fetch(`https://api.telegram.org/bot${TG.token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TG.chat, text: msg, parse_mode: 'HTML' })
        });
        const j = await r.json();
        if (!j.ok) throw new Error(j.description || 'Telegram error');
        if (verbose) toast('Telegram: sent ✓');
        return true;
    } catch (e) {
        if (verbose) toast('Telegram: ' + e.message);
        return false;
    }
}

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */
function sendChartSnap({ symbol, tf = '15m', caption = '' }) {
    if (!TG.token || !TG.chat || !symbol) return false;
    const sym = String(symbol).toUpperCase().replace(/[^A-Z0-9]/g, '');
    const cleanSym = sym.endsWith('USDT') ? sym : sym + 'USDT';
    const params = new URLSearchParams({
        mode: 'snap', symbol: cleanSym, tf,
        tg_token: TG.token, tg_chat: String(TG.chat), caption
    });
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.t1prime.com/enginepro?${params}`;
    iframe.style.cssText = 'position:fixed;top:-3000px;left:-3000px;width:1400px;height:900px;opacity:0.01;pointer-events:none;border:0;z-index:-1';
    iframe.setAttribute('aria-hidden', 'true');
    iframe.setAttribute('tabindex', '-1');
    document.body.appendChild(iframe);
    setTimeout(() => { try { iframe.remove(); } catch(e){} }, 30000);
    return true;
}

function renderFNG(data) {

    const v = parseInt(data.value);
    const el = $('fng-val'); if (!el) return;
    el.textContent = v;
    el.style.color = v >= 60 ? 'var(--green)' : (v <= 40 ? 'var(--red)' : 'var(--gold)');

}

function renderGlobal(data) {
    if (!data) return;
    const btc = data.market_cap_percentage.btc, eth = data.market_cap_percentage.eth;
    const stable = data.market_cap_percentage.usdt || 0;
    const others = Math.max(0, 100 - btc - eth - stable);
    const C = 2 * Math.PI * 70;
    const setSlice = (id, pct, offset) => {
        const el = $(id); if (!el) return;
        el.setAttribute('stroke-dasharray', `${(pct / 100) * C} ${C}`);
        el.setAttribute('stroke-dashoffset', offset);
    };
    setSlice('slice-btc', btc, 0);
    setSlice('slice-eth', eth, -(btc/100) * C);
    setSlice('slice-oth', others, -((btc+eth)/100) * C);

    const db = $('dom-btc'); if (db) db.textContent = btc.toFixed(1) + '%';
    const lb = $('leg-btc'); if (lb) lb.textContent = btc.toFixed(1) + '%';
    const le = $('leg-eth'); if (le) le.textContent = eth.toFixed(1) + '%';

/* ★ Singleton IntersectionObserver · 500 fetch-ի փոխարեն միայն visible-ները */
let _sparkObserver = null;
function getSparkObserver() {
    if (_sparkObserver) return _sparkObserver;
    _sparkObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const el = entry.target;
            const sym = el.dataset.pendingSym;
            if (!sym) return;
            const change = parseFloat(el.dataset.pendingChange) || 0;
            delete el.dataset.pendingSym;
            delete el.dataset.pendingChange;
            _sparkObserver.unobserve(el);
            fetchSparkline(sym, el, change);
        });
    }, { rootMargin: '150px' });   // 150px նախօրոք → scroll-ի ժամանակ պատրաստ ա
    return _sparkObserver;
}

/* ─── Long-press · Desktop (mousedown 600ms) + Mobile (touchstart 500ms) ─── */
/* ─── Ticker · click = CoinGlass · long-press = Mini Widget ─── */
/* ─── Long-press · Desktop (mousedown 500ms) + Mobile (touchstart 500ms) ─── */
/* ─── Ticker · click = CoinGlass · long-press = Mini Widget ─── */
/* ─── Ticker · Desktop hover → mini spark · Mobile long-press → mini spark ─── */
function attachLongPress(el, symbol) {
    let timer = null;
    let startX = 0, startY = 0;
    let longPressed = false;
    const isTouchOnly = () => matchMedia('(hover: none)').matches;

    const clearPress = () => { if (timer) { clearTimeout(timer); timer = null; } };

    /* ═══════════════ DESKTOP · hover triggers ═══════════════ */
    el.addEventListener('mouseenter', (e) => {
        if (isTouchOnly()) return;
        miniWidget.open(symbol, e.clientX, e.clientY, false);
    });
    el.addEventListener('mousemove', (e) => {
        if (isTouchOnly()) return;
        if (miniWidget.isOpen()) miniWidget.open(symbol, e.clientX, e.clientY, false);
    });
    el.addEventListener('mouseleave', () => {
        if (isTouchOnly()) return;
        miniWidget.scheduleHide(120);
    });
    /* Desktop click → CoinGlass */
    el.addEventListener('click', () => {
        if (isTouchOnly()) return;
        window.open(`https://www.coinglass.com/tv/Binance_${symbol}`, '_blank');
    });

    /* ═══════════════ MOBILE · long-press only ═══════════════ */
    el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        longPressed = false;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        clearPress();
        timer = setTimeout(() => {
            longPressed = true;
            try { if (navigator.vibrate) navigator.vibrate(15); } catch (_) {}
            miniWidget.open(symbol, startX, startY, true);
        }, 500);
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
        if (!timer || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearPress();
    }, { passive: true });

    el.addEventListener('touchend', (e) => {
        clearPress();
        const wasLong = longPressed;
        longPressed = false;
        e.preventDefault();                 // kill ghost-click
        if (!wasLong) {
            window.open(`https://www.coinglass.com/tv/Binance_${symbol}`, '_blank');
        }
    });

    el.addEventListener('touchcancel', () => { clearPress(); longPressed = false; });
}

async function fetchSparkline(symbol, el, change) {
    if (!el) return;
    let closes = sparkCache.get(symbol);
    if (!closes) {
        try {
            const k = await fetchKlines(symbol, '1h', 24);
            closes = k.map(c => parseFloat(c[4]));
            sparkCache.set(symbol, closes);
        } catch(e) { closes = null; }
    }
    if (!el.isConnected) return;
    if (closes && closes.length > 1) {
        el.classList.remove('sk');
        el.innerHTML = sparkSVG(closes, {
            width: 60, height: 20,
            color: change >= 0 ? 'var(--green)' : 'var(--red)'
        });
        /* ↑ VOLUME ՉԿԱ — sparkSVG-ն առանց opts.volumes → flat fill */
    }
}

function updateScreenerRow(tr, t, index, prevPrices) {
    const rank = tr.querySelector('.c-rank');
    if (rank) rank.textContent = index + 1;

    const priceEl = tr.querySelector('.c-price');
    const newText = '$' + fmtPrice(t.price);
    if (priceEl && priceEl.textContent !== newText) {
        const oldPx = prevPrices.get(t.symbol);
        priceEl.textContent = newText;
        if (oldPx != null && oldPx !== t.price) {
            const dir = t.price > oldPx ? 'flash-up' : 'flash-dn';
            priceEl.classList.remove('flash-up', 'flash-dn');
            void priceEl.offsetWidth;
            priceEl.classList.add(dir);
        }
    }

    const chgEl = tr.querySelector('.c-change');
    if (chgEl) {
        chgEl.textContent = fmtPct(t.change);
        chgEl.className = 'num c-change ' + (t.change >= 0 ? 'pos' : 'neg');
        chgEl.style.fontWeight = '700';
    }
    const volEl = tr.querySelector('.c-vol');
    if (volEl) volEl.textContent = fmtUSD(t.volume);
    const fundEl = tr.querySelector('.c-fund');
    if (fundEl) {
        const f = state.funding[t.symbol];
        fundEl.textContent = f == null ? '--' : (f >= 0 ? '+' : '') + f.toFixed(4) + '%';
        fundEl.style.color = (f == null) ? 'var(--muted)' : (f >= 0 ? 'var(--green)' : 'var(--red)');
    }
}

function computeScreenerList() {
    let list = [...state.tickers];
    if (state.screenerSearch) {
        const q = state.screenerSearch.toUpperCase();
        list = list.filter(t => t.base.includes(q) || t.symbol.includes(q));
    }
    if (state.screenerMode === 'volume') list.sort((a,b) => b.volume - a.volume);
    else if (state.screenerMode === 'gainers') list.sort((a,b) => b.change - a.change);
    else if (state.screenerMode === 'losers') list.sort((a,b) => a.change - b.change);
    else if (state.screenerMode === 'volatile') list = list.filter(t => t.volume > 5e6).sort((a,b) => Math.abs(b.change) - Math.abs(a.change));
    else if (state.screenerMode === 'funding_pos') list.sort((a,b) => (state.funding[b.symbol]||0) - (state.funding[a.symbol]||0));
    else if (state.screenerMode === 'funding_neg') list.sort((a,b) => (state.funding[a.symbol]||0) - (state.funding[b.symbol]||0));
    return list.slice(0, 500);
}

function patchScreener() {
    const tbody = $('scr-body');
    if (!tbody) return;
    const wrap = tbody.closest('.screener-table');
    const scrollTop = wrap ? wrap.scrollTop : 0;
    const list = computeScreenerList();

    const beforeTops = new Map();
    const existing = new Map();
    [...tbody.children].forEach(tr => {
        beforeTops.set(tr.dataset.sym, tr.getBoundingClientRect().top);
        existing.set(tr.dataset.sym, tr);
    });
    const isInitial = beforeTops.size === 0;

    const wanted = new Set(list.map(t => t.symbol));
    for (const [sym, tr] of existing) {
        if (!wanted.has(sym)) { tr.remove(); existing.delete(sym); }
    }

    const prevPrices = state._prevPrices;
    list.forEach((t, i) => {
        let tr = existing.get(t.symbol);
        if (!tr) { tr = createScreenerRow(t); existing.set(t.symbol, tr); }
        updateScreenerRow(tr, t, i, prevPrices);
        tbody.appendChild(tr);
        prevPrices.set(t.symbol, t.price);
    });

    [...tbody.children].forEach(tr => {
        const sym = tr.dataset.sym;
        const before = beforeTops.get(sym);
        if (before == null) {
            if (isInitial) { tr.style.opacity = '1'; }
            else {
                tr.style.opacity = '0';
                requestAnimationFrame(() => {
                    tr.style.transition = 'opacity 0.4s cubic-bezier(0.22,1,0.36,1)';
                    tr.style.opacity = '1';
                    setTimeout(() => { tr.style.transition = ''; tr.style.opacity = ''; }, 500);
                });
            }
            return;
        }
        const after = tr.getBoundingClientRect().top;
        const delta = before - after;
        if (Math.abs(delta) < 1) return;
        tr.style.transition = 'none';
        tr.style.transform = `translateY(${delta}px)`;
        void tr.offsetWidth;
        requestAnimationFrame(() => {
            tr.style.transition = 'transform 0.42s cubic-bezier(0.22,1,0.36,1)';
            tr.style.transform = '';
            setTimeout(() => { tr.style.transition = ''; }, 460);
        });
    });

    if (wrap) wrap.scrollTop = scrollTop;
    const cnt = $('scr-count');
    if (cnt) cnt.textContent = list.length + ' pairs';
}

/* ─── Correlation ─── */
async function buildCorrelation() {
    try {
        const closes = await Promise.all(CORR_SYMBOLS.map(sym => fetchKlines(sym + 'USDT', '1d', 31).then(k => k.map(c => parseFloat(c[4])))));
        const returns = closes.map(arr => {
            const r = [];
            for (let i = 1; i < arr.length; i++) r.push(Math.log(arr[i] / arr[i-1]));
            return r;
        });
        const n = CORR_SYMBOLS.length, grid = $('corr-grid');
        if (!grid) return;
        grid.style.gridTemplateColumns = `38px repeat(${n}, 1fr)`;
        let html = '<div class="corr-cell hdr"></div>';
        CORR_SYMBOLS.forEach(s => { html += `<div class="corr-cell hdr">${s}</div>`; });
        for (let i = 0; i < n; i++) {
            html += `<div class="corr-cell hdr">${CORR_SYMBOLS[i]}</div>`;
            for (let j = 0; j < n; j++) {
                let c = 1;
                if (i !== j) {
                    const a = returns[i], b = returns[j], len = Math.min(a.length, b.length);
                    const ma = a.reduce((s,x)=>s+x,0)/len, mb = b.reduce((s,x)=>s+x,0)/len;
                    let num = 0, da = 0, db = 0;
                    for (let k = 0; k < len; k++) { const x = a[k]-ma, y = b[k]-mb; num += x*y; da += x*x; db += y*y; }
                    c = num / Math.sqrt(da * db || 1);
                }
                const bg = c >= 0
                    ? `rgba(0, 255, 157, ${(0.08 + c * 0.72).toFixed(3)})`
                    : `rgba(255, 0, 85, ${(0.08 + (-c) * 0.72).toFixed(3)})`;
                html += `<div class="corr-cell" style="background:${bg}; color:#fff;">${i===j?'—':c.toFixed(2)}</div>`;
            }
        }
        grid.innerHTML = html;
    } catch(e) {}
}

   ════════════════════════════════════════════════════════════ */
function migrateLayout() {
    let changed = false;
    let savedVer = 0;
    try {
        savedVer = parseInt(localStorage.getItem(LAYOUT_VERSION_KEY) || '0', 10);
    } catch (e) {}

    /* Եթե արդեն ընթացիկ version-ն ա → ոչինչ անել */
    if (savedVer >= LAYOUT_VERSION) return false;

    /* Ավելացնել պարտադիր widget-ները (եթե բացակայում են) */
    REQUIRED_WIDGETS.forEach(type => {
        const reg = WIDGET_REGISTRY[type];
        if (!reg) return;
        if (!state.widgets.some(w => w.type === type)) {
            state.widgets.unshift({ id: uid(), type, size: reg.size });
            changed = true;
        }
    });

    try {
        localStorage.setItem(LAYOUT_VERSION_KEY, String(LAYOUT_VERSION));
    } catch (e) {}

    return changed;
}

/* ════════════════════════════════════════════════════════════
   GRID RENDER
   ════════════════════════════════════════════════════════════ */
function renderGrid() {
    /* Cleanup old widgets */
    Object.values(widgetCleanup).forEach(fn => { try { fn(); } catch(e) {} });
    Object.keys(widgetCleanup).forEach(k => delete widgetCleanup[k]);

    const grid = $('bento-grid');
    const emptyEl = $('empty-dashboard');
    const topbar = document.querySelector('.topbar');
    if (!grid) return;

    /* ═════ STEP 1 · Capture refresh controls BEFORE the grid wipe ═════ */
    /* They may currently be in .topbar-actions OR already in .inline-refresh */
    const statusEl   = document.querySelector('.tb-status');
    const selectEl   = document.querySelector('.tb-select');
    const refreshBtn = document.querySelector('#refresh-now');
    const resetBtn   = document.querySelector('#btn-reset');
    const controls   = [statusEl, selectEl, refreshBtn, resetBtn].filter(Boolean);

    /* ═════ STEP 2 · Park them in a hidden container so they survive ═════ */
    let park = document.getElementById('_refresh-park');
    if (!park) {
        park = document.createElement('div');
        park.id = '_refresh-park';
        park.style.display = 'none';
        document.body.appendChild(park);
    }
    controls.forEach(el => park.appendChild(el));

    /* ═════ STEP 3 · Wipe grid ═════ */
    grid.innerHTML = '';

    /* ═════ STEP 4 · Empty dashboard → return controls to topbar ═════ */
    if (!state.widgets.length) {
        grid.classList.add('hidden');
        if (emptyEl) emptyEl.classList.remove('hidden');
        returnControlsToTopbar(park, topbar);
        return;
    }
    grid.classList.remove('hidden');
    if (emptyEl) emptyEl.classList.add('hidden');

    /* ═════ STEP 5 · Render all widgets ═════ */
    state.widgets.forEach((w, idx) => {
        const reg = WIDGET_REGISTRY[w.type];
        if (!reg) return;
        const el = document.createElement('div');
        el.className = 'module entering';
        el.dataset.widgetId = w.id;
        el.dataset.widgetType = w.type;
        el.dataset.size = w.size;
        el.style.animationDelay = (idx * 0.03) + 's';

        el.innerHTML = `
            <div class="widget-controls">
                <button class="widget-btn grip" title="Drag to move"><i class="fa-solid fa-grip-vertical"></i></button>
                <button class="widget-btn size-btn" title="Change size"><i class="fa-solid fa-expand"></i></button>
                <button class="widget-btn danger remove-btn" title="Remove"><i class="fa-solid fa-xmark"></i></button>
            </div>
            ${reg.render(w)}
            <div class="resize-handle" title="Drag to resize"></div>`;

        grid.appendChild(el);

        el.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); removeWidget(w.id); });
        el.querySelector('.size-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openSizePicker(e.currentTarget, w.id);
        });
        const rh = el.querySelector('.resize-handle');
        if (rh) rh.addEventListener('pointerdown', onResizeStart);
        const grip = el.querySelector('.widget-btn.grip');
        if (grip) grip.addEventListener('pointerdown', onGripPointerDown);

        el.addEventListener('dragover', onModuleDragOver);
        el.addEventListener('dragleave', onModuleDragLeave);
        el.addEventListener('drop', onModuleDrop);

        if (typeof reg.init === 'function') {
            setTimeout(() => { try { reg.init(w, el); } catch(e) { console.warn('widget init', e); } }, 60);
        }

        widgetCleanup[w.id] = () => { };
        setTimeout(() => el.classList.remove('entering'), 500 + idx * 30);
    });

    /* ═════ STEP 6 · Attach refresh controls into screener's card-title ═════ */
    const screenerWidget = document.querySelector('[data-widget-type="screener"]');
    if (screenerWidget) {
        const cardTitle = screenerWidget.querySelector('.card-title');

        /* Reuse existing inline-refresh container or create a new one */
        let inline = cardTitle?.querySelector('.inline-refresh');
        if (!inline && cardTitle) {
            inline = document.createElement('div');
            inline.className = 'inline-refresh';
            cardTitle.appendChild(inline);
        }

        if (inline) {
            controls.forEach(el => inline.appendChild(el));
            /* Hide the now-empty topbar completely */
            if (topbar) topbar.style.display = 'none';
        } else {
            /* Fallback · screener rendered but no .card-title found */
            returnControlsToTopbar(park, topbar);
        }
    } else {
        /* No screener widget · return controls to topbar and show it */
        returnControlsToTopbar(park, topbar);
    }
}

/* ── Helper · return controls to topbar and show it ── */
function returnControlsToTopbar(park, topbar) {
    if (!topbar) return;
    let actions = topbar.querySelector('.topbar-actions');
    if (!actions) {
        actions = document.createElement('div');
        actions.className = 'topbar-actions';
        topbar.appendChild(actions);
    }
    [...park.children].forEach(el => actions.appendChild(el));
    topbar.style.display = '';
}

function removeWidget(widgetId) {
    const idx = state.widgets.findIndex(x => x.id === widgetId);
    if (idx === -1) return;
    if (widgetCleanup[widgetId]) { try { widgetCleanup[widgetId](); } catch(e) {} delete widgetCleanup[widgetId]; }

        el.style.transition = 'all 0.25s var(--tr-smooth)';

    setTimeout(() => {

}

/* ════════════════════════════════════════════════════════════
   DRAG & DROP (pointer-based reorder)
   ════════════════════════════════════════════════════════════ */
let dragState = null;
let draggingFromLibrary = false;

function onGripPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const grip = e.currentTarget;
    const widget = grip.closest('.module');
    if (!widget) return;
    const rect = widget.getBoundingClientRect();
    dragState = {
        active: false,
        widgetId: widget.dataset.widgetId,
        element: widget,
        ghost: null,
        rect,
        startX: e.clientX, startY: e.clientY,
        offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
        target: null, overTrash: false
    };
    e.preventDefault();
    document.addEventListener('pointermove', onDragPointerMove);
    document.addEventListener('pointerup', onDragPointerUp);
    document.addEventListener('pointercancel', onDragPointerUp);
    document.addEventListener('keydown', onDragKeyDown);
}

function onDragPointerMove(e) {
    if (!dragState) return;
    if (!dragState.active) {
        const dx = Math.abs(e.clientX - dragState.startX);
        const dy = Math.abs(e.clientY - dragState.startY);
        if (dx < 6 && dy < 6) return;
        activateDrag();
    }
    const x = e.clientX - dragState.offsetX;
    const y = e.clientY - dragState.offsetY;
    dragState.ghost.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1.03) rotate(0.4deg)`;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const target = el ? el.closest('.module') : null;

    if (target && target !== dragState.element && !dragState.overTrash) {
        if (dragState.target !== target) {
            if (dragState.target) dragState.target.classList.remove('drop-target');
            dragState.target = target;
            target.classList.add('drop-target');
        }
    } else if (dragState.target) {
        dragState.target.classList.remove('drop-target');
        dragState.target = null;
    }

    const trash = $('trash-zone');
    if (trash && trash.classList.contains('active')) {
        const tr = trash.getBoundingClientRect();
        const overTrash = e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top && e.clientY <= tr.bottom;
        if (overTrash !== dragState.overTrash) {
            dragState.overTrash = overTrash;
            trash.classList.toggle('hot', overTrash);
            if (overTrash && dragState.target) {
                dragState.target.classList.remove('drop-target');
                dragState.target = null;
            }
        }
    }
}

function activateDrag() {
    if (!dragState || dragState.active) return;
    dragState.active = true;
    const el = dragState.element;
    const rect = dragState.rect;
    const ghost = el.cloneNode(true);
    ghost.classList.remove('entering', 'dragging');
    ghost.classList.add('drag-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
    ghost.querySelectorAll('button, input, textarea, select, iframe, a').forEach(x => {
        x.setAttribute('tabindex', '-1');
        x.style.pointerEvents = 'none';
    });
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    el.classList.add('dragging');
    const trash = $('trash-zone');
    if (trash) trash.classList.add('active');
    document.body.classList.add('is-dragging');
}

function onDragPointerUp() {
    if (!dragState) return;
    const wasActive = dragState.active;
    const targetId = dragState.target ? dragState.target.dataset.widgetId : null;
    const overTrash = dragState.overTrash;
    const widgetId = dragState.widgetId;
    cleanupDrag();
    if (!wasActive) return;
    if (overTrash) removeWidget(widgetId);
    else if (targetId && targetId !== widgetId) reorderWidget(widgetId, targetId);
}

function onDragKeyDown(e) {
    if (e.key === 'Escape' && dragState && dragState.active) cleanupDrag();
}

function cleanupDrag() {
    if (!dragState) return;
    if (dragState.ghost) dragState.ghost.remove();
    if (dragState.element) dragState.element.classList.remove('dragging');
    if (dragState.target) dragState.target.classList.remove('drop-target');
    const trash = $('trash-zone');
    if (trash) trash.classList.remove('active', 'hot');
    document.body.classList.remove('is-dragging');
    document.removeEventListener('pointermove', onDragPointerMove);
    document.removeEventListener('pointerup', onDragPointerUp);
    document.removeEventListener('pointercancel', onDragPointerUp);
    document.removeEventListener('keydown', onDragKeyDown);
    dragState = null;
}

/* ─── Surgical reorder (no grid re-render) ─── */
function reorderWidget(fromId, toId) {
    const fromIdx = state.widgets.findIndex(w => w.id === fromId);
    const toIdx = state.widgets.findIndex(w => w.id === toId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const [moved] = state.widgets.splice(fromIdx, 1);
    state.widgets.splice(toIdx, 0, moved);
    saveState();

    const grid = $('bento-grid');
    if (!grid) return;
    const fromEl = grid.querySelector(`[data-widget-id="${fromId}"]`);
    const toEl = grid.querySelector(`[data-widget-id="${toId}"]`);
    if (!fromEl || !toEl) return;
    if (fromIdx < toIdx) {
        toEl.parentNode.insertBefore(fromEl, toEl.nextSibling);
    } else {
        toEl.parentNode.insertBefore(fromEl, toEl);
    }
}
