                    <div id="tfSelector_${w.id}" style="display:flex; gap:4px;">
                        <button class="scr-tab active" data-interval="1h" data-limit="24" style="padding:4px 8px; font-size:9px;">24H</button>
                        <button class="scr-tab" data-interval="4h" data-limit="42" style="padding:4px 8px; font-size:9px;">7D</button>
                        <button class="scr-tab" data-interval="1d" data-limit="30" style="padding:4px 8px; font-size:9px;">1M</button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function initBTCSparklineWidget(w, el) {
    const API_BASE = 'https://api.binance.com/api/v3';
    const DPI = window.devicePixelRatio || 1;
    let currentCoinId = 'BTCUSDT';
    let priceData = [], rawPrices = [], rawVolumes = [];
    let animationFrameId = null, pulseAnimationFrameId = null, pulseTimeStart = null;
    let lastMouseX = -1;
    const PULSE_DURATION = 2000;

    const SYMBOL_NAMES = { 'BTCUSDT':'BITCOIN', 'ETHUSDT':'ETHEREUM', 'SOLUSDT':'SOLANA', 'BNBUSDT':'BNB', 'XRPUSDT':'RIPPLE', 'DOGEUSDT':'DOGECOIN', 'ADAUSDT':'CARDANO', 'AVAXUSDT':'AVALANCHE', 'LINKUSDT':'CHAINLINK' };

    let config = { interval: '1h', limit: 24, padding: { top: 15, right: 10, bottom: 10, left: 10 }, hoverLineColor: 'rgba(255,255,255,0.15)' };

    const els = {
        input:    el.querySelector(`#coinInput_${w.id}`),
        datalist: el.querySelector(`#coinList_${w.id}`),
        price:    el.querySelector(`#currentPrice_${w.id}`),
        change:   el.querySelector(`#priceChange_${w.id}`),
        high:     el.querySelector(`#highPrice_${w.id}`),
        low:      el.querySelector(`#lowPrice_${w.id}`),
        loading:  el.querySelector(`#loadingState_${w.id}`),
        canvas:   el.querySelector(`#sparklineChart_${w.id}`),
        tooltip:  el.querySelector(`#hoverTooltip_${w.id}`),
        tfs:      el.querySelectorAll(`#tfSelector_${w.id} .scr-tab`)
    };
    if (!els.canvas) return;
    const ctx = els.canvas.getContext('2d');

    function formatPrice(price) {
        const num = parseFloat(price);
        return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', minimumFractionDigits:2, maximumFractionDigits: num>100?2:6 }).format(num);
    }

    async function fetchChartData(symbol, interval, limit) {
        els.loading.style.display = 'block';
        try {
            let data = null;
            try {
                const r = await fetch(`/api/sparkline?symbol=${symbol}&interval=${interval}&limit=${limit}`);
                if (r.ok) data = await r.json();
            } catch (_) {}
            if (!data || !Array.isArray(data) || !data.length) {
                try {
                    const r2 = await fetch(`https://t1prime.com/api/sparkline?symbol=${symbol}&interval=${interval}&limit=${limit}`);
                    if (r2.ok) data = await r2.json();
                } catch (_) {}
            }
            if (!data || !Array.isArray(data) || !data.length) {
                const r3 = await fetch(`${API_BASE}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
                if (r3.ok) data = await r3.json();
            }
            els.loading.style.display = 'none';
            if (Array.isArray(data)) {
                return data.map(k => [parseInt(k[0]), parseFloat(k[4]), parseFloat(k[7])]);
            }
            return [];
        } catch (e) {
            els.loading.style.display = 'none';
            return [];
        }
    }

    async function updateWidget(symbol) {
        try {
            const marketData = await fetch(`${API_BASE}/ticker/24hr?symbol=${symbol}`).then(r=>r.json());
            if (marketData && !marketData.code) {
                const chg = parseFloat(marketData.priceChangePercent);
                els.price.textContent = formatPrice(marketData.lastPrice);
                const isUp = chg >= 0;
                const upCol = '#00ffc8', dnCol = '#a855f7';
                els.price.style.color = isUp ? upCol : dnCol;
                els.change.textContent = `${isUp?'+':''}${chg.toFixed(2)}%`;
                els.change.style.color = isUp ? upCol : dnCol;
                els.change.style.background = isUp ? 'rgba(0,255,200,0.1)' : 'rgba(168,85,247,0.1)';
                els.change.style.border = isUp ? '1px solid rgba(0,255,200,0.2)' : '1px solid rgba(168,85,247,0.2)';
                els.high.textContent = formatPrice(marketData.highPrice);
                els.low.textContent  = formatPrice(marketData.lowPrice);
            }
            priceData = await fetchChartData(symbol, config.interval, config.limit);
            rawPrices  = priceData.map(p => p[1]);
            rawVolumes = priceData.map(p => p[2] || 0);
            if (!pulseAnimationFrameId) pulseAnimationFrameId = requestAnimationFrame(animatePulse);
        } catch(e) {}
    }

    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    function drawSparkline(hoverX = -1, pulseScale = 1) {
        if (!rawPrices.length) return;
        const rect = els.canvas.parentElement.getBoundingClientRect();
        els.canvas.width  = rect.width  * DPI;
        els.canvas.height = rect.height * DPI;
        ctx.scale(DPI, DPI);

        const width  = rect.width  - config.padding.left - config.padding.right;
        const height = rect.height - config.padding.top  - config.padding.bottom;
        const max = Math.max(...rawPrices), min = Math.min(...rawPrices), range = max - min;
        const isUp = rawPrices[rawPrices.length-1] >= rawPrices[0];
        const lineColor = isUp ? '#00ffc8' : '#a855f7';

        ctx.clearRect(0, 0, rect.width*DPI, rect.height*DPI);
        if (rawPrices.length < 2 || range <= 0) return;

        const xScale = width / (rawPrices.length - 1), yScale = height / range;
        const getX = i => config.padding.left + i * xScale;
        const getY = p => config.padding.top + height - (p - min) * yScale;
        const baselineY = rect.height;

        const vols = rawVolumes.length === rawPrices.length ? rawVolumes : rawPrices.map(() => 1);
        const maxV = Math.max(...vols) || 1;
        const minV = Math.min(...vols) || 0;
        const logMax = Math.log(1 + maxV), logMin = Math.log(1 + minV);
        const logRange = logMax - logMin || 1;
        const normVol = vols.map(v => (Math.log(1 + v) - logMin) / logRange);

        /* AREA PATH */
        ctx.beginPath();
        ctx.moveTo(getX(0), baselineY);
        ctx.lineTo(getX(0), getY(rawPrices[0]));
        for (let i = 0; i < rawPrices.length - 1; i++) {
            ctx.quadraticCurveTo(
                (getX(i) + getX(i+1)) / 2, getY(rawPrices[i]),
                getX(i+1), getY(rawPrices[i+1])
            );
        }
        ctx.lineTo(getX(rawPrices.length - 1), baselineY);
        ctx.closePath();

        /* VOLUME-DRIVEN FILL */
        ctx.save();
        ctx.clip();
        const volGrad = ctx.createLinearGradient(config.padding.left, 0, config.padding.left + width, 0);
        const N = normVol.length;
        for (let i = 0; i < N; i++) {
            const p = N === 1 ? 0 : i / (N - 1);
            const alpha = 0.05 + normVol[i] * 0.7;
            volGrad.addColorStop(p, hexToRgba(lineColor, alpha));
        }
        ctx.fillStyle = volGrad;
        ctx.fillRect(config.padding.left, config.padding.top, width, height);

        ctx.globalCompositeOperation = 'destination-out';
        const fadeGrad = ctx.createLinearGradient(0, config.padding.top, 0, baselineY);
        fadeGrad.addColorStop(0, 'rgba(0,0,0,0)');
        fadeGrad.addColorStop(1, 'rgba(0,0,0,1)');
        ctx.fillStyle = fadeGrad;
        ctx.fillRect(config.padding.left, config.padding.top, width, height);
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();

        /* LINE */
        ctx.beginPath();
        ctx.strokeStyle = lineColor; ctx.lineWidth = 2.5;
        ctx.shadowColor = lineColor; ctx.shadowBlur = 8;
        ctx.moveTo(getX(0), getY(rawPrices[0]));
        for (let i = 0; i < rawPrices.length - 1; i++) {
            ctx.quadraticCurveTo(
                (getX(i) + getX(i+1)) / 2, getY(rawPrices[i]),
                getX(i+1), getY(rawPrices[i+1])
            );
        }
        ctx.stroke(); ctx.shadowBlur = 0;

        /* LAST POINT + PULSE */
        const lastX = getX(rawPrices.length - 1), lastY = getY(rawPrices[rawPrices.length - 1]);
        if (pulseScale > 1) {
            ctx.beginPath();
            ctx.arc(lastX, lastY, 12 * pulseScale, 0, Math.PI * 2);
            ctx.strokeStyle = lineColor + Math.round((0.8 / pulseScale) * 255).toString(16).padStart(2, '0');
            ctx.lineWidth = 2 * (2 - pulseScale); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();

        /* HOVER CROSSHAIR */
        if (hoverX > -1) {
            const idx = Math.min(Math.round((hoverX - config.padding.left) / xScale), rawPrices.length - 1);
            if (idx >= 0) {
                const px = getX(idx), py = getY(rawPrices[idx]);
                ctx.beginPath(); ctx.strokeStyle = config.hoverLineColor; ctx.setLineDash([3, 3]);
                ctx.moveTo(px, config.padding.top);
                ctx.lineTo(px, rect.height - config.padding.bottom);
                ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
                ctx.fill(); ctx.shadowBlur = 0;
                return { x: px, y: py, price: rawPrices[idx], time: priceData[idx][0], volume: vols[idx] || 0 };
            }
        }
    }

    function animatePulse(timestamp) {
        if (!pulseTimeStart) pulseTimeStart = timestamp;
        let progress = (timestamp - pulseTimeStart) / PULSE_DURATION;
        if (progress >= 1) { progress = 1; drawSparkline(lastMouseX, 1); pulseAnimationFrameId = null; return; }
        drawSparkline(lastMouseX, 1 + 0.6 * Math.sin(progress * Math.PI));
        pulseAnimationFrameId = requestAnimationFrame(animatePulse);
    }

    els.canvas.addEventListener('mousemove', e => {
        lastMouseX = e.clientX - els.canvas.getBoundingClientRect().left;
        if (pulseAnimationFrameId) { cancelAnimationFrame(pulseAnimationFrameId); pulseAnimationFrameId = null; pulseTimeStart = null; }
        if (!animationFrameId) animationFrameId = requestAnimationFrame(() => {
            animationFrameId = null;
            const h = drawSparkline(lastMouseX, 1);
            if (h) {
                const trendColor = h.price >= rawPrices[0] ? '#00ffc8' : '#a855f7';
                const fmtVol = v => v >= 1e9 ? (v/1e9).toFixed(2)+'B'
                    : v >= 1e6 ? (v/1e6).toFixed(2)+'M'
                    : v >= 1e3 ? (v/1e3).toFixed(1)+'K'
                    : v.toFixed(0);
                els.tooltip.innerHTML = `
                    <span style="font-weight:800; font-size:12px; color:${trendColor};">${formatPrice(h.price)}</span><br>
                    <span style="color:var(--accent); opacity:0.9; font-size:10px;">Vol: $${fmtVol(h.volume)}</span><br>
                    <span style="color:var(--text-muted); opacity:0.8;">${new Date(h.time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'})}</span>
                `;
                let tipX = h.x + els.canvas.offsetLeft;
                let tipY = h.y + els.canvas.offsetTop - 15;
                const tipW = els.tooltip.offsetWidth || 80;
                if (tipY < 40) { tipY = h.y + els.canvas.offsetTop + 20; els.tooltip.style.transform = 'translate(-50%, 0)'; }
                else { els.tooltip.style.transform = 'translate(-50%, -100%)'; }
                if (tipX < tipW/2 + 5) tipX = tipW/2 + 5;
                if (tipX > els.canvas.offsetWidth - tipW/2 - 5) tipX = els.canvas.offsetWidth - tipW/2 - 5;
                els.tooltip.style.left = `${tipX}px`;
                els.tooltip.style.top  = `${tipY}px`;
                els.tooltip.style.opacity = '1';
            }
        });
    });

    els.canvas.addEventListener('mouseout', () => {
        if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
        els.tooltip.style.opacity = '0'; lastMouseX = -1;
        if (!pulseAnimationFrameId) pulseAnimationFrameId = requestAnimationFrame(animatePulse);
    });

    Object.keys(SYMBOL_NAMES).forEach(id => {
        const opt = document.createElement('option');
        opt.value = id; opt.textContent = SYMBOL_NAMES[id];
        els.datalist.appendChild(opt);
    });

    let debounceTimer;
    els.input.addEventListener('input', e => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            let val = e.target.value.trim().toUpperCase();
            if (val.length > 2 && !val.includes('USDT') && !val.includes('USD')) val += 'USDT';
            if (val) { currentCoinId = val; updateWidget(currentCoinId); }
        }, 600);
    });

    els.tfs.forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        els.tfs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        config.interval = btn.dataset.interval;
        config.limit    = parseInt(btn.dataset.limit);
        updateWidget(currentCoinId);
    }));

    const ro = new ResizeObserver(() => drawSparkline(lastMouseX, 1));
    ro.observe(els.canvas.parentElement);
    updateWidget(currentCoinId);

    widgetCleanup[w.id] = () => {
        ro.disconnect();
        if (pulseAnimationFrameId)   cancelAnimationFrame(pulseAnimationFrameId);
        if (animationFrameId)        cancelAnimationFrame(animationFrameId);
    };
}

/* ─── Library → dashboard drop ─── */
function onModuleDragOver(e) {
    if (!draggingFromLibrary) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    this.classList.add('drop-target');
}
function onModuleDragLeave(e) {
    if (!this.contains(e.relatedTarget)) this.classList.remove('drop-target');
}
function onModuleDrop(e) {
    if (!draggingFromLibrary) return;
    e.preventDefault();
    this.classList.remove('drop-target');
    const type = e.dataTransfer.getData('widget-type');
    if (!type || !WIDGET_REGISTRY[type]) { draggingFromLibrary = false; return; }
    const targetId = this.dataset.widgetId;
    const toIdx = state.widgets.findIndex(x => x.id === targetId);
    addWidget(type, toIdx);
    draggingFromLibrary = false;
}

function initDashboardDropZone() {
    const grid = $('bento-grid');
    const emptyEl = $('empty-dashboard');
    if (!grid) return;

    const onDragOver = (e) => {
        if (!draggingFromLibrary) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        if (emptyEl) emptyEl.classList.add('highlight');
    };
    const onDragLeave = (e) => {
        if (grid.contains(e.relatedTarget)) return;
        if (emptyEl && emptyEl.contains(e.relatedTarget)) return;
        if (emptyEl) emptyEl.classList.remove('highlight');
    };
    const onDrop = (e) => {
        e.preventDefault();
        if (emptyEl) emptyEl.classList.remove('highlight');
        const type = e.dataTransfer.getData('widget-type');
        if (!type || !WIDGET_REGISTRY[type]) { draggingFromLibrary = false; return; }
        addWidget(type);
        draggingFromLibrary = false;
    };

    [grid, emptyEl].filter(Boolean).forEach(el => {
        el.addEventListener('dragover', onDragOver);
        el.addEventListener('dragleave', onDragLeave);
        el.addEventListener('drop', onDrop);
    });
}

/* ─── Trash zone ─── */
function initTrashZone() {
    const trash = $('trash-zone');
    if (!trash) return;
    trash.addEventListener('dragover', (e) => { e.preventDefault(); trash.classList.add('hot'); });
    trash.addEventListener('dragleave', (e) => { if (!trash.contains(e.relatedTarget)) trash.classList.remove('hot'); });
    trash.addEventListener('drop', (e) => {
        e.preventDefault();
        trash.classList.remove('hot');
        const wid = e.dataTransfer.getData('text/plain');
        if (wid && state.widgets.find(w => w.id === wid)) removeWidget(wid);
    });
}

/* ════════════════════════════════════════════════════════════
   RESIZE (snap to grid cells)
   ════════════════════════════════════════════════════════════ */
let resizeState = null;

function getGridInfo() {
    const grid = $('bento-grid');
    if (!grid) return { cellW: 340, gap: 14, maxCols: 4 };
    const cs = getComputedStyle(grid);
    const gap = parseFloat(cs.columnGap) || 14;
    const cols = (cs.gridTemplateColumns || '').split(' ').filter(s => s && s !== 'none').length || 1;
    const totalW = grid.clientWidth;
    const cellW = (totalW - (cols - 1) * gap) / cols;
    return { cellW, gap, maxCols: Math.max(1, cols) };
}

function pickSizeKey(cols, rows) {
    if (rows === 1) cols = Math.min(cols, 4);
    else if (rows === 2) cols = Math.min(cols, 4);
    else if (rows >= 3) { rows = 3; cols = Math.min(cols, 3); }
    return `${cols}x${rows}`;
}

function onResizeStart(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const handle = e.currentTarget;
    const widget = handle.closest('.module');
    if (!widget) return;

    resizeState = {
        widgetId: widget.dataset.widgetId,
        element: widget,
        handle,
        startX: e.clientX, startY: e.clientY,
        startW: widget.offsetWidth, startH: widget.offsetHeight,
        pointerId: e.pointerId,
        pendingSize: widget.dataset.size
    };

    let hint = document.getElementById('resizeHint');
    if (!hint) {
        hint = document.createElement('div');
        hint.id = 'resizeHint';
        hint.className = 'resize-hint';
        document.body.appendChild(hint);
    }
    hint.textContent = (widget.dataset.size || '1x1').toUpperCase();

    document.body.classList.add('is-resizing');
    document.addEventListener('pointermove', onResizeMove);
    document.addEventListener('pointerup', onResizeEnd);
    document.addEventListener('pointercancel', onResizeEnd);
}

function onResizeMove(e) {
    if (!resizeState) return;
    const { startX, startY, startW, startH, element } = resizeState;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const newW = Math.max(200, startW + dx);
    const newH = Math.max(140, startH + dy);

    const g = getGridInfo();
    const rawCols = (newW + g.gap) / (g.cellW + g.gap);
    const cols = Math.max(1, Math.min(g.maxCols, Math.round(rawCols)));
    const ROW_H = 200;
    const rows = Math.max(1, Math.min(3, Math.round((newH + 20) / ROW_H)));
    const sizeKey = pickSizeKey(cols, rows);
    resizeState.pendingSize = sizeKey;

    element.style.width = newW + 'px';
    element.style.height = newH + 'px';
    element.style.zIndex = '20';
    element.style.transform = 'none';
    element.style.transition = 'none';
    element.style.boxShadow = '0 24px 70px rgba(0,0,0,0.7), 0 0 0 2px var(--ac)';

    const hint = document.getElementById('resizeHint');
    if (hint) {
        const meta = SIZE_CATALOG.find(s => s.key === sizeKey);
        hint.textContent = `${sizeKey.toUpperCase()}${meta ? ' · ' + meta.desc : ''}`;
        hint.style.left = (e.clientX + 18) + 'px';
        hint.style.top = (e.clientY + 18) + 'px';
    }
}

function onResizeEnd() {
    if (!resizeState) return;
    const { widgetId, element, pendingSize } = resizeState;
    element.style.width = '';
    element.style.height = '';
    element.style.zIndex = '';
    element.style.transform = '';
    element.style.transition = '';
    element.style.boxShadow = '';

    const hint = document.getElementById('resizeHint');
    if (hint) hint.remove();

    document.body.classList.remove('is-resizing');
    document.removeEventListener('pointermove', onResizeMove);
    document.removeEventListener('pointerup', onResizeEnd);
    document.removeEventListener('pointercancel', onResizeEnd);

    if (pendingSize) setWidgetSize(widgetId, pendingSize);
    resizeState = null;
}

/* ════════════════════════════════════════════════════════════
   WIDGET LIBRARY
   ════════════════════════════════════════════════════════════ */
function renderLibrary() {
    const body = $('library-body');
    if (!body) return;
    const presentTypes = new Set(state.widgets.map(w => w.type));
    body.innerHTML = '';

    CATEGORIES.forEach(cat => {
        const widgets = Object.values(WIDGET_REGISTRY).filter(w => w.category === cat);
        if (!widgets.length) return;
        const catEl = document.createElement('div');
        catEl.className = 'library-category';
        catEl.innerHTML = `
            <div class="library-category-title">${cat}</div>
            <div class="library-grid">
                ${widgets.map(w => {
                    const isActive = presentTypes.has(w.id);
                    return `
                        <div class="library-item ${isActive ? 'active' : ''}" draggable="${isActive ? 'false' : 'true'}" data-widget-type="${w.id}" title="${isActive ? 'Already on dashboard' : 'Click to add'}">
                            <div class="library-item-icon"><i class="fa-solid ${w.icon}"></i></div>
                            <div class="library-item-name">${w.name}</div>
                            <div class="library-item-desc">${w.desc}</div>
                        </div>`;
                }).join('')}
            </div>`;
        body.appendChild(catEl);
    });

    $$('.library-item').forEach(el => {
        if (el.classList.contains('active')) return;
        el.addEventListener('click', () => {
            addWidget(el.dataset.widgetType);
        });
        el.addEventListener('dragstart', (e) => {
            draggingFromLibrary = true;
            e.dataTransfer.effectAllowed = 'copy';
            e.dataTransfer.setData('widget-type', el.dataset.widgetType);
        });
        el.addEventListener('dragend', () => { draggingFromLibrary = false; });
    });
}

function openLibrary() {
    $('widget-library').classList.add('open');
    $('library-overlay').classList.add('open');
}
function closeLibrary() {
    $('widget-library').classList.remove('open');
    $('library-overlay').classList.remove('open');
    const ed = $('empty-dashboard');
    if (ed) ed.classList.remove('highlight');
}

/* ════════════════════════════════════════════════════════════
   REFRESH SYSTEM
   ════════════════════════════════════════════════════════════ */
function updateRefreshIndicator() {
    const dot = $('refresh-dot');
    const stateEl = $('refresh-state');
    const lbl = $('refresh-label');
    const last = $('refresh-last');
    if (!dot) return;
    const off = state.refreshMs === 0;
    const paused = document.hidden;
    dot.classList.toggle('paused', off || paused);
    if (stateEl) stateEl.textContent = off ? 'OFF' : (paused ? 'PAUSED' : 'LIVE');
    if (lbl) {
        if (off) lbl.textContent = '—';
        else if (state.refreshMs >= 60000) lbl.textContent = (state.refreshMs/60000) + ' min';
        else lbl.textContent = (state.refreshMs/1000) + ' sec';
    }
    if (last && state.lastUpdateAt) {
        last.textContent = new Date(state.lastUpdateAt).toTimeString().slice(0,8);
    }
}

async function refreshPrices() {
    const btn = $('refresh-now');
    if (btn) btn.classList.add('spin');
    try {
        const [tickers, funding] = await Promise.all([fetchTickers(), fetchFunding()]);
        state.tickers = tickers;
        state.tickersMap = {};
        tickers.forEach(t => { state.tickersMap[t.symbol] = t; });
        state.funding = funding;
        state.lastUpdateAt = Date.now();

        updateBTCHeroFast();
        patchScreener();
        renderSectors(tickers);
        renderVolume(tickers);
        updateRefreshIndicator();
    } catch(e) { console.warn('Refresh failed:', e); }

  /* ── Cache helper ── */
  async function cached(key, url, ttlMs) {
    const now = Date.now();
    const hit = CACHE.get(key);
    if (hit && (now - hit.ts) < ttlMs) return hit.data;
    try {
      const data = await fetch(url).then(r => r.json());
      CACHE.set(key, { data, ts: now });

    } catch(e) { return null; }

        `⚠️ · ${sig.windowMin}m · ${cgLink(sig.base)}`,
        `📈 OI: ${sgn(sig.oiChg)}${sig.oiChg.toFixed(2)}% (${fmtUsd(sig.oiValue)})`,
        `💲 Price: ${sgn(sig.priceChg)}${sig.priceChg.toFixed(2)}%`,
        `${bolts(sig.volRatio)} Vol: ${Math.round(sig.volRatio)}x`,

      ].join('\n');

  }
  function pickTf(cardId, sig) {
    return ({
      pump_dump: `${sig.windowMin}m`,
      vol_spike: `${sig.windowMin}m`,
      oi_raise: '15m',

  function pickIcon(cardId, sig) {
    if (cardId === 'pump_dump') return sig.type === 'pump' ? '🟢' : '🔻';
    if (cardId === 'vol_spike') return '💹';
    if (cardId === 'oi_raise') return '⚠️';
    if (cardId === 'divergence') return '⚠️';

  /* ── Card scans ── */
  async function scanPumpDump() {
    const c = S.cards.pump_dump; c.lastScan = Date.now();
    const pool = filterPool(c.pool);
    const W = c.windowMin;
    const limit = 65;
    const BATCH = 6;
    for (let i = 0; i < pool.length; i += BATCH) {
      if (!S.alertsEnabled || !c.enabled) return;

      await new Promise(r => setTimeout(r, 130));

  }
  async function analyzePD(coin, cfg, limit) {
    const sym = coin.sym;
    const kl = await cached(
      `kl_1m_${sym}_${limit}`,
      `${API.binance}/fapi/v1/klines?symbol=${sym}&interval=1m&limit=${limit}`,
      55000
    );
    if (!Array.isArray(kl) || kl.length < limit - 5) return;
    const W = cfg.windowMin;
    const cur = parseFloat(kl[kl.length - 1][4]);
    const prev = parseFloat(kl[kl.length - 1 - W][4]);
    if (!prev || prev <= 0) return;
    const chg = ((cur - prev) / prev) * 100;
    if (chg >= cfg.pumpThr) {
      emit('pump_dump', { type: 'pump', sym, base: coin.base, price: cur, prevPrice: prev, chgPct: chg, windowMin: W });
    } else if (chg <= -cfg.dumpThr) {
      emit('pump_dump', { type: 'dump', sym, base: coin.base, price: cur, prevPrice: prev, chgPct: chg, windowMin: W });
    }
  }

  async function scanVolSpike() {
    const c = S.cards.vol_spike; c.lastScan = Date.now();
    const pool = filterPool(c.pool);
    const W = c.windowMin;
    const limit = 65;
    const BATCH = 6;
    for (let i = 0; i < pool.length; i += BATCH) {
      if (!S.alertsEnabled || !c.enabled) return;
      await Promise.all(pool.slice(i, i + BATCH).map(coin => analyzeVS(coin, c, limit)));
      await new Promise(r => setTimeout(r, 100));
    }
  }
  async function analyzeVS(coin, cfg, limit) {
    const sym = coin.sym;
    const kl = await cached(
      `kl_1m_${sym}_${limit}`,
      `${API.binance}/fapi/v1/klines?symbol=${sym}&interval=1m&limit=${limit}`,
      55000
    );
    if (!Array.isArray(kl) || kl.length < limit - 5) return;
    const W = cfg.windowMin;
    const recent = kl.slice(-W).reduce((s,k) => s + parseFloat(k[7]), 0);
    const prior  = kl.slice(-W*2, -W).reduce((s,k) => s + parseFloat(k[7]), 0);
    if (prior <= 0) return;
    const ratio = recent / prior;
    if (ratio < cfg.floor) return;
    const cur = parseFloat(kl[kl.length - 1][4]);
    const prev = parseFloat(kl[kl.length - 1 - W][4]);
    const chg = prev > 0 ? ((cur - prev) / prev) * 100 : 0;
    if (chg < cfg.priceThr) return;   // must be ≥ +1% (user-set)
    emit('vol_spike', { type: 'vol_spike', sym, base: coin.base, price: cur, chgPct: chg, volRatio: ratio, windowMin: W });
  }

  async function scanOiRaise() {
    const c = S.cards.oi_raise; c.lastScan = Date.now();
    const pool = filterPool(c.pool);
    const W = c.windowMin;
    const BATCH = 6;
    for (let i = 0; i < pool.length; i += BATCH) {
      if (!S.alertsEnabled || !c.enabled) return;
      await Promise.all(pool.slice(i, i + BATCH).map(coin => analyzeOI(coin, c, W)));
      await new Promise(r => setTimeout(r, 150));
    }
  }
  async function analyzeOI(coin, cfg, W) {
    const sym = coin.sym;
    const [kl, oi] = await Promise.all([
        cached(`kl_1m_${sym}_65`, `${API.binance}/fapi/v1/klines?symbol=${sym}&interval=1m&limit=65`, 55000),
        cached(`oi_5m_${sym}_15`, `${API.binance}/futures/data/openInterestHist?symbol=${sym}&period=5m&limit=15`, 4 * 60 * 1000),
    ]);
    if (!Array.isArray(kl) || kl.length < 60) return;
    if (!Array.isArray(oi) || oi.length < 5) return;

    /* ── 1. Basic thresholds (window W) ────────────────────────── */
    const cur  = parseFloat(kl[kl.length - 1][4]);
    const prev = parseFloat(kl[kl.length - 1 - W][4]);
    if (!prev || prev <= 0) return;

    const priceChg = ((cur - prev) / prev) * 100;
    if (priceChg < cfg.priceThr) return;   /* MUST be ≥ +5% (or user-set) */

    const oiSamples = Math.max(1, Math.round(W / 5));   /* 20m / 5m = 4 */
    const oiSlice   = oi.slice(-(oiSamples + 1));       /* 5 samples → 4 steps */
    if (oiSlice.length < 2) return;

    const oiNow  = parseFloat(oiSlice[oiSlice.length - 1].sumOpenInterestValue);
    const oiPast = parseFloat(oiSlice[0].sumOpenInterestValue);
    if (oiPast <= 0) return;

    const oiChg = ((oiNow - oiPast) / oiPast) * 100;
    if (oiChg < cfg.oiThr) return;         /* MUST be ≥ +3% (or user-set) */

    /* ── 2. Smart Filter A · OI Smoothness ────────────────────────
       ≥ 65% of 5m OI steps must be non-decreasing
       (using 5m OI hist as proxy · Binance gives min 5m, not 1m)  */
    let positiveSteps = 0, totalSteps = 0;
    for (let i = 1; i < oiSlice.length; i++) {
        const a = parseFloat(oiSlice[i - 1].sumOpenInterestValue);
        const b = parseFloat(oiSlice[i].sumOpenInterestValue);
        if (b >= a) positiveSteps++;
        totalSteps++;
    }
    const smoothness = totalSteps > 0 ? positiveSteps / totalSteps : 0;
    if (smoothness < 0.65) return;

    /* ── 3. Smart Filter B · Momentum Acceleration ────────────────
       Last-half ROC must be ≥ first-half ROC (FOMO check)         */
    const halfW  = Math.round(W / 2);
    const pMid   = parseFloat(kl[kl.length - 1 - halfW][4]);
    if (!pMid || pMid <= 0) return;
    const rocFirst = ((pMid - prev) / prev) * 100;
    const rocLast  = ((cur  - pMid) / pMid) * 100;
    if (rocLast < rocFirst) return;

    /* ── 4. Smart Filter C · Volume Breakout ──────────────────────
       avg last 5m volume per minute ≥ 1.5× avg prev 15m per minute */
    const volLast5   = kl.slice(-5).reduce((s, k) => s + parseFloat(k[7]), 0) / 5;
    const volPrev15  = kl.slice(-20, -5).reduce((s, k) => s + parseFloat(k[7]), 0) / 15;
    if (volPrev15 <= 0) return;
    const volBreakout = volLast5 / volPrev15;
    if (volBreakout < 1.5) return;

    /* ── 5. Candle Spike ratio — for ⚡ DISPLAY only, NOT a filter ─
       (keeps old "Vol: 13x" look via bolts() helper)               */
    const recentW = kl.slice(-W).reduce((s, k) => s + parseFloat(k[7]), 0);
    const priorW  = kl.slice(-W * 2, -W).reduce((s, k) => s + parseFloat(k[7]), 0);
    const volRatio = priorW > 0 ? recentW / priorW : 0;

    emit('oi_raise', {
        type: 'oi_raise', sym, base: coin.base,
        price: cur,
        priceChg, oiChg, oiValue: oiNow,
        volRatio,      /* used by bolts() in caption + UI ⚡ */
        volBreakout,   /* for debugging / future display */
        smoothness,    /* for debugging / future display */
        windowMin: W,
    });
}

  async function scanDivergence() {
    const c = S.cards.divergence; c.lastScan = Date.now();
    const pool = filterPool(c.pool);
    const BATCH = 6;
    for (let i = 0; i < pool.length; i += BATCH) {
      if (!S.alertsEnabled || !c.enabled) return;
      await Promise.all(pool.slice(i, i + BATCH).map(coin => analyzeDV(coin, c)));
      await new Promise(r => setTimeout(r, 200));
    }
  }
  async function analyzeDV(coin, cfg) {
    const sym = coin.sym;
    const LB  = cfg.lookbackH || 12;   /* fixed 12h */
    const limit = LB + 16;             /* 28 candles @1h · buffer */

    const [kl, oi] = await Promise.all([
        cached(`kl_1h_${sym}_${limit}`, `${API.binance}/fapi/v1/klines?symbol=${sym}&interval=1h&limit=${limit}`, 55 * 60 * 1000),
        cached(`oi_1h_${sym}_${limit}`, `${API.binance}/futures/data/openInterestHist?symbol=${sym}&period=1h&limit=${limit}`, 55 * 60 * 1000),
    ]);
    if (!Array.isArray(kl) || kl.length < LB + 2) return;
    if (!Array.isArray(oi) || oi.length < LB + 2) return;

    /* ── 1. Basic thresholds (fixed 12h) ───────────────────────── */
    const priceNow = parseFloat(kl[kl.length - 1][4]);
    const priceOld = parseFloat(kl[kl.length - 1 - LB][4]);
    if (!priceOld || priceOld <= 0 || priceNow <= 0) return;

    const priceChg = ((priceNow - priceOld) / priceOld) * 100;
    if (priceChg > -cfg.priceThr) return;   /* MUST be ≤ -5% (user-set) */

    const oiNow = parseFloat(oi[oi.length - 1].sumOpenInterestValue);
    const oiOld = parseFloat(oi[oi.length - 1 - LB].sumOpenInterestValue);
    if (!oiOld || oiOld <= 0 || oiNow <= 0) return;

    const oiChg = ((oiNow - oiOld) / oiOld) * 100;
    if (oiChg < cfg.oiThr) return;          /* MUST be ≥ +5% (user-set) */

    /* ── 2. Smart Filter A · OI Smoothness ────────────────────────
       ≥ 70% of hourly OI deltas must be non-decreasing            */
    const oiSlice = oi.slice(-(LB + 1));    /* 13 samples → 12 steps */
    let positive = 0, total = 0;
    for (let i = 1; i < oiSlice.length; i++) {
        const a = parseFloat(oiSlice[i - 1].sumOpenInterestValue);
        const b = parseFloat(oiSlice[i].sumOpenInterestValue);
        if (b >= a) positive++;
        total++;
    }
    const smoothness = total > 0 ? positive / total : 0;
    if (smoothness < 0.70) return;

    /* ── 3. Smart Filter B · Progressive 3 blocks × 4h ────────────
       OI_block3 > OI_block2 > OI_block1                            */
    const blockSize = Math.floor(LB / 3);   /* 4h per block */
    const b1End = oiSlice.length - blockSize * 2;
    const b2End = oiSlice.length - blockSize;

    const oiBlockAvg = (start, end) => {
        let s = 0, n = 0;
        for (let i = start; i < end; i++) {
            s += parseFloat(oiSlice[i].sumOpenInterestValue);
            n++;
        }
        return n > 0 ? s / n : 0;
    };
    const b1 = oiBlockAvg(0, b1End);
    const b2 = oiBlockAvg(b1End, b2End);
    const b3 = oiBlockAvg(b2End, oiSlice.length);
    if (!(b3 > b2 && b2 > b1)) return;

    /* ── 4. Smart Filter C · Volume Confirmation ──────────────────
       avg last 3h volume ≥ 0.8× avg prev 9h volume                */
    const volArr = kl.map(k => parseFloat(k[7]));
    const last3h = volArr.slice(-3).reduce((s, v) => s + v, 0) / 3;
    const prev9h = volArr.slice(-12, -3).reduce((s, v) => s + v, 0) / 9;
    if (prev9h <= 0) return;
    if (last3h < prev9h * 0.8) return;

    /* ── 5. Emit ────────────────────────────────────────────────── */
    emit('divergence', {
        type: 'divergence', sym, base: coin.base,
        price: priceNow,
        priceChg, oiChg, oiValue: oiNow,
        spanHours: LB,          /* fixed 12 · used in caption */
        smoothness,             /* for debugging */
        windowMin: LB * 60,
    });
}

  /* ── Liq WS ── */
  function startLiqWS() {

    const connect = () => {

              55000
            );
            if (!Array.isArray(kl) || kl.length < 6) return;
            const recent = kl.slice(-3).reduce((s,k) => s + parseFloat(k[7]), 0);
            const prior = kl.slice(-6, -3).reduce((s,k) => s + parseFloat(k[7]), 0);
            const ratio = prior > 0 ? recent / prior : 0;
            if (ratio < c.volFloor) return;
            const isLong = o.S === 'SELL';
            emit('liquidations', {
              type: isLong ? 'liq_long' : 'liq_short',
              sym, base: sym.replace('USDT',''),
              price: parseFloat(o.p),
              usd, volRatio: ratio,
            });
          } catch(e) {}
        };
        WS.onerror = () => {};
        WS.onclose = () => { if (alive) setTimeout(connect, 2500); };
      } catch(e) { setTimeout(connect, 2500); }
    };
    connect();
  }

  /* ── Scan wave (30s tick) ── */
  async function tickWave() {
    if (!S.alertsEnabled) return;
    await refreshUniverse();
    const now = Date.now();
    const tasks = [];
    if (S.cards.pump_dump.enabled    && now - S.cards.pump_dump.lastScan    >= S.cards.pump_dump.scanMs)    tasks.push(scanPumpDump());
    if (S.cards.vol_spike.enabled    && now - S.cards.vol_spike.lastScan    >= S.cards.vol_spike.scanMs)    tasks.push(scanVolSpike());
    if (S.cards.oi_raise.enabled     && now - S.cards.oi_raise.lastScan     >= S.cards.oi_raise.scanMs)     tasks.push(scanOiRaise());
    if (S.cards.divergence.enabled   && now - S.cards.divergence.lastScan   >= S.cards.divergence.scanMs)   tasks.push(scanDivergence());
    if (tasks.length) {
      setStatus(`SCANNING · ${tasks.length} cards`);
      await Promise.allSettled(tasks);
      setStatus('LIVE');
    }
  }
  function setStatus(txt) {
    const el = document.getElementById('mm-status');
    if (el) el.textContent = txt;
  }

  /* ── Render ── */
  function render() {
    const cardsHTML = [
      renderCardShell('pump_dump',    'fa-rocket',              'PUMPS / DUMPS',
        `<input type="number" class="mm-in-num" data-in="pump_dump" data-f="pumpThr" value="${S.cards.pump_dump.pumpThr}" min="1" max="100" title="Pump %">
         <input type="number" class="mm-in-num" data-in="pump_dump" data-f="dumpThr" value="${S.cards.pump_dump.dumpThr}" min="1" max="100" title="Dump %">`),
      renderCardShell('vol_spike',    'fa-bolt',                'VOL SPIKE',
    `<span style="font-size:8.5px;color:var(--muted);letter-spacing:.5px;">min 5×</span>
     <input type="number" class="mm-in-num" data-in="vol_spike" data-f="priceThr" value="${S.cards.vol_spike.priceThr}" min="0" max="100" step="0.5" title="Min price %">`),
      renderCardShell('oi_raise',     'fa-arrow-up-right-dots', 'OI RAISE',
    `<input type="number" class="mm-in-num" data-in="oi_raise" data-f="oiThr" value="${S.cards.oi_raise.oiThr}" min="1" max="100" step="0.5" title="OI % ≥">
     <input type="number" class="mm-in-num" data-in="oi_raise" data-f="priceThr" value="${S.cards.oi_raise.priceThr}" min="0" max="100" step="0.5" title="Price % ≥">`),
      renderCardShell('divergence',   'fa-code-branch',         'DIVERGENCE',
        `<input type="number" class="mm-in-num" data-in="divergence" data-f="oiThr" value="${S.cards.divergence.oiThr}" min="1" max="50" step="0.5" title="OI %">
         <input type="number" class="mm-in-num" data-in="divergence" data-f="priceThr" value="${S.cards.divergence.priceThr}" min="1" max="50" step="0.5" title="Price %">`),
      renderCardShell('liquidations', 'fa-water',               'LIQUIDATIONS',
        `<input type="number" class="mm-in-num" data-in="liquidations" data-f="minUsd" value="${S.cards.liquidations.minUsd}" min="1000" step="1000" title="Min USD">`),
    ].join('');

    return `
      <div class="mm-root">
        <div class="mm-topbar">
          <div class="mm-title">
            <i class="fas fa-satellite-dish"></i>
            MARKET MONITOR
            <span class="mm-badge" id="mm-count">0</span>
          </div>
          <div class="mm-topbar-actions">
            <span class="mm-status" id="mm-status">IDLE</span>
            <label class="mm-switch">
              <input type="checkbox" id="mm-master" ${S.alertsEnabled ? 'checked' : ''}>
              <span class="mm-switch-track"><span class="mm-switch-thumb"></span></span>
              <span class="mm-switch-label">ALERTS</span>
            </label>
          </div>
        </div>
        <div class="mm-cards-grid">${cardsHTML}</div>
      </div>`;
  }

  function renderCardShell(cardId, icon, title, extraInputs) {
    const c = S.cards[cardId];
    const poolVal = poolToStr(c.pool);
    return `
      <div class="mm-card ${c.enabled ? '' : 'off'}" data-card="${cardId}">
        <div class="mm-card-head">
          <div class="mm-card-title"><i class="fas ${icon}"></i>${title}</div>
          <div class="mm-card-actions">
            ${extraInputs}
            <select class="mm-pool-sel" data-pool="${cardId}">
              ${poolOptions(poolVal)}
            </select>
            <label class="mm-switch">
              <input type="checkbox" data-toggle="${cardId}" ${c.enabled ? 'checked' : ''}>
              <span class="mm-switch-track"><span class="mm-switch-thumb"></span></span>
            </label>
          </div>
        </div>
        <div class="mm-feed" id="mm-feed-${cardId}">
          <div class="mm-feed-empty">No signals yet</div>
        </div>
      </div>`;
  }
  function poolToStr(pool) {
    if (!pool || pool.mode === 'all') return 'all';
    return `${pool.mode}:${pool.topN}`;
  }
  function strToPool(s) {
    if (s === 'all') return { mode: 'all' };
    const [m, n] = s.split(':');
    return { mode: m, topN: +n };
  }
  function poolOptions(current) {
    const opts = [
      ['all', 'All coins'],
      ['top:20', 'Top 20'], ['top:50', 'Top 50'], ['top:100', 'Top 100'],
      ['top:200', 'Top 200'], ['top:300', 'Top 300'], ['top:500', 'Top 500'],
      ['excluding:10', 'Excl Top 10'], ['excluding:20', 'Excl Top 20'],
      ['excluding:25', 'Excl Top 25'], ['excluding:50', 'Excl Top 50'],
      ['excluding:100', 'Excl Top 100'], ['excluding:200', 'Excl Top 200'],
    ];
    return opts.map(([v,l]) => `<option value="${v}" ${v === current ? 'selected' : ''}>${l}</option>`).join('');
  }

  function renderCardFeed(cardId) {
    const feed = document.getElementById(`mm-feed-${cardId}`);
    if (!feed) return;
    const sigs = S.cards[cardId].signals;
    if (!sigs.length) {
      feed.innerHTML = `<div class="mm-feed-empty">No signals yet</div>`;
      return;
    }
    feed.innerHTML = sigs.map(s => sigHTML(cardId, s)).join('');
    // Update total badge
    const total = Object.values(S.cards).reduce((a,c) => a + c.signals.length, 0);
    const badge = document.getElementById('mm-count');
    if (badge) badge.textContent = total;
  }

  function sigHTML(cardId, s) {
    const ago = Math.round((Date.now() - s.ts) / 1000);
    const agoStr = ago < 60 ? `${ago}s` : ago < 3600 ? `${Math.round(ago/60)}m` : `${Math.round(ago/3600)}h`;
    const icon = s.icon;
    const base = s.base;
    const link = `https://www.coinglass.com/tv/Binance_${base}USDT`;

    let tag = '', label = '', lines = '';

    if (cardId === 'pump_dump') {
      tag = `${s.windowMin}m`;
      label = s.type === 'pump' ? 'Pump' : 'Dump';
      lines = `<span class="mm-sig-val ${s.chgPct >= 0 ? 'pos' : 'neg'}">${sgn(s.chgPct)}${s.chgPct.toFixed(2)}%</span>
               <span class="mm-sig-val dim">$${fmtPrice(s.prevPrice)} → $${fmtPrice(s.price)}</span>`;
    } else if (cardId === 'vol_spike') {
      tag = `${s.windowMin}m`;
      label = 'Vol';
      lines = `<span class="mm-sig-val gold">${bolts(s.volRatio)} ${Math.round(s.volRatio)}x</span>
               <span class="mm-sig-val pos">P ${sgn(s.chgPct)}${s.chgPct.toFixed(2)}%</span>`;
    } else if (cardId === 'oi_raise') {
      tag = `${s.windowMin}m`;
      label = 'OI';
      lines = `<span class="mm-sig-val blue">OI ${sgn(s.oiChg)}${s.oiChg.toFixed(2)}%</span>
               <span class="mm-sig-val pos">P ${sgn(s.priceChg)}${s.priceChg.toFixed(2)}%</span>
               <span class="mm-sig-val gold">${bolts(s.volRatio)} ${Math.round(s.volRatio)}x</span>`;
    } else if (cardId === 'divergence') {
      tag = `${s.spanHours}h`;
      label = 'Div';
      lines = `<span class="mm-sig-val neg">P ${sgn(s.priceChg)}${s.priceChg.toFixed(2)}%</span>
               <span class="mm-sig-val blue">OI ${sgn(s.oiChg)}${s.oiChg.toFixed(2)}%</span>`;
    } else if (cardId === 'liquidations') {
      tag = '';
      label = s.type === 'liq_long' ? 'LONG' : 'SHORT';
      lines = `<span class="mm-sig-val neg">${fmtUsd(s.usd)}</span>
               <span class="mm-sig-val gold">${bolts(s.volRatio)} ${s.volRatio.toFixed(1)}x</span>`;
    }

    return `
      <div class="mm-sig" data-sym="${s.sym}" onclick="window.open('${link}','_blank')">
        <div class="mm-sig-icon">${icon}</div>
        <div class="mm-sig-body">
          <div class="mm-sig-line1">
            <a class="mm-sig-sym" href="${link}" target="_blank" onclick="event.stopPropagation()">${base}</a>
            ${tag ? `<span class="mm-sig-tag">${tag}</span>` : ''}
            <span class="mm-sig-label">${label}</span>
          </div>
          <div class="mm-sig-line2">${lines}</div>
        </div>
        <div class="mm-sig-time">${agoStr}</div>
      </div>`;
  }

  /* ── Init (wire up events + start scanning) ── */
  function init(w, el) {
    // Wire master switch
    const master = el.querySelector('#mm-master');
    if (master) {
      master.addEventListener('change', () => {
        S.alertsEnabled = master.checked;
        saveCfg();
        setStatus(S.alertsEnabled ? 'LIVE' : 'PAUSED');
        toast(`Alerts ${S.alertsEnabled ? 'ON' : 'OFF'}`);
        if (S.alertsEnabled && !BOOTED) startAll();
      });
    }

    // Wire per-card toggles
    el.querySelectorAll('[data-toggle]').forEach(inp => {
      inp.addEventListener('change', () => {
        const id = inp.dataset.toggle;
        S.cards[id].enabled = inp.checked;
        const cardEl = el.querySelector(`.mm-card[data-card="${id}"]`);
        if (cardEl) cardEl.classList.toggle('off', !inp.checked);
        saveCfg();
      });
    });

    // Wire threshold inputs
    el.querySelectorAll('.mm-in-num').forEach(inp => {
      inp.addEventListener('change', () => {
        const id = inp.dataset.in;
        const f = inp.dataset.f;
        const v = parseFloat(inp.value);
        if (isFinite(v) && v > 0) S.cards[id][f] = v;
        else inp.value = S.cards[id][f];
        saveCfg();
      });
    });

    // Wire pool selectors
    el.querySelectorAll('.mm-pool-sel').forEach(sel => {
      sel.addEventListener('change', () => {
        const id = sel.dataset.pool;
        S.cards[id].pool = strToPool(sel.value);
        saveCfg();
      });
    });

    // Render existing feeds (from previous session)
    for (const id of Object.keys(S.cards)) renderCardFeed(id);

    // Start scanner (once per page)
    if (!BOOTED) startAll();
  }

  function startAll() {
    if (BOOTED) return;
    BOOTED = true;
    loadCfg();
    startLiqWS();
    // Initial scan after universe is fetched
    setTimeout(async () => {
      await refreshUniverse();
      tickWave();
    }, 3000);
    // 30s tick
    TICK = setInterval(tickWave, 30_000);
    // 15s feed "ago" refresh
    setInterval(() => {
      for (const id of Object.keys(S.cards)) {
        const feed = document.getElementById(`mm-feed-${id}`);
        if (feed && feed.children.length) renderCardFeed(id);
      }
    }, 15000);
    setStatus('LIVE');
    console.log('[MM] started · 5 cards active');
  }

  return { render, init, startAll, _S: S };
})();

/* ════════════════════════════════════════════════════════════
   BOOT BINDINGS
   ════════════════════════════════════════════════════════════ */
function bindTopbarUI() {
    const sel = $('refresh-interval');
    if (sel) {
        sel.value = String(state.refreshMs);
        sel.addEventListener('change', () => {
            state.refreshMs = parseInt(sel.value, 10) || 0;
            startAutoRefresh();
        });
    }
    const btn = $('refresh-now');
    if (btn) btn.addEventListener('click', () => refreshPrices());

    document.addEventListener('visibilitychange', () => {
        updateRefreshIndicator();
        if (!document.hidden) refreshPrices();
    });

    const libBtn = $('btn-library');
    if (libBtn) libBtn.addEventListener('click', () => {
        const lib = $('widget-library');
        if (lib.classList.contains('open')) closeLibrary();
        else { renderLibrary(); openLibrary(); }
    });

    const libClose = $('library-close');
    if (libClose) libClose.addEventListener('click', closeLibrary);

    const overlay = $('library-overlay');
    if (overlay) overlay.addEventListener('click', closeLibrary);

    const resetBtn = $('btn-reset');
    if (resetBtn) resetBtn.addEventListener('click', () => {
        if (!confirm('Reset layout to default?')) return;
        state.widgets = getDefaultLayout();
        saveState();
        renderGrid();
        toast('Layout reset to default');
    });

    const emptyCta = $('empty-cta');
    if (emptyCta) emptyCta.addEventListener('click', () => { renderLibrary(); openLibrary(); });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLibrary();
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            renderLibrary();
            openLibrary();
        }
    });
}

/* ════════════════════════════════════════════════════════════
   MINI SPARKLINE POPUP · տեղական · առանց iframe
   ════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════
   MINI SPARKLINE POPUP · տեղական · առանց iframe
   ════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════
   MINI SPARKLINE · floating tooltip · near cursor / touch
   ════════════════════════════════════════════════════════════ */
const miniWidget = (() => {
    let el, symEl, priceEl, chgEl, bodyEl;
    let currentSym = null;
    let fetchToken = 0;
    let hideTimer = null;
    let opened = false;
    let mobileMode = false;

    function init() {
        el      = document.getElementById('miniSpark');
        symEl   = document.getElementById('miniSparkSym');
        priceEl = document.getElementById('miniSparkPrice');
        chgEl   = document.getElementById('miniSparkChg');
        bodyEl  = document.getElementById('miniSparkBody');
        if (!el) return;

        /* Desktop · keep alive while hovering over the mini widget itself */
        el.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        el.addEventListener('mouseleave', () => { if (!mobileMode) scheduleHide(90); });

        /* Mobile · tap outside closes */
        document.addEventListener('touchstart', (e) => {
            if (!mobileMode || !opened) return;
            if (el.contains(e.target)) return;
            if (e.target.closest && e.target.closest('.clickable-ticker')) return;
            hide();
        }, { passive: true });
    }

    function scheduleHide(ms) {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => hide(), ms || 120);
    }

    /* Keep the tooltip inside viewport, offset from cursor */
    function place(x, y) {
        if (!el) return;
        const w = el.offsetWidth  || 280;
        const h = el.offsetHeight || 150;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const OFF = 14;

        let px = x + OFF;
        let py = y + OFF;
        if (px + w + 8 > vw) px = x - w - OFF;
        if (px < 8)          px = 8;
        if (py + h + 8 > vh) py = y - h - OFF;
        if (py < 8)          py = 8;

        el.style.transform = `translate3d(${px}px, ${py}px, 0) scale(${opened ? 1 : 0.96})`;
    }

    function hide() {
        if (!el) return;
        clearTimeout(hideTimer);
        el.classList.remove('show');
        opened = false;
        currentSym = null;
        fetchToken++;
    }

    async function open(symbol, x, y, mobile) {
        if (!el) return;

        let sym = String(symbol || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!sym) return;
        if (!sym.endsWith('USDT')) sym += 'USDT';

        mobileMode = !!mobile;

        /* Same symbol already visible → just move it */
        if (opened && currentSym === sym) {
            place(x, y);
            return;
        }

        /* New symbol → reset & fetch */
        const token = ++fetchToken;
        currentSym = sym;

        if (symEl)   symEl.textContent = sym.replace('USDT', '');
        if (priceEl) { priceEl.textContent = '--'; priceEl.style.color = 'var(--muted)'; }
        if (chgEl) {
            chgEl.textContent = '--';
            chgEl.style.color = 'var(--muted)';
            chgEl.style.background = 'transparent';
            chgEl.style.border = '1px solid var(--border)';
        }
        if (bodyEl) bodyEl.innerHTML = '<div class="mini-spark-loading">…</div>';

        /* Position first, then reveal */
        place(x, y);
        el.classList.add('show');
        opened = true;

        let mkt = null, klines = null;
        try {
            [mkt, klines] = await Promise.all([
                fetch(`${API.binance}/fapi/v1/ticker/24hr?symbol=${sym}`)
                    .then(r => r.json()).catch(() => null),
                fetch(`${API.binance}/fapi/v1/klines?symbol=${sym}&interval=1h&limit=48`)
                    .then(r => r.json()).catch(() => null)
            ]);
        } catch (_) {}

        if (token !== fetchToken) return;   // user moved to another ticker

        /* Header */
        if (mkt && !mkt.code) {
            const price = parseFloat(mkt.lastPrice);
            const chg   = parseFloat(mkt.priceChangePercent);
            const isUp  = chg >= 0;
            if (priceEl) {
                priceEl.textContent = '$' + fmtPrice(price);
                priceEl.style.color = isUp ? 'var(--up)' : 'var(--dn)';
            }
            if (chgEl) {
                chgEl.textContent = (isUp ? '+' : '') + chg.toFixed(2) + '%';
                chgEl.style.color      = isUp ? 'var(--up)' : 'var(--dn)';
                chgEl.style.background = isUp ? 'rgba(0,255,200,0.10)' : 'rgba(168,85,247,0.10)';
                chgEl.style.border     = isUp ? '1px solid rgba(0,255,200,0.25)' : '1px solid rgba(168,85,247,0.25)';
            }
        }

        /* Body */
        if (!Array.isArray(klines) || klines.length < 2) {
            if (bodyEl) bodyEl.innerHTML = '<div class="mini-spark-loading">NO DATA</div>';
            return;
        }

        const closes  = klines.map(k => parseFloat(k[4]));
        const volumes = klines.map(k => parseFloat(k[7]));   // ★ quote volume
        const isUp    = closes[closes.length - 1] >= closes[0];
        const color   = isUp ? '#00ffc8' : '#a855f7';

                if (bodyEl) bodyEl.innerHTML = sparkSVG(closes, {
            width: 280, height: 110,
            color: color,
            volumes: volumes,
            dot: true,
            precise: true          // ★ HubDL-style · 1 stop per candle + vertical fade
        });
    }

    return {
        init, open, hide, scheduleHide,
        isOpen: () => opened
    };
})();

/* ════════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════════ */
(async function boot() {
     miniWidget.init();
     loadTg();   // ★ TG config-ը load արա սկզբում
    console.log('%c v1.0 ', 'background:linear-gradient(90deg,#00ffd5,#0099ff);color:#000;padding:5px 12px;border-radius:5px;font-weight:900;letter-spacing:2px;');
       

    const loaded = loadState();
    if (!loaded || !state.widgets.length) {
        /* Առաջին անգամ → default layout */
        state.widgets = getDefaultLayout();
        saveState();
        try { localStorage.setItem(LAYOUT_VERSION_KEY, String(LAYOUT_VERSION)); } catch(e) {}
    } else {
        /* Բեռնված layout → migration ստուգում */
        if (migrateLayout()) {
            saveState();
            console.log('%c Layout migrated · new widgets injected ', 'background:#00ffd5;color:#000;padding:3px 8px;border-radius:4px;font-weight:800;');
        }
    }

    renderGrid();
    initDashboardDropZone();
    initTrashZone();
    bindTopbarUI();
    MM.startAll();

    
    await loadInitial();
    buildCorrelation();

    startAutoRefresh();
    setTimeout(refreshMacroLoop, 5000);
    setTimeout(refreshBTCSparkLoop, 10000);
    setTimeout(refreshCorrelationLoop, 60000);
    setTimeout(refreshSparkCacheLoop, 300000);
})();
