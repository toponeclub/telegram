<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Smart Crypto Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0a0a; --surface:#141414; --surface-light:#1f1f1f; --border:#333;
      --text:#e2e8f0; --muted:#94a3b8; 
      --accent:#3b82f6; --danger:#ef4444; --success:#10b981; --warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",sans-serif;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    
    /* Layout */
    .app-container { display: flex; height: 100%; }
    .sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 2; }
    .main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    
    /* Input Section */
    h2 { margin: 0 0 15px 0; font-size: 18px; font-weight: 600; display:flex; align-items:center; gap:8px;}
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input, textarea, select { 
      width: 100%; background: var(--surface-light); border: 1px solid var(--border); 
      color: var(--text); padding: 10px; border-radius: 6px; font-family: "IBM Plex Sans", sans-serif; font-size: 14px;
      transition: 0.2s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    
    .btn { 
      width: 100%; padding: 12px; border: none; border-radius: 6px; 
      font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px; }
    .btn-ghost:hover { color: var(--text); border-color: var(--text); }

    /* Notepad Area */
    .notepad-container { flex: 1; display: flex; flex-direction: column; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
    #notepad { flex: 1; resize: none; line-height: 1.5; font-family: "IBM Plex Mono", monospace; font-size: 13px; }

    /* Task List (Watchlist) */
    .header-bar { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,20,0.8); backdrop-filter: blur(10px); z-index: 10; }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: var(--surface-light); color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

    .tasks-wrapper { flex: 1; overflow-y: auto; padding: 20px; }
    .empty-state { text-align: center; color: var(--muted); margin-top: 100px; }

    .task-card { 
      background: var(--surface-light); border: 1px solid var(--border); border-radius: 8px; 
      padding: 15px; margin-bottom: 12px; position: relative; transition: transform 0.2s;
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
    }
    .task-card:hover { border-color: #444; transform: translateY(-1px); }
    .task-card.triggered { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }
    .task-card.paused { opacity: 0.6; }

    .coin-info { display: flex; align-items: baseline; gap: 8px; }
    .coin-name { font-weight: 700; font-size: 16px; }
    .coin-price { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 14px; }
    
    .target-info { margin-top: 8px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .target-val { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--text); }
    .dist-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #333; }
    
    .progress-track { height: 4px; background: #000; border-radius: 2px; margin-top: 10px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s; }
    
    .task-note { margin-top: 8px; font-size: 12px; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 8px; }

    .card-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .action-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; }
    .action-btn:hover { color: var(--text); }

    /* Settings Modal */
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index: 100; }
    .modal-content { background: var(--surface); padding: 20px; border-radius: 12px; width: 350px; border: 1px solid var(--border); }

    @media (max-width: 700px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 15px; }
      .notepad-container { display: none; } /* Скрыть блокнот на мобиле или сделать табом */
    }
  </style>
</head>
<body>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>⚙️ Telegram Settings</h2>
      <div class="input-group">
        <label>Bot Token</label>
        <input id="tgToken" type="password" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">
      </div>
      <div class="input-group">
        <label>Chat ID</label>
        <input id="tgChat" type="text" placeholder="-100123456789">
      </div>
      <div class="row">
        <button class="btn btn-ghost" onclick="testTg()">Test</button>
        <button class="btn btn-primary" onclick="saveSettings()">Save & Close</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="sidebar">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>🔔 New Alert</h2>
        <button class="btn-ghost" onclick="document.getElementById('settingsModal').style.display='flex'" style="width:auto; border:none;">⚙️</button>
      </div>

      <div class="input-group">
        <label>Coin Ticker</label>
        <div class="row">
          <input id="inpTicker" type="text" placeholder="BTC" oninput="this.value = this.value.toUpperCase()">
          <button class="btn-ghost" style="width:40px" title="Get Current Price" onclick="fetchCurrentPrice()">↓</button>
        </div>
      </div>
      
      <div class="input-group">
        <label>Target Price ($)</label>
        <input id="inpPrice" type="number" placeholder="98500" step="any">
      </div>

      <div class="input-group">
        <label>Note / Plan</label>
        <input id="inpNote" type="text" placeholder="Long retest, SL tight...">
      </div>

      <button class="btn btn-primary" onclick="addTask()">
        <span>+</span> ADD WATCH
      </button>

      <div class="notepad-container">
        <label style="font-size:12px; color:var(--muted); margin-bottom:5px;">📝 Global Scratchpad</label>
        <textarea id="notepad" placeholder="Write anything here... it saves automatically."></textarea>
      </div>
    </div>

    <div class="main-content">
      <div class="header-bar">
        <div style="font-weight:700;">Active Watchlist</div>
        <div class="status-badge">
          <div id="wsDot" class="dot"></div>
          <span id="wsStatus">Disconnected</span>
        </div>
      </div>

      <div id="taskList" class="tasks-wrapper">
        <div class="empty-state">No active alerts.<br>Add a coin to start monitoring.</div>
      </div>
    </div>
  </div>

  <audio id="alertSound" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3"></audio>

  <script>
    // --- STATE ---
    let tasks = [];
    let prices = {}; // Cache for latest prices
    let ws = null;
    const WS_URL = 'wss://fstream.binance.com/ws/!markPrice@arr@1s'; // Real-time futures prices

    // --- DOM ELEMENTS ---
    const q = (s) => document.querySelector(s);
    const sound = q('#alertSound');

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderTasks();
      connectWS();
      
      // Auto-save notepad on typing
      q('#notepad').addEventListener('input', (e) => {
        localStorage.setItem('globalNote', e.target.value);
      });
    });

    // --- DATA MANAGEMENT ---
    function loadData() {
      const savedTasks = localStorage.getItem('cryptoTasks');
      if (savedTasks) tasks = JSON.parse(savedTasks);
      
      const savedNote = localStorage.getItem('globalNote');
      if (savedNote) q('#notepad').value = savedNote;

      const savedTg = localStorage.getItem('tgSettings');
      if (savedTg) {
        const s = JSON.parse(savedTg);
        q('#tgToken').value = s.token;
        q('#tgChat').value = s.chat;
      }
    }

    function saveData() {
      localStorage.setItem('cryptoTasks', JSON.stringify(tasks));
    }

    function saveSettings() {
      const token = q('#tgToken').value.trim();
      const chat = q('#tgChat').value.trim();
      localStorage.setItem('tgSettings', JSON.stringify({ token, chat }));
      q('#settingsModal').style.display = 'none';
      alert('Settings saved!');
    }

    // --- WEBSOCKET ---
    function connectWS() {
      if (ws) ws.close();
      ws = new WebSocket(WS_URL);
      q('#wsStatus').innerText = 'Connecting...';
      q('#wsDot').className = 'dot';

      ws.onopen = () => {
        q('#wsStatus').innerText = 'Live Data';
        q('#wsDot').classList.add('connected');
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        // Data format: [{ s: symbol, p: markPrice }, ...]
        data.forEach(item => {
          prices[item.s] = parseFloat(item.p);
        });
        checkAlerts();
        updateUI();
      };

      ws.onclose = () => {
        q('#wsStatus').innerText = 'Disconnected';
        q('#wsDot').classList.remove('connected');
        setTimeout(connectWS, 3000);
      };
    }

    // --- CORE LOGIC ---
    function addTask() {
      let symbol = q('#inpTicker').value.trim().toUpperCase();
      const target = parseFloat(q('#inpPrice').value);
      const note = q('#inpNote').value;

      if (!symbol || isNaN(target)) {
        alert('Please enter Ticker and Target Price');
        return;
      }

      // Auto-add USDT if missing
      if (!symbol.endsWith('USDT')) symbol += 'USDT';

      // Determine current price for initial setup
      const currentPrice = prices[symbol] || target; // Fallback if no data yet
      const direction = target > currentPrice ? 'UP' : 'DOWN';

      const task = {
        id: Date.now(),
        symbol,
        target,
        entryPrice: currentPrice,
        note,
        direction,
        active: true,
        triggered: false
      };

      tasks.unshift(task);
      saveData();
      renderTasks();
      
      // Clear inputs
      q('#inpTicker').value = '';
      q('#inpPrice').value = '';
      q('#inpNote').value = '';
    }

    function fetchCurrentPrice() {
      let s = q('#inpTicker').value.toUpperCase();
      if (!s) return;
      if (!s.endsWith('USDT')) s += 'USDT';
      
      if (prices[s]) {
        q('#inpPrice').value = prices[s];
      } else {
        alert('Waiting for price data... ensure ticker is correct (e.g. BTC)');
      }
    }

    function checkAlerts() {
      let changed = false;
      tasks.forEach(task => {
        if (!task.active || task.triggered) return;
        
        const price = prices[task.symbol];
        if (!price) return;

        let hit = false;
        if (task.direction === 'UP' && price >= task.target) hit = true;
        if (task.direction === 'DOWN' && price <= task.target) hit = true;

        if (hit) {
          triggerTask(task, price);
          changed = true;
        }
      });
      if (changed) saveData();
    }

    function triggerTask(task, finalPrice) {
      task.triggered = true;
      task.active = false;
      
      // Calculate % change from entry
      const pnl = ((finalPrice - task.entryPrice) / task.entryPrice) * 100;
      const pnlStr = pnl > 0 ? `+${pnl.toFixed(2)}%` : `${pnl.toFixed(2)}%`;
      
      // Send Telegram
      sendTg(task.symbol, finalPrice, pnlStr, task.note);
      
      // Play sound
      sound.play().catch(e => console.log('Audio blocked'));
      
      renderTasks();
    }

    function toggleTask(id) {
      const t = tasks.find(x => x.id === id);
      if (t) {
        if (t.triggered) {
          // Resetting a triggered task
          t.triggered = false;
          t.active = true;
          // Re-evaluate direction based on CURRENT price
          const cur = prices[t.symbol] || t.target;
          t.direction = t.target > cur ? 'UP' : 'DOWN';
          t.entryPrice = cur; // Reset entry for new calc
        } else {
          t.active = !t.active;
        }
        saveData();
        renderTasks();
      }
    }

    function removeTask(id) {
      if(confirm('Delete this alert?')) {
        tasks = tasks.filter(x => x.id !== id);
        saveData();
        renderTasks();
      }
    }

    // --- UI RENDERING ---
    function updateUI() {
      // Just update dynamic parts (prices, progress bars) to save redraws
      tasks.forEach(task => {
        const curPrice = prices[task.symbol];
        if (!curPrice) return;
        
        // Update Price Text
        const card = document.getElementById(`card-${task.id}`);
        if(card) {
            const priceEl = card.querySelector('.live-price');
            if(priceEl) priceEl.innerText = `$${curPrice}`;
            
            // Update Progress Bar
            if(!task.triggered) {
                const totalDist = Math.abs(task.target - task.entryPrice);
                const covered = Math.abs(curPrice - task.entryPrice);
                let pct = (covered / totalDist) * 100;
                if (pct > 100) pct = 100;
                if (pct < 0) pct = 0;
                
                const bar = card.querySelector('.progress-fill');
                if(bar) bar.style.width = `${pct}%`;

                // Update Distance Badge
                const distPct = ((curPrice - task.target) / curPrice) * 100;
                const distEl = card.querySelector('.dist-val');
                if(distEl) distEl.innerText = `${Math.abs(distPct).toFixed(2)}% away`;
            }
        }
      });
    }

    function renderTasks() {
      const container = q('#taskList');
      if (tasks.length === 0) {
        container.innerHTML = '<div class="empty-state">No active alerts.<br>Add a coin to start monitoring.</div>';
        return;
      }

      container.innerHTML = tasks.map(t => {
        const isPaused = !t.active && !t.triggered;
        const statusClass = t.triggered ? 'triggered' : (isPaused ? 'paused' : '');
        const btnText = t.triggered ? '🔄 Restart' : (t.active ? '⏸ Pause' : '▶ Resume');
        const color = t.direction === 'UP' ? 'var(--success)' : 'var(--danger)';
        
        return `
        <div class="task-card ${statusClass}" id="card-${t.id}" style="border-left: 3px solid ${color}">
          <div>
            <div class="coin-info">
              <div class="coin-name">${t.symbol}</div>
              <div class="coin-price live-price">...</div>
            </div>
            
            <div class="target-info">
              <span>Target: <span class="target-val">$${t.target}</span></span>
              <span class="dist-badge dist-val">...</span>
            </div>

            ${t.note ? `<div class="task-note">${t.note}</div>` : ''}

            ${!t.triggered ? `
            <div class="progress-track">
              <div class="progress-fill" style="background:${color}"></div>
            </div>` : `<div style="margin-top:5px; color:var(--success); font-weight:bold; font-size:12px;">✅ TRIGGERED</div>`}
          </div>
          
          <div class="card-actions">
            <button class="action-btn" onclick="toggleTask(${t.id})" title="${btnText}">${t.triggered ? '🔄' : (t.active ? '⏸' : '▶')}</button>
            <button class="action-btn" onclick="removeTask(${t.id})" title="Delete" style="color:var(--danger)">×</button>
          </div>
        </div>
        `;
      }).join('');
      
      updateUI(); // Trigger immediate update of prices
    }

    // --- TELEGRAM ---
    async function sendTg(symbol, price, change, note) {
      const token = q('#tgToken').value;
      const chat = q('#tgChat').value;
      
      if (!token || !chat) return;

      const text = `🚨 <b>ALARM: ${symbol}</b>\n` +
                   `💰 Price: <b>$${price}</b>\n` +
                   `📈 Move: ${change}\n` +
                   `📝 Note: <i>${note || 'No note'}</i>`;

      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            chat_id: chat, 
            text: text, 
            parse_mode: 'HTML'
          })
        });
      } catch (e) {
        console.error('TG Error', e);
      }
    }

    async function testTg() {
      const token = q('#tgToken').value;
      const chat = q('#tgChat').value;
      if(!token || !chat) return alert('Enter Token and Chat ID');
      
      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ chat_id: chat, text: '✅ Test connection success!' })
        });
        alert('Message sent! Check Telegram.');
      } catch(e) {
        alert('Error sending message');
      }
    }
  </script>
</body>
</html>
