<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>MultiScan Pro Alligator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔻</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="scanner-communicator.js"></script>

  <style>
    :root{
      --bg:#0a0a0a; --surface:#111; --surface-light:#1a1a1a; --border:#222;
      --text:#e2e8f0; --muted:#94a3b8; --accent:#00d07a; --danger:#ef4444; --warn:#f59e0b;
      --blue:#3b82f6; --purple:#8b5cf6;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:auto; overflow-x: hidden;
  scrollbar-color: #2a2a2a #0a0a0a;
  scrollbar-width: thin;}
    .app{display:flex;flex-direction:column;height:100vh}
    .header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
    .logo{display:flex;gap:10px;align-items:center;cursor:pointer}
    .logo-text{font-weight:700;font-size:16px}
    .badge{background:var(--blue);color:#fff;padding:4px 8px;border-radius:6px;font-weight:700;font-size:12px}
    .controls{display:flex;gap:8px;align-items:center}
    .select, .btn {background:var(--surface-light);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px}
    .btn {cursor:pointer}
    .main{display:flex;flex:1;min-height:0}
    
    /* 🔥 ПАНЕЛИ С РЕСАЙЗОМ */
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 2px solid var(--border);
      min-width: 300px;
      overflow: hidden;
      position: relative;
    }
    
    .right{
      flex:0.45;
      display:flex;
      flex-direction:column;
      background:var(--surface);
      overflow:auto; 
      min-width: 400px;
      position: relative;
      min-height: 450px;
    }
    
    /* РЕСАЙЗЕРЫ */
    .resizer {
      position: absolute;
      background: var(--border);
      z-index: 100;
      opacity: 0.35;
    }
    
    .resizer.vertical {
      width: 4px;
      height: 100%;
      right: -2px;
      top: 0;
      cursor: col-resize;
      opacity: 0.35;
    }
    
    .resizer.horizontal {
      height: 4px;
      width: 100%;
      bottom: -2px;
      left: 0;
      cursor: row-resize;
    }
    
    .resizer:hover {
      background: var(--accent);
    }
    
    .overview{
      padding:12px;
      border-bottom:1px solid var(--border);
      overflow-y: auto;
      flex: 1;
    }
    
    .watchlist-table{width:100%;border-collapse:collapse}
    .coin-row{
      display:grid;
      grid-template-columns: 1fr 84px 80px 70px;
      gap:45px;
      align-items:center;
      padding:10px;
      border-radius:8px;
      margin-bottom:6px;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      cursor:pointer;
      border:1px solid transparent
    }
    .coin-row:hover{
      border-color:#2b2b2b;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent)
    }
    .coin-symbol{font-weight:700}
    .coin-price{font-family: 'IBM Plex Mono', monospace;font-size:13px}
    .small-muted{color:var(--muted);font-size:12px}
    .arrow{font-size:18px;width:22px;text-align:center}
    .arrow.up{color:var(--accent)}
    .arrow.down{color:var(--danger)}
    .arrow.flat{color:var(--warn)}
    .spark{
      width:98px;
      height:28px;
      border-radius:4px;
      display:block;
      opacity: 0.85;
    }
    
    .filterbar{
      display:flex;
      gap:8px;
      padding:4px 8px;
      background:var(--surface-light);
      border-radius:8px;
      margin-bottom:10px
    }
    .filter-btn{
      padding:6px 10px;
      border-radius:6px;
      background:transparent;
      border:1px solid var(--border);
      color:var(--muted);
      cursor:pointer
    }
    .filter-btn.active{
      border-color:var(--accent);
      color:var(--text);
      background:linear-gradient(180deg, rgba(0,208,122,0.06), transparent)
    }
   
    .filter-btn[data-filter="short"].active {
      border-color: #ff4b4b;
      color: #fff;
      background: linear-gradient(180deg, rgba(255,75,75,0.08), transparent);
    }

    /* ТРЕЙДИНГВЬЮ */
    .tradingview-section {
      flex: 0.70;
      min-height: 150px;
      max-height: 40vh;
      display: flex;
      flex-direction: column;
     
      position: relative;
    }

    .tradingview-container {
      flex: 1;
      background: var(--surface-light);
       height: 100%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .tradingview-widget {
      height: 100%;
      width: 100%;
    }

    .fullscreen-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(17, 17, 17, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .fullscreen-btn:hover {
      background: var(--surface-light);
    }

    /* ДЕТАЛЬНАЯ ПАНЕЛЬ */
    .detail-panel{
      padding:12px;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .detail-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    .detail-title{font-weight:700; font-size: 18px;}
    .detail-subtitle{color: var(--muted); font-size: 12px;}

    .signal-card{
      padding:12px;
      border-radius:8px;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      border:1px solid var(--border);
      cursor:pointer
    }

    .strength-bar{
      height:8px;
      background:var(--surface-light);
      border-radius:6px;
      overflow:hidden;
      margin-top:8px
    }
    
    .strength-fill{
      height:100%;
      background:linear-gradient(90deg,var(--danger),var(--warn),var(--accent));
      transition:width .4s
    }
    
    .log{
      padding:10px;
      height:160px;
      overflow:auto;
      background:var(--surface-light);
      border:1px solid var(--border);
      border-radius:8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size:12px
    }
    
    .mini-stats{
      display:flex;
      gap:8px;
      margin-top:8px
    }
    
    .stat{
      flex:1;
      padding:8px;
      background:var(--surface-light);
      border-radius:8px;
      border:1px solid var(--border);
      text-align:center
    }
    
    .header-right{display:flex;gap:8px;align-items:center}
    .help-btn{
      background:var(--surface-light);
      border:1px solid var(--border);
      padding:6px;
      border-radius:8px;
      cursor:pointer
    }
   
    /* СТАТУС СОЕДИНЕНИЯ */
    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      margin-left: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .connection-dot.connected {
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 6px;
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 1.5s infinite;
    }

    /* АНИМАЦИИ */
    .signal-pulse {
      animation: signalPulse 2s ease-in-out;
    }

    @keyframes signalPulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* ВКЛАДКИ */
    .tab-buttons {
      display: flex;
      gap: 6px;
      margin: 0 20px;
    }

    .tab-btn {
      padding: 8px 12px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: linear-gradient(180deg, rgba(0,208,122,0.06), transparent);
    }

    /* TELEGRAM */
    .telegram-section {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .telegram-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .telegram-input {
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .telegram-btn {
      width: 100%;
      padding: 8px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .telegram-btn:hover {
      background: var(--border);
    }

    .telegram-status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
    }

    .status-ok {
      color: var(--accent);
    }

    .status-error {
      color: var(--danger);
    }

    /* CHARTS PANEL */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      height: 100%;
      padding: 6px;
      background: var(--surface);
    }

    .chart-window {
      background: var(--surface-light);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      min-height: 200px;
    }

    /* АДАПТИВНОСТЬ */
    @media (max-width: 1000px) { 
      .right { width: 360px } 
      .left { min-width: 0 } 
    }
    
    @media (max-width: 760px) { 
      .main { flex-direction: column } 
      .right { width: 100%; height: 380px } 
      .left { border-right: none } 
      .tradingview-section { display: none; }
      .coin-row { gap: 20px; }
    }
  </style>
</head>

  <script>
  // ========== Config ==========
  const WATCHLIST = [
    "BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT","ADAUSDT",
    "SOLUSDT","DOGEUSDT","MATICUSDT","DOTUSDT","TRXUSDT",
    "LINKUSDT","LTCUSDT","BCHUSDT","AVAXUSDT","UNIUSDT", 
    "PEPEUSDT", "BONKUSDT", "INJUSDT", "APTUSDT"
  ];
  
  const DEFAULT_INTERVAL = '1m';
  const UPDATE_BATCH_MS = 10000; // 10 seconds
  const CANDLES_LIMIT = 100;
  
  // State
  let mode = 'dual';
  let interval = DEFAULT_INTERVAL;
  let isRunning = true;
  let watchers = {};
  let updateTimer = null;
  let tradingviewLoaded = false;
  let currentDetail = null;
  let tvWidget = null;
  let lastTelegramSignal = {};

  // Utils
  function q(id){return document.getElementById(id)}
  
  function addMainLog(text, cls='info'){
    const el = q('mainLog');
    const node = document.createElement('div');
    const t = new Date().toLocaleTimeString();
    node.innerHTML = `<span style="color:var(--muted)">[${t}]</span> ${text}`;
    el.appendChild(node);
    el.scrollTop = el.scrollHeight;
    while(el.children.length>200) el.removeChild(el.firstChild);
  }

  // 🔥 ОБНОВЛЕНИЕ СИГНАЛА
  function updateSignalIcon(sym) {
    const icon = q('signalIcon');
    const status = q('signalStatus');
    const watcher = watchers[sym];
    
    if (!watcher) {
      icon.textContent = '⚡';
      icon.style.color = 'var(--muted)';
      status.textContent = 'Select a coin';
      return;
    }

    const long = watcher.signalLong;
    const short = watcher.signalShort;
    const maxStrength = Math.max(long.strength || 0, short.strength || 0);

    if (long.action === 'BUY' && long.strength >= 70) {
      icon.textContent = '📈';
      icon.style.color = 'var(--accent)';
      status.textContent = `BUY SIGNAL • ${long.strength}%`;
    } else if (short.action === 'SELL' && short.strength >= 70) {
      icon.textContent = '📉';
      icon.style.color = 'var(--danger)';
      status.textContent = `SELL SIGNAL • ${Math.round(short.strength)}%`;
    } else {
      icon.textContent = '⚡';
      icon.style.color = 'var(--warn)';
      status.textContent = `AWAITING ENTRY ${Math.round(maxStrength)}%`;
    }
  }

  // СПАРКЛАЙНЫ
  function drawSpark(sym){
    const canvas = q(`spark-${sym}`);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.clientWidth * devicePixelRatio;
    const H = canvas.height = canvas.clientHeight * devicePixelRatio;
    ctx.clearRect(0,0,W,H);
    
    const pts = watchers[sym].sparkPoints || [];
    if(pts.length<2){
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 2*devicePixelRatio;
      ctx.beginPath(); 
      ctx.moveTo(2*devicePixelRatio,H/2); 
      ctx.lineTo(W-2*devicePixelRatio,H/2); 
      ctx.stroke();
      return;
    }
    
    const min = Math.min(...pts), max = Math.max(...pts);
    const len = pts.length;
    ctx.lineWidth = 2*devicePixelRatio;
    
    const slope = pts[pts.length-1] - pts[0];
    const styles = getComputedStyle(document.documentElement);
    const accentColor = styles.getPropertyValue('--accent').trim();
    const dangerColor = styles.getPropertyValue('--danger').trim(); 
    const warnColor = styles.getPropertyValue('--warn').trim();

    ctx.strokeStyle = slope>0 ? accentColor : slope<0 ? dangerColor : warnColor;
    
    ctx.beginPath();
    for(let i=0;i<len;i++){
      const x = (i/(len-1))*(W-4*devicePixelRatio) + 2*devicePixelRatio;
      const y = max===min ? H/2 : H - ((pts[i]-min)/(max-min))*(H-4*devicePixelRatio) - 2*devicePixelRatio;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  async function fetchCandles(symbol, intv, limit = CANDLES_LIMIT){
    try {
      const resp = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${intv}&limit=${limit}`);
      if (resp.ok) {
        const data = await resp.json();
        return data.map(d => ({
          ts: d[0], 
          open: +d[1], 
          high: +d[2], 
          low: +d[3], 
          close: +d[4], 
          vol: +d[5]
        }));
      }
    } catch (e) {
      console.log(`API недоступен для ${symbol}, используем симуляцию`);
    }

    // СИМУЛЯЦИЯ С РЕАЛИСТИЧНЫМИ ДАННЫМИ
    const arr = [];
    let lastPrice = watchers[symbol]?.lastPrice || (symbol === 'BTCUSDT' ? 50000 : 
                   symbol === 'ETHUSDT' ? 3000 : 
                   symbol === 'BNBUSDT' ? 600 : 100);
    
    for(let i = 0; i < limit; i++){
      const volatility = symbol === 'BTCUSDT' ? 0.002 : 0.004;
      const change = (Math.random() - 0.5) * (lastPrice * volatility);
      const close = Math.max(0.0001, lastPrice + change);
      
      arr.push({
        ts: Date.now() - (limit - i) * 60000,
        open: lastPrice,
        high: Math.max(lastPrice, close) * (1 + Math.random() * 0.01),
        low: Math.min(lastPrice, close) * (1 - Math.random() * 0.01),
        close: close,
        vol: Math.random() * 1000 + 100
      });
      lastPrice = close;
    }
    return arr;
  }

  // 🔥 ALLIGATOR + ATR STRATEGY FUNCTIONS
  function smma(data, length) {
    const out = [];
    let prev;
    for (let i = 0; i < data.length; i++) {
      const price = (data[i].high + data[i].low) / 2;
      if (i < length) {
        out.push(null);
      } else {
        if (prev === undefined) {
          // Calculate SMA for first value
          let sum = 0;
          for (let j = i - length + 1; j <= i; j++) {
            sum += (data[j].high + data[j].low) / 2;
          }
          prev = sum / length;
        } else {
          prev = (prev * (length - 1) + price) / length;
        }
        out.push(prev);
      }
    }
    return out;
  }

  function sma(data, length) {
    const out = [];
    for (let i = 0; i < data.length; i++) {
      if (i < length - 1) {
        out.push(null);
      } else {
        let sum = 0;
        for (let j = i - length + 1; j <= i; j++) {
          sum += (data[j].high + data[j].low) / 2;
        }
        out.push(sum / length);
      }
    }
    return out;
  }

  function calculateATR(data, period) {
    const atr = [];
    const tr = [];
    
    // Calculate True Range
    for (let i = 0; i < data.length; i++) {
      if (i === 0) {
        tr.push(data[i].high - data[i].low);
      } else {
        const val1 = data[i].high - data[i].low;
        const val2 = Math.abs(data[i].high - data[i-1].close);
        const val3 = Math.abs(data[i].low - data[i-1].close);
        tr.push(Math.max(val1, val2, val3));
      }
    }
    
    // Calculate ATR
    for (let i = 0; i < data.length; i++) {
      if (i < period - 1) {
        atr.push(null);
      } else if (i === period - 1) {
        let sum = 0;
        for (let j = 0; j < period; j++) {
          sum += tr[j];
        }
        atr.push(sum / period);
      } else {
        atr.push((atr[i-1] * (period - 1) + tr[i]) / period);
      }
    }
    
    return atr;
  }

  // 🔥 УЛУЧШЕННАЯ ГЕНЕРАЦИЯ СИГНАЛОВ С ALLIGATOR + ATR
  function generateSignalFor(symbol){
    const state = watchers[symbol];
    const candles = state.candles;
    
    if(!candles || candles.length < 34) return; // Need enough data for Alligator (13+8+5)

    
    
    try {
      // Calculate Alligator components
      const jaw = smma(candles, 13);
      const teeth = smma(candles, 8);
      const lips = smma(candles, 5);

      
      
      // Calculate ATR for stop-loss
      const atr = calculateATR(candles, 14);

      
      
      // Get current values
      const currentJaw = jaw[jaw.length - 1];
      const currentTeeth = teeth[teeth.length - 1];
      const currentLips = lips[lips.length - 1];
      const currentAtr = atr[atr.length - 1];
      const currentPrice = candles[candles.length - 1].close;

      
      
      // Get previous values for crossover detection
      const prevJaw = jaw.length > 1 ? jaw[jaw.length - 2] : currentJaw;
      const prevTeeth = teeth.length > 1 ? teeth[teeth.length - 2] : currentTeeth;
      const prevLips = lips.length > 1 ? lips[lips.length - 2] : currentLips;
      
      if (!currentJaw || !currentTeeth || !currentLips || !currentAtr) return;
      
      // ALLIGATOR STRATEGY LOGIC
      let long = { action: 'HOLD', strength: 0, desc: 'Alligator sleeping' };
      let short = { action: 'HOLD', strength: 0, desc: 'Alligator sleeping' };
      
      // Check for Alligator awakening (lines sorting properly)
      const alligatorAwake = currentLips > currentTeeth && currentTeeth > currentJaw;
      const alligatorAwakeBearish = currentLips < currentTeeth && currentTeeth < currentJaw;
      
      // Crossover signals
      const lipsCrossedAboveJaw = currentLips > currentJaw && prevLips <= prevJaw;
      const lipsCrossedBelowJaw = currentLips < currentJaw && prevLips >= prevJaw;
      const lipsCrossedAboveTeeth = currentLips > currentTeeth && prevLips <= prevTeeth;
      const lipsCrossedBelowTeeth = currentLips < currentTeeth && prevLips >= prevTeeth;
      
      // LONG SIGNAL: Alligator awakening + Lips crossing above
      if ((alligatorAwake || lipsCrossedAboveJaw || lipsCrossedAboveTeeth) && currentPrice > currentLips) {
        const baseStrength = alligatorAwake ? 70 : 60;
        const atrStrength = Math.min(20, (currentAtr / currentPrice) * 1000); // ATR contributes up to 20%
        const crossoverStrength = (lipsCrossedAboveJaw ? 10 : 0) + (lipsCrossedAboveTeeth ? 5 : 0);
        
        long = {
          action: 'BUY',
          strength: Math.min(95, baseStrength + atrStrength + crossoverStrength),
          desc: `Alligator ${alligatorAwake ? 'awake' : 'waking'} + Lips bullish crossover`
        };
      }
      
      // SHORT SIGNAL: Bearish Alligator + Lips crossing below
      if ((alligatorAwakeBearish || lipsCrossedBelowJaw || lipsCrossedBelowTeeth) && currentPrice < currentLips) {
        const baseStrength = alligatorAwakeBearish ? 70 : 60;
        const atrStrength = Math.min(20, (currentAtr / currentPrice) * 1000);
        const crossoverStrength = (lipsCrossedBelowJaw ? 10 : 0) + (lipsCrossedBelowTeeth ? 5 : 0);
        
        short = {
          action: 'SELL', 
          strength: Math.min(95, baseStrength + atrStrength + crossoverStrength),
          desc: `Alligator ${alligatorAwakeBearish ? 'bearish' : 'turning'} + Lips bearish crossover`
        };
      }

      
      
      // UPDATE STATE
      if (long.action === 'BUY') state.lastLong = 'BUY';
      if (short.action === 'SELL') state.lastShort = 'SELL';
      
      state.signalLong = long;
      state.signalShort = short;
      
      const pts = candles.slice(-20).map(c => c.close);
      state.sparkPoints = pts;
      state.lastPrice = currentPrice;



      // TELEGRAM ALERTS
      if ((long.strength > 75 && long.action === 'BUY') || (short.strength > 75 && short.action === 'SELL')) {
        const signalType = long.strength > short.strength ? 'LONG' : 'SHORT';
        const strength = Math.max(long.strength, short.strength);
        
        const signalKey = `${symbol}_${signalType}`;
        if (!lastTelegramSignal[signalKey] || lastTelegramSignal[signalKey] < strength - 5) {
          sendTelegramSignal(symbol, signalType, strength, currentPrice, currentAtr);
          lastTelegramSignal[signalKey] = strength;
        }
      }
      
    } catch (error) {
      console.error(`Error in Alligator strategy for ${symbol}:`, error);
    }
  }

  

  // 🔥 MISSING FUNCTIONS THAT WERE REMOVED BUT STILL NEEDED
  function calcRSI(closes, period=14){
    if(closes.length<period+1) return Array(closes.length).fill(50);
    const gains=[], losses=[];
    for(let i=1;i<closes.length;i++){ 
      const d=closes[i]-closes[i-1]; 
      gains.push(Math.max(d,0)); 
      losses.push(Math.max(-d,0)); 
    }
    let avgG = gains.slice(0,period).reduce((a,b)=>a+b,0)/period;
    let avgL = losses.slice(0,period).reduce((a,b)=>a+b,0)/period;
    const rsi = new Array(closes.length).fill(50);
    for(let i=period;i<closes.length;i++){
      avgG = ((avgG*(period-1))+gains[i-1])/period;
      avgL = ((avgL*(period-1))+losses[i-1])/period;
      const rs = avgL===0?100:avgG/avgL;
      rsi[i] = 100 - (100/(1+rs));
    }
    return rsi;
  }

  function calcStochRsi(candles, rsiLen=14, stochLen=14){
    const closes = candles.map(c=>c.close);
    const rsiArr = calcRSI(closes, rsiLen);
    if(rsiArr.length<stochLen) return {k:50,d:50};
    const recent = rsiArr.slice(-stochLen);
    const cur = rsiArr[rsiArr.length-1];
    const low = Math.min(...recent), high = Math.max(...recent);
    const k = high===low?50:((cur-low)/(high-low))*100;
    const d = k;
    return {k,d};
  }

  async function scanLoop(){

    try {
      const promises = WATCHLIST.map(async (sym) => {
        try {
          const candles = await fetchCandles(sym, interval, CANDLES_LIMIT);
          
          if (!candles || candles.length === 0) {
            console.warn(`No data for ${sym}`);
            return;
          }
          
          const lastCandle = candles[candles.length - 1];
          if (!lastCandle || !lastCandle.close) return;
          
          watchers[sym].candles = candles;
          watchers[sym].lastPrice = lastCandle.close;
          generateSignalFor(sym);
          renderRow(sym);
          
        } catch (err) {
          console.error(`Error for ${sym}:`, err);
        }
      });

      await Promise.all(promises);
      refreshWatchlist();
      
      // ОБНОВЛЕНИЕ ДЕТАЛЕЙ ЕСЛИ ОТКРЫТЫ
      if (currentDetail && watchers[currentDetail]) {
        const watcher = watchers[currentDetail];
        q('detailPrice').textContent = watcher.lastPrice ? `$${watcher.lastPrice.toFixed(2)}` : '--';
        
        if(watcher.candles && watcher.candles.length > 0){
          const stoch = calcStochRsi(watcher.candles);
          q('detailRsi').textContent = Math.round(stoch.k);
        }
        
        const maxStrength = Math.max(watcher.signalLong.strength || 0, watcher.signalShort.strength || 0);
        q('detailStrength').textContent = `${Math.round(maxStrength)}%`;
        q('detailStrengthFill').style.width = `${maxStrength}%`;
      }
      
    } catch (error) {
      console.error('Scan error:', error);
    }
    
    if (isRunning) {
      updateTimer = setTimeout(scanLoop, UPDATE_BATCH_MS);
    }
  }

  function sortActiveByStrength() {

    const visibleRows = Array.from(container.querySelectorAll('.coin-row[style*="display: grid"]'));
    
    // Сортируем только видимые (активные) строки по силе сигнала (по убыванию)
    visibleRows.sort((a, b) => {
        const symA = a.id.replace('row-', '');
        const symB = b.id.replace('row-', '');
        const watcherA = watchers[symA];
        const watcherB = watchers[symB];
        
        // Вычисляем максимальную силу сигнала для каждого символа
        const strengthA = Math.max(
            watcherA?.signalLong?.strength || 0, 
            watcherA?.signalShort?.strength || 0
        );
        const strengthB = Math.max(
            watcherB?.signalLong?.strength || 0, 
            watcherB?.signalShort?.strength || 0
        );
        
        return strengthB - strengthA; // По убыванию
    });
    
    // Перемещаем отсортированные строки обратно в контейнер
    visibleRows.forEach(row => container.appendChild(row));
  }

  // 🔥 РЕСАЙЗИНГ ПАНЕЛЕЙ
  function initResizeHandlers() {
    const leftPanel = document.querySelector('.left');
    const rightPanel = document.querySelector('.right');
    const tradingViewSection = document.querySelector('.tradingview-section');
    const overviewSection = document.querySelector('.overview');
    
    const verticalResizer = document.querySelector('.resizer.vertical');
    const horizontalResizer = document.querySelector('.resizer.horizontal');
    
    let isVerticalResizing = false;
    let isHorizontalResizing = false;
    
    // ВЕРТИКАЛЬНЫЙ РЕСАЙЗ (лево-право)
    verticalResizer.addEventListener('mousedown', function(e) {
      isVerticalResizing = true;
      document.addEventListener('mousemove', handleVerticalResize);
      document.addEventListener('mouseup', stopVerticalResize);
      e.preventDefault();
    });
    
    function handleVerticalResize(e) {
      if (!isVerticalResizing) return;
      
      const containerRect = document.querySelector('.main').getBoundingClientRect();
      const leftWidth = ((e.clientX - containerRect.left) / containerRect.width) * 100;
      
      if (leftWidth > 20 && leftWidth < 80) {
        leftPanel.style.flex = `0 0 ${leftWidth}%`;
        rightPanel.style.flex = `0 0 ${100 - leftWidth}%`;
      }
    }
    
    function stopVerticalResize() {
      isVerticalResizing = false;
      document.removeEventListener('mousemove', handleVerticalResize);
      document.removeEventListener('mouseup', stopVerticalResize);
    }
    
    // ГОРИЗОНТАЛЬНЫЙ РЕСАЙЗ (верх-низ в левой панели)
    horizontalResizer.addEventListener('mousedown', function(e) {
      isHorizontalResizing = true;
      document.addEventListener('mousemove', handleHorizontalResize);
      document.addEventListener('mouseup', stopHorizontalResize);
      e.preventDefault();
    });
    
    function handleHorizontalResize(e) {
      if (!isHorizontalResizing) return;
      
      const leftRect = leftPanel.getBoundingClientRect();
      const tvHeight = ((e.clientY - leftRect.top) / leftRect.height) * 100;
      
      if (tvHeight > 10 && tvHeight < 50) {
        tradingViewSection.style.flex = `0 0 ${tvHeight}%`;
        overviewSection.style.flex = `0 0 ${100 - tvHeight}%`;
      }
    }
    
    function stopHorizontalResize() {
      isHorizontalResizing = false;
      document.removeEventListener('mousemove', handleHorizontalResize);
      document.removeEventListener('mouseup', stopHorizontalResize);
    }
  }

// Инициализация коммуникатора
const warRoomComms = new ScannerCommunicator('alligator');

// Функция отправки сигналов в War Room
function sendToWarRoom(symbol, signal, price, timeframe) {
    if (signal.strength >= 91) {
        const signalData = {
            coin: symbol,
            direction: signal.action === 'BUY' ? 'LONG' :  'SHORT',
            confidence: signal.strength,
            price: price,
            timeframe: timeframe,
            strength: signal.strength,
            volume: 0,
            message: signal.desc,
            probability: signal.strength,
            score: signal.strength
        };
        
        const success = warRoomComms.sendSignal(signalData);
        if (success) {
            console.log(`📤 [War Room] ${signal.action} signal sent for ${symbol}`);
        }
    }
}

// Модифицируем функцию generateSignalFor для отправки сигналов
const originalGenerateSignalFor = generateSignalFor;
generateSignalFor = function(symbol) {
    originalGenerateSignalFor(symbol);
    
    const state = watchers[symbol];
    if (!state) return;
    
    // Проверяем LONG сигнал
    if (state.signalLong && state.signalLong.action === 'BUY' && state.signalLong.strength >= 73) {
        setTimeout(() => sendToWarRoom(symbol, state.signalLong, state.lastPrice, interval), 100);
    }
    
    // Проверяем SHORT сигнал
    if (state.signalShort && state.signalShort.action === 'SELL' && state.signalShort.strength >= 73) {
        setTimeout(() => sendToWarRoom(symbol, state.signalShort, state.lastPrice, interval), 100);
    }
};
