<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIND // Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --accent: #00ffd5;
    --bg-deep: #030303;
    --text-main: #ffffff;
    --text-muted: #666666;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 213, 0.05) 0%, transparent 50%),
        linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
}
.card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, rgba(0,0,0,0.2) 100%);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 22px;
    padding: 50px 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 255, 213, 0.08);
    border: 1px solid rgba(0, 255, 213, 0.2);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 50px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 25px;
}
.badge .dot {
    width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 8px var(--accent); animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
.title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 15px;
    text-transform: uppercase;
}
.desc {
    color: var(--text-muted);
    font-size: 0.85rem;
    line-height: 1.6;
    margin-bottom: 35px;
}
.form-group {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}
.email-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 0 16px;
    color: var(--text-main);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    height: 48px;
    outline: none;
    transition: all 0.3s;
}
.email-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 255, 213, 0.08);
}
.email-input::placeholder { color: var(--text-muted); }
.submit-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 0 24px;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    height: 48px;
}
.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 255, 213, 0.15);
    filter: brightness(1.1);
}
.back-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}
.back-btn:hover { color: var(--text-main); }
#success-msg {
    display: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 30px;
    padding: 14px;
    background: rgba(0, 255, 213, 0.08);
    border-radius: 12px;
    border: 1px solid rgba(0, 255, 213, 0.2);
}
</style>
</head>
<body>

<div class="card">
    <div class="badge"><div class="dot"></div> In Development</div>
    <h1 class="title">Module Offline</h1>
    <p class="desc">Leave your email to be the first to know when the module opens.</p>
    
    <div id="success-msg"><i class="fa-solid fa-check"></i> SIGNAL RECEIVED</div>
    
    <!-- Hetagayum sa Cloudflare Worker-i URL-ov kpoxarinq action-y -->
    <form class="form-group" id="notifyForm" onsubmit="submitEmail(event)">
        <input type="email" name="email" class="email-input" id="emailInput" placeholder="ENTER EMAIL..." required>
        <button type="submit" class="submit-btn">Notify</button>
    </form>

    <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Return</a>
</div>

<script>
async function submitEmail(e) {
    e.preventDefault();
    const input = document.getElementById('emailInput');
    const form = document.getElementById('notifyForm');
    const msg = document.getElementById('success-msg');
    
    if(!input.value) return;

    /* 
      Aystegh hetagayum kmiacnenq Cloudflare Worker-i endpoint-y:
      
      const response = await fetch('https://qo-worker.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: input.value })
      });
      if(response.ok) { ... }
    */

    form.style.display = 'none';
    msg.style.display = 'block';
}
</script>

</body>
</html>
