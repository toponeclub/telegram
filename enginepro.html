/* ═══════════════ AUTO AREA (zoom-out) ═══════════════ */
/* ═══════════════ AUTO AREA (zoom-out) ═══════════════ */
/* ═══════════════ AUTO AREA (smooth crossfade) ═══════════════ */
/* ═══════════════ AUTO AREA · pure crossfade ═══════════════ */
const _C_UP = [0, 255, 200];
const _C_DN = [168, 85, 247];
/* const _AREA_COLOR = [46, 127, 208]; */  // #2E7FD0.  
/* const _AREA_COLOR = [51, 102, 255]; */  // #3366FF · Royal Blue
/* const _AREA_COLOR = [41, 98, 255]; */   // #2962FF
const _AREA_COLOR = [0, 136, 255];   // #0088FF


let _autoAnim = 0;

function _rgba(c, a){
  a = Math.max(0, Math.min(1, a));
  return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
}

/* easeInOutCubic — smooth, no "snap" at endpoints */
function _ease(t){
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}

function _ensureAutoSeries(){
  if(S._autoS) return true;
  if(!S.charts.main || !S.prices.length) return false;
  try{
    S._autoS = S.charts.main.addAreaSeries({
  lineColor:'rgba(59,130,246,0)',
  topColor:'rgba(59,130,246,0)',
  bottomColor:'rgba(59,130,246,0)',
      lineWidth:2,
      priceFormat:{ type:'custom', formatter:fmtP, minMove:1e-8 },
      lastValueVisible:false,
      priceLineVisible:false,
      crosshairMarkerVisible:true
    });
    S._autoS.setData(S.prices.map(p => ({ time:p.time, value:p.close })));
    return true;
  }catch(e){ S._autoS = null; return false; }
}

/* heiken source data — preserve transformed OHLC during transition */
function _candleSourceData(){
  if(S.style !== 'heiken') return S.prices;
  const ha = [];
  S.prices.forEach((p,i)=>{
    if(i===0){ ha.push({ time:p.time, open:p.open, high:p.high, low:p.low, close:p.close }); return; }
    const prev = ha[i-1];
    const o = (prev.open + prev.close) / 2;
    const cl = (p.open + p.high + p.low + p.close) / 4;
    ha.push({ time:p.time, open:o, high:Math.max(p.high,o,cl), low:Math.min(p.low,o,cl), close:cl });
  });
  return ha;
}

/* Precompute all keyframes once — no GC churn mid-animation */
function _buildFrames(startT, targetT, N_FRAMES){
  const src = _candleSourceData();
  const N = src.length;
  const isHollow = S.style === 'hollow';
  const goingUp = targetT > startT;
  const frames = [];

  for(let f = 0; f <= N_FRAMES; f++){
    const rawP = f / N_FRAMES;
    const t = startT + (targetT - startT) * _ease(rawP);

    let candleA, areaA;
    if(goingUp){
      // FORWARD (candle → area): անփոփոխ, ինչպես հավանել ես
      candleA = Math.max(0, 1 - t);
      areaA   = Math.max(0, t);
    } else {
      // REVERSE (area → candle):
      //   area:   pow(t, 0.35)  — fade-out-ը ~40% ավելի դանդաղ (նախ 0.5 էր)
      //   candle: pow(1-t, 0.625) — fade-in-ը ~25% ավելի դանդաղ (նախ 0.5 էր)
      // Երկուսն էլ mid-ում 0.6–0.8-ի սահմաններում → ոչ մի դատարկ պահ
      
  // REVERSE (area → candle):
  //   area:   pow(t, 0.30)    — fade-out ~15% դանդաղ (նախ 0.35 էր)
  //   candle: pow(1-t, 0.75)  — fade-in ~25% դանդաղ (նախ 0.625 էր)
  candleA = Math.pow(Math.max(0, 1 - t), 0.75);
  areaA   = Math.pow(Math.max(0, t),     0.30);
}
    

    const candleData = new Array(N);
    for(let i = 0; i < N; i++){
      const bar = src[i];
      const isUp = bar.close >= bar.open;
      const col = isUp ? _C_UP : _C_DN;
      const colorStr = _rgba(col, candleA);
      candleData[i] = {
        time: bar.time, open: bar.open, high: bar.high, low: bar.low, close: bar.close,
        color:       isHollow ? 'rgba(0,0,0,0)' : colorStr,
        borderColor: colorStr,
        wickColor:   colorStr
      };
    }

    /* Volume is CONSTANT — no fade, always visible */
const volData = S.prices.map(p => ({
  time: p.time, value: p.volume,
  color: C.VOL
}));

    frames.push({ rawP, candleData, volData, areaA });
  }
  return frames;
}

function _restoreCandleStyle(){
  if(!S.series.candle) return;
  try{ S.series.volume.applyOptions({ visible:true }); }catch(e){}

  if(S.style === 'hollow'){
    try{
      S.series.candle.applyOptions({
        upColor:'transparent', borderUpColor:C.UP, wickUpColor:C.UP,
        downColor:'transparent', borderDownColor:C.DN, wickDownColor:C.DN,
        borderVisible:true, visible:true,
lastValueVisible:true, priceLineVisible:true, priceLineColor: C.UP
      });
      S.series.candle.setData(S.prices);
    }catch(e){}
  } else if(S.style === 'heiken'){
    try{
      S.series.candle.applyOptions({
        upColor:C.UP, downColor:C.DN,
        wickUpColor:C.UP, wickDownColor:C.DN,
        borderVisible:false, visible:true,
        lastValueVisible:true, priceLineVisible:true, priceLineColor: C.UP
      });
      S.series.candle.setData(_candleSourceData());
    }catch(e){}
  } else {
    try{
      S.series.candle.applyOptions({
        upColor:C.UP, downColor:C.DN,
        wickUpColor:C.UP, wickDownColor:C.DN,
        borderVisible:false, visible:true,
       lastValueVisible:true, priceLineVisible:true, priceLineColor: C.UP
      });
      S.series.candle.setData(S.prices);
    }catch(e){}
  }
  if(S.series.volume){
    try{ S.series.volume.setData(S.prices.map(p => ({ time:p.time, value:p.volume, color:C.VOL }))); }catch(e){}
  }
}

function _finalize(target){
  if(target >= 0.5){
    /* ═ AREA mode ═
       - Data-ն reset անում ենք մաքուր OHLC-ի (առանց per-bar գույների)
       - Series-ի գույները դարձնում ենք transparent applyOptions-ով
       - visible / lastValueVisible / priceLineVisible = true ՄՆՈՒՄ ԵՆ
       - Price line, label, alerts-ները → ամբողջովին անփոփոխ */

    try{
      S.series.candle.setData(S.prices.map(p => ({
        time:p.time, open:p.open, high:p.high, low:p.low, close:p.close
      })));
      S.series.candle.applyOptions({
        upColor:'rgba(0,0,0,0)',
        downColor:'rgba(0,0,0,0)',
        borderUpColor:'rgba(0,0,0,0)',
        borderDownColor:'rgba(0,0,0,0)',
        wickUpColor:'rgba(0,0,0,0)',
        wickDownColor:'rgba(0,0,0,0)',
        borderVisible:false,
        visible:true,
        lastValueVisible:true,
        priceLineVisible:true,
        priceLineColor: C.UP
      });
    }catch(e){}
    try{ S.series.volume.applyOptions({ visible:true }); }catch(e){}
    if(S._autoS){
      try{
        S._autoS.applyOptions({
          lineColor: _rgba(_AREA_COLOR, 1),
          topColor: _rgba(_AREA_COLOR, 0.28),
          bottomColor: _rgba(_AREA_COLOR, 0.01)
        });
      }catch(e){}
    }
    S._autoArea = true;
  } else {
    if(S._autoS){
      try{ S.charts.main.removeSeries(S._autoS); }catch(e){}
      S._autoS = null;
    }
    _restoreCandleStyle();
    S._autoArea = false;
  }

}

function _cancelAutoAnim(){
  if(_autoAnim){ cancelAnimationFrame(_autoAnim); _autoAnim = 0; }
}

function _animTo(target, dur = 550){
  if(!S.charts.main || !S.series.candle || !S.prices.length) return;
  if(target > 0 && !_ensureAutoSeries()) return;

  _cancelAutoAnim();

  const startT = S._autoT || 0;
  const dist = Math.abs(target - startT);
  if(dist < 0.02){ _finalize(target); S._autoT = target; return; }

  const actualDur = Math.max(260, dur * dist);
  const N_FRAMES = 30;
  const frames = _buildFrames(startT, target, N_FRAMES);

  /* *** BUG FIX ***  Երկու layer-ներն էլ պետք է VISIBLE լինեն անիմացիայի
     ընթացքում։ setData()-ն hidden series-ի վրա ոչինչ չի ռենդերում,
     անկախ alpha-ից։ Ահա թե ինչու էր առաջանում «դատարկ պատուհան»։ */
  /* Մոմիկների series-ը մնում է ամբողջովին կենդանի.
   Մենք միայն գույներով ենք fade անում setData-ով։ */
/* Մոմիկների series-ը մնում է ամբողջովին կենդանի.
   Մենք միայն գույներով ենք fade անում setData-ով։ */
try{
  S.series.candle.applyOptions({
    visible:true,
    lastValueVisible:true,
    priceLineVisible:true,
    priceLineColor: C.UP
  });
}catch(e){}

  try{ S.series.volume.applyOptions({ visible:true }); }catch(e){}
  if(S._autoS){ try{ S._autoS.applyOptions({ lastValueVisible:false }); }catch(e){} }

  const t0 = performance.now();
  let lastIdx = -1;

  const step = (now) => {
    const rawP = Math.min(1, (now - t0) / actualDur);
    const idx = Math.min(N_FRAMES, Math.floor(rawP * N_FRAMES));

    if(idx !== lastIdx){
      lastIdx = idx;
      const f = frames[idx];
      S._autoT = startT + (target - startT) * _ease(f.rawP);

      try{ S.series.candle.setData(f.candleData); }catch(e){}
      try{ S.series.volume.setData(f.volData); }catch(e){}

    if(S._autoS){
  try{
    S._autoS.applyOptions({
      lineColor:   _rgba(_AREA_COLOR, f.areaA),
      topColor:    _rgba(_AREA_COLOR, f.areaA * 0.28),
      bottomColor: _rgba(_AREA_COLOR, f.areaA * 0.01)
    });
  }catch(e){}
}
    }

    if(rawP < 1){
      _autoAnim = requestAnimationFrame(step);
    } else {
      _autoAnim = 0;
      S._autoT = target;
      _finalize(target);
    }
  };
  _autoAnim = requestAnimationFrame(step);
}

function applyAutoArea(){   _animTo(1, 1050); }   // fade-in · 3.3x դանդաղ
function removeAutoArea(){  _animTo(0, 800); }   // fade-out · ՆՈՒՅՆ տևողություն

function checkAutoStyle(){
  if(!S.charts.main || !S.series.candle) return;

  if(S.style === 'line' || S.style === 'area'){
    if(S._autoS || S._autoArea){ removeAutoArea(); }
    return;
  }

  let range;
  try{ range = S.charts.main.timeScale().getVisibleLogicalRange(); }catch(e){ return; }
  if(!range) return;

  const cw = ($('#c-main')?.clientWidth) || 800;
  const visibleBars = range.to - range.from;
  if(visibleBars <= 0) return;

  const barSpacing = cw / visibleBars;
  const TO_AREA   = 1.8;
  const TO_CANDLE = 2.8;

  if(!S._autoArea && barSpacing < TO_AREA){
    S._autoArea = true;
    applyAutoArea();
  } else if(S._autoArea && barSpacing > TO_CANDLE){
    S._autoArea = false;
    removeAutoArea();
  }
}

let _autoRaf = 0;
function scheduleAutoCheck(){
  if(_autoRaf) return;
  _autoRaf = requestAnimationFrame(() => {
    _autoRaf = 0;
    checkAutoStyle();
  });
}

async function handleExternalSnap(d) {
    /* 
      d object-i mej spasum enq stanalu hetevyal tvyalnern (inch vor kuxarken):
      - d.symbol (orinak 'BTC')
      - d.tf     (orinak '15m')
      - d.panels (orinak ['oi', 'oid', 'bsd'])
      - d.tg_token u d.tg_chat (ete pahanjvum a uxarkel)
      - d.caption (text)
    */
    console.log('[EXTERNAL_SNAP] Stacvec tvyalnerov:', d);

    try {
        const symbol = String(d.symbol || 'BTC').toUpperCase().replace(/[^A-Z0-9]/g, '');
        const tf = d.tf || '5m';
        
        // 1. Ete sym kam tf poxvel en, kanchum enq reload (kam tvyalneri tarmacum)
        if (symbol + 'USDT' !== S.symbol || tf !== S.tf) {
            S.symbol = symbol + 'USDT';
            S.tf = tf;
            const ci = document.getElementById('ci');
            if (ci) ci.value = symbol;
            document.querySelectorAll('#tfs .tf').forEach(b => {
                b.classList.toggle('active', b.dataset.tf === tf);
            });
            await reload(); // Spasum enq minchev nor tvyalnery qashvi
        }

        // 2. Ete pahanjvum en hatuk panelner (kam inch vor kargavorumner)
        if (Array.isArray(d.panels)) {
            // Ete uzum es pahanjvats panelnery bacven
            Object.keys(S.panels).forEach(t => { try { removePanel(t); } catch(e){} });
            d.panels.forEach(t => {
                if (PDEF[t]) {
                    try { addPanel(t, { silent: true, height: 100 }); } catch(e){}
                }
            });
            await new Promise(r => setTimeout(r, 400));
        }

        // 3. Spasum enq vor chart-y render lini
        await new Promise(r => setTimeout(r, 800));

        // 4. Nkarum enq (Screenshot)
        const { el, hide } = getSnapshotTarget();
        hide.forEach(x => x && (x.style.display = 'none'));

        let blob;
        try {
            const cv = await html2canvas(el, {
                backgroundColor: '#0d1017',
                scale: 2,
                logging: false,
                useCORS: true,
                width: el.clientWidth,
                height: el.clientHeight,
            });
            blob = await new Promise(r => cv.toBlob(r, 'image/png'));
        } finally {
            hide.forEach(x => x && (x.style.display = ''));
            updateAlertLabel();
        }

        if (!blob) throw new Error('Blob-n chstacvec');

        // 5. Uxarkum enq Telegram (kam veradardznum enq)
        if (d.tg_token && d.tg_chat) {
            const fd = new FormData();
            fd.append('chat_id', d.tg_chat);
            fd.append('photo', blob, 'external_snap.png');
            if (d.caption) fd.append('caption', d.caption);
            fd.append('parse_mode', 'HTML');

            const res = await fetch(`https://api.telegram.org/bot${d.tg_token}/sendPhoto`, {
                method: 'POST', body: fd
            });
            const json = await res.json();
            console.log('[EXTERNAL_SNAP] TG Response:', json);
        } else {
            // Ete token chka, vorpes download (testi hamar)
            const a = document.createElement('a');
            a.download = `external_${symbol}_${tf}.png`;
            a.href = URL.createObjectURL(blob);
            a.click();
        }

    } catch (err) {
        console.error('[EXTERNAL_SNAP Error]:', err);
    }
}

/* ═══════════════════════════════════════════════════════════════════
   SILENT TAB KEEPER · keeps tab alive via silent audio
   — Chrome/Firefox treat tabs with audio as ACTIVE
   — rAF + setTimeout work normally when "playing"
   ═══════════════════════════════════════════════════════════════════ */
let _keepAliveCtx = null;

function startTabKeepAlive() {
  if (_keepAliveCtx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    _keepAliveCtx = new AC();
    /* 1-sample silent buffer, looped forever */
    const buf = _keepAliveCtx.createBuffer(1, 1, 22050);
    const src = _keepAliveCtx.createBufferSource();

    const PAGE = 1000, MAX_PAGES = 120, PAR = 5;
const cutoffMs = Date.now() - 240 * 60 * 1000;   // max 4 hour
    const getJson = async (u) => {
      try {
        const r = await fetch(u);
        if (!r.ok) return null;

    if (!latest || !latest.length) return [];
    const out = latest.slice();
    let oldestId = latest[0].a, oldestT = latest[0].T, pages = 1;

    while (pages < MAX_PAGES && oldestT > cutoffMs && oldestId > 0){
      const ids = [];
      for (let k = 1; k <= PAR; k++){
        const from = oldestId - PAGE * k;
        if (from < 0) { if (k === 1) ids.push(0); break; }

        price: parseFloat(t.p),
        qty: parseFloat(t.q),
        side: t.m ? 'S' : 'B',
      });
      if (t.a > state.lastAggId) state.lastAggId = t.a;
    }
    list.sort((a,b) => a.id - b.id);
    state.trades = list;
    if (state.trades.length > 120000) state.trades.splice(0, state.trades.length - 120000);
  }

  function buildCVD(klines){
    state.cvdHistory = [];
    let cum = 0;
    for (const bar of klines){
      const delta = bar.takerBuy - bar.takerSell;
      cum += delta;
      state.cvdHistory.push({ time: bar.time, value: cum });
    }
    state.cvd = cum;
  }

  // ═══ ENABLE / DISABLE / REFETCH ═══
  async function enable(){
    if (state.enabled || state.loading) return;
    state.loading = true;
    state.enabled = true;
    setButtonMode('loading');

    try {
      state.canvas.style.display = 'block';
      state.infoEl.classList.add('show');
      state.wipeX = 0;
      state.isAnimating = true;

      const c = ctx();
      try { state._volumeWasVisible = c.series.volume.options().visible !== false; } catch(e){}
      try { c.series.volume.applyOptions({ visible: false }); } catch(e){}
      state._prevStyle = c.style || 'candles';

      // Fetch history first — show spinner while loading
      await refetch().catch(e => console.warn('[OF] refetch:', e));

      // Skip candle transition if chart is already line/area
      const needCandleTransition =
        state._prevStyle !== 'line' && state._prevStyle !== 'area';

      // ═══ Parallel: wipe L→R  +  candle→line  ═══
      await Promise.all([
        new Promise(r => animateWipe(0, state.W, 900, () => { state.isAnimating = false; r(); })),
        needCandleTransition ? animateCandlesToLine(true, 900) : Promise.resolve(),
      ]);

      connectWs();
    } finally {
      state.loading = false;
      setButtonMode('on');
    }
  }

  function disable(){
    if (!state.enabled || state.loading || state._disabling) return;
    state._disabling = true;
    state.isAnimating = true;

    const needRestore =
      state._prevStyle !== 'line' && state._prevStyle !== 'area';

    // ═══ Parallel: wipe R→L  +  line→candle  ═══
    Promise.all([
      new Promise(r => animateWipe(state.W, 0, 700, () => { r(); })),
      needRestore ? animateCandlesToLine(false, 700) : Promise.resolve(),
    ]).then(() => {
      state.enabled = false;
      state.isAnimating = false;
      state._disabling = false;
      if (state.canvas) state.canvas.style.display = 'none';
      if (state.infoEl) state.infoEl.classList.remove('show');
      const c = ctx();
      try { c.series.volume.applyOptions({ visible: state._volumeWasVisible }); } catch(e){}

      // Complex styles (hollow / heiken / area) need engine's setStyle
      if (state._prevStyle && state._prevStyle !== 'candles' && state._prevStyle !== 'line'){
        const prevBtn = document.querySelector('#ms .ddi[data-st="' + state._prevStyle + '"]');
        if (prevBtn) prevBtn.click();
      }

      disconnectWs();
    });
  }

    // ═══ Candle ↔ Line transition (parallel-friendly) ═══
  function animateCandlesToLine(toLine, duration) {
    return new Promise(resolve => {
      const chartData = ctx();
      if (!chartData) return resolve();
      const chart = chartData.charts.main;
      const candleSeries = chartData.series.candle;
      if (!chart || !candleSeries) return resolve();

      // ---- Read current up/down colors from candle series ----
      let upRGB = [0, 255, 200];
      let dnRGB = [168, 85, 247];
      const parseC = (c) => {
        if (typeof c !== 'string') return null;
        c = c.trim();
        let m = /^#([0-9a-f]{6})$/i.exec(c);
        if (m) return [parseInt(m[1].slice(0,2),16), parseInt(m[1].slice(2,4),16), parseInt(m[1].slice(4,6),16)];
        m = /^#([0-9a-f]{3})$/i.exec(c);
        if (m) return [...m[1]].map(h => parseInt(h+h,16));
        m = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(c);
        if (m) return [+m[1], +m[2], +m[3]];
        return null;
      };
      try {
        const opts = candleSeries.options();
        upRGB = parseC(opts.upColor) || parseC(opts.borderUpColor) || upRGB;
        dnRGB = parseC(opts.downColor) || parseC(opts.borderDownColor) || dnRGB;
      } catch(e){}
      const upStr = `${upRGB[0]},${upRGB[1]},${upRGB[2]}`;
      const dnStr = `${dnRGB[0]},${dnRGB[1]},${dnRGB[2]}`;

      // ---- Create line series on demand ----
      let lineSeries = chartData._ofLineSeries;
      if (toLine && !lineSeries) {
        try {
          lineSeries = chart.addLineSeries({
            color: `rgba(${upStr},0)`,
            lineWidth: 2,
            lastValueVisible: false,
            priceLineVisible: false,
            priceFormat: { type: 'custom', formatter: p => p.toString(), minMove: 1e-8 },
            crosshairMarkerVisible: false,
          });
          const p = chartData.prices;
          if (p && p.length){
            lineSeries.setData(p.map(b => ({ time: b.time, value: b.close })));
          }
          chartData._ofLineSeries = lineSeries;
        } catch(e){ return resolve(); }
      }

      // ---- Ensure candle series is visible (alpha controls appearance) ----
      try { candleSeries.applyOptions({ visible: true }); } catch(e){}

      const fromProg = toLine ? 0 : 1;
      const toProg   = toLine ? 1 : 0;
      const startTime = performance.now();

      const step = (now) => {
        const prices = chartData.prices;
        if (!prices || !prices.length) return resolve();

        const p = Math.min(1, (now - startTime) / duration);
        // Match easeOutCubic — same easing as animateWipe for perfect sync
        const eased = 1 - Math.pow(1 - p, 3);
        const prog  = fromProg + (toProg - fromProg) * eased;

        const candleA = 1 - prog;
        const lineA   = prog;

        // ---- Fade candles ----
        try {
          candleSeries.setData(prices.map(bar => {
            const isUp = bar.close >= bar.open;
            const base = isUp ? upStr : dnStr;
            const col  = `rgba(${base},${candleA})`;
            return {
              time: bar.time,
              open: bar.open, high: bar.high, low: bar.low, close: bar.close,
              color: col, borderColor: col, wickColor: col,
            };
          }));
        } catch(e){}

        // ---- Fade line ----
        if (lineSeries){
          try { lineSeries.applyOptions({ color: `rgba(${upStr},${lineA})` }); } catch(e){}
        }

        if (p < 1){
          requestAnimationFrame(step);
          return;
        }

        // ═══ Finalize ═══
        if (toLine){
          chartData.style     = 'line';
          chartData._autoArea = false;
          chartData._autoT    = 0;
          if (chartData._autoS){
            try { chart.removeSeries(chartData._autoS); } catch(e){}
            chartData._autoS = null;
          }
          try { candleSeries.applyOptions({ visible: false }); } catch(e){}
        } else {
          chartData.style  = state._prevStyle || 'candles';
          chartData._autoT = 0;
          try {
            candleSeries.applyOptions({
              visible: true,
              upColor:       `rgba(${upStr},1)`,
              downColor:     `rgba(${dnStr},1)`,
              wickUpColor:   `rgba(${upStr},1)`,
              wickDownColor: `rgba(${dnStr},1)`,
              borderUpColor:   `rgba(${upStr},1)`,
              borderDownColor: `rgba(${dnStr},1)`,
              borderVisible: false,
            });
            candleSeries.setData(prices);
          } catch(e){}
          if (lineSeries){
            try { chart.removeSeries(lineSeries); } catch(e){}
            chartData._ofLineSeries = null;
          }
        }
        resolve();
      };
      requestAnimationFrame(step);
    });
  }

  async function refetch(){
    // NOTE: does NOT touch WS — WS lifecycle managed by enable/disable/poller
    const gen = ++state._fetchGen;
    state.trades = [];
    state.cvdHistory = [];
    state.cvd = 0;
    state.lastAggId = 0;
    state.currentBids = [];
    state.currentAsks = [];
    state._dirty = true;

    const [klines, aggTrades] = await Promise.all([
      fetchKlines(),
      fetchAggTrades(),
    ]);
    if (gen !== state._fetchGen) return;   // symbol/tf changed meanwhile

    addTradesRaw(aggTrades);
    if (state.trades.length) console.log('[OF] history:', state.trades.length, 'trades, from', new Date(state.trades[0].time*1000).toLocaleString());
    buildCVD(klines);

    if (state.trades.length){
      state.priceDecimals = getDecimals(state.trades[state.trades.length - 1].price.toString());
    }

    updateInfo();
    state._dirty = true;
  }

  // ═══ LIVE WS ═══
  // ─── WS with generation counter + host fallback ───
  let _wsGen = 0;

  function disconnectWs(){
    _wsGen++;
    for (const k of ['ws', 'wsD']){
      if (state[k]){
        try { state[k].close(); } catch(e){}
        state[k] = null;
      }
    }
    state._bf = null;
    state.wsConnected = false;
  }

  // Binance USD-M split (legacy /stream URL retired 2026-04-23):
  //   aggTrade  -> wss://fstream.binance.com/market/...
  //   depth     -> wss://fstream.binance.com/public/...
  // Mixed categories on ONE connection get no data, so we use TWO sockets.
  function openSocket(kind, url, myGen, onMsg, onOpen){
    let ws;
    try { ws = new WebSocket(url); } catch(e){ return null; }
    ws.onopen = () => {
      if (myGen !== _wsGen) { try{ws.close()}catch(e){}; return; }
      if (onOpen) onOpen();
      console.log('[OF] WS open · ' + kind);
    };
    ws.onmessage = (ev) => {
      if (myGen !== _wsGen) return;
      let msg;
      try { msg = JSON.parse(ev.data); } catch(e){ return; }
      if (!msg || !msg.data) return;
      onMsg(msg.data);
    };
    ws.onerror = () => {
      if (myGen !== _wsGen) return;
      if (kind === 'market') { state.wsConnected = false; updateInfo(); }
    };
    ws.onclose = () => {
      if (myGen !== _wsGen) return;
      if (kind === 'market') { state.wsConnected = false; updateInfo(); }
      console.log('[OF] WS closed · ' + kind + ' · reconnecting');
      if (state.enabled){
        setTimeout(() => {
          if (state.enabled && myGen === _wsGen) reopen(kind, myGen);
        }, 2000);
      }
    };
    return ws;
  }

  function reopen(kind, myGen){
    const sym = state.symbol.toLowerCase();
    if (kind === 'market'){
      state.ws = openSocket('market',
        `wss://fstream.binance.com/market/stream?streams=${sym}@aggTrade`,
        myGen,
        (d) => { if (d.e === 'aggTrade'){ if (state._bf) state._bf.push(d); else onTrade(d); } },
        () => { state.wsConnected = true; updateInfo(); startBackfill(myGen); });
    } else {
      state.wsD = openSocket('public',
        `wss://fstream.binance.com/public/stream?streams=${sym}@depth20@100ms`,
        myGen,
        (d) => onDepth(d));
    }
  }

  // after (re)connect: fill the hole between last known trade and the live stream
  async function startBackfill(myGen){
    state._bf = [];                                   // buffer live msgs meanwhile
    const sym = state.symbol;
    try {
      if (state.lastAggId > 0){
        let from = state.lastAggId + 1;
        for (let p = 0; p < 15; p++){
          const r = await fetch(`https://fapi.binance.com/fapi/v1/aggTrades?symbol=${sym}&fromId=${from}&limit=1000`);
          if (!r.ok || myGen !== _wsGen) break;
          const arr = await r.json();
          if (!Array.isArray(arr) || !arr.length) break;
          for (const t of arr) onTrade(t);
          from = arr[arr.length - 1].a + 1;
          if (arr.length < 1000) break;
        }
      }
    } catch(e){ console.warn('[OF] backfill:', e.message); }
    if (myGen !== _wsGen) return;
    const q = state._bf || [];
    state._bf = null;
    for (const d of q) onTrade(d);                    // onTrade dedupes by aggId
  }

  function connectWs(){
    disconnectWs();
    const myGen = _wsGen;
    reopen('market', myGen);
    reopen('public', myGen);
  }

  function onTrade(t){
    if (t.a != null){ if (t.a <= state.lastAggId) return; state.lastAggId = t.a; }
    const side = t.m ? 'S' : 'B';
    const trade = {
      id: t.a,
      time: Math.floor(t.T / 1000),
      price: parseFloat(t.p),
      qty: parseFloat(t.q),
      side,
    };
    state.trades.push(trade);
    state.cvd += side === 'B' ? trade.qty : -trade.qty;

    // merge into cvdHistory (same bar → replace; new bar → append)
    const tfSec = tfToSec(state.tf);
    const barTime = Math.floor(trade.time / tfSec) * tfSec;
    const last = state.cvdHistory[state.cvdHistory.length - 1];
    if (last && last.time === barTime){
      last.value = state.cvd;                 // same candle -> update in place
    } else {
      state.cvdHistory.push({ time: barTime, value: state.cvd });   // new candle (bar-aligned time)
      if (state.cvdHistory.length > 4000) state.cvdHistory.shift();
    }

    if (state.trades.length > 120000) state.trades.splice(0, 10000);
    state._dirty = true;
    updateInfo();
  }

  function onDepth(d){
    const bids = ((d.bids || d.b || [])).slice(0, 5).map(([p,q]) => ({
      p: parseFloat(p), q: parseFloat(q),
    }));
    const asks = ((d.asks || d.a || [])).slice(0, 5).map(([p,q]) => ({
      p: parseFloat(p), q: parseFloat(q),
    }));
    state.currentBids = bids;
    state.currentAsks = asks;

    const now = Math.floor(Date.now() / 1000);
    const last = state.depth[state.depth.length - 1];
    if (last && last.time === now){
      last.bids = bids;
      last.asks = asks;
    } else {
      state.depth.push({ time: now, bids, asks });
      if (state.depth.length > 14400) state.depth.shift();
    }
    state._dirty = true;
    updateInfo();
  }

  // ═══ INFO PANEL ═══
  function updateInfo(){
    const cvdEl = document.getElementById('of-cvd');
    if (cvdEl){
      cvdEl.textContent = fmtQty(state.cvd);
      cvdEl.className = 'val ' + (state.cvd >= 0 ? 'pos' : 'neg');
    }
    const imEl = document.getElementById('of-imbal');
    if (imEl && state.currentBids.length && state.currentAsks.length){
      const bq = state.currentBids[0].q;
      const aq = state.currentAsks[0].q;
      const im = (bq - aq) / (bq + aq || 1);
      imEl.textContent = (im * 100).toFixed(0) + '%';
      imEl.className = 'val ' + (im > 0.15 ? 'pos' : (im < -0.15 ? 'neg' : ''));
    }
    const trEl = document.getElementById('of-trades');
    if (trEl) trEl.textContent = state.trades.length;

    const tapeEl = document.getElementById('of-tape');
    if (tapeEl){
      const last5 = state.trades.slice(-5).reverse();
      tapeEl.innerHTML = last5.map(t => {
        const cls = t.side === 'B' ? 'b' : 's';
        return `<div class="t ${cls}"><span>${t.price.toFixed(state.priceDecimals)}</span><span>${fmtQty(t.qty)}</span></div>`;
      }).join('');
    }

    const liveEl = document.getElementById('of-live');
    if (liveEl) liveEl.className = 'live ' + (state.wsConnected ? '' : 'off');
  }

  // ═══ WIPE ANIMATION ═══
  function animateWipe(from, to, duration, onDone){
    if (state._wipeRaf) cancelAnimationFrame(state._wipeRaf);
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      state.wipeX = from + (to - from) * eased;
      render();
      if (p < 1){
        state._wipeRaf = requestAnimationFrame(step);
      } else {
        state._wipeRaf = 0;
        state.wipeX = to;
        if (onDone) onDone();
      }
    };
    state._wipeRaf = requestAnimationFrame(step);
  }

  // ═══ RENDER LOOP ═══
  function startLoop(){
    const loop = () => {
      if (state.enabled){
        const now = performance.now();
        if (now - state._lastRender > 100 || state._dirty){
          state._lastRender = now;
          state._dirty = false;
          render();
        }
      }
      state._loopRaf = requestAnimationFrame(loop);
    };
    state._loopRaf = requestAnimationFrame(loop);
  }

  // ═══ RENDER ═══
  function render(){
    if (!state.enabled || !state.ctx2d) return;
    const ctx2d = state.ctx2d;
    const W = state.W, H = state.H;
    const chartCtx = ctx();
    if (!chartCtx) return;
    const chart = chartCtx.charts?.main;
    const candleSeries = chartCtx.series?.candle;
    if (!chart || !candleSeries) return;

    const ts = chart.timeScale();
    const wipeX = state.wipeX;

    ctx2d.clearRect(0, 0, W, H);
    if (wipeX <= 0) return;

    let visibleRange = null;
    try { visibleRange = ts.getVisibleRange(); } catch(e){}
    if (!visibleRange || visibleRange.from == null) return;

    const rightEdge = W - 70;

    // clip to wipe
    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.rect(0, 0, wipeX, H);
    ctx2d.clip();

  // ─── dim the candles while OrderFlow is on (0.5 = candles at 50% opacity) ───
    const CANDLE_DIM = 0.81;
    {
      let taH = 28;
      try { const h = ts.height(); if (h > 0) taH = h; } catch(e){}
      ctx2d.fillStyle = `rgba(13,16,23,${CANDLE_DIM})`;      // = page bg (#0d1017)
      ctx2d.fillRect(0, 0, rightEdge, Math.max(0, H - taH));
    }

    // ─── bar geometry: trades/depth are positioned INSIDE their candle by time ───
    const tfSec = tfToSec(state.tf);
    let bs = 6; // px per bar
    {
      const tEnd = Math.floor(visibleRange.to / tfSec) * tfSec;
      const a = ts.timeToCoordinate(tEnd), b = ts.timeToCoordinate(tEnd - tfSec);
      if (a !== null && b !== null && a > b) bs = a - b;
    }
    const xOf = (t) => {
      const barT = Math.floor(t / tfSec) * tfSec;
      const x0 = ts.timeToCoordinate(barT);
      if (x0 === null) return null;
      return x0 + ((t - barT) / tfSec - 0.5) * bs;
    };
    const tTo = visibleRange.to + tfSec;   // include the current (last) bar too

    // ─── 1. Heatmap ───
    if (state.depth.length){
      const allQ = [];
for (const snap of state.depth){
  for (const lv of snap.bids) allQ.push(lv.q);
  for (const lv of snap.asks) allQ.push(lv.q);
}
allQ.sort((a, b) => a - b);
// 92-րդ percentile — whale-ները չեն dim-ում մնացածը
const gMax = Math.max(allQ[Math.floor(allQ.length * 0.92)] || 1, 1);
      const rowH = 5;

      let start = 0;
      {
        let lo = 0, hi = state.depth.length - 1;
        while (lo < hi){
          const mid = (lo + hi) >> 1;
          if (state.depth[mid].time < visibleRange.from) lo = mid + 1;
          else hi = mid;
        }
        start = Math.max(0, lo - 1);
      }

      let lastPx = -1e9;
      for (let i = start; i < state.depth.length; i++){
        const snap = state.depth[i];
        if (snap.time > tTo) break;
        const x1 = xOf(snap.time);
        if (x1 === null) continue;
        if (x1 < -10 || x1 > rightEdge + 10) continue;

        let x2 = null;
        if (i < state.depth.length - 1) x2 = xOf(state.depth[i+1].time);
        let colW = (x2 !== null ? x2 - x1 : 2);
        if (colW < 1.5){                       // don't overdraw the same pixel
          const px = Math.round(x1);
          if (px === lastPx) continue;
          lastPx = px;
          colW = 2;
        }

        for (const lv of snap.bids){
          const y = candleSeries.priceToCoordinate(lv.p);
          if (y === null) continue;
          const t = Math.pow(Math.min(1, lv.q / gMax), 0.7);
          const alpha = t * 0.72;
          if (alpha < 0.02) continue;
          ctx2d.fillStyle = `rgba(38,166,154,${alpha})`;
          ctx2d.fillRect(x1, y - rowH/2, colW, rowH);
        }
        for (const lv of snap.asks){
          const y = candleSeries.priceToCoordinate(lv.p);
          if (y === null) continue;
          const t = Math.pow(Math.min(1, lv.q / gMax), 0.7);
          const alpha = t * 0.72;
          if (alpha < 0.02) continue;
          ctx2d.fillStyle = `rgba(239,83,80,${alpha})`;
          ctx2d.fillRect(x1, y - rowH/2, colW, rowH);
        }
      }
    }

   // ─── 2. Bubbles (aggregated per pixel-cell · same look for history + live) ───
    if (state.trades.length){
      let bStart = 0;
      {
        let lo = 0, hi = state.trades.length - 1;
        while (lo < hi){
          const mid = (lo + hi) >> 1;
          if (state.trades[mid].time < visibleRange.from) lo = mid + 1;
          else hi = mid;
        }
        bStart = Math.max(0, lo - 1);
      }

      // group visible trades into cells: (x column) x (price row) x (side)
      const CELL_X = 4, CELL_Y = 4;          // px · bigger = fewer, larger bubbles
      const cells = new Map();
      for (let i = bStart; i < state.trades.length; i++){
        const tr = state.trades[i];
        if (tr.time > tTo) break;
        if (tr.time < visibleRange.from) continue;
        const x = xOf(tr.time);
        if (x === null || x < -30 || x > rightEdge + 30) continue;
        const y = candleSeries.priceToCoordinate(tr.price);
        if (y === null) continue;
        const key = tr.side + ':' + Math.floor(x / CELL_X) + ':' + Math.floor(y / CELL_Y);
        let c = cells.get(key);
        if (!c){ c = { sx: 0, sy: 0, q: 0, n: 0, side: tr.side }; cells.set(key, c); }
        c.sx += x * tr.qty; c.sy += y * tr.qty; c.q += tr.qty; c.n++;
      }

      const vis = [];
      for (const c of cells.values()){
        if (c.q <= 0) continue;
        vis.push({ x: c.sx / c.q, y: c.sy / c.q, q: c.q, side: c.side });
      }

      if (vis.length){
        vis.sort((a, b) => b.q - a.q);            // big first, small ones stay visible on top
        const n = vis.length;
        const qs = vis.map(v => v.q).sort((a,b) => a - b);
        const refQ   = Math.max(qs[Math.floor((n-1) * 0.98)], 1e-12);
        const largeQ = qs[Math.floor((n-1) * 0.93)];

        const BUBBLE_STYLE = 'flat';          // 'flat' | 'ring' | 'sphere'
        const DESAT = 0.25;                   // 0 = candle colour as is, 1 = grey. Higher = calmer
        const minR = 3.5;
const maxR = Math.max(12, Math.min(22, bs * 1.4));
        const sizeFn = (q) => minR + Math.min(1, Math.sqrt(q / refQ)) * (maxR - minR);

        // colours follow the candle series
        const toRgb = (c, fb) => {
          if (typeof c !== 'string') return fb;
          c = c.trim();
          let m = /^#([0-9a-f]{6})$/i.exec(c);
          if (m) return [parseInt(m[1].slice(0,2),16), parseInt(m[1].slice(2,4),16), parseInt(m[1].slice(4,6),16)];
          m = /^#([0-9a-f]{3})$/i.exec(c);
          if (m) return [...m[1]].map(h => parseInt(h+h,16));
          m = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(c);
          if (m) return [+m[1], +m[2], +m[3]];
          return fb;
        };
        let upRGB = [0,255,200], dnRGB = [168,85,247];
        try {
          const o = candleSeries.options();
          upRGB = toRgb(o.upColor, toRgb(o.borderUpColor, upRGB));
          dnRGB = toRgb(o.downColor, toRgb(o.borderDownColor, dnRGB));
        } catch(e){}
        const lighten = (c, t) => [c[0] + (255-c[0])*t, c[1] + (255-c[1])*t, c[2] + (255-c[2])*t];
        const darken  = (c, t) => [c[0]*(1-t), c[1]*(1-t), c[2]*(1-t)];
        const mixC    = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
        const desat   = (c, k) => { const l = 0.3*c[0] + 0.59*c[1] + 0.11*c[2]; return [c[0]+(l-c[0])*k, c[1]+(l-c[1])*k, c[2]+(l-c[2])*k]; };
        const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
        const baseUp = desat(upRGB, DESAT), baseDn = desat(dnRGB, DESAT);

        // size -> tone ramp:  small = light, bright, more opaque
        //                     big   = deep, calm, more transparent  (so the small ones stay readable on top)
        const drawBubble = (v) => {
          const r = sizeFn(v.q);
          const t = (r - minR) / (maxR - minR);                 // 0..1
          const base  = v.side === 'B' ? baseUp : baseDn;
          const fillC = mixC(lighten(base, 0.08), darken(base, 0.40), t);
          const rimC  = mixC(lighten(base, 0.25), base, t);
          const BUBBLE_TRANSPARENCY = 0.55;                      // 0 = solid · 0.6 = previous look · 1 = invisible
          const k = (1 - BUBBLE_TRANSPARENCY) / 0.2;            // 0.6 -> x1 (as before), 0.2 -> x2
          const fillA = Math.min(1, (0.46 - 0.16*t) * k);
          const rimA  = Math.min(1, (0.80 - 0.12*t) * k);
          ctx2d.beginPath();
          ctx2d.arc(v.x, v.y, r, 0, Math.PI*2);

          if (BUBBLE_STYLE === 'ring'){
            ctx2d.fillStyle = rgba(fillC, 0.05 + 0.05*t);
            ctx2d.fill();
            ctx2d.lineWidth = 1 + 0.8*t;
            ctx2d.strokeStyle = rgba(mixC(lighten(base, 0.20), base, t), rimA);
            ctx2d.stroke();
          }
          else if (BUBBLE_STYLE === 'sphere' && r >= 4){
            const g = ctx2d.createRadialGradient(v.x - r*0.3, v.y - r*0.3, r*0.05, v.x, v.y, r);
            g.addColorStop(0,    rgba(lighten(fillC, 0.18), fillA + 0.26));
            g.addColorStop(0.55, rgba(fillC, fillA + 0.20));
            g.addColorStop(1,    rgba(darken(fillC, 0.30), fillA + 0.10));
            ctx2d.fillStyle = g;
            ctx2d.fill();
            ctx2d.lineWidth = 1;
            ctx2d.strokeStyle = rgba(rimC, rimA * 0.8);
            ctx2d.stroke();
          }
          else {
            if (r < 4){
              ctx2d.fillStyle = rgba(fillC, fillA);
            } else {
              const g = ctx2d.createRadialGradient(v.x - r*0.25, v.y - r*0.3, 0, v.x, v.y, r);
              g.addColorStop(0, rgba(lighten(fillC, 0.06), fillA + 0.06));
              g.addColorStop(1, rgba(fillC, fillA - 0.06));
              ctx2d.fillStyle = g;
            }
            ctx2d.fill();
            ctx2d.lineWidth = 1 + 0.5*t;
            ctx2d.strokeStyle = rgba(rimC, rimA);
            ctx2d.stroke();
          }
        };

        // vis is sorted big -> small, so big ones sit at the bottom and small ones stay visible on top
        for (const v of vis) drawBubble(v);
      }
    }

    // ─── 3. CVD strip (bottom 70px) ───
    if (state.cvdHistory.length >= 2){
      const cvdH = 70;
      const cvdTop = H - cvdH;

      // background
      ctx2d.fillStyle = 'rgba(13,16,23,0.85)';
      ctx2d.fillRect(0, cvdTop, rightEdge, cvdH);

      // binary-search
      // Build pts — X-based, never freezes on pan/zoom
const pts = [];
const lastIdx = state.cvdHistory.length - 1;
const startIdx = Math.max(0, lastIdx - 3000);
for (let i = startIdx; i <= lastIdx; i++){
  const c = state.cvdHistory[i];
  if (!c || !isFinite(c.value)) continue;
  const x = ts.timeToCoordinate(c.time);
  if (x === null) continue;
  if (x < -20) continue;
  if (x > rightEdge + 20) continue;
  pts.push({ x, value: c.value });
}

      if (pts.length >= 2){
        let minV = Infinity, maxV = -Infinity;
        for (const p of pts){
          if (p.value < minV) minV = p.value;
          if (p.value > maxV) maxV = p.value;
        }
        if (minV > 0) minV = 0;
        if (maxV < 0) maxV = 0;
        const range = maxV - minV || 1;
        const zeroY = cvdTop + cvdH * (1 - (0 - minV) / range);

        // zero line
        ctx2d.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx2d.lineWidth = 1;
        ctx2d.beginPath();
        ctx2d.moveTo(0, zeroY);
        ctx2d.lineTo(rightEdge, zeroY);
        ctx2d.stroke();

        // fill
        const firstX = pts[0].x;
        const lastX  = pts[pts.length - 1].x;
        ctx2d.beginPath();
        ctx2d.moveTo(pts[0].x, cvdTop + cvdH * (1 - (pts[0].value - minV) / range));
        for (let i = 1; i < pts.length; i++){
          const y = cvdTop + cvdH * (1 - (pts[i].value - minV) / range);
          ctx2d.lineTo(pts[i].x, y);
        }
        ctx2d.lineTo(lastX, zeroY);
        ctx2d.lineTo(firstX, zeroY);
        ctx2d.closePath();
        const grd = ctx2d.createLinearGradient(0, cvdTop, 0, cvdTop + cvdH);
        if (state.cvd >= 0){
          grd.addColorStop(0, 'rgba(38,166,154,0.35)');
          grd.addColorStop(1, 'rgba(38,166,154,0.02)');
        } else {
          grd.addColorStop(0, 'rgba(239,83,80,0.02)');
          grd.addColorStop(1, 'rgba(239,83,80,0.35)');
        }
        ctx2d.fillStyle = grd;
        ctx2d.fill();

        // line
        ctx2d.beginPath();
        ctx2d.moveTo(pts[0].x, cvdTop + cvdH * (1 - (pts[0].value - minV) / range));
        for (let i = 1; i < pts.length; i++){
          const y = cvdTop + cvdH * (1 - (pts[i].value - minV) / range);
          ctx2d.lineTo(pts[i].x, y);
        }
        ctx2d.strokeStyle = state.cvd >= 0 ? '#7fdcd0' : '#ff8a87';
        ctx2d.lineWidth = 1.5;
        ctx2d.stroke();

        // label
        ctx2d.fillStyle = state.cvd >= 0 ? '#7fdcd0' : '#ff8a87';
        ctx2d.font = 'bold 10px JetBrains Mono, monospace';
        ctx2d.textAlign = 'left';
        ctx2d.textBaseline = 'top';
        ctx2d.fillText('CVD ' + fmtQty(state.cvd), 8, cvdTop + 5);
      }

      // divider
      ctx2d.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx2d.lineWidth = 1;
      ctx2d.beginPath();
      ctx2d.moveTo(0, cvdTop);
      ctx2d.lineTo(rightEdge, cvdTop);
      ctx2d.stroke();
    }

    ctx2d.restore();

    // ─── wipe front ───
    if (state.isAnimating && wipeX < W){
      ctx2d.strokeStyle = 'rgba(0,255,213,0.85)';
      ctx2d.lineWidth = 2;
      ctx2d.beginPath();
      ctx2d.moveTo(wipeX, 0);
      ctx2d.lineTo(wipeX, H);
      ctx2d.stroke();

      const grd = ctx2d.createLinearGradient(wipeX - 32, 0, wipeX + 2, 0);
      grd.addColorStop(0, 'rgba(0,255,213,0)');
      grd.addColorStop(1, 'rgba(0,255,213,0.32)');
      ctx2d.fillStyle = grd;
      ctx2d.fillRect(wipeX - 32, 0, 32, H);
    }
  }

  // ═══ TOGGLE ═══
  function toggleOF(){
    if (state.loading) return;
    if (state.enabled) disable();
    else enable();
  }

  // ═══ BOOT ═══
  function tryInit(){
    const c = ctx();
    if (!c || !c.charts || !c.charts.main){
      setTimeout(tryInit, 400);
      return;
    }
    state.symbol = c.symbol;
    state.tf = c.tf;
    createCanvas();
    injectButton();
    hookChart();
    startPoller();
    startLoop();
    console.log('[OF] ready · symbol=' + state.symbol + ' tf=' + state.tf);
  }

  tryInit();
})();
</script>
