<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Trading Engine</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0d1017;--bg2:#11141b;--bg3:#161a22;
--bd:rgba(255,255,255,.05);
--ac:#089981;--acD:rgba(8,153,129,.08);
--up:#089981;--dn:#673ab7;--yel:#ffd60a;--rsi:#6366f1;
--t1:#e6e7ea;--t2:#9ca0a9;--t3:#6b7280;
--ui:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
--tr:all .2s cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);color:var(--t1);font-family:var(--ui);overflow:hidden;font-size:12px}
#app{display:grid;grid-template-rows:44px 1fr;width:100vw;height:100vh;overflow:hidden}

#main { display:flex; overflow:hidden; min-height:0; flex-direction:row; }
#left-bar { width: 44px; background: var(--bg2); border-right: 1px solid var(--bd); display: flex; flex-direction: column; gap: 8px; padding: 12px 0; align-items: center; z-index: 50; flex-shrink: 0; }
.tb-btn { background: transparent; border: 1px solid transparent; color: var(--t3); width: 30px; height: 30px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: var(--tr); display: flex; align-items: center; justify-content: center; }
.tb-btn:hover { color: var(--ac); background: var(--acD); border-color: rgba(0,255,213,0.2); }
.tb-btn.active { color: var(--bg); background: var(--ac); }
.tb-btn.del { margin-top: auto; color: var(--t3); }
.tb-btn.del:hover { color: var(--dn); background: rgba(168,85,247,.15); border-color: rgba(168,85,247,.3); }

#top{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;flex-shrink:0;position:relative;z-index:100}
#top::-webkit-scrollbar{display:none}
.ci{background:rgba(0,0,0,.4);border:1px solid rgba(0,255,213,.2);color:#fff;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono);text-transform:uppercase;width:82px;text-align:center;transition:var(--tr);flex-shrink:0}
.ci:focus{outline:none;border-color:var(--ac);box-shadow:0 0 12px var(--acD)}
.tfs{display:flex;gap:1px;background:rgba(0,0,0,.4);padding:2px;border-radius:5px;border:1px solid var(--bd);flex-shrink:0}
.tf{background:transparent;border:none;color:var(--t3);padding:4px 7px;border-radius:3px;font-size:10px;font-weight:700;font-family:var(--mono);cursor:pointer;transition:var(--tr)}
.tf:hover{color:#fff;background:rgba(255,255,255,.05)}
.tf.active{background:var(--acD);color:var(--ac)}
.sp{flex:1;min-width:6px}
.hud{display:flex;gap:14px;align-items:center;flex-shrink:0}
.hud-it{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.hud-lb{font-size:7px;color:var(--t3);letter-spacing:1px;font-weight:700}
.hud-vl{font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:-.3px}
.ib{background:transparent;border:1px solid var(--bd);color:var(--t3);width:28px;height:28px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:var(--tr);flex-shrink:0}
.ib:hover{color:var(--ac);border-color:var(--ac);background:var(--acD)}
.ib.active{color:var(--ac);border-color:var(--ac);background:var(--acD)}

.ddm{position:fixed;z-index:9999;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:3px;min-width:200px;display:none;box-shadow:0 16px 44px rgba(0,0,0,.85)}
.ddm.open{display:block}
.ddh{padding:5px 9px 3px;font-size:8px;font-weight:800;color:var(--t3);letter-spacing:1.3px;text-transform:uppercase}
.ddi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:4px;font-size:10px;color:var(--t2);cursor:pointer;transition:var(--tr)}
.ddi:hover{background:var(--acD);color:var(--ac)}
.ddi.on{color:var(--ac);background:rgba(0,255,213,.04)}
.ddi i.chk{width:12px;font-size:10px;text-align:center;color:var(--ac);opacity:0}
.ddi.on i.chk{opacity:1}
.ddsep{height:1px;background:var(--bd);margin:3px 0}

#main{display:flex;overflow:hidden;min-height:0}
#stack{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative;min-width:0}
#ctrl{width:210px;background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;flex-shrink:0;padding:8px;gap:8px;scrollbar-width:thin}
#ctrl::-webkit-scrollbar{width:4px}
#ctrl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

.lb{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.lb-hd{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);padding-bottom:5px;border-bottom:1px solid var(--bd)}
.lb-hd i{font-size:10px}
.lb-hd.alert i{color:var(--ac)}
.lb-hd.vol i{color:#fff}
.lb-hd.liq i{color:var(--dn)}
.lb-hd.tg i{color:#00bfff}
.lb-hd .cnt{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--dn);font-weight:700}
.lb-row{display:flex;gap:4px;align-items:center}
.lb-lbl{font-size:9px;color:var(--t3);font-weight:600;flex-shrink:0}
.lb-in{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--bd);color:var(--t1);padding:4px 6px;border-radius:4px;font-size:10px;font-family:var(--mono);text-align:right;font-weight:600;transition:var(--tr)}
.lb-in:focus{outline:none;border-color:var(--ac)}
.lb-in::-webkit-outer-spin-button,.lb-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lb-in[type=number]{-moz-appearance:textfield}
.lb-btn{flex:1;padding:5px;background:transparent;border:1px solid var(--bd);color:var(--t2);border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.8px;cursor:pointer;transition:var(--tr);font-family:var(--ui);text-transform:uppercase}
.lb-btn:hover{color:var(--ac);border-color:var(--ac);background:var(--acD)}
.lb-btn.set:hover{color:var(--up);border-color:var(--up);background:rgba(0,255,200,.08)}
.lb-btn.clr:hover{color:var(--dn);border-color:var(--dn);background:rgba(168,85,247,.08)}
.lb-st{font-size:9px;color:var(--t3);text-align:center;font-family:var(--mono);min-height:11px}
.lb-st.ok{color:var(--up)}
.lb-st.warn{color:var(--yel)}

.lb-liq{flex:1 1 auto;min-height:120px;overflow:hidden;display:flex;flex-direction:column}
.liq-feed{flex:1 1 auto;overflow-y:auto;margin:0 -6px;padding:0 6px;min-height:60px;scrollbar-width:thin}
.liq-feed::-webkit-scrollbar{width:3px}
.liq-feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.liq-empty{text-align:center;color:var(--t3);font-size:9px;padding:20px 4px;font-family:var(--mono)}
.liq-it{display:grid;grid-template-columns:50px 42px 1fr;gap:4px;padding:4px 2px;font-family:var(--mono);font-size:9px;border-bottom:1px solid rgba(255,255,255,.03);align-items:center;animation:liqIn .3s ease-out}
@keyframes liqIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.liq-it .tm{color:var(--t3);font-size:8px}
.liq-it .sd{font-weight:800;font-size:8px;padding:1px 3px;border-radius:2px;text-align:center}
.liq-it .sd.long{color:var(--up);background:rgba(0,255,200,.1)}
.liq-it .sd.short{color:var(--dn);background:rgba(168,85,247,.12)}
.liq-it .am{font-weight:800;color:var(--t1);text-align:right;font-size:9px}
.liq-it.big .am{color:var(--yel);text-shadow:0 0 8px rgba(255,214,10,.4)}

.pnl{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg);flex-shrink:0}
.pnl.main{flex:1 1 auto;min-height:150px}
.pnl.extra{flex:0 0 auto;height:100px}
.pnl-hd{display:flex;align-items:center;justify-content:space-between;height:22px;padding:0 8px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--bd);font-size:9px;font-weight:700;letter-spacing:1px;color:var(--t3);flex-shrink:0;user-select:none}
.pnl-ttl{display:flex;align-items:center;gap:5px;text-transform:uppercase}
.pnl-ttl i{font-size:9px}
.pnl-acts{display:flex;gap:1px;opacity:.4;transition:opacity .2s}
.pnl:hover .pnl-acts{opacity:1}
.pnl-acts button{background:transparent;border:none;color:var(--t3);width:18px;height:18px;border-radius:3px;cursor:pointer;font-size:9px;transition:var(--tr)}
.pnl-acts button:hover{color:var(--ac);background:rgba(255,255,255,.06)}
.pnl-acts button.del:hover{color:var(--dn)}
.pnl-body{flex:1;position:relative;min-height:0;overflow:hidden}
.pnl-body>.lw{width:100%;height:100%}

.rz{height:5px;background:transparent;cursor:ns-resize;flex-shrink:0;position:relative;transition:background .15s;touch-action:none}
.rz:hover{background:rgba(0,255,213,.15)}
.rz::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:2px;background:rgba(255,255,255,.06);border-radius:2px;transition:background .15s}
.rz:hover::after{background:var(--ac)}

/* Physical vertical line — spans ALL panels over the candles */
#xh-line{
position:absolute;
top:0;bottom:0;
width:1px;
background:rgba(255,255,255,.42);
pointer-events:none;
display:none;
z-index:30;
will-change:left;
transform:translateX(-0.5px);
box-shadow:0 0 4px rgba(255,255,255,.12);
}
#xh-label{
position:absolute;
bottom:0;
transform:translateX(-50%);
background:rgba(28,31,38,.98);
border:1px solid rgba(255,255,255,.08);
border-radius:3px;
padding:2px 6px;
font-family:var(--mono);
font-size:9px;
font-weight:700;
color:#e6e7ea;
pointer-events:none;
display:none;
z-index:31;
white-space:nowrap;
margin-bottom:2px;
}

#cursor-lbl,#alert-lbl{position:absolute;display:none;align-items:center;background:rgba(13,16,23,.96);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:10px;font-weight:700;color:#eaeaea;pointer-events:none;white-space:nowrap;transform:translateY(-50%);line-height:1.2;z-index:6;box-shadow:0 2px 14px rgba(0,0,0,.5)}
#cursor-lbl{border:1px solid rgba(255,255,255,.15);min-width:52px;justify-content:center;padding:3px 9px}
#alert-lbl{border:1px solid rgba(0,255,213,.5);z-index:7}

#alert-lbl .tag{color:var(--ac);font-size:8px;letter-spacing:1px;font-weight:800;margin-right:6px}
.pct.pos{color:var(--up)}.pct.neg{color:var(--dn)}.pct.zero{color:var(--t3)}

#ctx{position:fixed;z-index:10000;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:3px;display:none;min-width:180px;box-shadow:0 14px 44px rgba(0,0,0,.85)}
#ctx>div{display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:10px;color:var(--t2);cursor:pointer;border-radius:4px;transition:var(--tr)}
#ctx>div:hover{background:var(--acD);color:var(--ac)}

#ld{position:absolute;inset:0;background:rgba(13,16,23,.9);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:400;pointer-events:none}
#ld.on{display:flex}
.spin{width:28px;height:28px;border:2px solid rgba(0,255,213,.15);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ld .lt{font-size:9px;font-weight:800;letter-spacing:3px;color:var(--ac)}

#tst{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:10000;pointer-events:none}
.tst{background:var(--bg3);border:1px solid var(--bd);border-left:2px solid var(--ac);padding:8px 12px;border-radius:5px;font-size:10px;font-weight:600;color:var(--t1);max-width:280px;pointer-events:auto;transition:opacity .3s;animation:ti .25s cubic-bezier(.16,1,.3,1)}
.tst.e{border-left-color:var(--dn)}
.tst.w{border-left-color:var(--yel)}
@keyframes ti{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

#mr{position:absolute;display:none;pointer-events:none;z-index:8;border:1px dashed var(--up);background:rgba(0,255,200,.08);border-radius:2px;box-sizing:border-box}
#ml{position:absolute;display:none;pointer-events:none;z-index:9;background:rgba(0,0,0,.92);border:1px solid rgba(0,255,200,.5);padding:3px 7px;border-radius:4px;font-family:var(--mono);font-size:10px;white-space:nowrap;transform:translate(-50%,-100%);text-align:center;font-weight:700;margin-top:-7px}
#ml .pc{font-size:12px;line-height:1.1}
#ml .sb{font-size:8px;color:#999}
#mc{position:absolute;display:none;pointer-events:none;z-index:8;width:16px;height:16px;border:1px solid var(--up);border-radius:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.5)}
#mc::before{content:'';position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:var(--up);transform:translateX(-50%)}
#mc::after{content:'';position:absolute;top:50%;left:3px;right:3px;height:1px;background:var(--up);transform:translateY(-50%)}

#vpc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4}

@media(max-width:720px){
#top{gap:6px;padding:0 6px}
.ci{width:64px;font-size:10px;padding:3px 6px}
.tf{padding:3px 6px;font-size:9px}
.ib{width:26px;height:26px;font-size:10px}
.hud-it:not(.keep){display:none}
.hud-vl{font-size:11px}
#ctrl{width:150px;padding:6px;gap:6px}
.lb{padding:6px;gap:5px}
.lb-in{font-size:9px;padding:3px 5px}
.lb-btn{font-size:8px;padding:4px}
.pnl.extra{height:80px}
#cursor-lbl,#alert-lbl{font-size:9px;padding:2px 6px}
.liq-it{grid-template-columns:42px 38px 1fr;font-size:8px;padding:3px 1px}
.liq-it .tm{font-size:7px}
}
@media(max-width:480px){
#ctrl{width:130px}
.tf:nth-child(n+5){display:none}
.liq-it{grid-template-columns:40px 1fr}
.liq-it .tm{display:none}
}

#ctrl {
  width: 210px;
  position: relative;
  transition: width 0.2s ease, padding 0.2s ease;
}
#ctrl.collapsed {
  width: 0 !important;
  min-width: 0 !important;
  padding-left: 0 !important;
  padding-right: 0 !important;
  border-left: none !important;
}
.ctrl-rz-x {
  position: absolute;
  left: -3px;
  top: 0;
  bottom: 0;
  width: 6px;
  cursor: ew-resize;
  z-index: 20;
}
#ctrl.collapsed .ctrl-rz-x {
  display: none;
}
.ctrl-toggle-btn {
  position: absolute;
  right: 0; /* Kpnum e stack-i aj koghmin */
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 48px;
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-right: none;
  border-radius: 5px 0 0 5px;
  color: var(--t3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  font-size: 10px;
  transition: var(--tr);
}
.ctrl-toggle-btn:hover {
  color: var(--ac);
  background: var(--acD);
  border-color: var(--ac);
}

#left-bar {
  transition: width 0.2s ease, padding 0.2s ease;
  overflow: hidden;
}
#left-bar.collapsed {
  width: 0 !important;
  min-width: 0 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  border-right: none !important;
}
.left-toggle-btn {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 48px;
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-left: none;
  border-radius: 0 5px 5px 0;
  color: var(--t3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  font-size: 10px;
  transition: var(--tr);
}
.left-toggle-btn:hover {
  color: var(--ac);
  background: var(--acD);
  border-color: var(--ac);
}

#stack:fullscreen {
  background-color: var(--bg);
  padding: 0;
  width: 100vw;
  height: 100vh;
}
#stack:-webkit-full-screen {
  background-color: var(--bg);
  padding: 0;
  width: 100vw;
  height: 100vh;
}

/* ═══════════════ LIQUIDATION SWITCH ═══════════════ */
.lb-hd.liq .liq-switch{
margin-left:auto;
width:26px;
height:14px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
border-radius:8px;
cursor:pointer;
position:relative;
transition:all .22s cubic-bezier(.16,1,.3,1);
padding:0;
flex-shrink:0;
outline:none;
}
.lb-hd.liq .liq-switch::after{
content:'';
position:absolute;
top:1px;
left:1px;
width:10px;
height:10px;
background:var(--t3);
border-radius:50%;
transition:all .22s cubic-bezier(.16,1,.3,1);
}
.lb-hd.liq .liq-switch:hover{
border-color:rgba(0,255,213,.4);
background:rgba(0,255,213,.05);
}
.lb-hd.liq .liq-switch.on{
background:rgba(0,255,213,.18);
border-color:rgba(0,255,213,.55);
box-shadow:0 0 10px rgba(0,255,213,.25);
}
.lb-hd.liq .liq-switch.on::after{
background:var(--ac);
left:13px;
box-shadow:0 0 6px var(--ac);
}
/* Count — հետ բերել նեղ margin, որ switch-ից հետո չշարժվի */
.lb-hd.liq .cnt{margin-left:6px}

/* ═══════════════ MULTI ALERT LIST ═══════════════ */
.lb-hd.alert .cnt{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--ac);font-weight:700}
.lb-alerts{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow-y:auto;margin-top:2px;scrollbar-width:thin}
.lb-alerts::-webkit-scrollbar{width:3px}
.lb-alerts::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.lb-alerts:empty{display:none}
.pa-item{display:flex;align-items:center;gap:5px;padding:4px 6px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:4px;font-family:var(--mono);font-size:9px;transition:var(--tr);animation:liqIn .25s ease-out}
.pa-item.active{border-color:rgba(0,255,213,.25)}
.pa-item.sent{border-color:rgba(0,255,200,.4);background:rgba(0,255,200,.06);opacity:.8}
.pa-item .p{flex:1;min-width:0;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-item.sent .p{color:var(--up)}
.pa-item .st{font-size:8px;color:var(--t3);letter-spacing:.3px;flex-shrink:0}
.pa-item.sent .st{color:var(--up)}
.pa-item .ok{color:var(--up);font-weight:800;font-size:10px;width:10px;text-align:center;flex-shrink:0}
.pa-item .x{background:transparent;border:none;color:var(--t3);cursor:pointer;padding:1px 3px;font-size:10px;transition:var(--tr);border-radius:2px;flex-shrink:0}
.pa-item .x:hover{color:var(--dn);background:rgba(168,85,247,.15)}

/* ═══════════════ MULTI ALERT LABELS ═══════════════ */
#alert-labels{
position:absolute;
inset:0;
pointer-events:none;
z-index:7;
}
.alert-lbl-item{
position:absolute;
display:none;
align-items:center;
background:rgba(13,16,23,.96);
border:1px solid rgba(0,255,213,.5);
border-radius:4px;
padding:3px 8px;
font-family:var(--mono);
font-size:10px;
font-weight:700;
color:#eaeaea;
pointer-events:none;
white-space:nowrap;
transform:translateY(-50%);
line-height:1.2;

init(){

this.showAt(x, null);

stack.addEventListener('touchend', () => this.hide());
window.addEventListener('resize', () => {
try { this.scaleWidth = S.charts.main.priceScale('right').width() || 68; } catch(e){}
});
},

isInsideChart(x, stackRect){
const chartEl = $('#c-main');
if(!chartEl) return false;
const r = chartEl.getBoundingClientRect();
const left = r.left - stackRect.left;
const right = left + r.width - this.scaleWidth;
return x >= left && x <= right;
},

fromChart(param, chartId){
if(!param || !param.point || param.time === undefined){ this.hide(); return; }
const chartEl = chartId === 'main' ? $('#c-main') : (S.panels[chartId] ? S.panels[chartId].container : null);
if(!chartEl){ this.hide(); return; }
const stackRect = $('#stack').getBoundingClientRect();

try { this.scaleWidth = S.charts.main.priceScale('right').width() || this.scaleWidth; } catch(e){}
if(!this.isInsideChart(x, stackRect)){ this.hide(); return; }
this.showAt(x, param.time);
},

showAt(x, time){
this.pendingX = x;
this.pendingTime = time;
if(this.raf) return;
this.raf = requestAnimationFrame(() => {
this.raf = 0;
if(this.pendingX == null){ this.hide(); return; }

this.label.style.display = 'none';
}
});

hide(){

hook(ch, chartId){

/* ═══════════════ TIME-SCALE SYNC ═══════════════ */
/* Guard against feedback loops and against propagating ranges that were
    set programmatically during setData (which is what caused the B/S scatter). */
function hookTimeScale(ch){
if(ch._tsHooked) return;
ch._tsHooked = true;
ch.timeScale().subscribeVisibleLogicalRangeChange(range => {
if(S._syncing || !range) return;
S._syncing = true;
try {
Object.entries(S.charts).forEach(([id, other]) => {
if(other === ch || !other) return;
try { other.timeScale().setVisibleLogicalRange(range); } catch(e){}
});
} finally {
S._syncing = false;
}
updateAlertLabel();
});
}

function applyMainRange(ch){
if(!ch || !S.charts.main) return;
try {
const r = S.charts.main.timeScale().getVisibleLogicalRange();
if(r) ch.timeScale().setVisibleLogicalRange(r);
} catch(e){}
}

function syncAllPanelsToMain(){
S._syncing = true;
try {
Object.entries(S.charts).forEach(([id,c]) => {
if(id === 'main' || !c) return;
applyMainRange(c);
});
} finally {
S._syncing = false;
}
}

/* ═══ NATIVE BRUSH PLUGIN LWC V4 (SELECT, DELETE, UNDO) ═══ */
class BrushPlugin {
  constructor(chart, series) {
    this.chart = chart; this.series = series;
    this.lines = []; this.cur = null; this.isDraw = false;
  }
  paneViews() {
    return [{
      update: () => {},
      renderer: () => ({
        zOrder: 'top',
        draw: (target) => {
          target.useMediaCoordinateSpace(({ context: ctx }) => {
            ctx.save(); 
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            this.lines.forEach(l => {
              if (l.points.length < 2) return;
              ctx.lineWidth = l.selected ? 3 : 2; 
              ctx.strokeStyle = l.selected ? '#fff' : '#00ffd5'; 
              ctx.beginPath();
              let moved = false;
              l.points.forEach(pt => {
                const x = this.chart.timeScale().logicalToCoordinate(pt.logical);
                const y = this.series.priceToCoordinate(pt.price);
                if (x === null || y === null) return;
                if (!moved) { ctx.moveTo(x, y); moved = true; } else { ctx.lineTo(x, y); }
              });
              ctx.stroke();
            });
            ctx.restore();
          });
        }
      })
    }];
  }
  updateAllViews() { if (this.requestUpdate) this.requestUpdate(); }
  attached({requestUpdate}) { this.requestUpdate = requestUpdate; }
  detached() { this.requestUpdate = null; }
  
  start(l, p) { this.deselectAll(); this.cur = { points: [{logical: l, price: p}], selected: false }; this.lines.push(this.cur); this.isDraw = true; }
  add(l, p) { if (this.isDraw && this.cur) { this.cur.points.push({logical: l, price: p}); this.updateAllViews(); } }
  stop() { this.isDraw = false; this.cur = null; }
  clear() { this.lines = []; this.updateAllViews(); }
  undo() { this.lines.pop(); this.updateAllViews(); }
  deleteSelected() { this.lines = this.lines.filter(l => !l.selected); this.updateAllViews(); }
  deselectAll() { this.lines.forEach(l => l.selected = false); this.updateAllViews(); }
  
  checkHit(x, y) {
    let hit = null;
    for (let i = this.lines.length - 1; i >= 0; i--) {
      const l = this.lines[i];
      if (l.points.length < 2) continue;
      for (let j = 0; j < l.points.length - 1; j++) {
        const x1 = this.chart.timeScale().logicalToCoordinate(l.points[j].logical);
        const y1 = this.series.priceToCoordinate(l.points[j].price);
        const x2 = this.chart.timeScale().logicalToCoordinate(l.points[j+1].logical);
        const y2 = this.series.priceToCoordinate(l.points[j+1].price);
        if (x1 === null || y1 === null || x2 === null || y2 === null) continue;
        
        const l2 = (x2 - x1)**2 + (y2 - y1)**2;
        let t = l2 === 0 ? 0 : ((x - x1) * (x2 - x1) + (y - y1) * (y2 - y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        const dist = Math.hypot(x - (x1 + t * (x2 - x1)), y - (y1 + t * (y2 - y1)));
        
        if (dist < 6) { hit = l; break; }
      }
      if (hit) break;
    }
    this.deselectAll();
    if (hit) { hit.selected = true; this.updateAllViews(); return true; }
    return false;
  }
}

  };
};

container.addEventListener('pointerdown', e => {

}, true);

}, true);

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && _drawOn) S._setDrawMode(false);

function _ensureAlertLabel(a){
  if(a.labelEl && a.labelEl.isConnected) return a.labelEl;
  const cont = document.getElementById('alert-labels');
  if(!cont) return null;
  const el = document.createElement('div');
  el.className = 'alert-lbl-item';
  el.dataset.aid = a.id;
  cont.appendChild(el);
  a.labelEl = el;
  return el;
}

function _removeAlertLabel(a){
  if(a.labelEl){
    try{ a.labelEl.remove(); }catch(e){}
    a.labelEl = null;
  }
}

function updateAlertLabels(){
  const cont = document.getElementById('alert-labels');
  if(!cont || !S.charts.main || !S.series.candle) return;

  const live = S.livePrice || 0;
  const ct = document.getElementById('c-main');
  if(!ct) return;
  const H = ct.clientHeight;
  const W = XH.scaleWidth || 68;

  /* ՄԻԱՅՆ active alert-ները chart-ի վրա */
  const activeAlerts = S.alerts.filter(a => a.symbol === S.symbol && a.status === 'active');
  const activeIds = new Set(activeAlerts.map(a => a.id));

  /* Remove stale labels (alerts deleted or wrong symbol) */
  cont.querySelectorAll('.alert-lbl-item').forEach(el => {
    if(!el.dataset.aid || !activeIds.has(el.dataset.aid)){
      el.remove();
    }
  });

  /* Ensure label exists for each active alert */
  activeAlerts.forEach(a => { _ensureAlertLabel(a); });

  /* Compute Y + text, then collision-adjust */
  const visible = [];
  activeAlerts.forEach(a => {
    const el = a.labelEl;
    if(!el) return;

    let y;
    try{ y = S.series.candle.priceToCoordinate(a.price); }catch(e){ y = null; }
    if(y == null || y < -10 || y > H + 10){
      el.style.display = 'none';
      return;
    }

    const pct = live ? ((a.price - live)/live)*100 : 0;
    const cls = pct > 0.005 ? 'pos' : pct < -0.005 ? 'neg' : 'zero';

    el.className = 'alert-lbl-item';
    el.innerHTML =
      `<span class="tag">ALERT</span>` +
      `<span class="p">${fmtP(a.price)}</span>` +
      `<span class="sep">│</span>` +
      `<span class="pct ${cls}">${pct>0?'+':''}${pct.toFixed(2)}%</span>`;

    el.style.right = (W + 6) + 'px';
    visible.push({ el, y });
  });

  /* Collision avoidance — sort by Y, push down if overlapping */
  visible.sort((a, b) => a.y - b.y);
  const LABEL_H = 20;
  let lastY = -Infinity;
  visible.forEach(v => {
    let ty = v.y;
    if(ty - lastY < LABEL_H) ty = lastY + LABEL_H;
    if(ty < 10) ty = 10;
    if(ty > H - 10) ty = H - 10;
    lastY = ty;
    v.el.style.top = ty + 'px';
    v.el.style.display = 'flex';
  });
}

/* ═══════════════ DATA BUILDERS ═══════════════ */
function buildOIMap(){
const m = new Map();
if(!S.oiRaw.length) return m;
const period = tfSec(oiPer(S.tf));
S.oiRaw.forEach(o => {
const t = Math.floor((o.timestamp/1000)/period)*period;
m.set(t, parseFloat(o.sumOpenInterestValue));
});
return m;
}
function buildLSRMap(){
const m = new Map();
if(!S.lsrRaw.length) return m;
const period = tfSec(oiPer(S.tf));
S.lsrRaw.forEach(o => {
const t = Math.floor((o.timestamp/1000)/period)*period;
m.set(t, parseFloat(o.longShortRatio));
});
return m;
}

function buildOICandles(){
const period = tfSec(oiPer(S.tf));
const m = buildOIMap();
const out = [];
let prev = null;
S.prices.forEach(b => {
const bucket = Math.floor(b.time/period)*period;
const v = m.get(bucket);
if(v == null){ out.push({ time: b.time }); return; }
const o = prev == null ? v : prev;
const c = v;
const up = c >= o;
out.push({
time: b.time,
open: o, high: Math.max(o, c), low: Math.min(o, c), close: c,
color: up ? C.UP : C.DN,
borderColor: up ? C.UP : C.DN,
wickColor: up ? C.UP : C.DN
});
prev = v;
});
return out;
}

function buildOID(){
const period = tfSec(oiPer(S.tf));
const m = buildOIMap();
const out = [];
let prev = null;
S.prices.forEach(b => {
const bucket = Math.floor(b.time/period)*period;
const v = m.get(bucket);
if(v == null){ out.push({ time:b.time }); return; }
if(prev == null){ out.push({ time:b.time, value:0, color:'#6b7280' }); prev=v; return; }
const d = v - prev;
out.push({ time:b.time, value:d, color: d>=0 ? C.YELLOW : C.DN });
prev = v;
});
return out;
}
function buildBSDFut(){
return S.prices.map(b => {
const d = (b.takerBuy||0)-(b.takerSell||0);
return { time:b.time, value:d, color: d>=0 ? C.UP : C.DN };
});
}
function buildBSDSpot(){
if(!S.spotBars.size) return S.prices.map(p=>({ time:p.time, value:0 }));
return S.prices.map(b => {
const sp = S.spotBars.get(b.time);
if(!sp) return { time:b.time, value:0 };
const d = (sp.takerBuy||0)-(sp.takerSell||0);
return { time:b.time, value:d, color: d>=0 ? C.UP : C.DN };
});
}
function buildLSR(){
if(!S.lsrRaw.length) return S.prices.map(p=>({ time:p.time }));
const period = tfSec(oiPer(S.tf));
const m = buildLSRMap();
return S.prices.map(p => {
const bucket = Math.floor(p.time/period)*period;
const v = m.get(bucket);
return v==null ? { time:p.time } : { time:p.time, value:v };
});
}
function buildRSI(){
const out = [];
let aG=0, aL=0;
const period = 14;
for(let i=0;i<S.prices.length;i++){
if(i===0){ out.push({ time:S.prices[0].time }); continue; }
const d = S.prices[i].close - S.prices[i-1].close;
const g = d>0 ? d : 0;
const l = d<0 ? -d : 0;
aG = (aG*(period-1)+g)/period;
aL = (aL*(period-1)+l)/period;
if(i < period){ out.push({ time:S.prices[i].time }); continue; }
out.push({ time:S.prices[i].time, value: 100 - 100/(1 + aG/(aL||1)) });
}
return out;
}

/* renderPanel — set data with time-scale propagation suppressed.
    This prevents B/S-scatter bug when setData triggers internal range change. */
function renderPanel(type){
const p = S.panels[type];
if(!p) return;
const d = {
oi: buildOICandles(),
oid: buildOID(),
bsdFut: buildBSDFut(), bsdSpot: buildBSDSpot(),
lsr: buildLSR(), rsi: buildRSI()
};
const wasSyncing = S._syncing;
S._syncing = true;
try {
try{ p.def.render(p.obj, d); }catch(e){ console.warn(type, e); }
} finally {
S._syncing = wasSyncing;
}
}

function renderAllPanels(){
/* Suppress time-scale propagation across the entire batch */
const wasSyncing = S._syncing;
S._syncing = true;
try {
S.order.forEach(renderPanel);
} finally {
S._syncing = wasSyncing;
}
}

/* ═══════════════ VOLUME PROFILE ═══════════════ */
function initVP(){
const cv = $('#vpc');
S.vp.cv = cv;
S.vp.ctx = cv.getContext('2d');
const resize = () => {
const st = $('#c-main');
const dpr = window.devicePixelRatio || 1;
cv.width = Math.round(st.clientWidth * dpr);
cv.height = Math.round(st.clientHeight * dpr);
cv.style.width = st.clientWidth + 'px';
cv.style.height = st.clientHeight + 'px';
S.vp.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
S.vp.lastKey = '';
};
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#c-main'));
setTimeout(resize, 80);
const loop = () => {
if(S.vp.en && S.charts.main && S.series.candle && S.prices.length) drawVP();
requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}

function drawVP(){
const vp = S.vp;
if(!vp.ctx || !S.prices.length) return;
const cv = vp.cv, ctx = vp.ctx;
const W = cv.clientWidth, H = cv.clientHeight;
ctx.clearRect(0,0,W,H);
const vr = S.charts.main.timeScale().getVisibleRange();
if(!vr) return;
const vis = S.prices.filter(p => p.time >= vr.from && p.time <= vr.to);
if(vis.length < 3) return;
const minP = Math.min(...vis.map(c => c.low));
const maxP = Math.max(...vis.map(c => c.high));
const range = maxP - minP;
if(range <= 0) return;
const buckets = Math.max(50, Math.min(200, Math.floor(H/3)));
const bucket = range/buckets;
const hist = new Array(buckets).fill(0);
vis.forEach(c => {
const lo = c.low, hi = c.high, tp = (hi+lo+c.close)/3, cR = hi-lo;
if(cR<=0){
const b = Math.min(buckets-1, Math.max(0, Math.floor((c.close-minP)/bucket)));
hist[b] += c.volume; return;
}
const b1 = Math.max(0, Math.floor((lo-minP)/bucket));
const b2 = Math.min(buckets-1, Math.floor((hi-minP)/bucket));
let totalW = 0; const weights = [];
for(let b=b1;b<=b2;b++){
const center = minP+(b+0.5)*bucket;
const dist = Math.abs(center-tp)/(cR/2);
const w = Math.max(0.05, 1-Math.min(1,dist));
weights.push(w); totalW+=w;
}
if(totalW<=0) return;
for(let i=0;i<weights.length;i++) hist[b1+i]+=c.volume*(weights[i]/totalW);
});
const maxV = Math.max(...hist);
if(maxV <= 0) return;
let poc = 0;
for(let i=1;i<buckets;i++) if(hist[i] > hist[poc]) poc = i;
const rightEdge = W - vp.offR;
const s = S.series.candle;
for(let i=0;i<buckets;i++){
const lowP = minP+i*bucket;
const highP = lowP+bucket;
let yT, yB;
try{
yT = s.priceToCoordinate(highP);
yB = s.priceToCoordinate(lowP);
}catch(e){ continue; }
if(yT == null || yB == null) continue;
const y = Math.min(yT,yB);
const h = Math.max(1, Math.abs(yB-yT)-1);
if(y+h<0 || y>H) continue;
const intensity = hist[i]/maxV;
const len = intensity * vp.w;
const alpha = 0.22 + intensity*0.68;
ctx.fillStyle = `rgba(0,255,213,${alpha})`;
ctx.fillRect(0, y, len, h);
}
const pocPrice = minP + poc*bucket + bucket/2;
let pocY;
try{ pocY = s.priceToCoordinate(pocPrice); }catch(e){ pocY=null; }
if(pocY != null){
ctx.strokeStyle = 'rgba(255,214,10,0.5)';
ctx.lineWidth = 1;
ctx.setLineDash([4,4]);
ctx.beginPath(); ctx.moveTo(0,pocY); ctx.lineTo(rightEdge,pocY); ctx.stroke();
ctx.setLineDash([]);
ctx.font = '9px JetBrains Mono, monospace';
ctx.fillStyle = 'rgba(255,214,10,0.7)';
ctx.textAlign = 'right';
ctx.fillText('POC '+fmtP(pocPrice), rightEdge-2, pocY-3);
}
}

function toggleVP(){
S.vp.en = !S.vp.en;
const el = document.querySelector('#mi [data-tool="vp"]');
el && el.classList.toggle('on', S.vp.en);
if(!S.vp.en && S.vp.ctx) S.vp.ctx.clearRect(0,0,S.vp.cv.width,S.vp.cv.height);
S.vp.lastKey = '';
toast('Volume Profile ' + (S.vp.en?'on':'off'));
saveLayout();
}

/* ═══════════════ FETCHING ═══════════════ */
async function fetchSpot(tf, limit, endTime){
try{
let u = `${CFG.spot}/klines?symbol=${S.symbol}&interval=${tf}&limit=${limit}`;
if(endTime) u += `&endTime=${endTime}`;
const r = await get(u);
if(!Array.isArray(r)) return [];
return r.map(k => {
const vol = parseFloat(k[5]), tb = parseFloat(k[9]);
return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
});
}catch(e){ return []; }
}

async function fetchInit(){
load(true);
try{
const sym = S.symbol, tf = S.tf;
// 1. Արագ քաշում ենք միայն գրաֆիկի հիմքը (մոմիկներ, տիկեր, սփոթ)
const [kl, tk, spot] = await Promise.all([
  get(`${CFG.rest}/klines?symbol=${sym}&interval=${tf}&limit=1000`),
  get(`${CFG.rest}/ticker/24hr?symbol=${sym}`).catch(()=>null),
  fetchSpot(tf, 1000)
]);
if(!Array.isArray(kl) || !kl.length) throw new Error('No klines');
if(sym !== S.symbol || tf !== S.tf) return;

const bars = kl.map(k => {
  const vol = parseFloat(k[5]), tb = parseFloat(k[9]);
  return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
});
S.rawBars.clear(); bars.forEach(b => S.rawBars.set(b.time, b));
S.spotBars.clear(); (spot||[]).forEach(b => S.spotBars.set(b.time, b));
S.oldestTime = kl[0][0];
S.noMore = false;

// 2. ՄՈՄԻԿՆԵՐԸ ՆԿԱՐՈՒՄ ԵՆՔ ԱՆՄԻՋԱՊԵՍ (ոչ մի բան չենք սպասում)
S._syncing = true;
try { rebuild(); } finally { S._syncing = false; }

const last = S.prices[S.prices.length-1];
if(last){
  S.livePrice = last.close;
  const n = S.prices.length;
  S._syncing = true;
  try{ S.charts.main.timeScale().setVisibleLogicalRange({ from: Math.max(0, n-150), to: n+3 }); }catch(e){}
  S._syncing = false;
  updateHUD(last.close, tk ? parseFloat(tk.priceChangePercent) : null);
  scheduleAutoCheck();
}
updateAlertLabel();
S.vp.lastKey = '';
S._ready = true;

// 3. Էկրանը հանում ենք լոադինգից, քանի որ մոմիկներն արդեն էկրանին են
load(false);

// 4. OI և LSR քաշում ենք ՖՈՆՈՒՄ (500-ական կտորներով), մինչև հասնենք մոմիկների սկզբին (kl[0][0])
Promise.all([
  fetchAllOI(tf, kl[0][0]).catch(()=>[]),
  fetchAllLSR(tf, kl[0][0]).catch(()=>[])
]).then(([oi, lsr]) => {
  // Երբ ֆոնային քաշումը ավարտվի, ստուգում ենք, որ օգտատերը չի փոխել սիմվոլը կամ TF-ը
  if(sym !== S.symbol || tf !== S.tf) return;
  
  S.oiRaw = oi.slice().sort((a,b)=>a.timestamp-b.timestamp);
  S.lsrRaw = lsr.slice().sort((a,b)=>a.timestamp-b.timestamp);
  
  // Թարմացնում ենք պանելները նոր եկած տվյալներով
  S._syncing = true;
  try {
    if(S.panels.oi) renderPanel('oi');
    if(S.panels.oid) renderPanel('oid');
    if(S.panels.lsr) renderPanel('lsr');
    if(S.panels.rsi) renderPanel('rsi');
  } finally {
    S._syncing = false;
  }
  syncAllPanelsToMain();
}).catch(e => console.warn('BG OI/LSR fetch failed:', e));

}catch(e){
  console.error(e);
  toast('Fetch error: '+e.message, 'e');
  load(false);
}
}

async function fetchAllOI(tf, targetMs){
const per = oiPer(tf);
let all = [], end = null;
for(let i=0;i<30;i++){
try{
const u = `https://fapi.binance.com/futures/data/openInterestHist?symbol=${S.symbol}&period=${per}&limit=500${end?'&endTime='+end:''}`;
const r = await get(u);
if(!Array.isArray(r) || !r.length) break;
all = r.concat(all);
if(r.length<500) break;
end = r[0].timestamp - 1;
if(targetMs && r[0].timestamp <= targetMs) break;
await sleep(60);
}catch(e){ break; }
}
return all;
}
async function fetchAllLSR(tf, targetMs){
const per = oiPer(tf);
let all = [], end = null;
for(let i=0;i<30;i++){
try{
const u = `https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${S.symbol}&period=${per}&limit=500${end?'&endTime='+end:''}`;
const r = await get(u);
if(!Array.isArray(r) || !r.length) break;
all = r.concat(all);
if(r.length<500) break;
end = r[0].timestamp - 1;
if(targetMs && r[0].timestamp <= targetMs) break;
await sleep(60);
}catch(e){ break; }
}
return all;
}

/* ───── loadHistory — the critical part ───── */
async function loadHistory(chunks = 2){
if(S.loadingHist || S.noMore || !S.oldestTime || !S._ready) return;

S.loadingHist = true;
_cancelAutoAnim();

const sym = S.symbol, tf = S.tf;
try{
const batchBars = Math.min(chunks * 500, 1500);
const end = S.oldestTime - 1;
const [kl, spot] = await Promise.all([
  get(`${CFG.rest}/klines?symbol=${sym}&interval=${tf}&limit=${batchBars}&endTime=${end}`),
  fetchSpot(tf, Math.min(batchBars, 500), end).catch(()=>[])
]);
if(sym !== S.symbol || tf !== S.tf){ S.loadingHist = false; return; }
if(!Array.isArray(kl) || !kl.length){ S.noMore = true; S.loadingHist = false; return; }

const bars = kl.map(k => {
  const vol = parseFloat(k[5]), tb = parseFloat(k[9]);
  return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
});
bars.forEach(b => S.rawBars.set(b.time, b));
(spot||[]).forEach(b => S.spotBars.set(b.time, b));
S.oldestTime = kl[0][0];

const [oi, lsr] = await Promise.all([
  fetchAllOI(tf, kl[0][0]).catch(()=>[]),
  fetchAllLSR(tf, kl[0][0]).catch(()=>[])
]);
if(sym !== S.symbol || tf !== S.tf){ S.loadingHist = false; return; }
const om = new Map(S.oiRaw.map(o => [o.timestamp, o]));
oi.forEach(o => om.set(o.timestamp, o));
S.oiRaw = [...om.values()].sort((a,b)=>a.timestamp-b.timestamp);
const lm = new Map(S.lsrRaw.map(o => [o.timestamp, o]));
lsr.forEach(o => lm.set(o.timestamp, o));
S.lsrRaw = [...lm.values()].sort((a,b)=>a.timestamp-b.timestamp);
}catch(e){
  console.warn('loadHistory fetch:', e);
  S.loadingHist = false;
  return;
}

/* ★ RECAPTURE — fetch-ի ընթացքում user-ը կարող էր scroll անել,
   ուստի capture-ը պետք ա ԼԻՆԻ ՀԵՆՑ ՀԻՄԱ, ոչ թե fetch-ից առաջ */
const origLogical = S.charts.main.timeScale().getVisibleLogicalRange();
const oldLen = S.prices.length;

/* ★ ՄԵԿ synchronous block — setData + restore, առանց paint-ի միջև */
S._syncing = true;
try{
  /* Rebuild S.prices */
  const raw = Array.from(S.rawBars.values()).sort((a,b)=>a.time-b.time);
  S.prices = raw.map(b => ({...b}));
  if(S.prices.length) S.livePrice = S.prices[S.prices.length-1].close;

  /* setData — այստեղ ա LWC-ն shift անում (աջ-եզր anchor) */
  if(S.series.candle) S.series.candle.setData(S.prices);
  if(S.series.volume) S.series.volume.setData(S.prices.map(p => ({ time:p.time, value:p.volume, color:C.VOL })));
  if(S._autoS) S._autoS.setData(S.prices.map(p => ({ time:p.time, value:p.close })));
  rebuildAlertLines();

  /* ★ RESTORE — ՆՈՒՅՆ block-ում, LWC-ն դեռ չի paint արել */
  const newLen = S.prices.length;
  const shift = newLen - oldLen;
  if(origLogical && shift > 0){
    try{
      S.charts.main.timeScale().setVisibleLogicalRange({
        from: origLogical.from + shift,
        to: origLogical.to + shift
      });
    }catch(e){}
  }
}finally{
  S._syncing = false;
}

/* Panels — առանձին block, չեն ազդում main chart-ի վրա */
S._syncing = true;
try{
  S.order.forEach(renderPanel);
  syncAllPanelsToMain();
}finally{
  S._syncing = false;
}

S.vp.lastKey = '';
S.loadingHist = false;
}

function rebuild(){
const raw = Array.from(S.rawBars.values()).sort((a,b)=>a.time-b.time);
S.prices = raw.map(b => ({...b}));
if(S.prices.length) S.livePrice = S.prices[S.prices.length-1].close;
if(S.series.candle) S.series.candle.setData(S.prices);
if(S.series.volume) S.series.volume.setData(S.prices.map(p => ({ time:p.time, value:p.volume, color:C.VOL })));
if(S._autoS){ try{ S._autoS.setData(S.prices.map(p => ({ time:p.time, value:p.close }))); }catch(e){} }  // ← NEW
rebuildAlertLines();   // ← NEW
S.vp.lastKey = '';
}

function setupPriceLineWheelZoom() {
const ct = $('#c-main');
if(!ct) return;

ct.addEventListener('wheel', e => {
const rc = ct.getBoundingClientRect();
const scaleW = (typeof XH !== 'undefined' && XH.scaleWidth) ? XH.scaleWidth : 68;

if(e.clientX < rc.right - scaleW) return;

e.preventDefault();
e.stopPropagation();

if(window._isFakeDrag) return;
window._isFakeDrag = true;

const target = document.elementFromPoint(e.clientX, e.clientY) || ct;
const dy = e.deltaY > 0 ? -25 : 25; 

const oCap = target.setPointerCapture;
const oRel = target.releasePointerCapture;
target.setPointerCapture = function(){};
target.releasePointerCapture = function(){};

try {
  const ev = { clientX: e.clientX, clientY: e.clientY, bubbles: true, pointerId: 9999, isPrimary: true, button: 0, buttons: 1 };
  target.dispatchEvent(new PointerEvent('pointerdown', ev));
  ev.clientY += dy;
  target.dispatchEvent(new PointerEvent('pointermove', ev));
  ev.buttons = 0;
  target.dispatchEvent(new PointerEvent('pointerup', ev));
} catch(err){} 
finally {
  if(oCap !== undefined) target.setPointerCapture = oCap; else delete target.setPointerCapture;
  if(oRel !== undefined) target.releasePointerCapture = oRel; else delete target.releasePointerCapture;
  window._isFakeDrag = false;
}
}, { passive: false, capture: true });

ct.addEventListener('dblclick', e => {
const rc = ct.getBoundingClientRect();
const scaleW = (typeof XH !== 'undefined' && XH.scaleWidth) ? XH.scaleWidth : 68;

if(e.clientX < rc.right - scaleW) return;

e.preventDefault(); 
e.stopPropagation();

try { S.charts.main.priceScale('right').applyOptions({ autoScale: true }); } catch(err){}
}, { capture: true });
}

function upsert(bar){
const last = S.prices[S.prices.length-1];
if(!last || last.time < bar.time){ S.prices.push(bar); if(S.prices.length > 2000) S.prices.shift(); }
else if(last.time === bar.time){ S.prices[S.prices.length-1] = bar; }
else return;
S.livePrice = bar.close;

/* Main chart — use update() for performance */
S._syncing = true;
try {
try{ S.series.candle.update(bar); }catch(e){}
try{ S.series.volume.update({ time:bar.time, value:bar.volume, color:C.VOL }); }catch(e){}
if(S._autoS){ try{ S._autoS.update({ time:bar.time, value:bar.close }); }catch(e){} } 
} finally {
S._syncing = false;
}

updateHUD(bar.close, null);
checkAlerts(bar.close);
updateAlertLabel();

/* Panels — full setData rebuild (avoids any partial-update desync) */
S._syncing = true;
try {
if(S.panels.oi) renderPanel('oi');
if(S.panels.oid) renderPanel('oid');
if(S.panels.bsd) renderPanel('bsd');
if(S.panels.lsr) renderPanel('lsr');
if(S.panels.rsi) renderPanel('rsi');
} finally {
S._syncing = false;
}

S.vp.lastKey = '';
}

if(pe){ pe.textContent = fmtP(p); pe.style.color = ch != null ? (ch>=0 ? C.UP : C.DN) : '#eaeaea'; }
if(ch != null && isFinite(ch)){
const ce = $('#hc');
if(ce){ ce.textContent = (ch>0?'+':'')+ch.toFixed(2)+'%'; ce.style.color = ch>=0 ? C.UP : C.DN; }
}
}

/* ═══════════════ MULTI PRICE ALERTS ═══════════════ */
let _alertSeq = 0;
function _nextAlertId(){ return 'a_' + Date.now().toString(36) + '_' + (++_alertSeq); }

function _createAlertLine(a){
  if(!S.series.candle || a.symbol !== S.symbol) return;
  /* Միայն ACTIVE alert-ները line են ստանում */
  if(a.status !== 'active') return;
  try{
    a.line = S.series.candle.createPriceLine({
      price: a.price,
      color: C.ACCENT,
      lineWidth: 2,
      lineStyle: 2,
      axisLabelVisible: false,
      title: ''
    });
  }catch(e){ a.line = null; }
}

function addAlert(price){
  if(!isFinite(price) || price <= 0) return null;
  const a = {
    id: _nextAlertId(),
    price,
    line: null,
    last: S.livePrice || null,
    status: 'active',
    createdAt: Date.now(),
    triggeredAt: null,
    symbol: S.symbol
  };
  S.alerts.push(a);
  _createAlertLine(a);
  _ensureAlertLabel(a);   // ← NEW
  renderAlertList();
  updateAlertLabels();
  return a;
}

function removeAlert(id){
  const i = S.alerts.findIndex(a => a.id === id);
  if(i < 0) return;
  const a = S.alerts[i];
  if(a.line && S.series.candle){
    try{ S.series.candle.removePriceLine(a.line); }catch(e){}
  }
  _removeAlertLabel(a);   // ← NEW
  S.alerts.splice(i, 1);
  renderAlertList();
  updateAlertLabels();
}

function clearAllAlerts(){
  S.alerts.forEach(a => {
    if(a.line && S.series.candle){
      try{ S.series.candle.removePriceLine(a.line); }catch(e){}
    }
    _removeAlertLabel(a);   // ← NEW
  });
  S.alerts = [];
  renderAlertList();
  updateAlertLabels();
}

function rebuildAlertLines(){
  if(!S.series.candle) return;
  S.alerts.forEach(a => {
    if(a.line){
      try{ S.series.candle.removePriceLine(a.line); }catch(e){}
      a.line = null;
    }
  });
  S.alerts.forEach(a => {
    if(a.symbol !== S.symbol) return;
    _createAlertLine(a);
  });
}

function renderAlertList(){
  const list = $('#pa-list');
  if(!list) return;

  const mine = S.alerts.filter(a => a.symbol === S.symbol);
  const cnt = $('#pa-count');
  if(cnt) cnt.textContent = mine.length;

  if(!mine.length){ list.innerHTML = ''; return; }

  list.innerHTML = mine.map(a => {
    const isSent = a.status === 'sent';
    const t = new Date(a.createdAt).toTimeString().slice(0,5);
    return `
      <div class="pa-item ${a.status}" data-aid="${a.id}">
        <span class="p">${fmtP(a.price)}</span>
        <span class="st">${t}</span>
        <span class="ok">${isSent ? '✓' : ''}</span>
        <button class="x" data-aid="${a.id}" title="Remove"><i class="fa-solid fa-xmark"></i></button>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.x').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      removeAlert(btn.dataset.aid);
    });
  });
}

function setAlert(){
  const input = $('#pa');
  if(!input) return;
  const v = parseFloat(input.value);
  if(!isFinite(v) || v <= 0){ toast('Invalid price','e'); return; }
  const a = addAlert(v);
  if(!a) return;
  input.value = '';
  input.focus();
  const st = $('#pa-st');
  if(st){
    st.textContent = 'added @ ' + fmtP(v);
    st.classList.add('warn'); st.classList.remove('ok');
  }
}

function checkAlerts(p){
  if(!S.alerts.length) return;
  let changed = false;
  S.alerts.forEach(a => {
    if(a.status !== 'active') return;
    if(a.symbol !== S.symbol) return;
    const prev = a.last;
    a.last = p;
    if(prev == null) return;
    const crossed = (prev < a.price && p >= a.price) || (prev > a.price && p <= a.price);
    if(!crossed) return;

    a.status = 'sent';
    a.triggeredAt = Date.now();

    /* Line-ը ջնջվում է, նորը ՉԻ ստեղծվում */
    if(a.line && S.series.candle){
      try{ S.series.candle.removePriceLine(a.line); }catch(e){}
      a.line = null;
    }
    /* Label-ը DOM-ից ջնջվում է */
    _removeAlertLabel(a);

    beep(1200);
    toast('🔔 Alert: ' + fmtP(p), 'w');
    if(S.tg.token && S.tg.chat){
      /* ★ NEW · off-screen clean 1280×720 snap via queue */
      enqueueSnap({
        symbol: S.symbol.replace('USDT',''),
        tf: S.tf,
        tgToken: S.tg.token,
        tgChat: S.tg.chat,
        caption: `🔔 <b>PRICE ALERT</b>\n${S.symbol} crossed ${fmtP(a.price)}\nNow: ${fmtP(p)}`,
      });
    }
    changed = true;
  });
  if(changed) renderAlertList();
  updateAlertLabels();   // ← NEW (ամեն tick-ի pct-ը թարմանա)
}

let _ac = null;
function beep(f=880){
try{
if(!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)();
if(_ac.state === 'suspended') _ac.resume();
const o = _ac.createOscillator();
const g = _ac.createGain();

o.start(); o.stop(_ac.currentTime + 0.12);
}catch(e){}
}

/* ═══════════════ MEASURE ═══════════════ */
function setupMeasure(){
const ct = $('#c-main');
const rect = $('#mr'), lbl = $('#ml'), center = $('#mc');
let msr=false, sx=0, sy=0, sp=0, shift=false;
const lock = v => {
try{ S.charts.main.applyOptions({ handleScroll:!v, handleScale:!v }); }catch(e){}
ct.style.cursor = v ? 'crosshair' : '';
};
window.addEventListener('keydown', e => { if(e.key === 'Shift' && !shift){ shift=true; lock(true); } });
window.addEventListener('keyup', e => { if(e.key === 'Shift'){ shift=false; if(!msr) lock(false); } });
window.addEventListener('blur', ()=>{ if(shift && !msr){ shift=false; lock(false); } });
ct.addEventListener('mousedown', e => {
if(!e.shiftKey || e.button !== 0) return;
const rc = ct.getBoundingClientRect();
sx = e.clientX - rc.left; sy = e.clientY - rc.top;
try{ sp = S.series.candle.coordinateToPrice(sy); }catch(err){ return; }
if(sp == null) return;
msr = true; lock(true);
rect.style.display='block'; lbl.style.display='block'; center.style.display='block';
e.preventDefault(); e.stopPropagation();
}, true);
window.addEventListener('mousemove', e => {
if(!msr) return;
const rc = ct.getBoundingClientRect();
const cx = e.clientX - rc.left, cy = e.clientY - rc.top;
let cp;
try{ cp = S.series.candle.coordinateToPrice(cy); }catch(err){ return; }
if(cp == null) return;
const l = Math.min(sx,cx), t = Math.min(sy,cy);
const w = Math.abs(cx-sx), h = Math.abs(cy-sy);
rect.style.left = l+'px'; rect.style.top = t+'px';
rect.style.width = w+'px'; rect.style.height = h+'px';
const up = cp >= sp;
const col = up ? C.UP : C.DN;
rect.style.borderColor = col;
rect.style.background = up ? 'rgba(0,255,200,0.08)' : 'rgba(168,85,247,0.08)';
const pct = ((cp-sp)/sp)*100;
const cX = l+w/2, cY = t+h/2;
center.style.left = cX+'px';
center.style.top = cY+'px';
center.style.borderColor = col;
lbl.innerHTML = `<div class="pc" style="color:${col}">${pct>0?'+':''}${pct.toFixed(2)}%</div><div class="sb">${fmtP(sp)} → ${fmtP(cp)}</div>`;
lbl.style.left = cX+'px';
lbl.style.top = cY+'px';
lbl.style.borderColor = col;
e.preventDefault(); e.stopPropagation();
}, true);
window.addEventListener('mouseup', e => {
if(!msr) return;
msr = false;
setTimeout(()=>{ if(!msr){ rect.style.display='none'; lbl.style.display='none'; center.style.display='none'; } }, 2200);
if(!e.shiftKey && !shift) lock(false);
e.preventDefault(); e.stopPropagation();
}, true);
}

/* ═══════════════════════════════════════════════════════════════════
   OFF-SCREEN SNAP · generateSnapImage()
   ─────────────────────────────────────────────────────────────────
   Ստեղծում է clean 1280×720 JPEG պատկեր `position:fixed; left:-100000px`
   container-ի մեջ — ԱՌԱՆՑ visible UI-ին դիպչելու։
   Երբ symbol/tf նույնն է → օգտագործում է հիշողության մեջ եղած տվյալները։
   Երբ տարբեր է → fetch անում է off-screen-ի համար (visible chart-ը անփոփոխ)։
   ═══════════════════════════════════════════════════════════════════ */

/* ─── Fetch helpers · off-screen-ի համար (S.symbol-ից անկախ) ─── */
async function _fetchSpotFor(sym, tf, limit, endTime) {
  try {
    let u = `${CFG.spot}/klines?symbol=${sym}&interval=${tf}&limit=${limit}`;
    if (endTime) u += `&endTime=${endTime}`;
    const r = await get(u);
    if (!Array.isArray(r)) return [];
    return r.map(k => {
      const vol = parseFloat(k[5]), tb = parseFloat(k[9]);
      return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
    });
  } catch (e) { return []; }
}

async function _fetchAllOIFor(sym, tf) {
  const per = oiPer(tf);
  let all = [], end = null;
  for (let i = 0; i < 30; i++) {
    try {
      const u = `https://fapi.binance.com/futures/data/openInterestHist?symbol=${sym}&period=${per}&limit=500${end ? '&endTime='+end : ''}`;
      const r = await get(u);
      if (!Array.isArray(r) || !r.length) break;
      all = r.concat(all);
      if (r.length < 500) break;
      end = r[0].timestamp - 1;
      await sleep(60);
    } catch (e) { break; }
  }
  return all;
}

async function _fetchAllLSRFor(sym, tf) {
  const per = oiPer(tf);
  let all = [], end = null;
  for (let i = 0; i < 30; i++) {
    try {
      const u = `https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${sym}&period=${per}&limit=500${end ? '&endTime='+end : ''}`;
      const r = await get(u);
      if (!Array.isArray(r) || !r.length) break;
      all = r.concat(all);
      if (r.length < 500) break;
      end = r[0].timestamp - 1;
      await sleep(60);
    } catch (e) { break; }
  }
  return all;
}

/* ─── Parameterized panel data builders ─── */
function _snapBuildOICandles(bars, oiRaw, tf) {
  const period = tfSec(oiPer(tf));
  const m = new Map();
  oiRaw.forEach(o => {
    const t = Math.floor((o.timestamp / 1000) / period) * period;
    m.set(t, parseFloat(o.sumOpenInterestValue));
  });
  const out = [];
  let prev = null;
  bars.forEach(b => {
    const bucket = Math.floor(b.time / period) * period;
    const v = m.get(bucket);
    if (v == null) { out.push({ time: b.time }); return; }
    const o = prev == null ? v : prev;
    const c = v;
    const up = c >= o;
    out.push({
      time: b.time,
      open: o, high: Math.max(o, c), low: Math.min(o, c), close: c,
      color: up ? C.UP : C.DN, borderColor: up ? C.UP : C.DN, wickColor: up ? C.UP : C.DN
    });
    prev = v;
  });
  return out;
}

function _snapBuildOID(bars, oiRaw, tf) {
  const period = tfSec(oiPer(tf));
  const m = new Map();
  oiRaw.forEach(o => {
    const t = Math.floor((o.timestamp / 1000) / period) * period;
    m.set(t, parseFloat(o.sumOpenInterestValue));
  });
  const out = [];
  let prev = null;
  bars.forEach(b => {
    const bucket = Math.floor(b.time / period) * period;
    const v = m.get(bucket);
    if (v == null) { out.push({ time: b.time }); return; }
    if (prev == null) { out.push({ time: b.time, value: 0, color: '#6b7280' }); prev = v; return; }
    const d = v - prev;
    out.push({ time: b.time, value: d, color: d >= 0 ? C.YELLOW : C.DN });
    prev = v;
  });
  return out;
}

function _snapBuildBSDFut(bars) {
  return bars.map(b => {
    const d = (b.takerBuy || 0) - (b.takerSell || 0);
    return { time: b.time, value: d, color: d >= 0 ? C.UP : C.DN };
  });
}

function _snapBuildBSDSpot(bars, spotBars) {
  return bars.map(b => {
    const sp = spotBars.get(b.time);
    if (!sp) return { time: b.time, value: 0 };
    const d = (sp.takerBuy || 0) - (sp.takerSell || 0);
    return { time: b.time, value: d, color: d >= 0 ? C.UP : C.DN };
  });
}

/* ─── Off-screen mini-chart factory ─── */
function _snapMkChart(container, width, height, opts = {}) {
  return LWC.createChart(container, {
    width, height,
    layout: {
      background: { type: 'solid', color: 'transparent' },
      textColor: '#6b7280',
      fontFamily: 'JetBrains Mono, monospace',
      fontSize: 10,
    },
    grid: {
      vertLines: { color: 'rgba(255,255,255,0.02)' },
      horzLines: { color: 'rgba(255,255,255,0.02)' },
    },
    crosshair: {
      mode: 0,
      vertLine: { color: 'transparent', width: 1, labelVisible: false },
      horzLine: { color: 'rgba(255,255,255,0.22)', width: 1, style: 3, labelVisible: false, labelBackgroundColor: '#1c1f26' },
    },
    timeScale: {
      timeVisible: true, secondsVisible: false,
      borderColor: 'rgba(255,255,255,0.05)',

    },
    rightPriceScale: {

      scaleMargins: opts.margins || { top: 0.1, bottom: 0.1 },
      autoScale: true,
      minimumWidth: 68,
    },
    handleScroll: false,
    handleScale: false,
  });
}

/* ═══════════════════════════════════════════════════════════════════
   generateSnapImage · գլխավոր generator
   ═══════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   generateSnapImage · DIRECT CANVAS EXPORT (100% Background/Tab Safe)
   Չի օգտագործում html2canvas. Ուղղակիորեն կարդում է Lightweight Charts-ի 
   կանվասները, ուստի աշխատում է անկախ նրանից տաբը ակտիվ է, թե ոչ։
   ═══════════════════════════════════════════════════════════════════ */

async function generateSnapImage(opts = {}) {
  const symbol = String(opts.symbol || S.symbol).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/USDT$/,'');
  const tf = opts.tf || S.tf;
  const width = opts.width || 1280;
  const height = opts.height || 720;
  const panels = opts.panels || ['oi', 'oid', 'bsd'];
  const PANEL_H = 100;
  const HEADER_H = 44;

  const curSym = S.symbol.replace('USDT','').toUpperCase();
  const sameLive = (symbol === curSym) && (tf === S.tf);

  /* ─── 1. DATA · հիշողությունից կամ fetch ─── */
  let bars, spotBars, oiRaw, lsrRaw, ticker;
  if (sameLive && S.prices.length) {
    bars = S.prices.slice();
    spotBars = new Map(S.spotBars);
    oiRaw = S.oiRaw.slice();
    lsrRaw = S.lsrRaw.slice();
    ticker = null;
  } else {
    const sym = symbol + 'USDT';
    const [kl, tk, spot, oi, lsr] = await Promise.all([
      get(`${CFG.rest}/klines?symbol=${sym}&interval=${tf}&limit=1000`),
      get(`${CFG.rest}/ticker/24hr?symbol=${sym}`).catch(() => null),
      _fetchSpotFor(sym, tf, 1000),
      _fetchAllOIFor(sym, tf),
      _fetchAllLSRFor(sym, tf),
    ]);
    if (!Array.isArray(kl) || !kl.length) throw new Error('No klines for ' + symbol);
    bars = kl.map(k => {
      const vol = parseFloat(k[5]), tb = parseFloat(k[9]);
      return { time: Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:vol, takerBuy:tb, takerSell:vol-tb };
    });
    spotBars = new Map((spot || []).map(b => [b.time, b]));
    oiRaw = oi;
    lsrRaw = lsr;
    ticker = tk;
  }
  if (!bars.length) throw new Error('No data');

  const lastBar = bars[bars.length - 1];
  const livePrice = lastBar.close;
  const pct = ticker ? parseFloat(ticker.priceChangePercent) : 0;
  const upCol = pct >= 0 ? '#00ffc8' : '#a855f7';

  /* ─── 2. DOM ROOT (Տեղադրում ենք էկրանին թափանցիկ, որպեսզի բրաուզերը նկարի) ─── */
  const root = document.createElement('div');
  root.style.cssText = `position:fixed;left:0;top:0;width:${width}px;height:${height}px;background:#0d1017;display:grid;grid-template-rows:${HEADER_H}px 1fr;z-index:999999;opacity:0.01;pointer-events:none;overflow:hidden;font-family:Inter,sans-serif;`;

  root.innerHTML = `
    <div id="snap-header" style="display:flex;align-items:center;gap:8px;padding:0 10px;background:#11141b;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;">
      <div style="background:rgba(0,0,0,.4);border:1px solid rgba(0,255,213,.2);color:#fff;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;min-width:82px;text-align:center;text-transform:uppercase;">${symbol}</div>
      <div style="display:flex;gap:14px;align-items:center;margin:0 8px;">
        <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;">
          <span style="font-size:7px;color:#6b7280;letter-spacing:1px;font-weight:700;">PRICE</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:${upCol};">${fmtP(livePrice)}</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;">
          <span style="font-size:7px;color:#6b7280;letter-spacing:1px;font-weight:700;">24H</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:${upCol};">${pct>0?'+':''}${pct.toFixed(2)}%</span>
        </div>
      </div>
      <div style="display:flex;gap:1px;background:rgba(0,0,0,.4);padding:2px;border-radius:5px;border:1px solid rgba(255,255,255,.05);">
        ${['1m','5m','15m','1h','4h','1d'].map(t =>
          `<span style="padding:4px 7px;border-radius:3px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;${t===tf?'background:rgba(8,153,129,.08);color:#089981;':'color:#6b7280;'}">${t.toUpperCase()}</span>`
        ).join('')}
      </div>
    </div>
    <div id="snap-body" style="display:flex;flex-direction:column;overflow:hidden;min-height:0;background:#0d1017;"></div>
  `;

  document.body.appendChild(root);

  const bodyEl = root.querySelector('#snap-body');
  const chartsToCleanup = [];

  try {
    /* ─── 3. MAIN CHART ─── */
    const MAIN_H = height - HEADER_H - panels.length * PANEL_H;
    const mainEl = document.createElement('div');
    mainEl.style.cssText = `flex:0 0 auto;width:${width}px;height:${MAIN_H}px;position:relative;overflow:hidden;`;
    bodyEl.appendChild(mainEl);

    const mainCh = _snapMkChart(mainEl, width, MAIN_H, { margins: { top: 0.05, bottom: 0.30 } });
    chartsToCleanup.push(mainCh);

    const candleS = mainCh.addCandlestickSeries({
      upColor: C.UP, downColor: C.DN, borderVisible: false,
      wickUpColor: C.UP, wickDownColor: C.DN,
      priceFormat: { type: 'custom', formatter: fmtP, minMove: 1e-8 },
      lastValueVisible: true, priceLineVisible: true, priceLineColor: C.UP,
    });
    candleS.setData(bars);

    const volS = mainCh.addHistogramSeries({
      color: C.VOL, priceFormat: { type: 'volume' }, priceScaleId: 'vol',
      lastValueVisible: false, priceLineVisible: false,
    });
    volS.setData(bars.map(b => ({ time: b.time, value: b.volume, color: C.VOL })));
    mainCh.priceScale('vol').applyOptions({ scaleMargins: { top: 0.78, bottom: 0 }, visible: false });

    const n = bars.length;
    mainCh.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 150), to: n + 3 });

    /* ─── 4. PANELS ─── */
    const PANEL_DEF = {
      oi: {
        title: 'OPEN INTEREST', icon: 'chart-line', color: C.ACCENT,
        build(ch) {
          return { s: ch.addCandlestickSeries({
            upColor: C.UP, downColor: C.DN, borderUpColor: C.UP, borderDownColor: C.DN,
            wickUpColor: C.UP, wickDownColor: C.DN, borderVisible: false,
            priceFormat: { type: 'custom', formatter: fmtOI, minMove: 0.01 },
            lastValueVisible: true, priceLineVisible: false,
          }) };
        },
        render(o, d) { o.s.setData(_snapBuildOICandles(d.bars, d.oiRaw, d.tf)); },
      },
      oid: {
        title: 'OI DELTA', icon: 'right-left', color: C.YELLOW,
        build(ch) { return { s: ch.addHistogramSeries({
          priceFormat: { type: 'volume' }, lastValueVisible: false, priceLineVisible: false,
        }) }; },
        render(o, d) { o.s.setData(_snapBuildOID(d.bars, d.oiRaw, d.tf)); },
      },
      bsd: {
        title: 'B/S DELTA', icon: 'layer-group', color: C.UP,
        build(ch) {
          const fut = ch.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'bs', lastValueVisible: false, priceLineVisible: false });
          const spot = ch.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'bs', lastValueVisible: false, priceLineVisible: false });
          ch.priceScale('bs').applyOptions({ scaleMargins: { top: 0.15, bottom: 0.15 } });
          return { fut, spot };
        },
        render(o, d) {
          o.fut.setData(_snapBuildBSDFut(d.bars));
          o.spot.setData(_snapBuildBSDSpot(d.bars, d.spotBars));
        },
      },
    };

    const PANEL_BODY_H = PANEL_H - 22;
    panels.forEach(type => {
      const def = PANEL_DEF[type];
      if (!def) return;

      const pEl = document.createElement('div');
      pEl.style.cssText = `flex:0 0 auto;width:${width}px;height:${PANEL_H}px;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid rgba(255,255,255,.05);`;
      pEl.innerHTML = `
        <div style="display:flex;align-items:center;height:22px;padding:0 8px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.05);font-size:9px;font-weight:700;letter-spacing:1px;color:#6b7280;text-transform:uppercase;flex-shrink:0;">
          <i class="fa-solid fa-${def.icon}" style="font-size:9px;color:${def.color};margin-right:5px;"></i>
          <span>${def.title}</span>
        </div>
        <div class="snap-panel-body" style="width:${width}px;height:${PANEL_BODY_H}px;position:relative;overflow:hidden;"></div>
      `;
      bodyEl.appendChild(pEl);

      const pBody = pEl.querySelector('.snap-panel-body');
      const pCh = _snapMkChart(pBody, width, PANEL_BODY_H, { margins: { top: 0.15, bottom: 0.15 }, showTimeAxis: false });
      chartsToCleanup.push(pCh);

      const obj = def.build(pCh);
      def.render(obj, { bars, oiRaw, spotBars, lsrRaw, tf });
      pCh.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 150), to: n + 3 });
    });

    /* ─── 5. Spasum enq render-ին ─── */
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 400));

    /* ─── 6. MASTER CANVAS · Հավաքում ենք ամեն ինչ մի նկարի մեջ ─── */
    const masterCanvas = document.createElement('canvas');
    const scale = 2; // High DPI (Retina)
    masterCanvas.width = width * scale;
    masterCanvas.height = height * scale;
    const ctx = masterCanvas.getContext('2d');
    ctx.scale(scale, scale);

    // Ֆոնը
    ctx.fillStyle = '#0d1017';
    ctx.fillRect(0, 0, width, height);

    // Կարդում ենք Header-ը (html2canvas-ով կամ ուղղակի նկարում ենք, քանի որ header-ում կանվաս չկա)
    const headerEl = root.querySelector('#snap-header');
    const headerCanvas = await html2canvas(headerEl, { backgroundColor: '#11141b', scale: 1, logging: false });
    ctx.drawImage(headerCanvas, 0, 0, width, HEADER_H);

    // Կարդում ենք բոլոր Lightweight Charts-ի ներսի իրական կանվասները
    const subCanvases = root.querySelectorAll('canvas');
    subCanvases.ValueOf = Array.from(subCanvases);
    
    for (const subCv of subCanvases) {
      if (subCv.width === 0 || subCv.height === 0) continue;
      const rect = subCv.getBoundingClientRect();
      const rootRect = root.getBoundingClientRect();
      
      const x = rect.left - rootRect.left;
      const y = rect.top - rootRect.top;
      
      ctx.drawImage(subCv, x, y, rect.width, rect.height);
    }

    const blob = await new Promise(r => masterCanvas.toBlob(r, 'image/jpeg', 0.92));
    if (!blob) throw new Error('masterCanvas blob null');
    return blob;

  } finally {
    chartsToCleanup.forEach(ch => { try { ch.remove(); } catch (e) {} });
    try { root.remove(); } catch (e) {}
  }
}

/* ═══════════════════════════════════════════════════════════════════
   SNAP QUEUE · serializes jobs — multiple alerts չեն կռվի
   ═══════════════════════════════════════════════════════════════════ */
const _snapQueue = [];
let _snapBusy = false;

function enqueueSnap(job) {
  _snapQueue.push(job);
  _processSnapQueue();
}

async function _processSnapQueue() {
  if (_snapBusy) return;
  _snapBusy = true;
  while (_snapQueue.length) {
    const job = _snapQueue.shift();
    try {
      const blob = await generateSnapImage({
        symbol: job.symbol,
        tf: job.tf,
        width: 1280,
        height: 720,
        panels: job.panels || ['oi', 'oid', 'bsd'],
      });

      if (job.tgToken && job.tgChat) {
        const fd = new FormData();
        fd.append('chat_id', job.tgChat);
        fd.append('photo', blob, 'snap.jpg');
        if (job.caption) fd.append('caption', job.caption);
        fd.append('parse_mode', 'HTML');
        const r = await fetch(`https://api.telegram.org/bot${job.tgToken}/sendPhoto`, {
          method: 'POST', body: fd,
        });
        const j = await r.json();
        console.log('[snapQueue] TG:', j);
        if (!j.ok) throw new Error('TG: ' + (j.description || 'error'));
      } else {
        const a = document.createElement('a');
        a.download = `snap_${job.symbol}_${job.tf}_${Date.now()}.jpg`;
        a.href = URL.createObjectURL(blob);
        a.click();
      }
    } catch (err) {
      console.error('[snapQueue] failed:', err);
    }
  }
  _snapBusy = false;
}


/* ═══════════════ PRICE-LINE WHEEL ZOOM ═══════════════
   Երբ mouse-ը alert price line-ի մոտ է (±24px), wheel-ը անում է
   ՄԻԱՅՆ ուղղահայաց (price) zoom: Anchor = S.alert.price,
   time axis-ը մնում է անփոփոխ:
*/
function setupPriceScaleCustomZoom() {
  const ct = document.getElementById('c-main');
  if (!ct) return;

  ct.addEventListener('wheel', (e) => {
    const rect = ct.getBoundingClientRect();
    if ((e.clientX - rect.left) <= (rect.width - 70)) return;

    e.preventDefault();
    e.stopPropagation();

    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target || target.tagName !== 'CANVAS') return;

    // e.deltaY > 0 (ներքև սքրոլ) = zoom out (քաշում ենք վերև՝ -25)
    // e.deltaY < 0 (վերև սքրոլ) = zoom in (քաշում ենք ներքև՝ +25)
    const dy = e.deltaY > 0 ? -25 : 25;

    // Լոկալ անջատում ենք միայն այս event-ի պաշտպանությունը, որպեսզի օրիգինալ քաշելը չվնասվի
    const origSet = target.setPointerCapture;
    const origRel = target.releasePointerCapture;
    target.setPointerCapture = function() {};
    target.releasePointerCapture = function() {};

        try {
      const evInit = {
        bubbles: true, cancelable: true, pointerId: 9999,
        isPrimary: true, button: 0, buttons: 1,
        clientX: e.clientX, clientY: e.clientY
      };
      
      target.dispatchEvent(new PointerEvent('pointerdown', evInit));
      evInit.clientY += dy;
      target.dispatchEvent(new PointerEvent('pointermove', evInit));
      evInit.buttons = 0;
      target.dispatchEvent(new PointerEvent('pointerup', evInit));
    } catch(err) {} 
    finally {
      if (origSet !== undefined) target.setPointerCapture = origSet; else delete target.setPointerCapture;
      if (origRel !== undefined) target.releasePointerCapture = origRel; else delete target.releasePointerCapture;
    }
  }, { passive: false, capture: true });

  ct.addEventListener('dblclick', (e) => {
    const rect = ct.getBoundingClientRect();
    if ((e.clientX - rect.left) <= (rect.width - 70)) return;
    e.preventDefault(); e.stopPropagation();
    const ps = S.charts.main?.priceScale('right');
    if (ps) ps.applyOptions({ autoScale: true });
  }, { capture: true });
}

/* ═══════════════════════════════════════════════════════════
   SNAPSHOT TARGET — 1 աղբյուր save / copy / snap-ի համար
   ═══════════════════════════════════════════════════════════ */
function getSnapshotTarget() {
    return {
        el: document.getElementById('app'),   // ★ ամբողջ էջը, header-ով
        hide: [
            '#mr','#ml','#mc',
            '#cursor-lbl','#alert-labels',
            '#xh-line','#xh-label',
            '.ctrl-toggle-btn',
            '#ctx','#ld','#tst',
            '#left-bar','#ctrl',
        ].map(s => document.querySelector(s)),
    };
}

async function copyShot(){
    const { el, hide } = getSnapshotTarget();
    hide.forEach(x => x && (x.style.display='none'));
    try {
        const cv = await html2canvas(el, {
            backgroundColor:'#0d1017', scale:2, logging:false, useCORS:true,
            width: el.clientWidth, height: el.clientHeight,
        });
        const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
        if (!blob) throw new Error('no blob');
        const fname = `${S.symbol}_${Date.now()}.png`;

        /* ① Desktop — Clipboard API */
        if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                toast('Screenshot copied');
                return;
            } catch(err) {
                console.warn('[copyShot] clipboard failed:', err);
            }
        }

        /* ② Mobile — Web Share (native sheet → Copy / Share / Save) */
        if (navigator.share && navigator.canShare) {
            try {
                const file = new File([blob], fname, { type: 'image/png' });
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'Chart · ' + S.symbol });
                    return;
                }
            } catch(err) {
                if (err.name !== 'AbortError') console.warn('[copyShot] share failed:', err);
            }
        }

        /* ③ Fallback — download */
        const a = document.createElement('a');
        a.download = fname;
        a.href = URL.createObjectURL(blob);
        a.click();
        toast('Downloaded (clipboard unavailable)');
    } catch(e) {
        console.error('[copyShot]', e);
        toast('Copy failed', 'e');
    } finally {
        hide.forEach(x => x && (x.style.display=''));
        updateAlertLabel();
    }
}
async function saveShot(){
    const { el, hide } = getSnapshotTarget();
    hide.forEach(x => x && (x.style.display='none'));
    try {
        const cv = await html2canvas(el, {
            backgroundColor:'#0d1017', scale:2, logging:false, useCORS:true,
            width: el.clientWidth, height: el.clientHeight,
        });
        const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
        if (!blob) throw new Error('no blob');
        const fname = `${S.symbol}_${Date.now()}.png`;

        /* ① Download (desktop Chrome/Firefox, Android Chrome) */
        const a = document.createElement('a');
        a.download = fname;
        a.href = URL.createObjectURL(blob);
        a.click();

        /* ② iOS Safari — download չի աշխատում → Web Share fallback */
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS && navigator.share && navigator.canShare) {
            try {
                const file = new File([blob], fname, { type: 'image/png' });
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'Chart · ' + S.symbol });
                }
            } catch(err) {
                if (err.name !== 'AbortError') console.warn('[saveShot] share:', err);
            }
        }
    } catch(e) {
        console.error('[saveShot]', e);
        toast('Save failed', 'e');
    } finally {
        hide.forEach(x => x && (x.style.display=''));
        updateAlertLabel();
    }
}
