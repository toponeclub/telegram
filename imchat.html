<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | THE BUNKER NODE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #050506;
            --surface: rgba(15, 15, 20, 0.8);
            --accent: #4deeea;
            --accent-dim: rgba(77, 238, 234, 0.15);
            --border: rgba(255, 255, 255, 0.05);
            --text: #e2e2e2;
            --text-dim: #666;
            --danger: #ff4a4a;
            --glass: blur(20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; overflow: hidden;
        }

        /* --- UI Framework --- */
        .app-shell {
            display: flex; height: 100vh; width: 100vw;
            background: radial-gradient(circle at 50% 50%, #0d1211 0%, #050506 100%);
            position: relative;
        }

        /* Sidebar: Contacts */
        .sidebar {
            width: 320px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; background: rgba(0,0,0,0.2);
            backdrop-filter: var(--glass); z-index: 10;
        }

        .node-header { padding: 25px; border-bottom: 1px solid var(--border); }
        .node-id-tag { 
            font-family: 'JetBrains Mono', monospace; font-size: 10px; 
            color: var(--accent); background: var(--accent-dim);
            padding: 4px 8px; border-radius: 4px; display: inline-block;
        }

        .contacts-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-card {
            padding: 15px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 5px; border: 1px solid transparent;
        }
        .contact-card:hover { background: rgba(255,255,255,0.03); }
        .contact-card.active { background: var(--accent-dim); border-color: var(--border); }

        /* Generative Avatar System */
        .avatar-box {
            width: 42px; height: 42px; border-radius: 8px;
            background: #111; overflow: hidden; position: relative;
            display: flex; flex-wrap: wrap; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .pixel { width: 20%; height: 20%; }

        /* Main Chat Area */
        .chat-view { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { 
            padding: 20px 30px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .messages-flow { 
            flex: 1; padding: 30px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 20px;
        }

        /* Hold-to-Reveal Logic */
        .msg-bubble {
            max-width: 70%; padding: 14px 18px; border-radius: 18px;
            font-size: 14px; line-height: 1.5; position: relative;
            transition: filter 0.3s ease, opacity 0.3s ease;
            cursor: pointer; user-select: none;
            filter: blur(8px); opacity: 0.4;
        }
        .msg-bubble.revealed { filter: blur(0); opacity: 1; }
        
        .msg-sent { align-self: flex-end; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #1a1a1f; border-bottom-left-radius: 4px; }

        /* Input Bar */
        .controls-bar { 
            padding: 20px 30px; border-top: 1px solid var(--border);
            display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.2);
        }

        .input-field {
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 20px; color: #fff; outline: none;
        }
        .input-field:focus { border-color: var(--accent); }

        .icon-btn {
            background: none; border: none; color: var(--text-dim);
            font-size: 18px; cursor: pointer; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .icon-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
        .icon-btn.active { color: var(--accent); background: var(--accent-dim); }
        .btn-send { background: var(--accent); color: #000; width: 45px; height: 45px; border-radius: 12px; }

        /* Login Screen */
        .auth-overlay {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }

        .auth-card {
            width: 100%; max-width: 400px; text-align: center;
        }

        .status-tag { width: 8px; height: 8px; border-radius: 50%; background: #333; margin-right: 8px; display: inline-block; }
        .online { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* Custom Audio Style */
        audio { height: 30px; filter: invert(1); opacity: 0.7; }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h1 style="letter-spacing: 5px; font-weight: 300;">IMCHAT</h1>
            <p style="color: var(--accent); font-size: 11px; margin-bottom: 40px;">BUNKER_NODE_INITIALIZATION</p>
            
            <div style="display: grid; gap: 10px;">
                <button class="icon-btn" style="width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 25px;" onclick="Engine.connectWallet('evm')">
                    <i class="fa-solid fa-fox"></i> &nbsp; METAMASK_AUTH
                </button>
                <button class="icon-btn" style="width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 25px;" onclick="Engine.connectWallet('solana')">
                    <i class="fa-solid fa-ghost"></i> &nbsp; PHANTOM_AUTH
                </button>
            </div>
            <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 20px;"></p>
        </div>
    </div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="node-header">
                <div id="my-avatar" style="margin-bottom: 15px;"></div>
                <div class="node-id-tag" id="my-address-display">0x...</div>
            </div>
            
            <div class="contacts-scroll" id="contacts-list"></div>

            <div style="padding: 20px; border-top: 1px solid var(--border);">
                <input type="text" id="add-peer-id" class="input-field" placeholder="Enter Wallet Address..." style="font-size: 12px; margin-bottom: 10px; width: 100%;">
                <button class="icon-btn" style="width: 100%; border: 1px solid var(--accent); color: var(--accent);" onclick="Engine.addPeer()">ADD_PEER</button>
            </div>
        </aside>

        <main class="chat-view">
            <div id="empty-state" style="position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 5;">
                <i class="fa-solid fa-radiation" style="font-size: 40px; color: var(--border); margin-bottom: 20px;"></i>
                <p style="color: var(--text-dim); font-size: 13px; letter-spacing: 2px;">SECURE_TUNNEL_IDLE</p>
            </div>

            <header class="chat-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="active-avatar"></div>
                    <div>
                        <div id="active-peer-name" style="font-weight: 700; font-size: 14px; font-family: 'JetBrains Mono';">Unknown_Node</div>
                        <div style="font-size: 11px; color: var(--text-dim);"><span class="status-tag" id="active-status-dot"></span><span id="active-status-text">DISCONNECTED</span></div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="icon-btn" title="Send Crypto" onclick="Engine.sendTransaction()"><i class="fa-solid fa-wallet"></i></button>
                    <button class="icon-btn" title="Delete Peer" onclick="Engine.deleteActivePeer()"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </header>

            <div class="messages-flow" id="messages-flow"></div>

            <footer class="controls-bar">
                <input type="file" id="file-input" hidden onchange="Engine.handleFileUpload(this.files[0])">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                
                <button class="icon-btn" id="voice-toggle" onmousedown="Engine.startVoice()" onmouseup="Engine.stopVoice()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                
                <button class="icon-btn" id="cyber-mic-btn" onclick="Engine.toggleCyberMic()" title="Cyber-Mic Distortion">
                    <i class="fa-solid fa-robot"></i>
                </button>

                <input type="text" id="chat-input" class="input-field" placeholder="Type encrypted message..." onkeypress="if(event.key === 'Enter') Engine.sendText()">
                
                <button class="icon-btn btn-send" onclick="Engine.sendText()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </footer>
        </main>
    </div>

<script>
/**
 * IMCHAT ENGINE v3.0 (Production Build)
 */

const Crypto = {
    async generateKeys() {
        return await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-384" }, true, ["deriveKey"]);
    },
    async deriveSecret(priv, pub) {
        return await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, priv, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    },
    async encrypt(key, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decrypt(key, obj) {
        try {
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(obj.iv) }, key, new Uint8Array(obj.data));
            return new TextDecoder().decode(decrypted);
        } catch(e) { return "[ENCRYPTED_DATA_CORRUPT]"; }
    }
};

const Avatar = {
    generate(address, targetId) {
        const hash = address.toLowerCase().replace('0x', '');
        const container = document.getElementById(targetId);
        container.innerHTML = '';
        container.className = 'avatar-box';
        
        // 5x5 Grid Generation based on Address Hex
        for (let i = 0; i < 25; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            const hexColor = hash.substring(i % hash.length, (i % hash.length) + 6);
            // Symmetry logic
            const color = (parseInt(hash[i % hash.length], 16) % 2 === 0) ? '#' + hexColor : 'transparent';
            pixel.style.backgroundColor = color;
            container.appendChild(pixel);
        }
    }
};

const Engine = {
    peer: null,
    myAddress: null,
    connections: {}, // address -> {conn, aesKey}
    activePeer: null,
    isCyberMic: false,
    audioCtx: null,
    mediaRecorder: null,
    stream: null,

    // --- Auth ---
    async connectWallet(type) {
        try {
            if (window.location.protocol === 'file:') throw new Error("Please run via Local Server.");
            let address = "";
            if (type === 'evm' && window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                address = accounts[0];
            } else if (type === 'solana' && window.solana) {
                const resp = await window.solana.connect();
                address = resp.publicKey.toString();
            } else throw new Error("Wallet not found.");

            this.myAddress = address;
            this.initP2P();
        } catch (e) { document.getElementById('auth-error').innerText = e.message; }
    },

    initP2P() {
        document.getElementById('auth-screen').style.display = 'none';
        const nodeId = "im_" + btoa(this.myAddress).replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
        this.peer = new Peer(nodeId);

        this.peer.on('open', () => {
            Avatar.generate(this.myAddress, 'my-avatar');
            document.getElementById('my-address-display').innerText = this.myAddress.slice(0, 8) + "..." + this.myAddress.slice(-4);
            this.loadContacts();
        });

        this.peer.on('connection', conn => this.setupConn(conn));
    },

    // --- Contacts ---
    async addPeer() {
        const addr = document.getElementById('add-peer-id').value.trim();
        if (!addr || addr === this.myAddress) return;
        
        let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        if (!contacts.includes(addr)) {
            contacts.push(addr);
            localStorage.setItem('contacts', JSON.stringify(contacts));
        }
        this.loadContacts();
        this.connectToPeer(addr);
    },

    loadContacts() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        contacts.forEach(addr => {
            const card = document.createElement('div');
            card.className = `contact-card ${this.activePeer === addr ? 'active' : ''}`;
            card.onclick = () => this.selectChat(addr);
            
            const avId = 'av-' + addr.slice(-4);
            card.innerHTML = `<div id="${avId}"></div><div style="font-size:12px; font-family:'JetBrains Mono';">${addr.slice(0,6)}...${addr.slice(-4)}</div>`;
            list.appendChild(card);
            Avatar.generate(addr, avId);
        });
    },

    // --- Connection Logic ---
    connectToPeer(address) {
        const nodeId = "im_" + btoa(address).replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
        const conn = this.peer.connect(nodeId);
        this.setupConn(conn);
    },

    async setupConn(conn) {
        const ecdh = await Crypto.generateKeys();
        const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);

        conn.on('open', () => {
            conn.send({ type: 'handshake', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
        });

        conn.on('data', async data => {
            if (data.type === 'handshake') {
                const peerPub = await crypto.subtle.importKey("raw", new Uint8Array(data.pub), { name: "ECDH", namedCurve: "P-384" }, true, []);
                const aesKey = await Crypto.deriveSecret(ecdh.privateKey, peerPub);
                this.connections[data.address] = { conn, aesKey, status: 'online' };
                this.updateUI();
            } 
            if (data.type === 'enc') {
                const session = this.connections[Object.keys(this.connections).find(k => this.connections[k].conn === conn)];
                const decrypted = await Crypto.decrypt(session.aesKey, data.payload);
                this.pushMsg(JSON.parse(decrypted), 'received');
            }
        });

        conn.on('close', () => this.updateUI());
    },

    // --- Messaging ---
    async sendText() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !this.activePeer) return;

        const msg = { type: 'text', body: text, time: Date.now() };
        this.sendToActive(msg);
        input.value = '';
    },

    async sendToActive(msg) {
        const session = this.connections[this.activePeer];
        if (!session) return;
        const enc = await Crypto.encrypt(session.aesKey, JSON.stringify(msg));
        session.conn.send({ type: 'enc', payload: enc });
        this.pushMsg(msg, 'sent');
    },

    pushMsg(msg, dir) {
        const flow = document.getElementById('messages-flow');
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble msg-${dir}`;
        
        // Anti-Screenshot Interaction
        bubble.onmousedown = bubble.ontouchstart = () => bubble.classList.add('revealed');
        bubble.onmouseup = bubble.onmouseleave = bubble.ontouchend = () => bubble.classList.remove('revealed');

        if (msg.type === 'text') bubble.innerText = msg.body;
        if (msg.type === 'voice') bubble.innerHTML = `<audio src="${msg.body}" controls></audio>`;
        if (msg.type === 'file') bubble.innerHTML = `<a href="${msg.body}" download="${msg.name}" style="color:var(--accent); text-decoration:none;"><i class="fa-solid fa-file-arrow-down"></i> ${msg.name}</a>`;

        flow.appendChild(bubble);
        flow.scrollTop = flow.scrollHeight;
    },

    // --- Cyber-Mic & Voice ---
    toggleCyberMic() {
        this.isCyberMic = !this.isCyberMic;
        document.getElementById('cyber-mic-btn').classList.toggle('active', this.isCyberMic);
    },

    async startVoice() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.audioCtx = new AudioContext();
            let source = this.audioCtx.createMediaStreamSource(this.stream);
            let destination = this.audioCtx.createMediaStreamDestination();

            if (this.isCyberMic) {
                // Vader / Robot Filter
                let filter = this.audioCtx.createBiquadFilter();
                filter.type = "lowshelf";
                filter.frequency.value = 400;
                filter.gain.value = 25;
                source.connect(filter);
                filter.connect(destination);
            } else {
                source.connect(destination);
            }

            this.mediaRecorder = new MediaRecorder(destination.stream);
            let chunks = [];
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = () => this.sendToActive({ type: 'voice', body: reader.result });
                reader.readAsDataURL(blob);
            };
            this.mediaRecorder.start();
            document.getElementById('voice-toggle').classList.add('active');
        } catch (e) { alert("Microphone blocked."); }
    },

    stopVoice() {
        if (this.mediaRecorder) this.mediaRecorder.stop();
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        document.getElementById('voice-toggle').classList.remove('active');
    },

    // --- File Drop ---
    async handleFileUpload(file) {
        if (file.size > 1024 * 1024 * 1024) return alert("Bunker limit: 1GB");
        const reader = new FileReader();
        reader.onload = () => this.sendToActive({ type: 'file', body: reader.result, name: file.name });
        reader.readAsDataURL(file);
    },

    // --- Finance ---
    async sendTransaction() {
        if (!this.activePeer) return;
        try {
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            // Здесь можно добавить P2P запрос chainId у друга, если нужно строгое совпадение.
            const tx = {
                from: this.myAddress,
                to: this.activePeer,
                value: '0x0' // User fills in MetaMask
            };
            await window.ethereum.request({ method: 'eth_sendTransaction', params: [tx] });
        } catch(e) { console.log("TX_CANCELLED"); }
    },

    // --- UI State ---
    selectChat(addr) {
        this.activePeer = addr;
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('active-peer-name').innerText = addr.slice(0, 10) + "...";
        Avatar.generate(addr, 'active-avatar');
        this.updateUI();
        this.loadContacts();
    },

    updateUI() {
        const session = this.connections[this.activePeer];
        const dot = document.getElementById('active-status-dot');
        const text = document.getElementById('active-status-text');
        if (session && session.conn.open) {
            dot.className = "status-tag online";
            text.innerText = "SECURE_TUNNEL_ACTIVE";
        } else {
            dot.className = "status-tag";
            text.innerText = "OFFLINE";
        }
    },

    deleteActivePeer() {
        let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        contacts = contacts.filter(a => a !== this.activePeer);
        localStorage.setItem('contacts', JSON.stringify(contacts));
        location.reload();
    }
};
</script>
</body>
</html>
