<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | SECURE NODE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #050506;
            --surface: rgba(15, 15, 20, 0.8);
            --accent: #4deeea;
            --accent-dim: rgba(77, 238, 234, 0.15);
            --border: rgba(255, 255, 255, 0.05);
            --text: #e2e2e2;
            --text-dim: #666;
            --danger: #ff4a4a;
            --glass: blur(20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; overflow: hidden;
        }

        .app-shell {
            display: flex; height: 100vh; width: 100vw;
            background: radial-gradient(circle at 50% 50%, #0d1211 0%, #050506 100%);
            position: relative; overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; background: rgba(0,0,0,0.2);
            backdrop-filter: var(--glass); z-index: 10; flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .node-header { 
            padding: 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .node-id-tag { 
            font-family: 'JetBrains Mono', monospace; font-size: 10px; 
            color: var(--accent); background: var(--accent-dim);
            padding: 4px 8px; border-radius: 4px; display: inline-block;
        }

        .list-section-title {
            font-size: 10px; color: var(--text-dim); letter-spacing: 2px;
            padding: 15px 15px 5px 15px; text-transform: uppercase;
        }

        .contacts-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        
        .contact-card {
            padding: 12px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 5px; border: 1px solid transparent;
            position: relative; transition: background 0.2s;
        }
        .contact-card:hover { background: rgba(255,255,255,0.03); }
        .contact-card.active { background: var(--accent-dim); border-color: var(--border); }
        .contact-card.request { border: 1px dashed var(--accent); }

        .contact-actions {
            position: absolute; right: 15px; display: flex; align-items: center; gap: 10px;
        }

        .sidebar-status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #333;
            transition: all 0.3s;
        }
        .sidebar-status-dot.online { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .sidebar-status-dot.pending { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; }

        .delete-btn-small {
            color: var(--text-dim); background: none; border: none; font-size: 12px;
            cursor: pointer; transition: color 0.2s; padding: 5px;
        }
        .delete-btn-small:hover { color: var(--danger); }

        /* --- Avatars --- */
        .avatar-box {
            width: 40px; height: 40px; border-radius: 8px;
            overflow: hidden; display: grid; 
            grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
            flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1);
        }
        .pixel { width: 100%; height: 100%; transition: all 0.2s; }

        /* --- Chat View --- */
        .chat-view { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        .chat-header { 
            padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .back-btn {
            display: none; color: var(--accent); background: none; border: none;
            font-size: 20px; cursor: pointer; margin-right: 15px; padding: 5px 10px 5px 0;
        }

        .messages-flow { 
            flex: 1; padding: 30px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 20px;
        }

        .msg-bubble {
            max-width: 85%; padding: 14px 18px; border-radius: 18px;
            font-size: 14px; line-height: 1.5; position: relative;
            transition: filter 0.3s ease, opacity 0.3s ease;
            word-break: break-word;
        }
        
        .msg-sent { align-self: flex-end; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #1a1a1f; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        /* Stealth Mode */
        .stealth-active .msg-bubble { filter: blur(8px); opacity: 0.4; cursor: pointer; user-select: none; }
        .stealth-active .msg-bubble:hover, .stealth-active .msg-bubble:active { filter: blur(0); opacity: 1; }

        /* --- Controls --- */
        .controls-bar { 
            padding: 15px 25px; border-top: 1px solid var(--border);
            display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.2);
        }

        .input-field {
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 15px; color: #fff; outline: none; min-width: 0;
        }
        .input-field:focus { border-color: var(--accent); }

        .icon-btn {
            background: none; border: none; color: var(--text-dim);
            font-size: 18px; cursor: pointer; width: 40px; height: 40px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
        .icon-btn.active { color: var(--accent); background: var(--accent-dim); }
        
        .btn-action {
            background: transparent; color: var(--accent); border: 1px solid var(--accent);
            padding: 12px; border-radius: 10px; cursor: pointer; font-size: 12px;
            font-weight: 600; width: 100%; transition: all 0.2s; text-align: center;
        }
        .btn-action:hover { background: var(--accent); color: var(--bg); }
        .btn-send { background: var(--accent); color: #000; width: 45px; height: 45px; border-radius: 12px; flex-shrink: 0; }

        /* --- Overlays --- */
        .auth-overlay {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card { width: 100%; max-width: 400px; text-align: center; }

        .full-overlay {
            position: absolute; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; text-align: center; padding: 20px;
        }

        /* --- Mobile Adaptation --- */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; }
            .chat-view { width: 100%; position: absolute; height: 100%; transform: translateX(100%); transition: transform 0.3s ease; }
            .app-shell.in-chat .sidebar { transform: translateX(-30%); opacity: 0; pointer-events: none; }
            .app-shell.in-chat .chat-view { transform: translateX(0); }
            .back-btn { display: flex; }
            
            .msg-bubble { max-width: 90%; }
            .controls-bar { padding: 10px 15px; }
            .chat-header { padding: 15px; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h1 style="letter-spacing: 5px; font-weight: 300;">IMCHAT</h1>
            <p style="color: var(--accent); font-size: 11px; margin-bottom: 40px;">BUNKER_NODE</p>
            
            <div id="initial-connect-box">
                <button class="btn-action" style="padding: 20px; font-size: 14px; box-shadow: 0 0 20px var(--accent-dim);" onclick="Engine.showWalletSelector()">
                    <i class="fa-solid fa-wallet"></i> &nbsp; CONNECT
                </button>
            </div>

            <div id="wallet-selector" style="display: none; animation: fadeIn 0.3s;">
                <p style="font-size: 10px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 1px;">SELECT SECURE PROVIDER:</p>
                <div style="display: grid; gap: 10px;" id="detected-wallets"></div>
                <button class="icon-btn" style="margin: 20px auto 0;" onclick="Engine.hideWalletSelector()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 20px;"></p>
        </div>
    </div>

    <div class="app-shell" id="app-shell">
        
        <aside class="sidebar">
            <div class="node-header">
                <div>
                    <div id="my-avatar" style="margin-bottom: 10px;"></div>
                    <div class="node-id-tag" id="my-address-display">0x...</div>
                </div>
                <button class="icon-btn" title="Logout" onclick="Engine.logout()"><i class="fa-solid fa-power-off"></i></button>
            </div>
            
            <div class="contacts-scroll" id="contacts-list"></div>

            <div style="padding: 20px; border-top: 1px solid var(--border);">
                <input type="text" id="add-peer-id" class="input-field" placeholder="Enter Wallet Address..." style="font-size: 12px; margin-bottom: 10px; width: 100%;">
                <button class="btn-action" onclick="Engine.addPeer()">ADD_CONTACT</button>
            </div>
        </aside>

        <main class="chat-view">
            <div id="empty-state" class="full-overlay">
                <i class="fa-solid fa-radiation" style="font-size: 40px; color: var(--border); margin-bottom: 20px;"></i>
                <p style="color: var(--text-dim); font-size: 13px; letter-spacing: 2px;">SECURE_TUNNEL_IDLE</p>
            </div>

            <div id="request-state" class="full-overlay" style="display: none; z-index: 6; background: rgba(5,5,6,0.95); backdrop-filter: blur(10px);">
                <div id="req-avatar" style="margin-bottom: 20px;"></div>
                <p style="color: var(--text); font-size: 14px; margin-bottom: 30px; font-family: 'JetBrains Mono';">Node <span id="req-id" style="color:var(--accent);"></span><br><br>Requests a secure tunnel.</p>
                <div style="display: flex; gap: 15px; width: 100%; max-width: 250px;">
                    <button class="btn-action" style="flex:1;" onclick="Engine.acceptRequest()">ACCEPT</button>
                    <button class="btn-action" style="flex:1; border-color: var(--danger); color: var(--danger);" onclick="Engine.declineRequest()">DECLINE</button>
                </div>
            </div>

            <header class="chat-header">
                <div style="display: flex; align-items: center;">
                    <button class="back-btn" onclick="Engine.closeChatMobile()"><i class="fa-solid fa-chevron-left"></i></button>
                    <div id="active-avatar" style="margin-right: 15px;"></div>
                    <div>
                        <div id="active-peer-name" style="font-weight: 700; font-size: 14px; font-family: 'JetBrains Mono';">Unknown_Node</div>
                        <div style="font-size: 11px; color: var(--text-dim);"><span class="sidebar-status-dot" style="position:static; display:inline-block; margin-right:5px;" id="active-status-dot"></span><span id="active-status-text">DISCONNECTED</span></div>
                    </div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button class="icon-btn" id="stealth-toggle" onclick="Engine.toggleStealth()" title="Stealth Mode"><i class="fa-solid fa-eye-slash"></i></button>
                    <button class="icon-btn" title="Send Crypto" onclick="Engine.sendTransaction()"><i class="fa-solid fa-wallet"></i></button>
                    <button class="icon-btn" title="Clear Chat History" onclick="Engine.clearChatHistory()"><i class="fa-solid fa-broom"></i></button>
                </div>
            </header>

            <div class="messages-flow" id="messages-flow"></div>

            <footer class="controls-bar" id="controls-bar">
                <input type="file" id="file-input" hidden onchange="Engine.handleFileUpload(this.files[0])">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                
                <button class="icon-btn" id="voice-toggle" onmousedown="Engine.startVoice()" onmouseup="Engine.stopVoice()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                
                <button class="icon-btn" id="cyber-mic-btn" onclick="Engine.toggleCyberMic()" title="Cyber-Mic">
                    <i class="fa-solid fa-robot"></i>
                </button>

                <input type="text" id="chat-input" class="input-field" placeholder="Secure comms..." onkeypress="if(event.key === 'Enter') Engine.sendText()">
                
                <button class="icon-btn btn-send" onclick="Engine.sendText()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </footer>
        </main>
    </div>

<script>
/**
 * ГЛОБАЛЬНЫЙ ПРОСЛУШИВАТЕЛЬ EIP-6963
 */
const EIPProviders = {};
window.addEventListener("eip6963:announceProvider", (event) => {
    EIPProviders[event.detail.info.uuid] = event.detail;
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

/**
 * IMCHAT ENGINE v4.0 (Sync & Mobile)
 */
const Crypto = {
    async generateKeys() {
        return await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-384" }, true, ["deriveKey"]);
    },
    async deriveSecret(priv, pub) {
        return await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, priv, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    },
    async encrypt(key, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decrypt(key, obj) {
        try {
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(obj.iv) }, key, new Uint8Array(obj.data));
            return new TextDecoder().decode(decrypted);
        } catch(e) { return "[ENCRYPTED_DATA_CORRUPT]"; }
    }
};

const Avatar = {
    generate(address, targetId) {
        const hash = address.toLowerCase().replace('0x', '');
        const container = document.getElementById(targetId);
        if (!container) return;
        container.innerHTML = '';
        container.className = 'avatar-box';
        
        const hue = parseInt(hash.substring(0, 4), 16) % 360;
        const mainColor = `hsl(${hue}, 80%, 60%)`;
        container.style.backgroundColor = `hsl(${hue}, 40%, 10%)`; 

        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                const mirrorCol = col > 2 ? 4 - col : col;
                const index = row * 3 + mirrorCol;
                if (hash.charCodeAt(index % hash.length) % 2 === 0) {
                    pixel.style.backgroundColor = mainColor;
                    pixel.style.boxShadow = `0 0 5px ${mainColor}`;
                }
                container.appendChild(pixel);
            }
        }
    }
};

const Engine = {
    peer: null,
    myAddress: null,
    connections: {}, // Holds open WebRTC connections
    activeSessions: {}, // Holds {aesKey} for verified contacts
    tempRequests: {}, // Holds {pubKey, conn} for unverified requests
    activePeer: null,
    
    // UI State
    isCyberMic: false,
    isStealth: false,
    audioCtx: null, mediaRecorder: null, stream: null,
    availableProviders: {}, activeProvider: null,

    // --- Data Management ---
    getContacts() { return JSON.parse(localStorage.getItem('contacts') || '[]'); },
    setContacts(arr) { localStorage.setItem('contacts', JSON.stringify([...new Set(arr)])); },
    getRequests() { return JSON.parse(localStorage.getItem('requests') || '[]'); },
    setRequests(arr) { localStorage.setItem('requests', JSON.stringify([...new Set(arr)])); },

    // --- Wallet Discovery ---
    showWalletSelector() {
        if (window.location.protocol === 'file:') {
            document.getElementById('auth-error').innerText = "Requires HTTP Server (Live Server)."; return;
        }

        document.getElementById('initial-connect-box').style.display = 'none';
        document.getElementById('wallet-selector').style.display = 'block';
        
        const list = document.getElementById('detected-wallets');
        list.innerHTML = '';
        this.availableProviders = {};
        const detectedNames = new Set();
        let count = 0;

        window.dispatchEvent(new Event("eip6963:requestProvider"));

        // EIP-6963 Wallets
        for (const [uuid, data] of Object.entries(EIPProviders)) {
            const name = data.info.name.toLowerCase();
            if (detectedNames.has(name)) continue; 
            detectedNames.add(name);

            this.availableProviders[uuid] = { provider: data.provider, type: 'evm' };
            let iconHtml = data.info.icon ? `<img src="${data.info.icon}" style="width:18px; height:18px; border-radius:4px;">` : `<i class="fa-solid fa-wallet"></i>`;
            list.innerHTML += `<button class="btn-action" style="padding: 15px; font-size: 13px; display:flex; align-items:center; justify-content:center; gap:10px;" onclick="Engine.connectSpecificWallet('${uuid}')">${iconHtml} <span>${data.info.name}</span></button>`;
            count++;
        }

        // Legacy Fallbacks (only if not found via EIP)
        if (window.trustwallet && !Array.from(detectedNames).some(n => n.includes('trust'))) {
            this.availableProviders['trust'] = { provider: window.trustwallet, type: 'evm' };
            list.innerHTML += `<button class="btn-action" style="padding: 15px; font-size: 13px; display:flex; align-items:center; justify-content:center; gap:10px;" onclick="Engine.connectSpecificWallet('trust')"><i class="fa-solid fa-shield-halved"></i> <span>Trust Wallet</span></button>`;
            count++;
        }
        if (window.ethereum && window.ethereum.isMetaMask && !Array.from(detectedNames).some(n => n.includes('meta'))) {
            this.availableProviders['mm'] = { provider: window.ethereum, type: 'evm' };
            list.innerHTML += `<button class="btn-action" style="padding: 15px; font-size: 13px; display:flex; align-items:center; justify-content:center; gap:10px;" onclick="Engine.connectSpecificWallet('mm')"><i class="fa-solid fa-fox"></i> <span>MetaMask</span></button>`;
            count++;
        }
        if (window.solana && window.solana.isPhantom && !Array.from(detectedNames).some(n => n.includes('phantom'))) {
            this.availableProviders['phantom'] = { provider: window.solana, type: 'solana' };
            list.innerHTML += `<button class="btn-action" style="padding: 15px; font-size: 13px; display:flex; align-items:center; justify-content:center; gap:10px;" onclick="Engine.connectSpecificWallet('phantom')"><i class="fa-solid fa-ghost"></i> <span>Phantom</span></button>`;
            count++;
        }

        if (count === 0) list.innerHTML = `<div style="color: var(--danger); font-size: 11px; padding: 15px; border: 1px dashed var(--danger); border-radius: 8px;">No Wallets Detected.</div>`;
    },

    hideWalletSelector() {
        document.getElementById('initial-connect-box').style.display = 'block';
        document.getElementById('wallet-selector').style.display = 'none';
    },

    async connectSpecificWallet(id) {
        try {
            const wallet = this.availableProviders[id];
            let address = "";
            if (wallet.type === 'evm') {
                const accounts = await wallet.provider.request({ method: 'eth_requestAccounts' });
                address = accounts[0];
            } else {
                const resp = await wallet.provider.connect();
                address = resp.publicKey.toString();
            }
            this.activeProvider = wallet.provider;
            this.myAddress = address;
            this.initP2P();
        } catch (e) { document.getElementById('auth-error').innerText = "Connection rejected."; }
    },

    logout() { location.reload(); },

    // --- Core P2P & Handshake ---
    initP2P() {
        document.getElementById('auth-screen').style.display = 'none';
        const nodeId = "im_" + btoa(this.myAddress).replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
        this.peer = new Peer(nodeId);

        this.peer.on('open', () => {
            Avatar.generate(this.myAddress, 'my-avatar');
            document.getElementById('my-address-display').innerText = this.myAddress.slice(0, 8) + "..." + this.myAddress.slice(-4);
            this.renderSidebar();
            setInterval(() => this.heartbeat(), 5000);
        });

        this.peer.on('connection', conn => this.handleConnection(conn));
    },

    heartbeat() {
        this.getContacts().forEach(addr => {
            if (!this.connections[addr] || !this.connections[addr].open) {
                const nodeId = "im_" + btoa(addr).replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
                const conn = this.peer.connect(nodeId, { reliable: true });
                this.handleConnection(conn);
            }
        });
    },

    addPeer() {
        const addr = document.getElementById('add-peer-id').value.trim();
        if (!addr || addr === this.myAddress) return;
        
        let contacts = this.getContacts();
        contacts.push(addr);
        this.setContacts(contacts);
        
        document.getElementById('add-peer-id').value = '';
        this.renderSidebar();
        this.heartbeat(); 
    },

    deleteContact(addr) {
        if(this.connections[addr]) this.connections[addr].close();
        let contacts = this.getContacts().filter(a => a !== addr);
        this.setContacts(contacts);
        
        if(this.activePeer === addr) {
            this.activePeer = null;
            document.getElementById('empty-state').style.display = 'flex';
            document.getElementById('request-state').style.display = 'none';
            document.getElementById('messages-flow').innerHTML = '';
        }
        this.renderSidebar();
    },

    clearChatHistory() {
        document.getElementById('messages-flow').innerHTML = '';
    },

    async handleConnection(conn) {
        const ecdh = await Crypto.generateKeys();
        const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);

        conn.on('open', () => {
            conn.send({ type: 'handshake', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
        });

        conn.on('data', async data => {
            if (data.type === 'handshake') {
                this.connections[data.address] = conn;
                const isContact = this.getContacts().includes(data.address);
                
                if (isContact) {
                    // Know them -> Accept and send ACK
                    const peerPub = await crypto.subtle.importKey("raw", new Uint8Array(data.pub), { name: "ECDH", namedCurve: "P-384" }, true, []);
                    this.activeSessions[data.address] = await Crypto.deriveSecret(ecdh.privateKey, peerPub);
                    conn.send({ type: 'handshake_ack', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
                    this.renderSidebar();
                    if(this.activePeer === data.address) this.updateChatHeader();
                } else {
                    // Unknown -> Put in requests
                    let reqs = this.getRequests();
                    if(!reqs.includes(data.address)) { reqs.push(data.address); this.setRequests(reqs); }
                    this.tempRequests[data.address] = { conn, pub: data.pub, ecdh };
                    conn.send({ type: 'handshake_pending', address: this.myAddress });
                    this.renderSidebar();
                }
            } 
            else if (data.type === 'handshake_ack') {
                const peerPub = await crypto.subtle.importKey("raw", new Uint8Array(data.pub), { name: "ECDH", namedCurve: "P-384" }, true, []);
                this.activeSessions[data.address] = await Crypto.deriveSecret(ecdh.privateKey, peerPub);
                this.renderSidebar();
                if(this.activePeer === data.address) this.updateChatHeader();
            }
            else if (data.type === 'handshake_pending') {
                // They received our connection but haven't accepted yet
                this.renderSidebar();
                if(this.activePeer === data.address) this.updateChatHeader();
            }
            else if (data.type === 'enc' && this.activeSessions[conn.peerAddress]) {
                const decrypted = await Crypto.decrypt(this.activeSessions[conn.peerAddress], data.payload);
                if (this.activePeer === conn.peerAddress) this.pushMsg(JSON.parse(decrypted), 'received');
            }
        });

        // Store address on conn for reverse lookup
        conn.on('data', d => { if(d.address) conn.peerAddress = d.address; });
        conn.on('close', () => { this.renderSidebar(); this.updateChatHeader(); });
        conn.on('error', () => {});
    },

    // --- Request UI Logic ---
    async acceptRequest() {
        const addr = this.activePeer;
        let reqs = this.getRequests().filter(a => a !== addr);
        this.setRequests(reqs);
        
        let contacts = this.getContacts();
        contacts.push(addr);
        this.setContacts(contacts);

        const temp = this.tempRequests[addr];
        if (temp && temp.conn.open) {
            const peerPub = await crypto.subtle.importKey("raw", new Uint8Array(temp.pub), { name: "ECDH", namedCurve: "P-384" }, true, []);
            this.activeSessions[addr] = await Crypto.deriveSecret(temp.ecdh.privateKey, peerPub);
            
            const ecdhNew = await Crypto.generateKeys();
            const myPub = await crypto.subtle.exportKey("raw", ecdhNew.publicKey);
            temp.conn.send({ type: 'handshake_ack', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
        }
        
        this.renderSidebar();
        this.selectChat(addr); // Re-render chat view
    },

    declineRequest() {
        const addr = this.activePeer;
        let reqs = this.getRequests().filter(a => a !== addr);
        this.setRequests(reqs);
        if(this.tempRequests[addr]) this.tempRequests[addr].conn.close();
        
        this.activePeer = null;
        document.getElementById('request-state').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex';
        this.renderSidebar();
    },

    // --- UI Rendering ---
    renderSidebar() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        const contacts = this.getContacts();
        const requests = this.getRequests();

        if (requests.length > 0) {
            list.innerHTML += `<div class="list-section-title">REQUESTS</div>`;
            requests.forEach(addr => list.appendChild(this.buildCard(addr, true)));
        }
        
        if (contacts.length > 0) {
            list.innerHTML += `<div class="list-section-title">SECURE NODES</div>`;
            contacts.forEach(addr => list.appendChild(this.buildCard(addr, false)));
        }
    },

    buildCard(addr, isRequest) {
        const isActive = this.connections[addr] && this.connections[addr].open;
        const isReady = this.activeSessions[addr] !== undefined;
        let statusClass = '';
        if (isActive && isReady) statusClass = 'online';
        else if (isActive && !isReady) statusClass = 'pending';

        const card = document.createElement('div');
        card.className = `contact-card ${this.activePeer === addr ? 'active' : ''} ${isRequest ? 'request' : ''}`;
        card.onclick = () => this.selectChat(addr, isRequest);
        
        const avId = 'av-s-' + addr.slice(-5);
        card.innerHTML = `
            <div id="${avId}"></div>
            <div style="font-size:12px; font-family:'JetBrains Mono';">${addr.slice(0,6)}...${addr.slice(-4)}</div>
            <div class="contact-actions">
                ${!isRequest ? `<button class="delete-btn-small" onclick="event.stopPropagation(); Engine.deleteContact('${addr}')"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                <div class="sidebar-status-dot ${statusClass}"></div>
            </div>
        `;
        // Delay avatar generation slightly to ensure DOM insertion
        setTimeout(() => Avatar.generate(addr, avId), 0);
        return card;
    },

    selectChat(addr, isRequest = false) {
        this.activePeer = addr;
        document.querySelector('.app-shell').classList.add('in-chat');
        document.getElementById('empty-state').style.display = 'none';
        
        if (isRequest || this.getRequests().includes(addr)) {
            document.getElementById('request-state').style.display = 'flex';
            document.getElementById('req-id').innerText = addr.slice(0,10) + "...";
            Avatar.generate(addr, 'req-avatar');
            document.getElementById('controls-bar').style.opacity = '0.2';
            document.getElementById('controls-bar').style.pointerEvents = 'none';
        } else {
            document.getElementById('request-state').style.display = 'none';
            document.getElementById('controls-bar').style.opacity = '1';
            document.getElementById('controls-bar').style.pointerEvents = 'auto';
            document.getElementById('active-peer-name').innerText = addr.slice(0, 10) + "...";
            Avatar.generate(addr, 'active-avatar');
            this.updateChatHeader();
        }
        this.renderSidebar();
    },

    closeChatMobile() {
        document.querySelector('.app-shell').classList.remove('in-chat');
    },

    updateChatHeader() {
        if (!this.activePeer) return;
        const isActive = this.connections[this.activePeer] && this.connections[this.activePeer].open;
        const isReady = this.activeSessions[this.activePeer] !== undefined;
        
        const dot = document.getElementById('active-status-dot');
        const text = document.getElementById('active-status-text');
        
        if (isActive && isReady) {
            dot.className = "sidebar-status-dot online";
            text.innerText = "TUNNEL_ACTIVE";
        } else if (isActive && !isReady) {
            dot.className = "sidebar-status-dot pending";
            text.innerText = "AWAITING_ACCEPTANCE";
        } else {
            dot.className = "sidebar-status-dot";
            text.innerText = "OFFLINE";
        }
    },

    // --- Chat Logic ---
    toggleStealth() {
        this.isStealth = !this.isStealth;
        const btn = document.getElementById('stealth-toggle');
        const flow = document.getElementById('messages-flow');
        
        if (this.isStealth) {
            btn.classList.add('active'); btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            flow.classList.add('stealth-active');
        } else {
            btn.classList.remove('active'); btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            flow.classList.remove('stealth-active');
        }
    },

    async sendText() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !this.activePeer) return;

        const msg = { type: 'text', body: text, time: Date.now() };
        this.sendToActive(msg);
        input.value = '';
    },

    async sendToActive(msg) {
        if (!this.activeSessions[this.activePeer]) { alert("Tunnel is not ready."); return; }
        const enc = await Crypto.encrypt(this.activeSessions[this.activePeer], JSON.stringify(msg));
        this.connections[this.activePeer].send({ type: 'enc', payload: enc });
        this.pushMsg(msg, 'sent');
    },

    pushMsg(msg, dir) {
        const flow = document.getElementById('messages-flow');
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble msg-${dir}`;
        
        if (msg.type === 'text') bubble.innerText = msg.body;
        if (msg.type === 'voice') bubble.innerHTML = `<audio src="${msg.body}" controls></audio>`;
        if (msg.type === 'file') bubble.innerHTML = `<a href="${msg.body}" download="${msg.name}" style="color:var(--accent); text-decoration:none;"><i class="fa-solid fa-file-arrow-down"></i> ${msg.name}</a>`;

        flow.appendChild(bubble);
        flow.scrollTop = flow.scrollHeight;
    },

    // --- Cyber-Mic & Media ---
    toggleCyberMic() {
        this.isCyberMic = !this.isCyberMic;
        document.getElementById('cyber-mic-btn').classList.toggle('active', this.isCyberMic);
    },

    async startVoice() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.audioCtx = new AudioContext();
            let source = this.audioCtx.createMediaStreamSource(this.stream);
            let destination = this.audioCtx.createMediaStreamDestination();

            if (this.isCyberMic) {
                let filter = this.audioCtx.createBiquadFilter();
                filter.type = "lowshelf"; filter.frequency.value = 400; filter.gain.value = 25;
                source.connect(filter); filter.connect(destination);
            } else { source.connect(destination); }

            this.mediaRecorder = new MediaRecorder(destination.stream);
            let chunks = [];
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = () => this.sendToActive({ type: 'voice', body: reader.result });
                reader.readAsDataURL(blob);
            };
            this.mediaRecorder.start();
            document.getElementById('voice-toggle').classList.add('active');
        } catch (e) { alert("Mic blocked."); }
    },
    stopVoice() {
        if (this.mediaRecorder) this.mediaRecorder.stop();
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        document.getElementById('voice-toggle').classList.remove('active');
    },
    async handleFileUpload(file) {
        if (file.size > 1024 * 1024 * 1024) return alert("Limit: 1GB");
        const reader = new FileReader();
        reader.onload = () => this.sendToActive({ type: 'file', body: reader.result, name: file.name });
        reader.readAsDataURL(file);
    },
    async sendTransaction() {
        if (!this.activePeer || !this.activeProvider) return;
        try {
            await this.activeProvider.request({ method: 'eth_sendTransaction', params: [{ from: this.myAddress, to: this.activePeer, value: '0x0' }] });
        } catch(e) {}
    }
};
</script>
