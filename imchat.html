<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | BUNKER NODE X</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #050505;
            --surface: #0a0a0c;
            --accent: #e2e2e2;
            --accent-dim: rgba(255,255,255,0.1);
            --border: rgba(255,255,255,0.08);
            --text: #e2e2e2;
            --text-muted: #666;
            --danger: #ff4444;
            --success: #00ffaa;
            --warning: #ffbb00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

        .app-shell { display: flex; height: 100vh; width: 100vw; position: relative; }

        /* Sidebar */
        .sidebar {
            width: 320px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; background: var(--surface);
            z-index: 20; transition: transform 0.3s ease; flex-shrink: 0;
        }
        .node-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .node-id-tag { font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 700; color: #000; background: var(--accent); padding: 4px 8px; border-radius: 4px; }
        .list-section-title { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; padding: 20px 20px 10px 20px; text-transform: uppercase; }
        .contacts-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-card {
            padding: 12px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 15px;
            margin-bottom: 5px; border: 1px solid transparent; position: relative;
        }
        .contact-card:hover { background: rgba(255,255,255,0.03); }
        .contact-card.active { background: var(--accent-dim); border-color: var(--border); }
        .contact-card.request { border: 1px dashed var(--warning); }
        .contact-actions { position: absolute; right: 12px; display: flex; gap: 8px; align-items: center; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: 0.2s; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 8px var(--warning); }

        /* Chat */
        .chat-view { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
        .mobile-back-btn { display: none; color: var(--accent); background: none; border: none; font-size: 18px; cursor: pointer; margin-right: 16px; }

        .messages-flow { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.received { align-self: flex-start; align-items: flex-start; }
        .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg-sent .msg-bubble { background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
        .msg-received .msg-bubble { background: #111; border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        .stealth-active .msg-bubble { filter: blur(10px); opacity: 0.2; cursor: pointer; transition: 0.2s; }
        .stealth-active .msg-bubble:hover { filter: blur(0); opacity: 1; }

        /* Controls */
        .controls-bar { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; background: var(--surface); }
        .input-field { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: #fff; outline: none; }
        .input-field:focus { border-color: var(--accent); }

        .icon-btn {
            background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer;
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: 0.2s;
        }
        .icon-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
        .icon-btn.active { color: var(--danger) !important; }
        .icon-btn.cyber-active { color: var(--success) !important; }

        .btn-action { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 12px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; width: 100%; text-align: center; transition: 0.2s; }
        .btn-action:hover { background: var(--accent); color: #000; }
        .btn-solid { background: var(--accent); color: #000; border: none; }

        /* Avatars */
        .avatar-box { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: repeat(5,1fr); grid-template-rows: repeat(5,1fr); flex-shrink: 0; border: 1px solid rgba(255,255,255,0.05); }
        .pixel { width: 100%; height: 100%; }

        /* Call Panel */
        .call-panel {
            display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(12px);
            padding: 15px 20px; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--accent-dim); animation: slideDown 0.2s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        .rec-indicator { display: none; align-items: center; gap: 6px; color: var(--danger); font-family: 'JetBrains Mono'; font-size: 12px; margin-right: 8px; }
        .rec-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0; } }

        .file-preview { display: none; padding: 10px 24px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--border); font-size: 12px; color: var(--accent); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; }
            .chat-view { width: 100%; position: absolute; height: 100%; transform: translateX(100%); transition: transform 0.3s; }
            .app-shell.in-chat .sidebar { transform: translateX(-20%); opacity: 0; pointer-events: none; }
            .app-shell.in-chat .chat-view { transform: translateX(0); }
            .mobile-back-btn { display: block; }
        }
    </style>
</head>
<body>

<div id="auth-screen" class="auth-overlay" style="position:fixed; inset:0; background:#050505; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div style="max-width:380px; text-align:center; padding:32px; border:1px solid rgba(255,255,255,0.08); border-radius:12px; background:#0a0a0c;">
        <h1 style="letter-spacing:6px; margin-bottom:30px;">IMCHAT</h1>
        <div id="initial-connect-box">
            <button class="btn-action btn-solid" style="padding:16px; font-size:14px;" onclick="App.showWalletSelector()">
                <i class="fa-solid fa-wallet"></i> &nbsp; CONNECT WALLET
            </button>
        </div>
        <div id="wallet-selector" style="display:none;">
            <div id="detected-wallets" style="display:grid; gap:10px;"></div>
            <button class="icon-btn" style="margin:16px auto 0;" onclick="App.hideWalletSelector()"><i class="fa-solid fa-arrow-left"></i></button>
        </div>
        <p id="auth-error" style="color:var(--danger); font-size:12px; margin-top:16px;"></p>
    </div>
</div>

<div class="app-shell" id="app-shell">
    <aside class="sidebar">
        <div class="node-header">
            <div id="my-avatar"></div>
            <div class="node-id-tag" id="my-address-display">0x...</div>
            <button class="icon-btn" onclick="App.logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
        <div class="contacts-scroll" id="contacts-list"></div>
        <div style="padding:20px; border-top:1px solid var(--border);">
            <input type="text" id="add-peer-id" class="input-field" placeholder="Wallet 0x..." style="font-size:12px; margin-bottom:12px; width:100%;">
            <button class="btn-action" onclick="App.addContact()">ADD CONTACT</button>
        </div>
    </aside>

    <main class="chat-view">
        <div id="empty-state" style="position:absolute; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:5;">
            <p style="color:var(--text-muted); font-size:11px; letter-spacing:2px;">SECURE NODE IDLE</p>
        </div>

        <div id="request-state" style="position:absolute; inset:0; background:rgba(5,5,5,0.95); backdrop-filter:blur(4px); z-index:6; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
            <div id="req-avatar" style="margin-bottom:20px; transform:scale(1.2);"></div>
            <p style="font-family:'JetBrains Mono'; margin-bottom:30px;">Node <span id="req-id" style="color:var(--accent);"></span><br><span style="font-size:11px; color:var(--text-muted);">Requests P2P tunnel</span></p>
            <div style="display:flex; gap:15px; width:250px;">
                <button class="btn-action btn-solid" style="flex:1;" onclick="App.acceptHandshake()">ACCEPT</button>
                <button class="btn-action" style="flex:1; border-color:var(--danger); color:var(--danger);" onclick="App.declineHandshake()">DECLINE</button>
            </div>
        </div>

        <div id="call-panel" class="call-panel">
            <div id="call-info" style="font-family:'JetBrains Mono'; font-size:13px;">CALLING...</div>
            <div style="display:flex; gap:10px;">
                <button id="answer-btn" class="icon-btn" style="display:none; background:var(--success); color:#000;" onclick="App.acceptCall()"><i class="fa-solid fa-phone"></i></button>
                <button class="icon-btn" style="color:var(--danger);" onclick="App.endCall()"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>

        <header class="chat-header">
            <div style="display:flex; align-items:center;">
                <button class="mobile-back-btn" onclick="App.closeChatMobile()"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="active-avatar" style="margin-right:12px;"></div>
                <div>
                    <div id="active-peer-name" style="font-weight:600; font-size:14px; font-family:'JetBrains Mono';">0x...</div>
                    <div style="font-size:10px; color:var(--text-muted); display:flex; align-items:center; gap:6px; margin-top:2px;">
                        <span class="status-dot" id="active-status-dot"></span>
                        <span id="active-status-text">DISCONNECTED</span>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:4px;">
                <button class="icon-btn" id="stealth-toggle" onclick="App.toggleStealth()"><i class="fa-solid fa-eye-slash"></i></button>
                <button class="icon-btn" id="call-init-btn" onclick="App.startCall()"><i class="fa-solid fa-phone"></i></button>
                <button class="icon-btn" onclick="App.clearChat()"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </header>

        <div class="messages-flow" id="messages-flow"></div>

        <div id="file-preview" class="file-preview"></div>

        <footer class="controls-bar">
            <input type="file" id="file-input" hidden onchange="App.handleFile(this.files[0])">
            <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>

            <div id="rec-ui" class="rec-indicator"><div class="rec-dot"></div><span id="rec-timer">00:00</span></div>

            <button class="icon-btn" id="voice-toggle" onmousedown="App.startVoice()" onmouseup="App.stopVoice()" ontouchstart="App.startVoice()" ontouchend="App.stopVoice()">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="icon-btn" id="cyber-mic-btn" onclick="App.toggleCyberMic()"><i class="fa-solid fa-robot"></i></button>

            <input type="text" id="chat-input" class="input-field" placeholder="Encrypted message..." onkeypress="if(event.key === 'Enter') App.sendText()">
            <button class="icon-btn btn-solid" style="width:44px; height:44px; border-radius:10px;" onclick="App.sendText()"><i class="fa-solid fa-arrow-up"></i></button>
        </footer>
    </main>
</div>

<script>
// ======================== WEB3 WALLET DISCOVERY ========================
const EIPProviders = {};
window.addEventListener("eip6963:announceProvider", (event) => { EIPProviders[event.detail.info.uuid] = event.detail; });
window.dispatchEvent(new Event("eip6963:requestProvider"));

// ======================== CRYPTO ENGINE (ECDH + AES-GCM) ========================
const CryptoEngine = {
    async generateECDH() {
        return await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-384" }, true, ["deriveKey"]);
    },
    async deriveAES(privateKey, peerPubKeyBuffer) {
        const peerPubKey = await crypto.subtle.importKey("raw", new Uint8Array(peerPubKeyBuffer), { name: "ECDH", namedCurve: "P-384" }, true, []);
        return await crypto.subtle.deriveKey({ name: "ECDH", public: peerPubKey }, privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    },
    async encryptData(aesKey, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decryptData(aesKey, encryptedObj) {
        try {
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(encryptedObj.iv) }, aesKey, new Uint8Array(encryptedObj.data));
            return new TextDecoder().decode(decrypted);
        } catch(e) { return "[CORRUPTED_PAYLOAD]"; }
    }
};

// ======================== GENERATIVE AVATARS (5x5 pixel) ========================
const AvatarEngine = {
    generate(address, targetId) {
        const hash = address.toLowerCase().replace('0x', '');
        const container = document.getElementById(targetId);
        if (!container) return;
        container.innerHTML = '';
        container.className = 'avatar-box';
        const hue = parseInt(hash.substring(0,4), 16) % 360;
        const mainColor = `hsl(${hue}, 80%, 60%)`;
        container.style.backgroundColor = `hsl(${hue}, 30%, 12%)`;
        for (let row=0; row<5; row++) {
            for (let col=0; col<5; col++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                const mirrorCol = col > 2 ? 4 - col : col;
                const idx = row * 3 + mirrorCol;
                if (hash.charCodeAt(idx % hash.length) % 2 === 0) {
                    pixel.style.backgroundColor = mainColor;
                    pixel.style.boxShadow = `0 0 5px ${mainColor}`;
                }
                container.appendChild(pixel);
            }
        }
    }
};

// ======================== MAIN APP ========================
const App = {
    // State
    peer: null,
    myAddress: null,
    dbPrefix: null,
    connections: {},
    activeSessions: {},
    incomingRequests: {},
    lastSeen: {},
    pendingKeys: {},
    activePeer: null,
    isStealth: false,
    isCyberMic: false,
    isRecording: false,
    audioCtx: null,
    mediaRecorder: null,
    recStream: null,
    recTimer: null,
    // Call state
    currentCall: null,
    // File pending
    pendingFile: null,
    // Wallet
    availableProviders: {},
    activeProvider: null,

    // ------------------------------------------------------------------
    // Wallet & Auth
    // ------------------------------------------------------------------
    showWalletSelector() {
        if (window.location.protocol === 'file:') {
            this.showError("Requires HTTP Server (Live Server).");
            return;
        }
        document.getElementById('initial-connect-box').style.display = 'none';
        document.getElementById('wallet-selector').style.display = 'block';
        this.showError("");
        const list = document.getElementById('detected-wallets');
        list.innerHTML = '';
        this.availableProviders = {};
        const detectedNames = new Set();
        let count = 0;

        window.dispatchEvent(new Event("eip6963:requestProvider"));
        for (const [uuid, data] of Object.entries(EIPProviders)) {
            const nameLower = data.info.name.toLowerCase();
            if (detectedNames.has(nameLower)) continue;
            detectedNames.add(nameLower);
            this.availableProviders[uuid] = { provider: data.provider, type: 'evm' };
            const iconHtml = data.info.icon ? `<img src="${data.info.icon}" style="width:18px;height:18px;border-radius:4px;">` : `<i class="fa-solid fa-wallet"></i>`;
            list.innerHTML += `<button class="btn-action" style="display:flex; align-items:center; justify-content:center; gap:10px;" onclick="App.login('${uuid}')">${iconHtml} <span>${data.info.name}</span></button>`;
            count++;
        }
        if (window.ethereum && window.ethereum.isMetaMask && !Array.from(detectedNames).some(n=>n.includes('meta'))) {
            this.availableProviders['mm_legacy'] = { provider: window.ethereum, type: 'evm' };
            list.innerHTML += `<button class="btn-action" style="display:flex; align-items:center; gap:10px;" onclick="App.login('mm_legacy')"><i class="fa-solid fa-fox" style="color:#f6851b;"></i> <span>MetaMask</span></button>`;
            count++;
        }
        if (window.solana && window.solana.isPhantom && !Array.from(detectedNames).some(n=>n.includes('phantom'))) {
            this.availableProviders['phantom_legacy'] = { provider: window.solana, type: 'solana' };
            list.innerHTML += `<button class="btn-action" style="display:flex; align-items:center; gap:10px;" onclick="App.login('phantom_legacy')"><i class="fa-solid fa-ghost" style="color:#ab9ff2;"></i> <span>Phantom</span></button>`;
            count++;
        }
        if (count === 0) list.innerHTML = `<div style="font-size:11px; color:var(--text-muted);">No Web3 wallets detected.</div>`;
    },
    hideWalletSelector() {
        document.getElementById('initial-connect-box').style.display = 'block';
        document.getElementById('wallet-selector').style.display = 'none';
    },
    showError(msg) { document.getElementById('auth-error').innerText = msg; },
    async login(id) {
        try {
            const wallet = this.availableProviders[id];
            let address = "";
            if (wallet.type === 'evm') {
                const accounts = await wallet.provider.request({ method: 'eth_requestAccounts' });
                address = accounts[0];
            } else {
                const resp = await wallet.provider.connect();
                address = resp.publicKey.toString();
            }
            this.activeProvider = wallet.provider;
            this.myAddress = address.toLowerCase();
            this.dbPrefix = `imchat_${this.myAddress}_`;
            this.bootNode();
        } catch(e) { this.showError("Connection rejected."); }
    },
    logout() { if (this.peer) this.peer.destroy(); location.reload(); },
    getDB(key) { return JSON.parse(localStorage.getItem(this.dbPrefix + key) || '[]'); },
    setDB(key, arr) { localStorage.setItem(this.dbPrefix + key, JSON.stringify([...new Set(arr)])); },
    getContacts() { return this.getDB('contacts'); },

    // ------------------------------------------------------------------
    // P2P Bootstrap
    // ------------------------------------------------------------------
    bootNode() {
        document.getElementById('auth-screen').style.display = 'none';
        const safeHash = btoa(this.myAddress).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16);
        const nodeId = `imnode_${safeHash}`;
        this.peer = new Peer(nodeId, { debug: 1 });

        this.peer.on('open', () => {
            AvatarEngine.generate(this.myAddress, 'my-avatar');
            document.getElementById('my-address-display').innerText = this.myAddress.slice(0,6)+'...'+this.myAddress.slice(-4);
            this.renderSidebar();
            setInterval(() => this.networkPulse(), 5000);
        });

        // Incoming calls
        this.peer.on('call', (call) => {
            this.currentCall = call;
            const panel = document.getElementById('call-panel');
            panel.style.display = 'flex';
            document.getElementById('call-info').innerText = "INCOMING CALL";
            document.getElementById('answer-btn').style.display = 'block';
        });

        this.peer.on('connection', (conn) => this.setupDataChannel(conn));
    },

    // ------------------------------------------------------------------
    // Networking & Handshake (FIXED)
    // ------------------------------------------------------------------
    networkPulse() {
        const activeContacts = this.getContacts();
        activeContacts.forEach(addr => {
            const nodeId = "imnode_" + btoa(addr).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16);
            const conn = this.connections[addr];
            // Подключаемся только если соединения нет или оно закрыто
            if (!conn || conn.open === false) {
                const newConn = this.peer.connect(nodeId, { reliable: true });
                this.setupDataChannel(newConn);
            }
        });
    },

    async setupDataChannel(conn) {
        const ecdh = await CryptoEngine.generateECDH();
        const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);

        conn.on('open', () => {
            this.pendingKeys[conn.peer] = ecdh;
            conn.send({
                type: 'handshake_req',
                address: this.myAddress,
                pub: Array.from(new Uint8Array(myPub))
            });
        });

        conn.on('data', async data => {
            if (data.address) conn.peerAddress = data.address.toLowerCase();
            const addr = conn.peerAddress || this.getContacts().find(a =>
                ("imnode_" + btoa(a).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16)) === conn.peer
            );
            if (!addr) return;

            // Ping/Pong
            if (data.type === 'ping') {
                conn.send({ type: 'pong', address: this.myAddress });
                return;
            }
            if (data.type === 'pong') {
                this.lastSeen[addr] = Date.now();
                this.connections[addr] = conn;
                this.renderSidebar();
                this.updateChatHeader();
                return;
            }

            // Handshake
            if (data.type === 'handshake_req') {
                this.connections[addr] = conn;
                this.lastSeen[addr] = Date.now();
                if (this.getContacts().includes(addr)) {
                    const aesKey = await CryptoEngine.deriveAES(ecdh.privateKey, data.pub);
                    this.activeSessions[addr] = aesKey;
                    conn.send({
                        type: 'handshake_ack',
                        address: this.myAddress,
                        pub: Array.from(new Uint8Array(myPub))
                    });
                    this.renderSidebar();
                    this.updateChatHeader();
                } else {
                    this.incomingRequests[addr] = { conn, pub: data.pub, ecdh };
                    this.renderSidebar();
                }
            }
            else if (data.type === 'handshake_ack') {
                const storedECDH = this.pendingKeys[conn.peer] || ecdh;
                this.activeSessions[addr] = await CryptoEngine.deriveAES(storedECDH.privateKey, data.pub);
                this.connections[addr] = conn;
                delete this.pendingKeys[conn.peer];
                this.renderSidebar();
                this.updateChatHeader();
            }
            else if (data.type === 'handshake_pending') {
                this.connections[addr] = conn;
                this.renderSidebar();
                this.updateChatHeader();
            }
            else if (data.type === 'handshake_decline') {
                conn.close();
                delete this.connections[addr];
                delete this.activeSessions[addr];
                this.renderSidebar();
                this.updateChatHeader();
            }
            // Encrypted message
            else if (data.type === 'enc') {
                const aesKey = this.activeSessions[addr];
                if (aesKey) {
                    const decrypted = await CryptoEngine.decryptData(aesKey, data.payload);
                    if (decrypted !== "[CORRUPTED_PAYLOAD]" && this.activePeer === addr) {
                        try { this.renderMessage(JSON.parse(decrypted), 'received'); } catch(e){}
                    }
                }
            }
        });

        conn.on('close', () => {
            if (conn.peerAddress) {
                delete this.connections[conn.peerAddress];
                delete this.activeSessions[conn.peerAddress];
                this.renderSidebar();
                this.updateChatHeader();
            }
        });
    },

    // ------------------------------------------------------------------
    // Contacts & UI
    // ------------------------------------------------------------------
    addContact() {
        let addr = document.getElementById('add-peer-id').value.trim().toLowerCase();
        if (!addr || addr === this.myAddress) return;
        let c = this.getContacts();
        c.push(addr);
        this.setDB('contacts', c);
        document.getElementById('add-peer-id').value = '';
        this.renderSidebar();
        this.networkPulse();
    },
    deleteContact(addr) {
        if (this.connections[addr]) this.connections[addr].close();
        delete this.connections[addr];
        delete this.activeSessions[addr];
        this.setDB('contacts', this.getContacts().filter(a => a !== addr));
        if (this.activePeer === addr) {
            this.activePeer = null;
            document.getElementById('empty-state').style.display = 'flex';
            this.clearChat();
        }
        this.renderSidebar();
    },
    clearChat() { document.getElementById('messages-flow').innerHTML = ''; },

    renderSidebar() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        const contacts = this.getContacts();
        const requests = Object.keys(this.incomingRequests);
        if (requests.length) {
            list.innerHTML += `<div class="list-section-title">REQUESTS</div>`;
            requests.forEach(addr => list.appendChild(this.createCard(addr, true)));
        }
        if (contacts.length) {
            list.innerHTML += `<div class="list-section-title">SECURE NODES</div>`;
            contacts.forEach(addr => list.appendChild(this.createCard(addr, false)));
        }
    },
    createCard(addr, isReq) {
        const isOnline = this.connections[addr] && this.connections[addr].open;
        const isSecure = this.activeSessions[addr] !== undefined;
        let sClass = '';
        if (isOnline && isSecure) sClass = 'online';
        else if (isOnline) sClass = 'pending';

        const card = document.createElement('div');
        card.className = `contact-card ${this.activePeer === addr ? 'active' : ''} ${isReq ? 'request' : ''}`;
        card.onclick = () => this.openChat(addr, isReq);
        const avId = `av_${addr.slice(-6)}`;
        card.innerHTML = `
            <div id="${avId}"></div>
            <div class="contact-info">
                <span class="contact-address">${addr.slice(0,6)}...${addr.slice(-4)}</span>
                <span class="contact-status-text">${sClass === 'online' ? 'SECURE' : (sClass === 'pending' ? 'LINKING...' : 'OFFLINE')}</span>
            </div>
            <div class="contact-actions">
                ${!isReq ? `<button class="icon-btn" style="width:24px; height:24px;" onclick="event.stopPropagation(); App.deleteContact('${addr}')"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                <div class="status-dot ${sClass}"></div>
            </div>
        `;
        setTimeout(() => AvatarEngine.generate(addr, avId), 0);
        return card;
    },

    openChat(addr, isReq = false) {
        this.activePeer = addr;
        document.getElementById('app-shell').classList.add('in-chat');
        document.getElementById('empty-state').style.display = 'none';
        if (isReq || this.incomingRequests[addr]) {
            document.getElementById('request-state').style.display = 'flex';
            document.getElementById('req-id').innerText = addr.slice(0,10)+"...";
            AvatarEngine.generate(addr, 'req-avatar');
            document.getElementById('controls-bar').style.opacity = '0.2';
            document.getElementById('controls-bar').style.pointerEvents = 'none';
        } else {
            document.getElementById('request-state').style.display = 'none';
            document.getElementById('controls-bar').style.opacity = '1';
            document.getElementById('controls-bar').style.pointerEvents = 'auto';
            document.getElementById('active-peer-name').innerText = addr.slice(0,10)+"...";
            AvatarEngine.generate(addr, 'active-avatar');
            this.updateChatHeader();
        }
        this.renderSidebar();
    },
    closeChatMobile() { document.getElementById('app-shell').classList.remove('in-chat'); },

    updateChatHeader() {
        if (!this.activePeer) return;
        const isOnline = this.connections[this.activePeer] && this.connections[this.activePeer].open;
        const isSecure = this.activeSessions[this.activePeer] !== undefined;
        const dot = document.getElementById('active-status-dot');
        const text = document.getElementById('active-status-text');
        if (isOnline && isSecure) {
            dot.className = "status-dot online";
            text.innerText = "TUNNEL ACTIVE";
        } else if (isOnline) {
            dot.className = "status-dot pending";
            text.innerText = "AWAITING KEY";
        } else {
            dot.className = "status-dot";
            text.innerText = "OFFLINE";
        }
    },

    // ----- Handshake acceptance -----
    async acceptHandshake() {
        const addr = this.activePeer;
        const req = this.incomingRequests[addr];
        if (req && req.conn.open) {
            let c = this.getContacts();
            c.push(addr);
            this.setDB('contacts', c);
            this.activeSessions[addr] = await CryptoEngine.deriveAES(req.ecdh.privateKey, req.pub);
            const myPub = await crypto.subtle.exportKey("raw", req.ecdh.publicKey);
            req.conn.send({ type: 'handshake_ack', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
            delete this.incomingRequests[addr];
            this.renderSidebar();
            this.openChat(addr);
        } else {
            this.declineHandshake();
        }
    },
    declineHandshake() {
        const addr = this.activePeer;
        const req = this.incomingRequests[addr];
        if (req && req.conn.open) req.conn.send({ type: 'handshake_decline' });
        delete this.incomingRequests[addr];
        this.activePeer = null;
        document.getElementById('request-state').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex';
        this.renderSidebar();
    },

    // ------------------------------------------------------------------
    // Messaging (Text, Voice, File)
    // ------------------------------------------------------------------
    async sendText() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text && this.activePeer) {
            this.transmitMessage({ type: 'text', body: text, time: Date.now() });
            input.value = '';
        }
    },
    async transmitMessage(msg) {
        const session = this.activeSessions[this.activePeer];
        const conn = this.connections[this.activePeer];
        if (!session || !conn || !conn.open) {
            console.warn("Channel not ready");
            return;
        }
        const enc = await CryptoEngine.encryptData(session, JSON.stringify(msg));
        conn.send({ type: 'enc', payload: enc });
        this.renderMessage(msg, 'sent');
    },
    renderMessage(msg, dir) {
        const flow = document.getElementById('messages-flow');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrapper ${dir}`;
        let content = '';
        if (msg.type === 'text') content = msg.body;
        else if (msg.type === 'voice') content = `<audio src="${msg.body}" controls style="height:35px; border-radius:8px;"></audio>`;
        else if (msg.type === 'file') content = `<a href="${msg.body}" download="${msg.name}" style="color:inherit; text-decoration:none;"><i class="fa-solid fa-file-arrow-down"></i> ${msg.name}</a>`;
        const time = new Date(msg.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        wrap.innerHTML = `<div class="msg-bubble">${content}</div><div class="msg-meta">${time}</div>`;
        flow.appendChild(wrap);
        flow.scrollTop = flow.scrollHeight;
    },

    // ------------------------------------------------------------------
    // Voice Recorder (Cyber-Mic enabled)
    // ------------------------------------------------------------------
    async getProcessedStream(raw) {
        if (!this.isCyberMic) return raw;
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
        const source = this.audioCtx.createMediaStreamSource(raw);
        const destination = this.audioCtx.createMediaStreamDestination();
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1100;
        const shaper = this.audioCtx.createWaveShaper();
        shaper.curve = (function(amt) {
            let n=44100, curve=new Float32Array(n), deg=Math.PI/180;
            for(let i=0; i<n; i++) { let x=i*2/n-1; curve[i]=(3+amt)*x*20*deg/(Math.PI+amt*Math.abs(x)); }
            return curve;
        })(100);
        source.connect(filter);
        filter.connect(shaper);
        shaper.connect(destination);
        return destination.stream;
    },

    async startVoice() {
        if (this.isRecording) return;
        try {
            const rawStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.recStream = await this.getProcessedStream(rawStream);
            this.mediaRecorder = new MediaRecorder(this.recStream, { mimeType: 'audio/webm' });
            let chunks = [];
            this.mediaRecorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
            this.mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                if (blob.size > 500) {
                    const reader = new FileReader();
                    reader.onload = () => this.transmitMessage({ type: 'voice', body: reader.result, time: Date.now() });
                    reader.readAsDataURL(blob);
                }
                if (this.recStream) this.recStream.getTracks().forEach(t => t.stop());
            };
            this.mediaRecorder.start();
            this.isRecording = true;
            document.getElementById('voice-toggle').classList.add('active');
            // Timer
            const recUI = document.getElementById('rec-ui');
            recUI.style.display = 'flex';
            let sec = 0;
            this.recTimer = setInterval(() => {
                sec++;
                const m = Math.floor(sec/60).toString().padStart(2,'0');
                const s = (sec%60).toString().padStart(2,'0');
                document.getElementById('rec-timer').innerText = `${m}:${s}`;
            }, 1000);
        } catch(e) { console.error(e); alert("Microphone denied."); }
    },
    stopVoice() {
        if (!this.isRecording) return;
        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') this.mediaRecorder.stop();
        clearInterval(this.recTimer);
        this.isRecording = false;
        document.getElementById('voice-toggle').classList.remove('active');
        document.getElementById('rec-ui').style.display = 'none';
        document.getElementById('rec-timer').innerText = '00:00';
    },
    toggleCyberMic() {
        this.isCyberMic = !this.isCyberMic;
        document.getElementById('cyber-mic-btn').classList.toggle('cyber-active');
    },

    // ------------------------------------------------------------------
    // File handling (with preview)
    // ------------------------------------------------------------------
    handleFile(file) {
        if (!file) return;
        if (file.size > 50 * 1024 * 1024) {
            alert("File limit 50MB for stable P2P");
            return;
        }
        this.pendingFile = file;
        const preview = document.getElementById('file-preview');
        preview.style.display = 'block';
        preview.innerHTML = `<i class="fa-solid fa-paperclip"></i> ${file.name} <span style="margin-left:10px; color:var(--accent); cursor:pointer;" onclick="App.sendPendingFile()">[SEND]</span>`;
    },
    sendPendingFile() {
        if (!this.pendingFile) return;
        const reader = new FileReader();
        reader.onload = () => {
            this.transmitMessage({ type: 'file', body: reader.result, name: this.pendingFile.name, time: Date.now() });
            this.pendingFile = null;
            document.getElementById('file-preview').style.display = 'none';
        };
        reader.readAsDataURL(this.pendingFile);
    },

    // ------------------------------------------------------------------
    // Voice Calls (with Ringtone + UI panel)
    // ------------------------------------------------------------------
    async startCall() {
        if (!this.activePeer) return;
        this.currentCall = null;
        const panel = document.getElementById('call-panel');
        panel.style.display = 'flex';
        document.getElementById('call-info').innerText = "CALLING...";
        document.getElementById('answer-btn').style.display = 'none';
        this.startRingtone();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const processed = await this.getProcessedStream(stream);
        const targetId = "imnode_" + btoa(this.activePeer).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16);
        this.currentCall = this.peer.call(targetId, processed);
        this.currentCall.on('stream', remote => {
            this.stopRingtone();
            document.getElementById('call-info').innerText = "ON CALL";
            this.playRemote(remote);
        });
        this.currentCall.on('close', () => this.endCall());
    },
    acceptCall() {
        if (!this.currentCall) return;
        navigator.mediaDevices.getUserMedia({ audio: true }).then(async raw => {
            const processed = await this.getProcessedStream(raw);
            this.currentCall.answer(processed);
            document.getElementById('answer-btn').style.display = 'none';
            document.getElementById('call-info').innerText = "ON CALL";
            this.currentCall.on('stream', remote => this.playRemote(remote));
        }).catch(e => console.error(e));
    },
    endCall() {
        if (this.currentCall) this.currentCall.close();
        this.stopRingtone();
        document.getElementById('call-panel').style.display = 'none';
        this.currentCall = null;
        if (this.audioCtx) this.audioCtx.close();
        this.audioCtx = null;
    },
    playRemote(stream) {
        const audio = document.getElementById('remote-audio') || document.createElement('audio');
        audio.id = 'remote-audio';
        audio.srcObject = stream;
        audio.play().catch(e=>console.log);
    },
    startRingtone() {
        if (!this.ringCtx) this.ringCtx = new AudioContext();
        const osc = this.ringCtx.createOscillator();
        const gain = this.ringCtx.createGain();
        osc.frequency.value = 900;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(this.ringCtx.destination);
        osc.start();
        this.ringOsc = osc;
        this.ringGain = gain;
        let toggle = 0;
        this.ringInterval = setInterval(() => {
            if (this.ringGain) this.ringGain.gain.value = toggle ? 0.08 : 0;
            toggle ^= 1;
        }, 1000);
    },
    stopRingtone() {
        if (this.ringOsc) this.ringOsc.stop();
        clearInterval(this.ringInterval);
        this.ringOsc = null;
        if (this.ringCtx) this.ringCtx.close();
        this.ringCtx = null;
    },

    // ------------------------------------------------------------------
    // UI toggles
    // ------------------------------------------------------------------
    toggleStealth() {
        this.isStealth = !this.isStealth;
        const btn = document.getElementById('stealth-toggle');
        const flow = document.getElementById('messages-flow');
        if (this.isStealth) {
            btn.classList.add('active');
            btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            flow.classList.add('stealth-active');
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            flow.classList.remove('stealth-active');
        }
    }
};
</script>
