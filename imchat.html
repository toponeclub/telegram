<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | BUNKER NODE v5</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        /* ==========================================================================
           CSS VARIABLES & THEME
           ========================================================================== */
        :root {
            --bg-main: #030405;
            --bg-panel: rgba(12, 14, 18, 0.85);
            --bg-hover: rgba(255, 255, 255, 0.03);
            
            --accent: #00ffd5;
            --accent-dim: rgba(0, 255, 213, 0.1);
            --accent-glow: 0 0 15px rgba(0, 255, 213, 0.4);
            
            --border-light: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(0, 255, 213, 0.3);
            
            --text-main: #f0f0f0;
            --text-muted: #7a828e;
            
            --danger: #ff3366;
            --warning: #ffb800;
            
            --glass-blur: blur(24px);
            --anim-speed: 0.3s;
        }

        /* ==========================================================================
           RESET & BASE STYLES
           ========================================================================== */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        body, html { 
            height: 100%; 
            width: 100%;
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif; 
            overflow: hidden;
        }

        /* Custom Scrollbar for Cypherpunk Vibe */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ==========================================================================
           LAYOUT SHELL
           ========================================================================== */
        .app-shell {
            display: flex; 
            height: 100vh; 
            width: 100vw;
            background: radial-gradient(circle at 50% 0%, #0d161a 0%, var(--bg-main) 80%);
            position: relative; 
            overflow: hidden;
        }

        /* ==========================================================================
           SIDEBAR (CONTACTS & REQUESTS)
           ========================================================================== */
        .sidebar {
            width: 340px; 
            border-right: 1px solid var(--border-light);
            display: flex; 
            flex-direction: column; 
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur); 
            z-index: 20; 
            flex-shrink: 0;
            transition: transform var(--anim-speed) cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .node-header { 
            padding: 24px; 
            border-bottom: 1px solid var(--border-light);
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
        }
        
        .node-identity {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .node-id-tag { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 11px; 
            font-weight: 600;
            color: var(--accent); 
            background: var(--accent-dim);
            padding: 6px 10px; 
            border-radius: 6px; 
            display: inline-block;
            border: 1px solid var(--border-accent);
        }

        .list-section-title {
            font-size: 11px; 
            font-weight: 700;
            color: var(--text-muted); 
            letter-spacing: 2px;
            padding: 20px 20px 10px 20px; 
            text-transform: uppercase;
        }

        .contacts-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
        }
        
        /* Contact Cards */
        .contact-card {
            padding: 12px 16px; 
            border-radius: 12px; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 16px;
            margin-bottom: 6px; 
            border: 1px solid transparent;
            position: relative; 
            transition: all 0.2s ease;
        }

        .contact-card:hover { 
            background: var(--bg-hover); 
        }

        .contact-card.active { 
            background: var(--accent-dim); 
            border-color: var(--border-accent); 
        }

        .contact-card.request { 
            border: 1px dashed var(--warning); 
            background: rgba(255, 184, 0, 0.05);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-address {
            font-size: 13px; 
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .contact-status-text {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-actions {
            position: absolute; 
            right: 16px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }

        /* Status Indicators */
        .status-dot {
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: #333;
            transition: all 0.3s ease;
        }
        .status-dot.online { background: var(--accent); box-shadow: var(--accent-glow); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 10px rgba(255, 184, 0, 0.4); }

        /* Sidebar Footer (Add Contact) */
        .sidebar-footer {
            padding: 24px; 
            border-top: 1px solid var(--border-light);
            background: rgba(0,0,0,0.2);
        }

        /* ==========================================================================
           MAIN CHAT VIEW
           ========================================================================== */
        .chat-view { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            min-width: 0; 
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.03)"/></svg>');
        }
        
        .chat-header { 
            padding: 20px 30px; 
            border-bottom: 1px solid var(--border-light);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            z-index: 10;
        }

        .mobile-back-btn {
            display: none; 
            color: var(--accent); 
            background: none; 
            border: none;
            font-size: 20px; 
            cursor: pointer; 
            margin-right: 20px; 
            padding: 5px;
        }

        /* Messages Flow */
        .messages-flow { 
            flex: 1; 
            padding: 30px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 24px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.received { align-self: flex-start; align-items: flex-start; }

        .msg-bubble {
            padding: 14px 20px; 
            border-radius: 18px;
            font-size: 14px; 
            line-height: 1.6; 
            position: relative;
            word-break: break-word;
            transition: all var(--anim-speed) ease;
        }
        
        .msg-sent .msg-bubble { 
            background: var(--accent-dim); 
            border: 1px solid var(--border-accent); 
            color: var(--accent); 
            border-bottom-right-radius: 4px; 
        }
        
        .msg-received .msg-bubble { 
            background: #161920; 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--border-light); 
        }

        .msg-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Stealth Mode Logic */
        .stealth-active .msg-bubble { 
            filter: blur(10px); 
            opacity: 0.3; 
            cursor: pointer; 
            user-select: none; 
        }
        .stealth-active .msg-bubble:hover, 
        .stealth-active .msg-bubble:active { 
            filter: blur(0); 
            opacity: 1; 
        }

        /* ==========================================================================
           CONTROLS BAR (INPUT)
           ========================================================================== */
        .controls-bar { 
            padding: 20px 30px; 
            border-top: 1px solid var(--border-light);
            display: flex; 
            gap: 16px; 
            align-items: center; 
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
        }

        .input-field {
            flex: 1; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border-light);
            border-radius: 14px; 
            padding: 16px 20px; 
            color: #fff; 
            outline: none; 
            min-width: 0;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--accent); }

        /* ==========================================================================
           BUTTONS & ICONS
           ========================================================================== */
        .icon-btn {
            background: transparent; 
            border: none; 
            color: var(--text-muted);
            font-size: 18px; 
            cursor: pointer; 
            width: 44px; 
            height: 44px; 
            flex-shrink: 0;
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-radius: 50%; 
            transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--accent); background: var(--bg-hover); }
        .icon-btn.active { color: var(--accent); background: var(--accent-dim); }
        
        .icon-btn.danger:hover { color: var(--danger); }
        
        .btn-action {
            background: transparent; 
            color: var(--accent); 
            border: 1px solid var(--border-accent);
            padding: 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px;
            font-weight: 600; 
            width: 100%; 
            transition: all 0.2s; 
            text-align: center;
            letter-spacing: 1px;
        }
        .btn-action:hover { 
            background: var(--accent-dim); 
            box-shadow: var(--accent-glow); 
        }

        .btn-solid {
            background: var(--accent);
            color: #000;
            border: none;
        }
        .btn-solid:hover {
            background: #00e6c0;
            box-shadow: var(--accent-glow);
        }

        .btn-send { 
            background: var(--accent); 
            color: #000; 
            width: 50px; 
            height: 50px; 
            border-radius: 14px; 
            flex-shrink: 0; 
        }
        .btn-send:hover { background: #00e6c0; }

        /* ==========================================================================
           GENERATIVE AVATARS
           ========================================================================== */
        .avatar-box {
            width: 44px; 
            height: 44px; 
            border-radius: 10px;
            overflow: hidden; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(5, 1fr);
            flex-shrink: 0; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .pixel { width: 100%; height: 100%; }

        /* ==========================================================================
           OVERLAYS & STATES
           ========================================================================== */
        .full-overlay {
            position: absolute; 
            inset: 0; 
            background: rgba(3, 4, 5, 0.85);
            backdrop-filter: blur(8px);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 5; 
            text-align: center; 
            padding: 20px;
        }

        .auth-overlay {
            position: fixed; 
            inset: 0; 
            background: var(--bg-main);
            background-image: radial-gradient(circle at 50% 50%, #0a1114 0%, #030405 100%);
            z-index: 1000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        .auth-card { 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* ==========================================================================
           RESPONSIVE DESIGN (MOBILE ADAPTATION)
           ========================================================================== */
        @media (max-width: 768px) {
            .sidebar { 
                width: 100%; 
                position: absolute; 
                height: 100%; 
                border-right: none;
            }
            .chat-view { 
                width: 100%; 
                position: absolute; 
                height: 100%; 
                transform: translateX(100%); 
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            }
            
            /* State when chat is active */
            .app-shell.in-chat .sidebar { 
                transform: translateX(-20%); 
                opacity: 0; 
                pointer-events: none; 
            }
            .app-shell.in-chat .chat-view { 
                transform: translateX(0); 
            }
            
            .mobile-back-btn { display: flex; }
            .msg-wrapper { max-width: 90%; }
            .controls-bar { padding: 12px 16px; }
            .chat-header { padding: 16px; }
            
            .auth-card { padding: 30px 20px; border: none; background: transparent; box-shadow: none;}
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .animate-fade { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card animate-fade">
            <h1 style="letter-spacing: 8px; font-weight: 300; margin-bottom: 5px;">IMCHAT</h1>
            <p style="color: var(--accent); font-size: 10px; margin-bottom: 40px; font-family: 'JetBrains Mono';">SECURE_P2P_NODE_v5</p>
            
            <div id="initial-connect-box">
                <button class="btn-action btn-solid" style="padding: 18px; font-size: 14px;" onclick="App.showWalletSelector()">
                    <i class="fa-solid fa-wallet"></i> &nbsp; CONNECT WALLET
                </button>
            </div>

            <div id="wallet-selector" style="display: none; animation: fadeIn 0.3s;">
                <p style="font-size: 10px; color: var(--text-muted); margin-bottom: 20px; letter-spacing: 1px;">AVAILABLE PROVIDERS:</p>
                <div style="display: grid; gap: 12px;" id="detected-wallets">
                    </div>
                <button class="icon-btn" style="margin: 20px auto 0;" onclick="App.hideWalletSelector()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>

            <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 20px; height: 15px;"></p>
        </div>
    </div>

    <div class="app-shell" id="app-shell">
        
        <aside class="sidebar">
            <div class="node-header">
                <div class="node-identity">
                    <div id="my-avatar"></div>
                    <div class="node-id-tag" id="my-address-display">0x...</div>
                </div>
                <button class="icon-btn" title="Disconnect Node" onclick="App.logout()">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
            
            <div class="contacts-scroll" id="contacts-list">
                </div>

            <div class="sidebar-footer">
                <input type="text" id="add-peer-id" class="input-field" placeholder="Enter Wallet 0x..." style="font-size: 12px; margin-bottom: 12px; width: 100%; background: rgba(0,0,0,0.5);">
                <button class="btn-action" onclick="App.addContact()">ADD CONTACT</button>
            </div>
        </aside>

        <main class="chat-view">
            
            <div id="empty-state" class="full-overlay">
                <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: var(--border-light); margin-bottom: 24px;"></i>
                <p style="color: var(--text-muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase;">Awaiting Secure Connection</p>
            </div>

            <div id="request-state" class="full-overlay" style="display: none; z-index: 6; background: rgba(3, 4, 5, 0.98);">
                <div id="req-avatar" style="margin-bottom: 24px; transform: scale(1.5);"></div>
                <p style="color: var(--text-main); font-size: 15px; margin-bottom: 40px; font-family: 'JetBrains Mono'; line-height: 1.6;">
                    Node <span id="req-id" style="color:var(--accent);"></span><br>
                    <span style="font-size: 12px; color: var(--text-muted); font-family: 'Inter';">Requests an encrypted E2E tunnel</span>
                </p>
                <div style="display: flex; gap: 16px; width: 100%; max-width: 280px;">
                    <button class="btn-action btn-solid" style="flex:1;" onclick="App.acceptHandshake()">ACCEPT</button>
                    <button class="btn-action" style="flex:1; border-color: var(--danger); color: var(--danger);" onclick="App.declineHandshake()">DECLINE</button>
                </div>
            </div>

            <header class="chat-header">
                <div style="display: flex; align-items: center;">
                    <button class="mobile-back-btn" onclick="App.closeChatMobile()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="active-avatar" style="margin-right: 16px;"></div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <div id="active-peer-name" style="font-weight: 700; font-size: 15px; font-family: 'JetBrains Mono';">Unknown_Node</div>
                        <div style="font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
                            <span class="status-dot" id="active-status-dot"></span>
                            <span id="active-status-text">DISCONNECTED</span>
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; gap: 8px;">
                    <button class="icon-btn" id="stealth-toggle" onclick="App.toggleStealth()" title="Toggle Stealth (Blur)">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                    <button class="icon-btn" title="Send Crypto (Soon)">
                        <i class="fa-solid fa-wallet"></i>
                    </button>
                    <button class="icon-btn danger" title="Clear Chat History" onclick="App.clearChat()">
                        <i class="fa-solid fa-broom"></i>
                    </button>
                </div>
            </header>

            <div class="messages-flow" id="messages-flow"></div>

            <footer class="controls-bar" id="controls-bar">
                <input type="file" id="file-input" hidden onchange="App.handleFile(this.files[0])">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Send File">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                
                <button class="icon-btn" id="voice-toggle" onmousedown="App.startVoice()" onmouseup="App.stopVoice()" title="Hold to Record">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                
                <button class="icon-btn" id="cyber-mic-btn" onclick="App.toggleCyberMic()" title="Cyber-Mic Distortion">
                    <i class="fa-solid fa-robot"></i>
                </button>

                <button class="icon-btn" id="call-btn" onclick="App.toggleCall()" title="P2P Voice Call">
    <i class="fa-solid fa-phone"></i>
</button>

<audio id="remote-audio" autoplay style="display:none;"></audio>

                <input type="text" id="chat-input" class="input-field" placeholder="Transmit secure message..." onkeypress="if(event.key === 'Enter') App.sendText()">
                
                <button class="icon-btn btn-send" onclick="App.sendText()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </footer>
        </main>
    </div>


<script type="importmap">
{
  "imports": {
    "ethers": "https://esm.sh/ethers@6",
    "@xmtp/xmtp-js": "https://esm.sh/@xmtp/xmtp-js",
    "@web3modal/ethers": "https://esm.sh/@web3modal/ethers"
  }
}
</script>

<script type="module">
// 1. Прямой полифилл (решает ошибку "buffer is not defined" и пути)
import { Buffer } from "https://esm.sh/buffer@6.0.3";
window.Buffer = window.Buffer || Buffer;

// 2. Импорты
import { ethers } from "ethers";
import { Client } from "@xmtp/xmtp-js";
import { createWeb3Modal, defaultConfig } from "@web3modal/ethers";

const PROJECT_ID = "9a4485f532467f3b0bb7584537697fd1";
const PINATA_API = "3c0bb126433a445fd080";
const PINATA_SEC = "7098d9bfdb290bdbf499cf222963d383638e9d44cc3b42402c7da6cbd2543c36";

let signer, xmtp, currentConv, myAddress;
let contacts = JSON.parse(localStorage.getItem('xmtp_contacts') || '[]');
let peer, myPeerId, currentCall, localStream;

// АВТОРИЗАЦИЯ
const mainnet = { 
    chainId: 1, 
    name: 'Ethereum', 
    currency: 'ETH', 
    explorerUrl: 'https://etherscan.io', 
    rpcUrl: 'https://cloudflare-eth.com' 
};

const modal = createWeb3Modal({
    ethersConfig: defaultConfig({ 
        metadata: { name: 'ImChat Node', description: 'Web3 P2P E2EE', url: window.location.origin, icons: [] } 
    }),
    chains: [mainnet],
    projectId: PROJECT_ID
});

modal.subscribeProvider(async ({ provider, address }) => {
    if (address && provider && !xmtp) {
        myAddress = address;
        signer = await new ethers.BrowserProvider(provider).getSigner();
        
        document.getElementById('my-address-display').innerText = `${address.slice(0,6)}...${address.slice(-4)}`;
        AvatarEngine.generate(address, 'my-avatar');
        document.getElementById('auth-screen').style.display = 'none';
        
        xmtp = await Client.create(signer, { env: "production" });
        initPeer();
        App.loadContacts();
        listenGlobal();
    }
});

// ЗВОНКИ
function initPeer() {
    peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }});
    peer.on('open', id => myPeerId = id);
    peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            localStream = stream;
            call.answer(stream);
            call.on('stream', remoteStream => {
                const audio = document.getElementById('remote-audio');
                audio.srcObject = remoteStream;
                audio.play();
            });
            currentCall = call;
            document.getElementById('call-btn').style.color = "var(--danger)";
        });
    });
}

// ТРАНСПОРТ СООБЩЕНИЙ
async function listenGlobal() {
    const stream = await xmtp.conversations.streamAllMessages();
    for await (const message of stream) {
        if (message.senderAddress === myAddress) continue;
        
        try {
            const data = JSON.parse(message.content);
            if (data.type === 'call') {
                App.answerCall(data.peerId);
                continue;
            }
        } catch(e) {}

        if (currentConv && message.conversation.peerAddress === currentConv.peerAddress) {
            renderMessage(message);
        }
    }
}

// ГЛОБАЛЬНЫЙ КОНТРОЛЛЕР
window.App = {
    showWalletSelector: () => modal.open(),
    logout: () => location.reload(),
    
    addContact: () => {
        const addr = document.getElementById('add-peer-id').value.trim();
        if (ethers.isAddress(addr) && !contacts.includes(addr)) {
            contacts.push(addr);
            localStorage.setItem('xmtp_contacts', JSON.stringify(contacts));
            App.loadContacts();
        }
        document.getElementById('add-peer-id').value = '';
    },
    
    loadContacts: () => {
        const list = document.getElementById('contacts-list');
        list.innerHTML = contacts.map(c => `
            <div class="contact-card" onclick="App.selectContact('${c}')">
                <div class="avatar-box" id="av-${c}"></div>
                <div class="contact-info">
                    <div class="contact-address">${c.slice(0,6)}...${c.slice(-4)}</div>
                </div>
            </div>
        `).join('');
        contacts.forEach(c => AvatarEngine.generate(c, `av-${c}`));
    },

    selectContact: async (addr) => {
        if (!await xmtp.canMessage(addr)) {
            alert("Адрес не активирован в сети XMTP");
            return;
        }
        currentConv = await xmtp.conversations.newConversation(addr);
        
        document.getElementById('active-peer-name').innerText = `${addr.slice(0,6)}...${addr.slice(-4)}`;
        AvatarEngine.generate(addr, 'active-avatar');
        document.getElementById('empty-state').style.display = 'none';
        
        const flow = document.getElementById('messages-flow');
        flow.innerHTML = '';
        const msgs = await currentConv.messages();
        msgs.forEach(renderMessage);
    },

    sendText: async () => {
        if (!currentConv) return;
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        
        input.value = '';
        await currentConv.send(text);
        renderMessage({ senderAddress: myAddress, content: text });
    },

    handleFile: async (file) => {
        if (!file || !currentConv) return;
        try {
            const key = await crypto.subtle.generateKey({name: "AES-GCM", length: 256}, true, ["encrypt", "decrypt"]);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const data = await file.arrayBuffer();
            const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, data);
            const exportedKey = await crypto.subtle.exportKey("raw", key);
            
            const blob = new Blob([iv, new Uint8Array(encrypted)]);
            const fd = new FormData();
            fd.append('file', blob);

            const res = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                method: 'POST',
                headers: { pinata_api_key: PINATA_API, pinata_secret_api_key: PINATA_SEC },
                body: fd
            });
            const { IpfsHash } = await res.json();
            
            const payload = JSON.stringify({
                type: 'file',
                cid: IpfsHash,
                keyBase64: btoa(String.fromCharCode(...new Uint8Array(exportedKey))),
                name: file.name,
                mime: file.type
            });

            await currentConv.send(payload);
            renderMessage({ senderAddress: myAddress, content: payload });
        } catch(e) { alert("Ошибка файла: " + e.message); }
    },

    downloadFile: async (cid, keyBase64, name, mime) => {
        try {
            const res = await fetch(`https://gateway.pinata.cloud/ipfs/${cid}`);
            const buf = await res.arrayBuffer();
            const iv = buf.slice(0, 12);
            const data = buf.slice(12);
            
            const rawKey = Uint8Array.from(atob(keyBase64), c => c.charCodeAt(0));
            const key = await crypto.subtle.importKey("raw", rawKey, {name: "AES-GCM"}, false, ["decrypt"]);
            const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv: new Uint8Array(iv)}, key, data);
            
            const url = URL.createObjectURL(new Blob([decrypted], {type: mime}));
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
        } catch(e) { alert("Ошибка расшифровки"); }
    },

    toggleCall: async () => {
        if (!currentConv || !myPeerId) return;
        if (currentCall) {
            currentCall.close();
            localStream?.getTracks().forEach(t => t.stop());
            currentCall = null;
            document.getElementById('call-btn').style.color = "";
            return;
        }
        await currentConv.send(JSON.stringify({ type: 'call', peerId: myPeerId }));
        document.getElementById('call-btn').style.color = "var(--warning)";
    },

    answerCall: async (targetPeerId) => {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            localStream = stream;
            currentCall = peer.call(targetPeerId, stream);
            currentCall.on('stream', remoteStream => {
                const audio = document.getElementById('remote-audio');
                audio.srcObject = remoteStream;
                audio.play();
            });
            document.getElementById('call-btn').style.color = "var(--danger)";
        });
    },

    toggleStealth: () => document.body.classList.toggle('stealth-active'),
    clearChat: () => { if(confirm("Очистить UI чата?")) document.getElementById('messages-flow').innerHTML = ''; }
};

// РЕНДЕР СООБЩЕНИЙ
function renderMessage(msg) {
    const flow = document.getElementById('messages-flow');
    const isSent = msg.senderAddress === myAddress;
    let contentHtml = msg.content;
    
    try {
        const data = JSON.parse(msg.content);
        if (data.type === 'file') {
            contentHtml = `
                <div style="cursor:pointer; color:var(--accent); text-decoration:underline;" 
                     onclick="App.downloadFile('${data.cid}', '${data.keyBase64}', '${data.name}', '${data.mime}')">
                    <i class="fa-solid fa-file-shield"></i> [СКАЧАТЬ] ${data.name}
                </div>`;
        } else if (data.type === 'call') {
            return; 
        }
    } catch(e) {
        contentHtml = contentHtml.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    flow.insertAdjacentHTML('beforeend', `
        <div class="msg-wrapper ${isSent ? 'sent msg-sent' : 'received msg-received'}">
            <div class="msg-bubble">${contentHtml}</div>
        </div>
    `);
    flow.scrollTop = flow.scrollHeight;
}

// ГЕНЕРАТОР АВАТАРОВ
const AvatarEngine = {
    generate(address, targetId) {
        const hash = address.toLowerCase().replace('0x', '');
        const el = document.getElementById(targetId);
        if (!el) return;
        el.className = 'avatar-box';
        el.innerHTML = '';
        const hue = parseInt(hash.substring(0, 4), 16) % 360;
        el.style.backgroundColor = `hsl(${hue}, 30%, 12%)`;
        for (let r=0; r<5; r++) {
            for (let c=0; c<5; c++) {
                const p = document.createElement('div');
                p.className = 'pixel';
                const mc = c>2 ? 4-c : c;
                if (hash.charCodeAt(r*3+mc) % 2 === 0) {
                    p.style.backgroundColor = `hsl(${hue}, 80%, 60%)`;
                    p.style.boxShadow = `0 0 8px hsl(${hue}, 80%, 60%)`;
                }
                el.appendChild(p);
            }
        }
    }
};
</script>
