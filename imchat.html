<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | SECURE NODE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #050506;
            --surface: rgba(15, 15, 20, 0.8);
            --accent: #4deeea;
            --accent-dim: rgba(77, 238, 234, 0.15);
            --border: rgba(255, 255, 255, 0.05);
            --text: #e2e2e2;
            --text-dim: #666;
            --danger: #ff4a4a;
            --glass: blur(20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; overflow: hidden;
        }

        /* --- UI Framework --- */
        .app-shell {
            display: flex; height: 100vh; width: 100vw;
            background: radial-gradient(circle at 50% 50%, #0d1211 0%, #050506 100%);
            position: relative;
        }

        /* Sidebar: Contacts */
        .sidebar {
            width: 320px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; background: rgba(0,0,0,0.2);
            backdrop-filter: var(--glass); z-index: 10;
        }

        .node-header { padding: 25px; border-bottom: 1px solid var(--border); }
        .node-id-tag { 
            font-family: 'JetBrains Mono', monospace; font-size: 10px; 
            color: var(--accent); background: var(--accent-dim);
            padding: 4px 8px; border-radius: 4px; display: inline-block;
        }

        .contacts-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-card {
            padding: 12px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 5px; border: 1px solid transparent;
            position: relative;
        }
        .contact-card:hover { background: rgba(255,255,255,0.03); }
        .contact-card.active { background: var(--accent-dim); border-color: var(--border); }

        .sidebar-status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #333; position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%); transition: all 0.3s;
        }
        .sidebar-status-dot.online {
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Generative Avatar System */
        .avatar-box {
            width: 40px; height: 40px; border-radius: 8px;
            overflow: hidden; 
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
            flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1);
        }
        .pixel { width: 100%; height: 100%; transition: all 0.2s; }

        /* Main Chat Area */
        .chat-view { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { 
            padding: 20px 30px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .messages-flow { 
            flex: 1; padding: 30px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 20px;
        }

        .msg-bubble {
            max-width: 70%; padding: 14px 18px; border-radius: 18px;
            font-size: 14px; line-height: 1.5; position: relative;
            transition: filter 0.3s ease, opacity 0.3s ease;
            word-break: break-word;
        }
        
        .msg-sent { align-self: flex-end; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #1a1a1f; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        /* Stealth Mode Logic */
        .stealth-active .msg-bubble {
            filter: blur(8px); opacity: 0.4; cursor: pointer; user-select: none;
        }
        .stealth-active .msg-bubble:hover, 
        .stealth-active .msg-bubble:active {
            filter: blur(0); opacity: 1;
        }

        /* Input Bar */
        .controls-bar { 
            padding: 20px 30px; border-top: 1px solid var(--border);
            display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.2);
        }

        .input-field {
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 20px; color: #fff; outline: none;
        }
        .input-field:focus { border-color: var(--accent); }

        .icon-btn {
            background: none; border: none; color: var(--text-dim);
            font-size: 18px; cursor: pointer; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
        .icon-btn.active { color: var(--accent); background: var(--accent-dim); }
        
        .btn-action {
            background: transparent; color: var(--accent); border: 1px solid var(--accent);
            padding: 12px; border-radius: 10px; cursor: pointer; font-size: 12px;
            font-weight: 600; width: 100%; transition: all 0.2s; text-align: center;
        }
        .btn-action:hover { background: var(--accent); color: var(--bg); }
        
        .btn-send { background: var(--accent); color: #000; width: 45px; height: 45px; border-radius: 12px; }

        /* Login Screen */
        .auth-overlay {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }

        .auth-card { width: 100%; max-width: 400px; text-align: center; }

        .status-tag { width: 8px; height: 8px; border-radius: 50%; background: #333; margin-right: 8px; display: inline-block; }
        .online { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h1 style="letter-spacing: 5px; font-weight: 300;">IMCHAT</h1>
            <p style="color: var(--accent); font-size: 11px; margin-bottom: 40px;">BUNKER_NODE</p>
            
            <div id="initial-connect-box">
                <button class="btn-action" style="padding: 20px; font-size: 14px; box-shadow: 0 0 20px var(--accent-dim);" onclick="Engine.showWalletSelector()">
                    <i class="fa-solid fa-link"></i> &nbsp; ESTABLISH CONNECTION
                </button>
            </div>

            <div id="wallet-selector" style="display: none; animation: fadeIn 0.3s;">
                <p style="font-size: 10px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 1px;">DETECTED SECURE PROVIDERS:</p>
                <div style="display: grid; gap: 10px;" id="detected-wallets">
                    </div>
                <button class="icon-btn" style="margin: 20px auto 0;" onclick="Engine.hideWalletSelector()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 20px;"></p>
        </div>
    </div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="node-header">
                <div id="my-avatar" style="margin-bottom: 15px;"></div>
                <div class="node-id-tag" id="my-address-display">0x...</div>
            </div>
            
            <div class="contacts-scroll" id="contacts-list"></div>

            <div style="padding: 20px; border-top: 1px solid var(--border);">
                <input type="text" id="add-peer-id" class="input-field" placeholder="Enter Wallet Address..." style="font-size: 12px; margin-bottom: 10px; width: 100%;">
                <button class="btn-action" onclick="Engine.addPeer()">ESTABLISH_LINK</button>
            </div>
        </aside>

        <main class="chat-view">
            <div id="empty-state" style="position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 5;">
                <i class="fa-solid fa-radiation" style="font-size: 40px; color: var(--border); margin-bottom: 20px;"></i>
                <p style="color: var(--text-dim); font-size: 13px; letter-spacing: 2px;">SECURE_TUNNEL_IDLE</p>
            </div>

            <header class="chat-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="active-avatar"></div>
                    <div>
                        <div id="active-peer-name" style="font-weight: 700; font-size: 14px; font-family: 'JetBrains Mono';">Unknown_Node</div>
                        <div style="font-size: 11px; color: var(--text-dim);"><span class="status-tag" id="active-status-dot"></span><span id="active-status-text">DISCONNECTED</span></div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="icon-btn" id="stealth-toggle" onclick="Engine.toggleStealth()" title="Stealth Mode (Blur)"><i class="fa-solid fa-eye-slash"></i></button>
                    <button class="icon-btn" title="Send Crypto" onclick="Engine.sendTransaction()"><i class="fa-solid fa-wallet"></i></button>
                    <button class="icon-btn" title="Delete Peer" onclick="Engine.deleteActivePeer()"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </header>

            <div class="messages-flow" id="messages-flow"></div>

            <footer class="controls-bar">
                <input type="file" id="file-input" hidden onchange="Engine.handleFileUpload(this.files[0])">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                
                <button class="icon-btn" id="voice-toggle" onmousedown="Engine.startVoice()" onmouseup="Engine.stopVoice()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                
                <button class="icon-btn" id="cyber-mic-btn" onclick="Engine.toggleCyberMic()" title="Cyber-Mic Distortion">
                    <i class="fa-solid fa-robot"></i>
                </button>

                <input type="text" id="chat-input" class="input-field" placeholder="Secure comms..." onkeypress="if(event.key === 'Enter') Engine.sendText()">
                
                <button class="icon-btn btn-send" onclick="Engine.sendText()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </footer>
        </main>
    </div>

<script>
/**
 * IMCHAT ENGINE v3.2
 * - Smart Wallet Discovery Protocol
 * - Improved Generative Avatars (No Black Holes)
 */

const Crypto = {
    async generateKeys() {
        return await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-384" }, true, ["deriveKey"]);
    },
    async deriveSecret(priv, pub) {
        return await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, priv, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    },
    async encrypt(key, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decrypt(key, obj) {
        try {
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(obj.iv) }, key, new Uint8Array(obj.data));
            return new TextDecoder().decode(decrypted);
        } catch(e) { return "[ENCRYPTED_DATA_CORRUPT]"; }
    }
};

const Avatar = {
    generate(address, targetId) {
        const hash = address.toLowerCase().replace('0x', '');
        const container = document.getElementById(targetId);
        if (!container) return;
        container.innerHTML = '';
        container.className = 'avatar-box';
        
        // Generate Hue
        const hue = parseInt(hash.substring(0, 4), 16) % 360;
        const mainColor = `hsl(${hue}, 80%, 60%)`;
        const baseDark = `hsl(${hue}, 40%, 10%)`; // Фикс "черных аватаров"
        
        container.style.backgroundColor = baseDark;

        // 5x5 Mirrored Grid
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                
                const mirrorCol = col > 2 ? 4 - col : col;
                const index = row * 3 + mirrorCol;
                
                const charCode = hash.charCodeAt(index % hash.length);
                if (charCode % 2 === 0) {
                    pixel.style.backgroundColor = mainColor;
                    pixel.style.boxShadow = `0 0 5px ${mainColor}`;
                }
                container.appendChild(pixel);
            }
        }
    }
};

const Engine = {
    peer: null,
    myAddress: null,
    connections: {}, 
    activePeer: null,
    isCyberMic: false,
    isStealth: false,
    audioCtx: null,
    mediaRecorder: null,
    stream: null,

    // --- Wallet Discovery ---
    showWalletSelector() {
        if (window.location.protocol === 'file:') {
            document.getElementById('auth-error').innerText = "Requires HTTP Server (Live Server) for Web3 injection.";
            return;
        }

        document.getElementById('initial-connect-box').style.display = 'none';
        document.getElementById('wallet-selector').style.display = 'block';
        document.getElementById('auth-error').innerText = '';

        const list = document.getElementById('detected-wallets');
        list.innerHTML = '';
        let providersFound = 0;

        // Smart Discovery
        if (window.ethereum) {
            providersFound++;
            let name = "EVM Wallet";
            let icon = "fa-wallet";
            if (window.ethereum.isMetaMask) { name = "MetaMask"; icon = "fa-fox"; }
            
            list.innerHTML += `<button class="btn-action" style="padding: 15px; font-size: 13px;" onclick="Engine.connectWallet('evm')"><i class="fa-solid ${icon}"></i> &nbsp; ${name}</button>`;
        }

        if (window.solana && window.solana.isPhantom) {
            providersFound++;
            list.innerHTML += `<button class="btn-action" style="padding: 15px; font-size: 13px;" onclick="Engine.connectWallet('solana')"><i class="fa-solid fa-ghost"></i> &nbsp; Phantom</button>`;
        }

        if (providersFound === 0) {
            list.innerHTML = `<div style="color: var(--danger); font-size: 11px; padding: 15px; border: 1px dashed var(--danger); border-radius: 8px;">No Web3 extensions detected in your browser.<br>Please install MetaMask or Phantom.</div>`;
        }
    },

    hideWalletSelector() {
        document.getElementById('initial-connect-box').style.display = 'block';
        document.getElementById('wallet-selector').style.display = 'none';
    },

    async connectWallet(type) {
        try {
            let address = "";
            if (type === 'evm' && window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                address = accounts[0];
            } else if (type === 'solana' && window.solana) {
                const resp = await window.solana.connect();
                address = resp.publicKey.toString();
            } else throw new Error("Connection failed or rejected.");

            this.myAddress = address;
            this.initP2P();
        } catch (e) { 
            document.getElementById('auth-error').innerText = "Connection rejected by user."; 
        }
    },

    // --- Core P2P ---
    initP2P() {
        document.getElementById('auth-screen').style.display = 'none';
        const nodeId = "im_" + btoa(this.myAddress).replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
        this.peer = new Peer(nodeId);

        this.peer.on('open', () => {
            Avatar.generate(this.myAddress, 'my-avatar');
            document.getElementById('my-address-display').innerText = this.myAddress.slice(0, 8) + "..." + this.myAddress.slice(-4);
            this.loadContacts();
            
            setInterval(() => this.reconnectRoutine(), 5000);
        });

        this.peer.on('connection', conn => this.setupConn(conn));
    },

    reconnectRoutine() {
        const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        contacts.forEach(addr => {
            const session = this.connections[addr];
            if (!session || session.status === 'offline') {
                const nodeId = "im_" + btoa(addr).replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
                const conn = this.peer.connect(nodeId, { reliable: true });
                this.setupConn(conn);
            }
        });
    },

    async addPeer() {
        const addr = document.getElementById('add-peer-id').value.trim();
        if (!addr || addr === this.myAddress) return;
        
        let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        if (!contacts.includes(addr)) {
            contacts.push(addr);
            localStorage.setItem('contacts', JSON.stringify(contacts));
        }
        document.getElementById('add-peer-id').value = '';
        this.loadContacts();
        this.reconnectRoutine();
    },

    loadContacts() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        
        contacts.forEach(addr => {
            const isOnline = this.connections[addr]?.status === 'online';
            const card = document.createElement('div');
            card.className = `contact-card ${this.activePeer === addr ? 'active' : ''}`;
            card.onclick = () => this.selectChat(addr);
            
            const avId = 'av-' + addr.slice(-4);
            card.innerHTML = `
                <div id="${avId}"></div>
                <div style="font-size:12px; font-family:'JetBrains Mono';">${addr.slice(0,6)}...${addr.slice(-4)}</div>
                <div class="sidebar-status-dot ${isOnline ? 'online' : ''}"></div>
            `;
            list.appendChild(card);
            Avatar.generate(addr, avId);
        });
    },

    async setupConn(conn) {
        const ecdh = await Crypto.generateKeys();
        const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);

        conn.on('open', () => {
            conn.send({ type: 'handshake', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
        });

        conn.on('data', async data => {
            if (data.type === 'handshake') {
                const peerPub = await crypto.subtle.importKey("raw", new Uint8Array(data.pub), { name: "ECDH", namedCurve: "P-384" }, true, []);
                const aesKey = await Crypto.deriveSecret(ecdh.privateKey, peerPub);
                this.connections[data.address] = { conn, aesKey, status: 'online' };
                this.loadContacts();
                this.updateUI();
            } 
            if (data.type === 'enc') {
                const senderAddr = Object.keys(this.connections).find(k => this.connections[k].conn === conn);
                if (!senderAddr) return;
                const session = this.connections[senderAddr];
                const decrypted = await Crypto.decrypt(session.aesKey, data.payload);
                if (this.activePeer === senderAddr) {
                    this.pushMsg(JSON.parse(decrypted), 'received');
                }
            }
        });

        conn.on('close', () => {
            const addr = Object.keys(this.connections).find(k => this.connections[k].conn === conn);
            if (addr) {
                this.connections[addr].status = 'offline';
                this.loadContacts();
                this.updateUI();
            }
        });

        conn.on('error', () => {});
    },

    // --- Chat Logic ---
    toggleStealth() {
        this.isStealth = !this.isStealth;
        const btn = document.getElementById('stealth-toggle');
        const flow = document.getElementById('messages-flow');
        
        if (this.isStealth) {
            btn.classList.add('active');
            btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            flow.classList.add('stealth-active');
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            flow.classList.remove('stealth-active');
        }
    },

    async sendText() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !this.activePeer) return;

        const msg = { type: 'text', body: text, time: Date.now() };
        this.sendToActive(msg);
        input.value = '';
    },

    async sendToActive(msg) {
        const session = this.connections[this.activePeer];
        if (!session || session.status !== 'online') {
            alert("Tunnel is offline.");
            return;
        }
        const enc = await Crypto.encrypt(session.aesKey, JSON.stringify(msg));
        session.conn.send({ type: 'enc', payload: enc });
        this.pushMsg(msg, 'sent');
    },

    pushMsg(msg, dir) {
        const flow = document.getElementById('messages-flow');
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble msg-${dir}`;
        
        if (msg.type === 'text') bubble.innerText = msg.body;
        if (msg.type === 'voice') bubble.innerHTML = `<audio src="${msg.body}" controls></audio>`;
        if (msg.type === 'file') bubble.innerHTML = `<a href="${msg.body}" download="${msg.name}" style="color:var(--accent); text-decoration:none;"><i class="fa-solid fa-file-arrow-down"></i> ${msg.name}</a>`;

        flow.appendChild(bubble);
        flow.scrollTop = flow.scrollHeight;
    },

    toggleCyberMic() {
        this.isCyberMic = !this.isCyberMic;
        document.getElementById('cyber-mic-btn').classList.toggle('active', this.isCyberMic);
    },

    async startVoice() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.audioCtx = new AudioContext();
            let source = this.audioCtx.createMediaStreamSource(this.stream);
            let destination = this.audioCtx.createMediaStreamDestination();

            if (this.isCyberMic) {
                let filter = this.audioCtx.createBiquadFilter();
                filter.type = "lowshelf";
                filter.frequency.value = 400;
                filter.gain.value = 25;
                source.connect(filter);
                filter.connect(destination);
            } else {
                source.connect(destination);
            }

            this.mediaRecorder = new MediaRecorder(destination.stream);
            let chunks = [];
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = () => this.sendToActive({ type: 'voice', body: reader.result });
                reader.readAsDataURL(blob);
            };
            this.mediaRecorder.start();
            document.getElementById('voice-toggle').classList.add('active');
        } catch (e) { alert("Microphone access needed."); }
    },

    stopVoice() {
        if (this.mediaRecorder) this.mediaRecorder.stop();
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        document.getElementById('voice-toggle').classList.remove('active');
    },

    async handleFileUpload(file) {
        if (file.size > 1024 * 1024 * 1024) return alert("Bunker limit: 1GB");
        const reader = new FileReader();
        reader.onload = () => this.sendToActive({ type: 'file', body: reader.result, name: file.name });
        reader.readAsDataURL(file);
    },

    async sendTransaction() {
        if (!this.activePeer) return;
        try {
            const tx = { from: this.myAddress, to: this.activePeer, value: '0x0' };
            await window.ethereum.request({ method: 'eth_sendTransaction', params: [tx] });
        } catch(e) { console.log("TX_CANCELLED"); }
    },

    selectChat(addr) {
        this.activePeer = addr;
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('active-peer-name').innerText = addr.slice(0, 10) + "...";
        Avatar.generate(addr, 'active-avatar');
        this.updateUI();
        this.loadContacts();
    },

    updateUI() {
        if (!this.activePeer) return;
        const session = this.connections[this.activePeer];
        const dot = document.getElementById('active-status-dot');
        const text = document.getElementById('active-status-text');
        
        if (session && session.status === 'online') {
            dot.className = "status-tag online";
            text.innerText = "SECURE_TUNNEL_ACTIVE";
        } else {
            dot.className = "status-tag";
            text.innerText = "OFFLINE";
        }
    },

    deleteActivePeer() {
        if (!this.activePeer) return;
        if (this.connections[this.activePeer]?.conn) {
            this.connections[this.activePeer].conn.close();
        }
        let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        contacts = contacts.filter(a => a !== this.activePeer);
        localStorage.setItem('contacts', JSON.stringify(contacts));
        location.reload();
    }
};
</script>
