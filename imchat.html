<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMCHAT | SECURE NODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #0a0a0c;
            --surface: rgba(20, 20, 24, 0.7);
            --surface-hover: rgba(40, 40, 48, 0.8);
            --neon: #4deeea;
            --border: rgba(77, 238, 234, 0.15);
            --text-main: #e2e2e2;
            --text-dim: #888;
            --danger: #ff4a4a;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Утилиты и Скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .hidden { display: none !important; }

        /* Экраны */
        .screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        
        .logo-area { text-align: center; margin-bottom: 40px; }
        .logo-area h1 { font-size: 2.5rem; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }
        .logo-area p { color: var(--neon); font-size: 11px; letter-spacing: 2px; margin-top: 5px; opacity: 0.8; }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%;
        }
        .btn:hover { border-color: var(--neon); color: var(--neon); background: rgba(77, 238, 234, 0.05); }
        .btn-primary { background: transparent; border-color: var(--neon); color: var(--neon); }
        .btn-primary:hover { background: var(--neon); color: var(--bg); }

        .input-box {
            width: 100%; max-width: 360px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-main);
            outline: none; font-size: 14px; font-family: inherit; margin-bottom: 15px;
        }
        .input-box:focus { border-color: var(--neon); }

        /* ЧАТ UI */
        #chat-screen { flex-direction: row; padding: 0; align-items: stretch; }
        
        .sidebar { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(0,0,0,0.2); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        .sidebar-header .my-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden;}
        .my-name { font-weight: 700; font-size: 14px; }
        .my-address { font-size: 10px; color: var(--text-dim); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        
        .contacts-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; border: 1px solid transparent;}
        .contact-item:hover { background: var(--surface-hover); }
        .contact-item.active { background: rgba(77, 238, 234, 0.05); border-color: var(--border); }
        .contact-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--neon); }
        .contact-info { display: flex; flex-direction: column; flex: 1; overflow: hidden;}
        .contact-name { font-size: 13px; font-weight: 500; }
        .contact-status { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
        
        .add-contact-area { padding: 15px; border-top: 1px solid var(--border); }

        .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.1); }
        .chat-header-info { display: flex; align-items: center; gap: 10px; }
        .peer-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
        .peer-status-dot.online { background: var(--neon); box-shadow: 0 0 8px var(--neon); }

        .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .message-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.received { align-self: flex-start; align-items: flex-start; }
        
        .message { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; word-break: break-word;}
        .sent .message { background: var(--border); border-bottom-right-radius: 4px; }
        .received .message { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); border-bottom-left-radius: 4px; }
        
        .msg-meta { font-size: 10px; color: var(--text-dim); margin-top: 4px; display: flex; gap: 5px; align-items: center; }
        .msg-tick { color: var(--text-dim); }
        .msg-tick.read { color: var(--neon); }

        .typing-indicator { font-size: 11px; color: var(--neon); padding: 0 24px; height: 15px; opacity: 0; transition: opacity 0.2s;}
        .typing-indicator.active { opacity: 1; }

        .input-bar { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,0.2); }
        .action-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; transition: color 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;}
        .action-btn:hover { color: var(--neon); background: rgba(255,255,255,0.05); }
        .action-btn.recording { color: var(--danger); animation: pulse 1s infinite; }
        
        .msg-input-wrapper { flex: 1; display: flex; position: relative; }
        #msg-input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 12px 20px; color: var(--text-main); outline: none; font-size: 14px; }
        #msg-input:focus { background: rgba(255,255,255,0.05); border-color: var(--neon); }
        
        .btn-send { background: var(--text-main); color: var(--bg); border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .btn-send:hover { background: var(--neon); }

        .audio-player { height: 30px; outline: none; }
        .file-link { color: var(--neon); text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 500;}

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--neon); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="overlay" class="hidden">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 12px; color: var(--neon); letter-spacing: 2px;" id="overlay-text">INITIALIZING...</p>
    </div>

    <div id="login-screen" class="screen">
        <div class="logo-area">
            <h1>IMCHAT</h1>
            <p>E2EE P2P WEB3 NODE</p>
        </div>
        <div style="display: flex; gap: 15px; width: 100%; max-width: 400px; flex-direction: column;">
            <button class="btn" onclick="App.login('evm')"><i class="fa-solid fa-fox"></i> Connect EVM Wallet</button>
            <button class="btn" onclick="App.login('solana')"><i class="fa-solid fa-ghost"></i> Connect Solana Wallet</button>
        </div>
        <div id="login-error" style="color: var(--danger); font-size: 12px; margin-top: 20px; text-align: center;"></div>
    </div>

    <div id="profile-screen" class="screen hidden">
        <div class="logo-area">
            <h1>NODE IDENTITY</h1>
            <p>LOCAL DATA ENCRYPTION</p>
        </div>
        <input type="text" id="profile-name" class="input-box" placeholder="Enter your display name...">
        <button class="btn btn-primary" style="max-width: 360px;" onclick="App.saveProfile()">Save Identity</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="my-info">
                    <span class="my-name" id="ui-my-name">User</span>
                    <span class="my-address" id="ui-my-address">0x...</span>
                </div>
            </div>
            
            <div class="contacts-list" id="contacts-list">
                </div>

            <div class="add-contact-area">
                <input type="text" id="new-contact-id" class="input-box" style="margin-bottom: 8px; padding: 10px; font-size: 12px;" placeholder="Paste friend's Node ID...">
                <input type="text" id="new-contact-name" class="input-box" style="margin-bottom: 8px; padding: 10px; font-size: 12px;" placeholder="Nickname for friend...">
                <button class="btn btn-primary" style="padding: 10px; font-size: 12px;" onclick="App.addContact()">Add Contact</button>
            </div>
        </div>

        <div class="chat-main">
            <div id="no-chat-selected" style="position:absolute; top:0;left:0;width:100%;height:100%; background:var(--surface); z-index:10; display:flex; align-items:center; justify-content:center; flex-direction:column;">
                <i class="fa-solid fa-shield-halved" style="font-size: 40px; color: var(--border); margin-bottom: 20px;"></i>
                <p style="color: var(--text-dim); font-size: 14px;">Select a contact to establish secure tunnel</p>
            </div>

            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="contact-avatar" id="active-chat-avatar"><i class="fa-solid fa-user-secret"></i></div>
                    <div>
                        <div style="font-weight: 600; font-size: 15px;" id="active-chat-name">Name</div>
                        <div style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 5px;">
                            <div class="peer-status-dot" id="active-chat-status-dot"></div>
                            <span id="active-chat-status">Offline</span>
                        </div>
                    </div>
                </div>
                <div style="color: var(--neon); font-size: 12px; opacity: 0.5;"><i class="fa-solid fa-lock"></i> AES-256-GCM</div>
            </div>

            <div class="messages-container" id="messages-container"></div>
            
            <div class="typing-indicator" id="typing-indicator">Peer is typing...</div>

            <div class="input-bar">
                <input type="file" id="file-input" class="hidden" onchange="App.sendFile(this.files[0])">
                <button class="action-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                <button class="action-btn" id="btn-mic" onmousedown="App.startVoice()" onmouseup="App.stopVoice()"><i class="fa-solid fa-microphone"></i></button>
                
                <div class="msg-input-wrapper">
                    <input type="text" id="msg-input" placeholder="Secure message..." oninput="App.sendTyping()" onkeypress="if(event.key === 'Enter') App.sendTextMsg()">
                </div>
                
                <button class="btn-send" onclick="App.sendTextMsg()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * CORE LOGIC
 */

// 1. CRYPTO ENGINE (ECDH + AES-GCM)
const CryptoUtils = {
    async generateECDH() {
        const keyPair = await crypto.subtle.generateKey(
            { name: "ECDH", namedCurve: "P-384" },
            true, ["deriveKey"]
        );
        return keyPair;
    },
    async exportPubKey(key) {
        const exported = await crypto.subtle.exportKey("raw", key);
        return btoa(String.fromCharCode(...new Uint8Array(exported)));
    },
    async importPubKey(base64Key) {
        const binary = atob(base64Key);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return await crypto.subtle.importKey(
            "raw", bytes.buffer, { name: "ECDH", namedCurve: "P-384" }, true, []
        );
    },
    async deriveAES(privateKey, peerPublicKey) {
        return await crypto.subtle.deriveKey(
            { name: "ECDH", public: peerPublicKey },
            privateKey,
            { name: "AES-GCM", length: 256 },
            false, ["encrypt", "decrypt"]
        );
    },
    async encryptData(aesKey, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decryptData(aesKey, encryptedObj) {
        try {
            const iv = new Uint8Array(encryptedObj.iv);
            const data = new Uint8Array(encryptedObj.data);
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, data);
            return new TextDecoder().decode(decrypted);
        } catch(e) { console.error("Decryption failed", e); return "[Decryption Error]"; }
    }
};

// 2. LOCAL DATABASE (IndexedDB)
const DB = {
    db: null,
    init() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open("ImChatDB", 1);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('profile')) db.createObjectStore('profile', {keyPath: 'id'});
                if (!db.objectStoreNames.contains('contacts')) db.createObjectStore('contacts', {keyPath: 'address'});
            };
            req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
            req.onerror = (e) => reject(e);
        });
    },
    async get(store, key) {
        return new Promise(r => {
            const req = this.db.transaction(store).objectStore(store).get(key);
            req.onsuccess = () => r(req.result);
            req.onerror = () => r(null);
        });
    },
    async put(store, data) {
        return new Promise(r => {
            const req = this.db.transaction(store, "readwrite").objectStore(store).put(data);
            req.onsuccess = () => r(true);
        });
    },
    async getAll(store) {
        return new Promise(r => {
            const req = this.db.transaction(store).objectStore(store).getAll();
            req.onsuccess = () => r(req.result);
        });
    }
};

// 3. MAIN APPLICATION LOGIC
const App = {
    myAddress: null,
    profile: null,
    peer: null,
    contacts: [],
    activePeerId: null,
    connections: {}, // address -> { conn, ecdhKeys, sharedAESKey, status }
    msgHistory: {},  // Эфемерное хранилище сообщений (RAM) { address: [msgs] }
    typingTimer: null,
    mediaRecorder: null,
    audioChunks: [],

    showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    },
    overlay(show, text="Loading...") {
        document.getElementById('overlay-text').innerText = text;
        document.getElementById('overlay').classList[show ? 'remove' : 'add']('hidden');
    },

    // --- AUTH & INIT ---
    async login(type) {
        if (window.location.protocol === 'file:') {
            document.getElementById('login-error').innerText = "Run via Local Server (http://) for Web3 to work.";
            return;
        }
        try {
            let address = "";
            if (type === 'evm' && window.ethereum) {
                const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                address = accs[0];
            } else if (type === 'solana' && window.solana) {
                const resp = await window.solana.connect();
                address = resp.publicKey.toString();
            } else {
                throw new Error("Wallet extension not found.");
            }
            this.myAddress = address;
            this.overlay(true, "LOADING DATABASE...");
            await DB.init();
            this.profile = await DB.get('profile', 'me');
            this.overlay(false);

            if (!this.profile) this.showScreen('profile-screen');
            else this.startNode();

        } catch (err) {
            document.getElementById('login-error').innerText = err.message || "Connection failed.";
        }
    },

    async saveProfile() {
        const name = document.getElementById('profile-name').value.trim();
        if(!name) return;
        this.profile = { id: 'me', name: name };
        await DB.put('profile', this.profile);
        this.startNode();
    },

    // --- P2P NETWORK ---
    async startNode() {
        this.showScreen('chat-screen');
        document.getElementById('ui-my-name').innerText = this.profile.name;
        document.getElementById('ui-my-address').innerText = this.myAddress;
        
        await this.loadContacts();

        const nodeId = "imchat_" + btoa(this.myAddress).replace(/=/g, '').substring(0,20);
        this.peer = new Peer(nodeId);

        this.peer.on('open', id => console.log('Node active:', id));
        
        // Входящее соединение (Мы - Получатель)
        this.peer.on('connection', conn => {
            this.setupDataListener(conn);
        });
    },

    getNetworkId(address) {
        return "imchat_" + btoa(address).replace(/=/g, '').substring(0,20);
    },

    // --- CONTACTS ---
    async loadContacts() {
        this.contacts = await DB.getAll('contacts') || [];
        this.renderContacts();
        this.contacts.forEach(c => this.connectToPeer(c.address));
    },

    async addContact() {
        const addr = document.getElementById('new-contact-id').value.trim();
        const name = document.getElementById('new-contact-name').value.trim();
        if(!addr || !name) return;
        
        await this.updateOrAddContact(addr, name);
        document.getElementById('new-contact-id').value = '';
        document.getElementById('new-contact-name').value = '';
        this.renderContacts();
        this.connectToPeer(addr);
    },

    async updateOrAddContact(address, name) {
        let c = this.contacts.find(x => x.address === address);
        if(!c) {
            c = { address, name };
            this.contacts.push(c);
        } else {
            c.name = name; // Обновляем имя, если друг его сменил
        }
        await DB.put('contacts', c);
    },

    renderContacts() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        this.contacts.forEach(c => {
            const isOnline = this.connections[c.address]?.status === 'open';
            const div = document.createElement('div');
            div.className = `contact-item ${this.activePeerId === c.address ? 'active' : ''}`;
            div.onclick = () => this.selectChat(c.address);
            div.innerHTML = `
                <div class="contact-avatar">${c.name.charAt(0).toUpperCase()}</div>
                <div class="contact-info">
                    <div class="contact-name">${c.name}</div>
                    <div class="contact-status" style="color: ${isOnline ? 'var(--neon)' : 'var(--text-dim)'}">${isOnline ? 'Tunnel Secured' : 'Offline'}</div>
                </div>
            `;
            list.appendChild(div);
        });
    },

    // --- CONNECTION & E2EE PROTOCOL (STRICT HANDSHAKE) ---
    async connectToPeer(address) {
        if(this.connections[address]?.status === 'open') return;
        
        const netId = this.getNetworkId(address);
        const conn = this.peer.connect(netId, { reliable: true });
        
        // Исходящее соединение (Мы - Инициатор)
        conn.on('open', async () => {
            const ecdhKeys = await CryptoUtils.generateECDH();
            const pubKey = await CryptoUtils.exportPubKey(ecdhKeys.publicKey);
            conn._tempEcdh = ecdhKeys;
            
            // Шаг 1: Инициатор шлет INIT
            conn.send({ 
                type: 'handshake_init', 
                address: this.myAddress, 
                name: this.profile.name,
                pubKey: pubKey 
            });
        });

        this.setupDataListener(conn);
    },

    setupDataListener(conn) {
        conn.on('data', async (payload) => {
            
            // Шаг 2: Получатель принимает INIT, шлет ACK
            if (payload.type === 'handshake_init') {
                const ecdhKeys = await CryptoUtils.generateECDH();
                const myPubKey = await CryptoUtils.exportPubKey(ecdhKeys.publicKey);
                const peerPubKey = await CryptoUtils.importPubKey(payload.pubKey);
                const aesKey = await CryptoUtils.deriveAES(ecdhKeys.privateKey, peerPubKey);

                this.connections[payload.address] = { conn, aesKey, status: 'open' };
                if(!this.msgHistory[payload.address]) this.msgHistory[payload.address] = [];
                
                await this.updateOrAddContact(payload.address, payload.name);
                
                conn.send({ 
                    type: 'handshake_ack', 
                    address: this.myAddress, 
                    name: this.profile.name,
                    pubKey: myPubKey 
                });

                this.renderContacts();
                if(this.activePeerId === payload.address) this.selectChat(payload.address);
            }
            // Шаг 3: Инициатор получает ACK, туннель готов
            else if (payload.type === 'handshake_ack') {
                const peerPubKey = await CryptoUtils.importPubKey(payload.pubKey);
                const aesKey = await CryptoUtils.deriveAES(conn._tempEcdh.privateKey, peerPubKey);

                this.connections[payload.address] = { conn, aesKey, status: 'open' };
                if(!this.msgHistory[payload.address]) this.msgHistory[payload.address] = [];

                await this.updateOrAddContact(payload.address, payload.name);
                
                this.renderContacts();
                if(this.activePeerId === payload.address) this.selectChat(payload.address);
            }
            // Шаг 4: Обычное зашифрованное сообщение
            else if (payload.type === 'enc') {
                const senderAddr = Object.keys(this.connections).find(k => this.connections[k].conn === conn);
                if(!senderAddr) return;
                
                const aesKey = this.connections[senderAddr].aesKey;
                const decryptedJson = await CryptoUtils.decryptData(aesKey, payload.data);
                if(decryptedJson === "[Decryption Error]") return;
                
                const msgData = JSON.parse(decryptedJson);
                this.handleAppMessage(senderAddr, msgData);
            }
        });

        conn.on('close', () => {
            const addr = Object.keys(this.connections).find(k => this.connections[k].conn === conn);
            if(addr) {
                this.connections[addr].status = 'closed';
                this.renderContacts();
                if(this.activePeerId === addr) this.selectChat(addr);
            }
        });
        
        conn.on('error', (err) => {
            // Игнорируем мелкие ошибки сети, чтобы не крашить UI
            console.warn("PeerJS Conn warning:", err); 
        });
    },

    // --- MESSAGING LOGIC ---
    async handleAppMessage(senderAddr, msg) {
        if(msg.type === 'typing') {
            if(this.activePeerId === senderAddr) {
                const ind = document.getElementById('typing-indicator');
                ind.classList.add('active');
                clearTimeout(this.typingTimer);
                this.typingTimer = setTimeout(() => ind.classList.remove('active'), 2000);
            }
        }
        else if(msg.type === 'read') {
            // Обновляем статус галочек
            const history = this.msgHistory[senderAddr];
            const m = history.find(x => x.id === msg.id);
            if(m) { m.status = 'read'; if(this.activePeerId === senderAddr) this.renderMessages(); }
        }
        else {
            // Обычное сообщение (text, file, voice)
            const newMsg = { ...msg, from: 'remote', status: 'delivered', time: Date.now() };
            this.msgHistory[senderAddr].push(newMsg);
            
            // Отправляем квитанцию о прочтении (если чат открыт)
            if(this.activePeerId === senderAddr) {
                this.renderMessages();
                this.sendEncrypted(senderAddr, { type: 'read', id: msg.id });
            } else {
                // Можно добавить счетчик непрочитанных здесь
                this.renderContacts(); 
            }
        }
    },

    async sendEncrypted(targetAddress, rawObj) {
        const connData = this.connections[targetAddress];
        if(!connData || connData.status !== 'open') return false;
        
        const jsonStr = JSON.stringify(rawObj);
        const encrypted = await CryptoUtils.encryptData(connData.aesKey, jsonStr);
        connData.conn.send({ type: 'enc', data: encrypted });
        return true;
    },

    async sendTextMsg() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text || !this.activePeerId) return;

        const msgObj = { type: 'text', text: text, id: Date.now().toString() };
        
        // Рендер локально
        this.msgHistory[this.activePeerId].push({ ...msgObj, from: 'local', status: 'sent', time: Date.now() });
        this.renderMessages();
        input.value = '';

        // Отправка
        const success = await this.sendEncrypted(this.activePeerId, msgObj);
        if(!success) alert("Peer is offline. Message not delivered.");
    },

    sendTyping() {
        if(!this.activePeerId) return;
        this.sendEncrypted(this.activePeerId, { type: 'typing' });
    },

    // --- MEDIA & FILES ---
    async sendFile(file) {
        if(!file || !this.activePeerId) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64 = e.target.result;
            const msgObj = { type: 'file', filename: file.name, data: base64, id: Date.now().toString() };
            
            this.msgHistory[this.activePeerId].push({ ...msgObj, from: 'local', status: 'sent', time: Date.now() });
            this.renderMessages();
            this.sendEncrypted(this.activePeerId, msgObj);
        };
        reader.readAsDataURL(file);
    },

    async startVoice() {
        if(!this.activePeerId) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.mediaRecorder = new MediaRecorder(stream);
            this.audioChunks = [];
            document.getElementById('btn-mic').classList.add('recording');
            
            this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
            this.mediaRecorder.onstop = async () => {
                document.getElementById('btn-mic').classList.remove('recording');
                const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    const msgObj = { type: 'voice', data: e.target.result, id: Date.now().toString() };
                    this.msgHistory[this.activePeerId].push({ ...msgObj, from: 'local', status: 'sent', time: Date.now() });
                    this.renderMessages();
                    this.sendEncrypted(this.activePeerId, msgObj);
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
            };
            this.mediaRecorder.start();
        } catch(e) { console.error("Mic error", e); alert("Microphone access denied."); }
    },
    stopVoice() {
        if(this.mediaRecorder && this.mediaRecorder.state === 'recording') {
            this.mediaRecorder.stop();
        }
    },

    // --- UI UPDATES ---
    selectChat(address) {
        this.activePeerId = address;
        document.getElementById('no-chat-selected').classList.add('hidden');
        this.renderContacts(); // update active class
        
        const contact = this.contacts.find(c => c.address === address);
        const isOnline = this.connections[address]?.status === 'open';
        
        document.getElementById('active-chat-name').innerText = contact?.name || address.slice(0,8);
        document.getElementById('active-chat-status').innerText = isOnline ? 'Secure Tunnel Active' : 'Offline';
        const dot = document.getElementById('active-chat-status-dot');
        isOnline ? dot.classList.add('online') : dot.classList.remove('online');

        this.renderMessages();

        // Послать read receipts на все непрочитанные
        if(isOnline && this.msgHistory[address]) {
            this.msgHistory[address].forEach(m => {
                if(m.from === 'remote' && m.status !== 'read') {
                    m.status = 'read';
                    this.sendEncrypted(address, { type: 'read', id: m.id });
                }
            });
        }
    },

    renderMessages() {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        if(!this.activePeerId || !this.msgHistory[this.activePeerId]) return;

        this.msgHistory[this.activePeerId].forEach(msg => {
            const wrap = document.createElement('div');
            wrap.className = `message-wrapper ${msg.from === 'local' ? 'sent' : 'received'}`;
            
            let contentHTML = '';
            if(msg.type === 'text') contentHTML = msg.text;
            if(msg.type === 'file') contentHTML = `<a href="${msg.data}" download="${msg.filename}" class="file-link"><i class="fa-solid fa-file"></i> ${msg.filename}</a>`;
            if(msg.type === 'voice') contentHTML = `<audio controls class="audio-player" src="${msg.data}"></audio>`;

            let ticks = '';
            if(msg.from === 'local') {
                if(msg.status === 'sent') ticks = '<i class="fa-solid fa-check msg-tick"></i>';
                if(msg.status === 'read') ticks = '<i class="fa-solid fa-check-double msg-tick read"></i>';
            }

            const timeStr = new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            wrap.innerHTML = `
                <div class="message">${contentHTML}</div>
                <div class="msg-meta">${timeStr} ${ticks}</div>
            `;
            container.appendChild(wrap);
        });
        container.scrollTop = container.scrollHeight;
    }
};
</script>
