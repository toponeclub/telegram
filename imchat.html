<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS · P2P</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg-main:#05070a; --bg-panel:rgba(15,17,22,.9); --bg-hover:rgba(255,255,255,.04);
  --accent:#00ffd5; --accent-dim:rgba(0,255,213,.1);
  --accent-glow:0 0 15px rgba(0,255,213,.4);
  --border-light:rgba(255,255,255,.07); --border-accent:rgba(0,255,213,.3);
  --text-main:#f0f0f0; --text-muted:#7a828e;
  --danger:#ff3366; --warning:#ffb800;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:radial-gradient(circle at 50% 0%,#0d161a 0%,var(--bg-main) 80%);color:var(--text-main);font-family:'Inter',sans-serif;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.waiting-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-main);z-index:100;padding:20px;text-align:center}
.waiting-card{padding:40px 32px;border:1px solid var(--border-light);border-radius:16px;background:var(--bg-panel);max-width:380px;width:100%}
.waiting-card i{color:var(--accent);font-size:44px;margin-bottom:18px;animation:pulse 2s infinite}
.waiting-card h2{letter-spacing:5px;font-weight:300;margin-bottom:8px;font-size:20px}
.waiting-card p{font-size:12px;color:var(--text-muted);line-height:1.6}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}

.app-shell{display:flex;height:100vh;width:100vw;overflow:hidden;position:relative}

/* SIDEBAR */
.sidebar{width:300px;border-right:1px solid var(--border-light);display:flex;flex-direction:column;background:var(--bg-panel);backdrop-filter:blur(20px);flex-shrink:0;transition:transform .3s}
.node-header{padding:18px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:10px}
.node-identity{display:flex;align-items:center;gap:12px;min-width:0}
.node-id-tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:6px 10px;border-radius:6px;border:1px solid var(--border-accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:all .2s}
.node-id-tag:hover{background:rgba(0,255,213,.18)}
.list-section-title{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:2px;padding:16px 18px 8px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.list-section-title .req-count{background:var(--warning);color:#000;font-size:9px;padding:1px 7px;border-radius:8px;letter-spacing:0}
.contacts-scroll{flex:1;overflow-y:auto;padding:6px}
.contact-card{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:4px;border:1px solid transparent;position:relative;transition:all .2s}
.contact-card:hover{background:var(--bg-hover)}
.contact-card.active{background:var(--accent-dim);border-color:var(--border-accent)}
.contact-card.request{border:1px dashed var(--warning);background:rgba(255,184,0,.05);animation:reqGlow 1.8s infinite}
@keyframes reqGlow{0%,100%{box-shadow:0 0 0 rgba(255,184,0,0)}50%{box-shadow:0 0 12px rgba(255,184,0,.25)}}
.contact-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.contact-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-address{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.unread-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;background:var(--accent);color:#000;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
.status-dot{width:7px;height:7px;border-radius:50%;background:#333;transition:all .3s}
.status-dot.online{background:var(--accent);box-shadow:var(--accent-glow)}
.status-dot.pending{background:var(--warning);box-shadow:0 0 8px rgba(255,184,0,.4);animation:pendingBlink 1.2s infinite}
@keyframes pendingBlink{0%,100%{opacity:1}50%{opacity:.35}}
.icon-btn-small{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:4px;font-size:11px;transition:all .2s}
.icon-btn-small:hover{color:var(--danger);background:rgba(255,51,102,.1)}
.icon-btn-small.retry:hover{color:var(--accent);background:var(--accent-dim)}

.icon-btn-header{background:transparent;border:1px solid var(--border-light);color:var(--text-muted);width:32px;height:32px;flex-shrink:0;border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.icon-btn-header:hover{color:var(--danger);border-color:rgba(255,51,102,.5);background:rgba(255,51,102,.08);box-shadow:0 0 12px rgba(255,51,102,.18)}

.sidebar-footer{padding:16px;border-top:1px solid var(--border-light);background:rgba(0,0,0,.2)}
.input-field{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border-light);border-radius:10px;padding:10px 14px;color:#fff;outline:none;font-size:12px;transition:border-color .2s;font-family:inherit}
.input-field:focus{border-color:var(--accent)}
.btn-action{background:transparent;color:var(--accent);border:1px solid var(--border-accent);padding:11px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;width:100%;transition:all .2s;text-align:center;letter-spacing:1px;font-family:inherit;margin-top:8px}
.btn-action:hover{background:var(--accent-dim);box-shadow:var(--accent-glow)}
.btn-action.primary{background:var(--accent);color:#000;border-color:var(--accent)}

/* CHAT VIEW */
.chat-view{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
.chat-header{padding:16px 22px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-panel);backdrop-filter:blur(20px);z-index:10}
.chat-header-left{display:flex;align-items:center;gap:12px;min-width:0}
.chat-name{font-weight:700;font-size:14px;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-top:3px}
.mobile-back-btn{display:none;background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;padding:6px;flex-shrink:0}

.messages-flow{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.msg-wrapper{display:flex;flex-direction:column;max-width:78%}
.msg-wrapper.sent{align-self:flex-end;align-items:flex-end}
.msg-wrapper.received{align-self:flex-start;align-items:flex-start}
.msg-bubble{padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.55;word-break:break-word}
.msg-sent .msg-bubble{background:var(--accent-dim);border:1px solid var(--border-accent);color:var(--accent);border-bottom-right-radius:4px}
.msg-received .msg-bubble{background:#161920;border:1px solid var(--border-light);border-bottom-left-radius:4px}
.msg-meta{font-size:9.5px;color:var(--text-muted);margin-top:4px;font-family:'JetBrains Mono',monospace}

.controls-bar{padding:14px 22px;border-top:1px solid var(--border-light);display:flex;gap:10px;align-items:center;background:var(--bg-panel);backdrop-filter:blur(20px)}
.btn-send{background:var(--accent);color:#000;width:44px;height:44px;border-radius:12px;flex-shrink:0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.btn-send:hover{background:var(--accent);filter:brightness(1.1);box-shadow:var(--accent-glow)}

.full-overlay{position:absolute;inset:0;background:rgba(5,7,10,.9);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:20px}

/* LO-FI AVATAR (small, decorative) */
.qr-avatar{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  padding:5px;background:#000;border:1px solid rgba(255,255,255,.06);
  box-shadow:0 4px 10px rgba(0,0,0,.5);overflow:hidden;
  cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;
}
.qr-avatar:hover{transform:scale(1.07);box-shadow:0 0 0 1px var(--border-accent),0 6px 18px rgba(0,0,0,.6)}
.qr-avatar.sm{width:36px;height:36px;padding:4px}
.qr-avatar.lg{width:64px;height:64px;padding:7px;border-radius:14px}
.qr-pixel{width:100%;height:100%}

/* REQUEST OVERLAY */
.req-overlay{position:absolute;inset:0;background:rgba(5,7,10,.98);z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.req-id{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px;margin:14px 0 30px;word-break:break-all;padding:0 20px}

/* QR SHARE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,10,.88);backdrop-filter:blur(12px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.share-card{
  background:linear-gradient(180deg,rgba(18,22,28,.98),rgba(10,13,17,.98));
  border:1px solid var(--border-accent);border-radius:18px;padding:26px 22px;max-width:380px;width:100%;
  text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 50px var(--accent-dim);
  animation:fadeIn .28s ease forwards;margin:auto;
}
.share-title{font-size:10px;letter-spacing:4px;color:var(--text-muted);font-weight:700;text-transform:uppercase}
.share-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);margin-top:6px;letter-spacing:1px;margin-bottom:14px}
.share-qr-wrap{
  display:inline-flex;padding:14px;background:#ffffff;border-radius:14px;
  border:1px solid var(--border-light);margin:4px 0 16px;
  box-shadow:0 0 30px var(--accent-dim), inset 0 0 0 1px rgba(255,255,255,.1);
}
.share-qr-wrap img, .share-qr-wrap canvas{display:block;border-radius:4px}
.share-hint{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px;margin-bottom:14px}
.share-addr{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
  word-break:break-all;background:var(--accent-dim);border:1px solid var(--border-accent);
  border-radius:10px;padding:11px 12px;margin-bottom:14px;line-height:1.5;cursor:pointer;transition:all .2s;
}
.share-addr:hover{background:rgba(0,255,213,.15)}
.share-actions{display:flex;gap:10px}
.share-actions .btn-action{margin-top:0}

/* TOAST */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(15,17,22,.97);border:1px solid var(--border-accent);color:var(--accent);
  padding:11px 22px;border-radius:10px;font-size:11px;font-family:'JetBrains Mono',monospace;
  letter-spacing:1.5px;z-index:300;opacity:0;pointer-events:none;transition:all .3s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px var(--accent-dim);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{border-color:rgba(255,184,0,.6);color:var(--warning);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px rgba(255,184,0,.25)}
.toast.ok{border-color:rgba(0,255,213,.6);color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fadeIn .35s ease forwards}

@media(max-width:520px){
  .sidebar{width:100%;position:absolute;height:100%;z-index:20;border-right:none}
  .chat-view{width:100%;position:absolute;height:100%;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .app-shell.in-chat .sidebar{transform:translateX(-25%);opacity:0;pointer-events:none}
  .app-shell.in-chat .chat-view{transform:translateX(0)}
  .mobile-back-btn{display:flex}
  .msg-wrapper{max-width:88%}
  .controls-bar{padding:12px}
  .chat-header{padding:12px 14px}
}
</style>
</head>
<body>

<!-- WAITING STATE -->
<div id="waiting-screen" class="waiting-overlay">
  <div class="waiting-card animate-fade">
    <i class="fa-solid fa-satellite-dish"></i>
    <h2>NEXUS</h2>
    <p style="color:var(--accent);font-family:'JetBrains Mono';font-size:10px;letter-spacing:2px;margin-bottom:14px;">P2P_ENCRYPTED_MESH</p>
    <p>Awaiting wallet from hub...</p>
    <p style="margin-top:10px;opacity:.5;font-size:11px">Open your wallet in the main dashboard to activate the secure channel.</p>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-shell" id="app-shell" style="display:none">
  <aside class="sidebar">
    <div class="node-header">
      <div class="node-identity">
        <div id="my-avatar" title="Share my identity"></div>
        <div class="node-id-tag" id="my-address-display" title="Click to copy / share">0x...</div>
      </div>
      <button class="icon-btn-header" title="Burn all sessions" onclick="App.secureWipeAll(false)"><i class="fa-solid fa-fire"></i></button>
    </div>
    <div class="contacts-scroll" id="contacts-list"></div>
    <div class="sidebar-footer">
      <input type="text" id="add-peer-id" class="input-field" placeholder="Wallet 0x..." autocomplete="off">
      <input type="text" id="add-peer-name" class="input-field" placeholder="Nickname (optional)" style="margin-top:8px" autocomplete="off">
      <button class="btn-action" onclick="App.addContact()">+ ADD CONTACT</button>
    </div>
  </aside>

  <main class="chat-view">
    <div id="empty-state" class="full-overlay">
      <i class="fa-solid fa-shield-halved" style="font-size:42px;color:var(--border-light);margin-bottom:20px"></i>
      <p style="color:var(--text-muted);font-size:11px;letter-spacing:3px;text-transform:uppercase">Awaiting Secure Connection</p>
    </div>

    <div id="request-state" class="req-overlay">
      <div id="req-avatar"></div>
      <div class="req-id" id="req-id">0x...</div>
      <p style="color:var(--text-muted);font-size:12px;margin-bottom:30px;font-family:Inter">Requests an encrypted E2E tunnel</p>
      <div style="display:flex;gap:12px;width:100%;max-width:260px">
        <button class="btn-action primary" style="flex:1" onclick="App.acceptHandshake()">ACCEPT</button>
        <button class="btn-action" style="flex:1;border-color:var(--danger);color:var(--danger);margin-top:0" onclick="App.declineHandshake()">DECLINE</button>
      </div>
    </div>

    <header class="chat-header">
      <div class="chat-header-left">
        <button class="mobile-back-btn" onclick="App.closeChatMobile()"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="active-avatar" title="Share identity"></div>
        <div style="min-width:0">
          <div class="chat-name" id="active-peer-name">Unknown_Node</div>
          <div class="chat-sub">
            <span class="status-dot" id="active-status-dot"></span>
            <span id="active-status-text">DISCONNECTED</span>
          </div>
        </div>
      </div>
      <button class="icon-btn-header" id="burn-btn" title="Burn this chat" onclick="App.burnActive()" style="display:none"><i class="fa-solid fa-fire-flame-curved"></i></button>
    </header>

    <div class="messages-flow" id="messages-flow"></div>

    <footer class="controls-bar">
      <input type="text" id="chat-input" class="input-field" placeholder="Transmit secure message..." onkeypress="if(event.key==='Enter')App.sendText()" autocomplete="off">
      <button class="btn-send" onclick="App.sendText()"><i class="fa-solid fa-paper-plane"></i></button>
    </footer>
  </main>
</div>

<!-- QR SHARE MODAL -->
<div class="modal-overlay" id="share-modal" onclick="if(event.target===this)App.closeShare()">
  <div class="share-card">
    <div class="share-title">SECURE IDENTITY</div>
    <div class="share-sub" id="share-label">NODE</div>
    <div class="share-qr-wrap" id="share-qr"></div>
    <div class="share-hint"><i class="fa-solid fa-camera"></i> SCAN WITH YOUR PHONE</div>
    <div class="share-addr" id="share-addr" onclick="App.copyAddress()" title="Click to copy">0x...</div>
    <div class="share-actions">
      <button class="btn-action" onclick="App.copyAddress()"><i class="fa-regular fa-copy"></i>&nbsp;COPY</button>
      <button class="btn-action primary" onclick="App.downloadQR()"><i class="fa-solid fa-download"></i>&nbsp;SAVE</button>
    </div>
    <button class="btn-action" style="border-color:var(--border-light);color:var(--text-muted)" onclick="App.closeShare()">CLOSE</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   NEXUS · P2P Chat — v3
   FIXES:
   1. ECDH key now stored per-connection (conn._ecdh) — was being
      overwritten by the second simultaneous dial, causing key mismatch.
   2. Duplicate-channel resolution — smaller PeerJS ID keeps outgoing,
      larger keeps incoming. Both ends agree on the same physical channel.
   3. Real scannable QR via qrcodejs (white background).
   4. Manual RETRY button on each contact card.
   5. Full state-transition toasts.
   ============================================================ */

// ─── 1. Crypto ───
const CryptoEngine = {
  async generateECDH(){ return crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-384"},true,["deriveKey"]); },
  async deriveAES(priv,pubBuf){
    const peer=await crypto.subtle.importKey("raw",new Uint8Array(pubBuf),{name:"ECDH",namedCurve:"P-384"},true,[]);
    return crypto.subtle.deriveKey({name:"ECDH",public:peer},priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  },
  async encrypt(key,text){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const enc=new TextEncoder().encode(text);
    const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc);
    return {iv:Array.from(iv),data:Array.from(new Uint8Array(c))};
  },
  async decrypt(key,obj){
    try{
      const d=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(obj.iv)},key,new Uint8Array(obj.data));
      return new TextDecoder().decode(d);
    }catch(e){ return "[CORRUPTED]"; }
  }
};

// ─── 2. LO-FI avatar (decorative, small) ───
const QRAvatar = {
  SIZE: 9,
  matrix(address){
    const hash=(address||'0x0').toLowerCase().replace('0x','')||'0';
    const SIZE=this.SIZE;
    const m=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    const finders=[[0,0],[0,SIZE-3],[SIZE-3,0]];
    finders.forEach(([r,c])=>{ for(let i=0;i<3;i++) for(let j=0;j<3;j++) m[r+i][c+j]=1; });
    let idx=0;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      let inFinder=false;
      finders.forEach(([fr,fc])=>{ if(r>=fr&&r<fr+3&&c>=fc&&c<fc+3) inFinder=true; });
      if(inFinder) continue;
      const code=hash.charCodeAt((idx+hash.length)%hash.length)||48;
      m[r][c]=(code*7+idx*13+r*3+c*5)%3===0?1:0;
      idx++;
    }
    return m;
  },
  hue(address){
    const hash=(address||'0x0').toLowerCase().replace('0x','');
    return parseInt(hash.slice(0,4)||'0',16)%360;
  },
  color(address){ return `hsl(${this.hue(address)},85%,62%)`; },
  render(address, targetId, cls){
    const el=document.getElementById(targetId); if(!el) return;
    el.className='qr-avatar '+(cls||'');
    el.innerHTML='';
    const m=this.matrix(address);
    const color=this.color(address);
    for(let r=0;r<this.SIZE;r++) for(let c=0;c<this.SIZE;c++){
      const p=document.createElement('div');
      p.className='qr-pixel';
      if(m[r][c]){
        p.style.background=color;
        p.style.boxShadow=`0 0 4px ${color}`;
        p.style.borderRadius='1px';
      }
      el.appendChild(p);
    }
  }
};

// ─── 3. App ───
const App = {
  myAddress:null, peer:null, dbPrefix:null,
  connections:{}, activeSessions:{}, incomingRequests:{},
  pendingConns:{},
  lastSeen:{},
  activePeer:null,
  chatHistory:{},
  contacts:[],
  unread:{},
  booted:false,
  _inited:false,
  _shareAddr:null,

  TTL_MS: 15*60*1000,
  lastActivity: Date.now(),
  _idleTimer:null,
  _pulseInterval: 5000,

  /* ─── HUB BRIDGE ─── */
  init(){
    if(this._inited) return;
    this._inited=true;

    document.getElementById('waiting-screen').style.display='none';
    document.getElementById('app-shell').style.display='flex';

    window.addEventListener('message', e=>this.onHubMessage(e));

    const myAv=document.getElementById('my-avatar');
    if(myAv) myAv.onclick=()=>this.openShare(this.myAddress);
    const actAv=document.getElementById('active-avatar');
    if(actAv) actAv.onclick=()=>this.openShare(this.activePeer);
    const myTag=document.getElementById('my-address-display');
    if(myTag) myTag.onclick=()=>this.openShare(this.myAddress);

    this.initActivityWatch();
    window.addEventListener('keydown', e=>{ if(e.key==='Escape') this.closeShare(); });
    console.log('[NEXUS] init() complete, awaiting hub_init…');
  },
  toHub(msg){
    try{ if(window.parent && window.parent!==window) window.parent.postMessage(msg,'*'); }catch(e){}
  },
  onHubMessage(e){
    const d=e.data; if(!d||typeof d!=='object'||!d.type) return;
    if(d.type==='hub_init'){
      console.log('[NEXUS] hub_init received, wallet =', d.wallet);
      if(d.accent) this.setAccent(d.accent);
      document.getElementById('waiting-screen').style.display='none';
      document.getElementById('app-shell').style.display='flex';
      if(d.wallet) this.boot(d.wallet);
    }
  },
  setAccent(hex){
    if(!hex||!hex.startsWith('#')) return;
    const dim=this.hexRgba(hex,.1), bord=this.hexRgba(hex,.3), glow=`0 0 15px ${this.hexRgba(hex,.4)}`;
    document.documentElement.style.setProperty('--accent',hex);
    document.documentElement.style.setProperty('--accent-dim',dim);
    document.documentElement.style.setProperty('--border-accent',bord);
    document.documentElement.style.setProperty('--accent-glow',glow);
  },
  hexRgba(hex,a){
    const h=hex.replace('#','');
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  },
  broadcastUnread(){
    const total=Object.values(this.unread).reduce((s,n)=>s+n,0);
    this.toHub({type:'imchat_unread',count:total});
  },
  toast(msg, kind){
    const t=document.getElementById('toast');
    if(!t) return;
    t.innerText=msg;
    t.classList.remove('warn','ok');
    if(kind==='warn') t.classList.add('warn');
    else if(kind==='ok') t.classList.add('ok');
    t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT=setTimeout(()=>t.classList.remove('show'),2800);
  },

  /* ─── SESSION PERSISTENCE ─── */
  sessKey(){ return 'nexus_sess_'+(this.myAddress||'anon'); },
  saveSession(){
    if(!this.myAddress) return;
    try{
      sessionStorage.setItem(this.sessKey(), JSON.stringify({
        chat:this.chatHistory, unread:this.unread, ts:Date.now()
      }));
    }catch(e){}
  },
  loadSession(){
    try{
      const raw=sessionStorage.getItem(this.sessKey());
      if(!raw){ this.chatHistory={}; this.unread={}; return; }
      const d=JSON.parse(raw);
      this.chatHistory=(d&&typeof d.chat==='object'&&d.chat)?d.chat:{};
      this.unread=(d&&typeof d.unread==='object'&&d.unread)?d.unread:{};
    }catch(e){ this.chatHistory={}; this.unread={}; }
  },
  dropSession(){ try{ sessionStorage.removeItem(this.sessKey()); }catch(e){} },

  initActivityWatch(){
    const reset=()=>{ this.lastActivity=Date.now(); };
    ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev=>
      window.addEventListener(ev, reset, {passive:true})
    );
    if(this._idleTimer) clearInterval(this._idleTimer);
    this._idleTimer=setInterval(()=>{
      if(!this.booted) return;
      if(Date.now()-this.lastActivity > this.TTL_MS){
        this.lastActivity=Date.now();
        this.secureWipeAll(true);
      }
    }, 30000);
  },

  /* ─── PeerJS ID derivation ─── */
  peerIdFor(addr){
    const safe=btoa(addr).replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,20);
    return `imnode_${safe}`;
  },

  /* ─── BOOT / SHUTDOWN ─── */
  boot(addr){
    const norm=addr.toLowerCase();
    if(this.booted && this.myAddress===norm) return;
    if(this.booted) this.shutdown(true);
    this.myAddress=norm;
    this.dbPrefix=`nexus_${this.myAddress}_`;
    this.loadContacts();
    this.loadSession();
    this.lastActivity=Date.now();

    document.getElementById('waiting-screen').style.display='none';
    document.getElementById('app-shell').style.display='flex';

    const nodeId=this.peerIdFor(this.myAddress);
    console.log('[NEXUS] Booting. wallet =', this.myAddress, '· PeerID =', nodeId);

    if(this.peer) try{this.peer.destroy()}catch(e){}
    this.peer=new Peer(nodeId,{debug:1});

    this.peer.on('open',(id)=>{
      console.log('[NEXUS] PeerJS OPEN · id =', id);
      QRAvatar.render(this.myAddress,'my-avatar');
      document.getElementById('my-address-display').innerText=
        this.myAddress.slice(0,6)+'...'+this.myAddress.slice(-4);
      this.renderSidebar();
      this.broadcastUnread();
      if(this._pulse) clearInterval(this._pulse);
      this._pulse=setInterval(()=>this.networkPulse(),this._pulseInterval);
      this.networkPulse();
    });
    this.peer.on('connection',conn=>{
      console.log('[NEXUS] INCOMING PeerJS connection from', conn.peer);
      this.setupDataChannel(conn);
    });
    this.peer.on('error',err=>{
      console.warn('[NEXUS] PeerJS error:', err.type, err);
      if(err.type==='unavailable-id'){
        this.toast('PEER ID TAKEN · ANOTHER TAB SAME WALLET', 'warn');
      }
    });
    this.peer.on('disconnected',()=>{
      console.warn('[NEXUS] signaling disconnected · reconnecting…');
      try{ this.peer.reconnect(); }catch(e){}
    });
    this.booted=true;
  },
  shutdown(silent){
    if(this.peer) try{this.peer.destroy()}catch(e){}
    if(this._pulse) clearInterval(this._pulse);
    this.peer=null; this.booted=false;
    this.connections={}; this.activeSessions={}; this.incomingRequests={};
    this.pendingConns={};
    this.chatHistory={}; this.unread={}; this.activePeer=null;
    this.saveSession();
    if(!silent){
      document.getElementById('waiting-screen').style.display='flex';
      document.getElementById('app-shell').style.display='none';
    }
    this.broadcastUnread();
  },

  /* ─── CONTACTS ─── */
  loadContacts(){
    try{ this.contacts=JSON.parse(localStorage.getItem(this.dbPrefix+'contacts')||'[]'); }
    catch(e){ this.contacts=[]; }
    if(!Array.isArray(this.contacts)) this.contacts=[];
  },
  saveContacts(){ try{ localStorage.setItem(this.dbPrefix+'contacts',JSON.stringify(this.contacts)); }catch(e){} },
  findContact(addr){ return this.contacts.find(c=>c.address===addr); },
  contactName(addr){ const c=this.findContact(addr); return c?c.name:(addr.slice(0,6)+'...'+addr.slice(-4)); },

  addContact(){
    const addrEl=document.getElementById('add-peer-id');
    const nameEl=document.getElementById('add-peer-name');
    const addr=(addrEl.value||'').trim().toLowerCase();
    const name=(nameEl.value||'').trim();
    if(!addr){ this.toast('ENTER A WALLET ADDRESS','warn'); return; }
    if(addr===this.myAddress){ this.toast('CANNOT ADD YOURSELF','warn'); return; }
    if(!/^0x[a-f0-9]{6,}$/.test(addr)){ this.toast('INVALID WALLET FORMAT','warn'); return; }
    if(this.findContact(addr)){ this.toast('CONTACT ALREADY EXISTS','warn'); addrEl.value=''; nameEl.value=''; return; }

    this.contacts.push({address:addr, name:name||('Node '+addr.slice(-4))});
    this.saveContacts();
    addrEl.value=''; nameEl.value='';
    this.renderSidebar();
    this.toast('CONTACT ADDED · DIALING…','ok');
    if(this.peer && this.peer.open) this.networkPulse();
  },
  deleteContact(addr){
    if(this.connections[addr]) try{this.connections[addr].close()}catch(e){}
    if(this.pendingConns[addr]) try{this.pendingConns[addr].close()}catch(e){}
    delete this.connections[addr];
    delete this.activeSessions[addr];
    delete this.chatHistory[addr];
    delete this.unread[addr];
    delete this.pendingConns[addr];
    this.contacts=this.contacts.filter(c=>c.address!==addr);
    this.saveContacts();
    this.saveSession();
    if(this.activePeer===addr){ this.activePeer=null; this.showEmpty(); }
    this.renderSidebar();
    this.broadcastUnread();
  },
  renameContact(addr){
    const c=this.findContact(addr); if(!c) return;
    const nn=prompt('Nickname:',c.name);
    if(nn===null) return;
    c.name=nn.trim()||('Node '+addr.slice(-4));
    this.saveContacts();
    this.renderSidebar();
    if(this.activePeer===addr) this.updateChatHeader();
  },

  /* ─── P2P NETWORK ─── */
  networkPulse(){
    if(!this.peer||!this.peer.open) return;
    const now=Date.now();

    this.contacts.forEach(({address:addr})=>{
      const active=this.connections[addr];
      const pending=this.pendingConns[addr];
      const hasActive=active && active.open;
      const hasPending=pending && !pending.closed;

      if(hasActive || hasPending) return;

      const targetId=this.peerIdFor(addr);
      console.log('[NEXUS] → Dialing', addr, '(', targetId, ')');
      let c;
      try{ c=this.peer.connect(targetId,{reliable:true}); }
      catch(e){ console.warn('[NEXUS] connect() threw', e); return; }
      if(!c) return;

      this.pendingConns[addr]=c;

      const timeout=setTimeout(()=>{
        if(this.pendingConns[addr]===c && !c.open){
          console.warn('[NEXUS] Pending timeout', addr);
          try{ c.close(); }catch(e){}
          if(this.pendingConns[addr]===c) delete this.pendingConns[addr];
        }
      }, 15000);
      c.on('open',()=>clearTimeout(timeout));
      c.on('close',()=>{
        clearTimeout(timeout);
        if(this.pendingConns[addr]===c) delete this.pendingConns[addr];
      });
      c.on('error',()=>{
        clearTimeout(timeout);
        if(this.pendingConns[addr]===c) delete this.pendingConns[addr];
      });

      this.setupDataChannel(c);
    });

    for(const [addr,conn] of Object.entries(this.connections)){
      if(conn.open){
        try{ conn.send({type:'ping',address:this.myAddress}); }catch(e){}
        if(this.lastSeen[addr] && now-this.lastSeen[addr]>20000){
          console.warn('[NEXUS] Stale · closing', addr);
          try{ conn.close(); }catch(e){}
          delete this.connections[addr];
          delete this.activeSessions[addr];
          this.renderSidebar();
          if(this.activePeer===addr) this.updateChatHeader();
        }
      }
    }

    this.renderSidebar();
  },

  /* ─── Close any other DataChannels we have for this peer ─── */
  closeOtherChannels(addr, keepConn){
    Object.entries(this.connections).forEach(([a,c])=>{
      if(a===addr && c && c!==keepConn){ try{ c.close(); }catch(e){} }
    });
    Object.entries(this.pendingConns).forEach(([a,c])=>{
      if(a===addr && c && c!==keepConn){ try{ c.close(); }catch(e){} delete this.pendingConns[a]; }
    });
  },

  async setupDataChannel(conn){
    // *** FIX: attach ECDH to the conn itself, never to a shared map ***
    const ecdh = await CryptoEngine.generateECDH();
    const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);
    conn._ecdh = ecdh;
    conn._myPub = Array.from(new Uint8Array(myPub));

    const sendHandshake = () => {
      try{
        conn.send({
          type:'handshake_req',
          address:this.myAddress,
          pub:conn._myPub
        });
        console.log('[NEXUS] → handshake_req to', conn.peer);
      }catch(e){ console.warn('[NEXUS] handshake send failed', e); }
    };

    if(conn.open) sendHandshake();
    else conn.on('open',sendHandshake);

    conn.on('data',async data=>{
      if(!data||!data.type) return;
      if(data.address) conn.peerAddress=data.address.toLowerCase();
      const addr=conn.peerAddress;
      if(!addr) return;

      if(this.pendingConns[addr]===conn) delete this.pendingConns[addr];

      // ─── PING / PONG ───
      if(data.type==='ping'){
        try{ conn.send({type:'pong',address:this.myAddress}); }catch(e){}
        return;
      }
      if(data.type==='pong'){
        this.lastSeen[addr]=Date.now();
        if(!this.connections[addr]) this.connections[addr]=conn;
        this.renderSidebar();
        if(this.activePeer===addr) this.updateChatHeader();
        return;
      }

      // ─── HANDSHAKE REQUEST ───
      if(data.type==='handshake_req'){
        const myId = this.peer ? this.peer.id : null;
        const theirId = conn.peer;
        const iAmSmaller = myId && theirId && myId < theirId;

        console.log('[NEXUS] ← handshake_req from', addr,
                    '· myId='+myId, '· theirId='+theirId,
                    '· smaller='+iAmSmaller);

        // DUPLICATE CHANNEL RESOLUTION
        // Rule: smaller PeerJS ID uses its OWN outgoing channel.
        //       So if we are smaller and we already have an outgoing,
        //       we ignore this incoming handshake.
        if(iAmSmaller){
          const outgoing = this.pendingConns[addr] || (this.connections[addr] && this.connections[addr]!==conn ? this.connections[addr] : null);
          if(outgoing && outgoing !== conn && !outgoing.closed){
            console.log('[NEXUS] Duplicate · keeping outgoing, closing incoming');
            try{ conn.close(); }catch(e){}
            return;
          }
        }

        // Use this incoming as the active channel
        this.connections[addr]=conn;
        this.lastSeen[addr]=Date.now();
        // If we had a pending outgoing for this addr, close it
        this.closeOtherChannels(addr, conn);

        if(this.findContact(addr)){
          // We know them → auto-complete handshake using THIS conn's ecdh
          this.activeSessions[addr] = await CryptoEngine.deriveAES(conn._ecdh.privateKey, data.pub);
          try{
            conn.send({
              type:'handshake_ack',
              address:this.myAddress,
              pub:conn._myPub
            });
          }catch(e){}
          console.log('[NEXUS] ← auto-accepted tunnel with', addr);
          this.toast('TUNNEL ACTIVE · '+this.contactName(addr),'ok');
          this.renderSidebar();
          if(this.activePeer===addr) this.updateChatHeader();
        } else {
          // Stranger → incoming request
          if(!this.incomingRequests[addr]){
            this.toast('NEW CONNECTION REQUEST · '+addr.slice(0,6)+'…'+addr.slice(-4), 'warn');
          }
          this.incomingRequests[addr]={conn,pub:data.pub,ecdh:conn._ecdh};
          this.renderSidebar();
        }
      }

      // ─── HANDSHAKE ACK ───
      else if(data.type==='handshake_ack'){
        console.log('[NEXUS] ← handshake_ack from', addr);
        this.lastSeen[addr]=Date.now();
        // Use THIS conn's ecdh — the one we generated for this exact channel
        this.activeSessions[addr] = await CryptoEngine.deriveAES(conn._ecdh.privateKey, data.pub);
        this.connections[addr]=conn;
        delete this.pendingConns[addr];

        // Close the OTHER channel (if we have one)
        this.closeOtherChannels(addr, conn);

        this.toast('TUNNEL ACTIVE · '+this.contactName(addr),'ok');
        this.renderSidebar();
        if(this.activePeer===addr) this.updateChatHeader();
      }

      // ─── HANDSHAKE DECLINE ───
      else if(data.type==='handshake_decline'){
        console.log('[NEXUS] ← handshake_decline from', addr);
        try{ conn.close(); }catch(e){}
        delete this.connections[addr];
        delete this.activeSessions[addr];
        delete this.incomingRequests[addr];
        delete this.pendingConns[addr];
        this.toast('CONNECTION DECLINED','warn');
        this.renderSidebar();
        if(this.activePeer===addr) this.updateChatHeader();
      }

      // ─── ENCRYPTED MESSAGE ───
      else if(data.type==='enc' && this.activeSessions[addr]){
        this.lastSeen[addr]=Date.now();
        const dec=await CryptoEngine.decrypt(this.activeSessions[addr],data.payload);
        if(dec!=='[CORRUPTED]'){
          try{
            const msg=JSON.parse(dec);
            msg.dir='received';
            msg.time=msg.time||Date.now();
            if(!this.chatHistory[addr]) this.chatHistory[addr]=[];
            this.chatHistory[addr].push(msg);
            this.saveSession();
            if(this.activePeer===addr){
              this.renderMessage(msg);
            } else {
              this.unread[addr]=(this.unread[addr]||0)+1;
              this.saveSession();
              this.broadcastUnread();
              this.renderSidebar();
            }
          }catch(e){}
        } else {
          console.warn('[NEXUS] Decryption failed for', addr, '- key mismatch?');
        }
      }
    });

    conn.on('close',()=>{
      const addr=conn.peerAddress;
      console.log('[NEXUS] Channel closed', addr||conn.peer);
      if(addr){
        if(this.connections[addr]===conn) delete this.connections[addr];
        if(this.pendingConns[addr]===conn) delete this.pendingConns[addr];
        delete this.activeSessions[addr];
        this.renderSidebar();
        if(this.activePeer===addr) this.updateChatHeader();
      }
    });
    conn.on('error',(e)=>console.warn('[NEXUS] DataChannel error', e));
  },

  /* ─── Manual retry from a card ─── */
  retryContact(addr){
    if(this.pendingConns[addr]){ try{this.pendingConns[addr].close();}catch(e){} delete this.pendingConns[addr]; }
    if(this.connections[addr]){ try{this.connections[addr].close();}catch(e){} delete this.connections[addr]; }
    delete this.activeSessions[addr];
    this.renderSidebar();
    this.toast('RETRYING…');
    if(this.peer && this.peer.open) this.networkPulse();
  },

  /* ─── HANDSHAKE ACTIONS ─── */
  async acceptHandshake(){
    const addr=this.activePeer;
    const req=this.incomingRequests[addr];
    if(req && req.conn.open){
      const name='Node '+addr.slice(-4);
      if(!this.findContact(addr)){ this.contacts.push({address:addr,name}); this.saveContacts(); }
      // *** Use the ecdh we stored on the request (bound to THIS conn) ***
      this.activeSessions[addr] = await CryptoEngine.deriveAES(req.ecdh.privateKey, req.pub);
      try{
        req.conn.send({
          type:'handshake_ack',
          address:this.myAddress,
          pub:Array.from(new Uint8Array(await crypto.subtle.exportKey("raw",req.ecdh.publicKey)))
        });
      }catch(e){}
      this.connections[addr]=req.conn;
      delete this.incomingRequests[addr];
      this.renderSidebar();
      this.openChat(addr);
      this.toast('TUNNEL ACCEPTED','ok');
    }
  },
  declineHandshake(){
    const addr=this.activePeer;
    const req=this.incomingRequests[addr];
    if(req&&req.conn.open){ try{req.conn.send({type:'handshake_decline'});req.conn.close();}catch(e){} }
    delete this.incomingRequests[addr];
    this.activePeer=null;
    document.getElementById('request-state').style.display='none';
    this.showEmpty();
    this.renderSidebar();
  },

  /* ─── SECURE WIPE / BURN ─── */
  burnActive(){ if(this.activePeer) this.burnChat(this.activePeer); },
  burnChat(addr){
    if(!addr) return;
    if(!confirm('Burn this chat?\n\nHistory and E2E encryption keys will be permanently destroyed. This cannot be undone.')) return;
    delete this.chatHistory[addr];
    delete this.unread[addr];
    delete this.activeSessions[addr];
    const conn=this.connections[addr];
    if(conn){ try{conn.close()}catch(e){} delete this.connections[addr]; }
    const pc=this.pendingConns[addr];
    if(pc){ try{pc.close()}catch(e){} delete this.pendingConns[addr]; }
    this.saveSession();
    this.broadcastUnread();
    if(this.activePeer===addr){
      document.getElementById('messages-flow').innerHTML='';
      this.updateChatHeader();
    }
    this.renderSidebar();
    this.toast('CHAT BURNED · KEYS DESTROYED','warn');
  },
  secureWipeAll(silent){
    Object.values(this.connections).forEach(c=>{ try{c.close(); }catch(e){} });
    Object.values(this.pendingConns).forEach(c=>{ try{c.close(); }catch(e){} });
    this.connections={};
    this.activeSessions={};
    this.incomingRequests={};
    this.pendingConns={};
    this.chatHistory={};
    this.unread={};
    this.lastSeen={};
    this.activePeer=null;
    this.dropSession();
    document.getElementById('app-shell').classList.remove('in-chat');
    this.showEmpty();
    this.renderSidebar();
    this.broadcastUnread();
    this.toast(silent ? 'IDLE TTL · ALL SESSIONS BURNED' : 'ALL SESSIONS BURNED','warn');
  },

  /* ─── QR SHARE MODAL (real scannable QR) ─── */
  openShare(addr){
    if(!addr) return;
    this._shareAddr=addr;
    const label=document.getElementById('share-label');
    const addrEl=document.getElementById('share-addr');
    const wrap=document.getElementById('share-qr');

    label.innerText = (addr===this.myAddress)
      ? 'YOUR NODE · SCAN TO ADD'
      : (this.contactName(addr)||'REMOTE NODE').toUpperCase();
    addrEl.innerText = addr;
    wrap.innerHTML='';

    // Real scannable QR — white background, dark modules
    // Use accent color only if it's dark enough on white; else use black
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00ffd5';
    const darkColor = this.contrastOnWhite(accent) ? '#000000' : accent;

    try {
      new QRCode(wrap, {
        text: addr,
        width: 220,
        height: 220,
        colorDark: '#0a0e12',   // always black-ish for maximum scan reliability
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(e){
      console.warn('[NEXUS] QR generation failed, falling back', e);
      wrap.innerHTML='<div style="color:#000;padding:40px;font-family:monospace;font-size:10px">QR ERROR</div>';
    }

    document.getElementById('share-modal').classList.add('show');
  },
  // Simple heuristic: if a color is light (contrast on white too low) → use black
  contrastOnWhite(hex){
    try{
      const h=hex.replace('#','').slice(0,6);
      if(h.length!==6) return false;
      const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
      const lum = 0.2126*r + 0.7152*g + 0.0722*b;
      return lum > 140; // light color → poor contrast on white
    }catch(e){ return false; }
  },
  closeShare(){
    document.getElementById('share-modal').classList.remove('show');
    this._shareAddr=null;
  },
  copyAddress(){
    const addr=this._shareAddr; if(!addr) return;
    const done=()=>this.toast('ADDRESS COPIED','ok');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(addr).then(done).catch(()=>this._fallbackCopy(addr,done));
    } else {
      this._fallbackCopy(addr,done);
    }
  },
  _fallbackCopy(text, cb){
    try{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      cb();
    }catch(e){ this.toast('COPY FAILED','warn'); }
  },
  downloadQR(){
    const addr=this._shareAddr; if(!addr) return;
    try{
      // qrcodejs puts a canvas or img inside the wrap
      const wrap=document.getElementById('share-qr');
      const canvas=wrap.querySelector('canvas');
      const img=wrap.querySelector('img');
      let dataUrl=null;
      if(canvas) dataUrl=canvas.toDataURL('image/png');
      else if(img) dataUrl=img.src;
      if(!dataUrl){ this.toast('QR NOT READY','warn'); return; }

      const link=document.createElement('a');
      link.download=`nexus_${addr.slice(0,10)}.png`;
      link.href=dataUrl;
      document.body.appendChild(link);
      link.click();
      link.remove();
      this.toast('QR SAVED','ok');
    }catch(e){ this.toast('SAVE FAILED','warn'); }
  },

  /* ─── UI RENDER ─── */
  renderSidebar(){
    const list=document.getElementById('contacts-list');
    if(!list) return;
    list.innerHTML='';
    const requests=Object.keys(this.incomingRequests);
    if(requests.length){
      const h=document.createElement('div');
      h.className='list-section-title';
      h.innerHTML='<span>REQUESTS</span><span class="req-count">'+requests.length+'</span>';
      list.appendChild(h);
      requests.forEach(a=>list.appendChild(this.makeCard(a,true)));
    }
    if(this.contacts.length){
      const h=document.createElement('div');
      h.className='list-section-title';
      h.innerText='Secure Nodes';
      list.appendChild(h);
      const sorted=[...this.contacts].sort((a,b)=>{
        const aOn=this.connections[a.address]&&this.connections[a.address].open;
        const bOn=this.connections[b.address]&&this.connections[b.address].open;
        if(aOn!==bOn) return aOn?-1:1;
        return String(a.name).localeCompare(String(b.name));
      });
      sorted.forEach(c=>list.appendChild(this.makeCard(c.address,false)));
    }
  },
  makeCard(addr,isReq){
    const conn=this.connections[addr];
    const hasConn=conn&&conn.open;
    const isSecure=this.activeSessions[addr]!==undefined;
    const isPending=!!this.pendingConns[addr];
    let dotCls='';
    if(hasConn&&isSecure) dotCls='online';
    else if(hasConn||isPending) dotCls='pending';
    const card=document.createElement('div');
    card.className=`contact-card ${this.activePeer===addr?'active':''} ${isReq?'request':''}`;
    card.onclick=()=>this.openChat(addr,isReq);
    const avId='av_'+addr.slice(-8)+'_'+Math.random().toString(36).slice(2,5);
    const name=isReq?('Node '+addr.slice(-4)):this.contactName(addr);
    const unread=this.unread[addr]||0;
    const stateTag = !isReq && !isSecure
      ? (isPending ? '<span style="color:var(--warning);font-size:9px;font-family:JetBrains Mono">PENDING</span>'
                   : '<span style="color:var(--text-muted);font-size:9px;font-family:JetBrains Mono">OFFLINE</span>')
      : '';
    card.innerHTML=`
      <div id="${avId}" title="Share identity"></div>
      <div class="contact-info">
        <span class="contact-name">${this.esc(name)} ${stateTag}</span>
        <span class="contact-address">${addr.slice(0,8)}...${addr.slice(-6)}</span>
      </div>
      <div class="contact-actions">
        ${unread>0?`<span class="unread-badge">${unread>99?'99+':unread}</span>`:''}
        ${!isReq?`<button class="icon-btn-small retry" title="Retry connection" onclick="event.stopPropagation();App.retryContact('${addr}')"><i class="fa-solid fa-rotate"></i></button>
        <button class="icon-btn-small" title="Rename" onclick="event.stopPropagation();App.renameContact('${addr}')"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn-small" title="Delete" onclick="event.stopPropagation();App.deleteContact('${addr}')"><i class="fa-solid fa-trash-can"></i></button>`:''}
        <div class="status-dot ${dotCls}"></div>
      </div>`;
    setTimeout(()=>{
      QRAvatar.render(addr,avId,'sm');
      const av=document.getElementById(avId);
      if(av) av.onclick=(e)=>{ e.stopPropagation(); this.openShare(addr); };
    },0);
    return card;
  },
  esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },

  showEmpty(){
    document.getElementById('empty-state').style.display='flex';
    document.getElementById('request-state').style.display='none';
    document.getElementById('active-peer-name').innerText='Unknown_Node';
    document.getElementById('active-avatar').innerHTML='';
    document.getElementById('active-status-text').innerText='DISCONNECTED';
    document.getElementById('active-status-text').style.color='var(--text-muted)';
    document.getElementById('active-status-dot').className='status-dot';
    document.getElementById('messages-flow').innerHTML='';
    document.getElementById('burn-btn').style.display='none';
    const input=document.getElementById('chat-input');
    if(input) input.disabled=true;
  },

  openChat(addr,isReq=false){
    this.activePeer=addr;
    this.lastActivity=Date.now();
    document.getElementById('app-shell').classList.add('in-chat');
    document.getElementById('empty-state').style.display='none';
    const input=document.getElementById('chat-input');
    const burnBtn=document.getElementById('burn-btn');

    if(isReq){
      document.getElementById('request-state').style.display='flex';
      document.getElementById('req-id').innerText=addr.slice(0,16)+'...'+addr.slice(-6);
      QRAvatar.render(addr,'req-avatar','lg');
      input.disabled=true;
      burnBtn.style.display='none';
    } else {
      document.getElementById('request-state').style.display='none';
      input.disabled=false;
      burnBtn.style.display='flex';
      document.getElementById('active-peer-name').innerText=this.contactName(addr);
      QRAvatar.render(addr,'active-avatar','sm');
      this.updateChatHeader();
      if(this.unread[addr]){ delete this.unread[addr]; this.saveSession(); this.broadcastUnread(); this.renderSidebar(); }
      const flow=document.getElementById('messages-flow');
      flow.innerHTML='';
      (this.chatHistory[addr]||[]).forEach(m=>this.renderMessage(m));
      flow.scrollTop=flow.scrollHeight;
      setTimeout(()=>input.focus(),100);
    }
    this.renderSidebar();
  },
  closeChatMobile(){
    document.getElementById('app-shell').classList.remove('in-chat');
  },
  updateChatHeader(){
    if(!this.activePeer) return;
    const conn=this.connections[this.activePeer];
    const hasConn=conn&&conn.open;
    const isSecure=this.activeSessions[this.activePeer]!==undefined;
    const isPending=!!this.pendingConns[this.activePeer];
    const dot=document.getElementById('active-status-dot');
    const txt=document.getElementById('active-status-text');
    if(hasConn&&isSecure){ dot.className='status-dot online'; txt.innerText='TUNNEL_ACTIVE'; txt.style.color='var(--accent)'; }
    else if(hasConn||isPending){ dot.className='status-dot pending'; txt.innerText='AWAITING_HANDSHAKE'; txt.style.color='var(--warning)'; }
    else { dot.className='status-dot'; txt.innerText='OFFLINE'; txt.style.color='var(--text-muted)'; }
  },

  /* ─── MESSAGING ─── */
  async sendText(){
    const input=document.getElementById('chat-input');
    const text=(input.value||'').trim();
    if(!text||!this.activePeer) return;
    const msg={type:'text',body:text,time:Date.now(),dir:'sent'};
    const sent=await this.transmit(msg);
    if(sent){
      if(!this.chatHistory[this.activePeer]) this.chatHistory[this.activePeer]=[];
      this.chatHistory[this.activePeer].push(msg);
      this.saveSession();
      this.renderMessage(msg);
      input.value='';
      this.lastActivity=Date.now();
    } else {
      this.toast('TUNNEL NOT ACTIVE','warn');
    }
  },
  async transmit(msg){
    const key=this.activeSessions[this.activePeer];
    const conn=this.connections[this.activePeer];
    if(!key||!conn||!conn.open) return false;
    const payload={type:msg.type,body:msg.body,time:msg.time};
    const enc=await CryptoEngine.encrypt(key,JSON.stringify(payload));
    try{ conn.send({type:'enc',payload:enc}); return true; }catch(e){ return false; }
  },
  renderMessage(msg){
    const flow=document.getElementById('messages-flow');
    const wrap=document.createElement('div');
    wrap.className=`msg-wrapper ${msg.dir==='sent'?'sent':'received'}`;
    const time=new Date(msg.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    wrap.innerHTML=`<div class="msg-bubble">${this.esc(msg.body)}</div><div class="msg-meta">${time}</div>`;
    flow.appendChild(wrap);
    flow.scrollTop=flow.scrollHeight;
  }
};

window.addEventListener('load',()=>App.init());
if(document.readyState==='complete') App.init();
</script>
</body>
</html>
