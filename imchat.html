<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | BUNKER NODE v5</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        /* ==========================================================================
           CSS VARIABLES & THEME
           ========================================================================== */
        :root {
            --bg-main: #030405;
            --bg-panel: rgba(12, 14, 18, 0.85);
            --bg-hover: rgba(255, 255, 255, 0.03);
            
            --accent: #00ffd5;
            --accent-dim: rgba(0, 255, 213, 0.1);
            --accent-glow: 0 0 15px rgba(0, 255, 213, 0.4);
            
            --border-light: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(0, 255, 213, 0.3);
            
            --text-main: #f0f0f0;
            --text-muted: #7a828e;
            
            --danger: #ff3366;
            --warning: #ffb800;
            
            --glass-blur: blur(24px);
            --anim-speed: 0.3s;
        }

        /* ==========================================================================
           RESET & BASE STYLES
           ========================================================================== */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        body, html { 
            height: 100%; 
            width: 100%;
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif; 
            overflow: hidden;
        }

        /* Custom Scrollbar for Cypherpunk Vibe */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ==========================================================================
           LAYOUT SHELL
           ========================================================================== */
        .app-shell {
            display: flex; 
            height: 100vh; 
            width: 100vw;
            background: radial-gradient(circle at 50% 0%, #0d161a 0%, var(--bg-main) 80%);
            position: relative; 
            overflow: hidden;
        }

        /* ==========================================================================
           SIDEBAR (CONTACTS & REQUESTS)
           ========================================================================== */
        .sidebar {
            width: 340px; 
            border-right: 1px solid var(--border-light);
            display: flex; 
            flex-direction: column; 
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur); 
            z-index: 20; 
            flex-shrink: 0;
            transition: transform var(--anim-speed) cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .node-header { 
            padding: 24px; 
            border-bottom: 1px solid var(--border-light);
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
        }
        
        .node-identity {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .node-id-tag { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 11px; 
            font-weight: 600;
            color: var(--accent); 
            background: var(--accent-dim);
            padding: 6px 10px; 
            border-radius: 6px; 
            display: inline-block;
            border: 1px solid var(--border-accent);
        }

        .list-section-title {
            font-size: 11px; 
            font-weight: 700;
            color: var(--text-muted); 
            letter-spacing: 2px;
            padding: 20px 20px 10px 20px; 
            text-transform: uppercase;
        }

        .contacts-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
        }
        
        /* Contact Cards */
        .contact-card {
            padding: 12px 16px; 
            border-radius: 12px; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 16px;
            margin-bottom: 6px; 
            border: 1px solid transparent;
            position: relative; 
            transition: all 0.2s ease;
        }

        .contact-card:hover { 
            background: var(--bg-hover); 
        }

        .contact-card.active { 
            background: var(--accent-dim); 
            border-color: var(--border-accent); 
        }

        .contact-card.request { 
            border: 1px dashed var(--warning); 
            background: rgba(255, 184, 0, 0.05);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-address {
            font-size: 13px; 
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .contact-status-text {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-actions {
            position: absolute; 
            right: 16px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }

        /* Status Indicators */
        .status-dot {
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: #333;
            transition: all 0.3s ease;
        }
        .status-dot.online { background: var(--accent); box-shadow: var(--accent-glow); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 10px rgba(255, 184, 0, 0.4); }

        /* Sidebar Footer (Add Contact) */
        .sidebar-footer {
            padding: 24px; 
            border-top: 1px solid var(--border-light);
            background: rgba(0,0,0,0.2);
        }

        /* ==========================================================================
           MAIN CHAT VIEW
           ========================================================================== */
        .chat-view { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            min-width: 0; 
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.03)"/></svg>');
        }
        
        .chat-header { 
            padding: 20px 30px; 
            border-bottom: 1px solid var(--border-light);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            z-index: 10;
        }

        .mobile-back-btn {
            display: none; 
            color: var(--accent); 
            background: none; 
            border: none;
            font-size: 20px; 
            cursor: pointer; 
            margin-right: 20px; 
            padding: 5px;
        }

        /* Messages Flow */
        .messages-flow { 
            flex: 1; 
            padding: 30px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 24px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.received { align-self: flex-start; align-items: flex-start; }

        .msg-bubble {
            padding: 14px 20px; 
            border-radius: 18px;
            font-size: 14px; 
            line-height: 1.6; 
            position: relative;
            word-break: break-word;
            transition: all var(--anim-speed) ease;
        }
        
        .msg-sent .msg-bubble { 
            background: var(--accent-dim); 
            border: 1px solid var(--border-accent); 
            color: var(--accent); 
            border-bottom-right-radius: 4px; 
        }
        
        .msg-received .msg-bubble { 
            background: #161920; 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--border-light); 
        }

        .msg-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Stealth Mode Logic */
        .stealth-active .msg-bubble { 
            filter: blur(10px); 
            opacity: 0.3; 
            cursor: pointer; 
            user-select: none; 
        }
        .stealth-active .msg-bubble:hover, 
        .stealth-active .msg-bubble:active { 
            filter: blur(0); 
            opacity: 1; 
        }

        /* ==========================================================================
           CONTROLS BAR (INPUT)
           ========================================================================== */
        .controls-bar { 
            padding: 20px 30px; 
            border-top: 1px solid var(--border-light);
            display: flex; 
            gap: 16px; 
            align-items: center; 
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
        }

        .input-field {
            flex: 1; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border-light);
            border-radius: 14px; 
            padding: 16px 20px; 
            color: #fff; 
            outline: none; 
            min-width: 0;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--accent); }

        /* ==========================================================================
           BUTTONS & ICONS
           ========================================================================== */
        .icon-btn {
            background: transparent; 
            border: none; 
            color: var(--text-muted);
            font-size: 18px; 
            cursor: pointer; 
            width: 44px; 
            height: 44px; 
            flex-shrink: 0;
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-radius: 50%; 
            transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--accent); background: var(--bg-hover); }
        .icon-btn.active { color: var(--accent); background: var(--accent-dim); }
        
        .icon-btn.danger:hover { color: var(--danger); }
        
        .btn-action {
            background: transparent; 
            color: var(--accent); 
            border: 1px solid var(--border-accent);
            padding: 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px;
            font-weight: 600; 
            width: 100%; 
            transition: all 0.2s; 
            text-align: center;
            letter-spacing: 1px;
        }
        .btn-action:hover { 
            background: var(--accent-dim); 
            box-shadow: var(--accent-glow); 
        }

        .btn-solid {
            background: var(--accent);
            color: #000;
            border: none;
        }
        .btn-solid:hover {
            background: #00e6c0;
            box-shadow: var(--accent-glow);
        }

        .btn-send { 
            background: var(--accent); 
            color: #000; 
            width: 50px; 
            height: 50px; 
            border-radius: 14px; 
            flex-shrink: 0; 
        }
        .btn-send:hover { background: #00e6c0; }

        /* ==========================================================================
           GENERATIVE AVATARS
           ========================================================================== */
        .avatar-box {
            width: 44px; 
            height: 44px; 
            border-radius: 10px;
            overflow: hidden; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(5, 1fr);
            flex-shrink: 0; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .pixel { width: 100%; height: 100%; }

        /* ==========================================================================
           OVERLAYS & STATES
           ========================================================================== */
        .full-overlay {
            position: absolute; 
            inset: 0; 
            background: rgba(3, 4, 5, 0.85);
            backdrop-filter: blur(8px);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 5; 
            text-align: center; 
            padding: 20px;
        }

        .auth-overlay {
            position: fixed; 
            inset: 0; 
            background: var(--bg-main);
            background-image: radial-gradient(circle at 50% 50%, #0a1114 0%, #030405 100%);
            z-index: 1000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        .auth-card { 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* ==========================================================================
           RESPONSIVE DESIGN (MOBILE ADAPTATION)
           ========================================================================== */
        @media (max-width: 768px) {
            .sidebar { 
                width: 100%; 
                position: absolute; 
                height: 100%; 
                border-right: none;
            }
            .chat-view { 
                width: 100%; 
                position: absolute; 
                height: 100%; 
                transform: translateX(100%); 
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            }
            
            /* State when chat is active */
            .app-shell.in-chat .sidebar { 
                transform: translateX(-20%); 
                opacity: 0; 
                pointer-events: none; 
            }
            .app-shell.in-chat .chat-view { 
                transform: translateX(0); 
            }
            
            .mobile-back-btn { display: flex; }
            .msg-wrapper { max-width: 90%; }
            .controls-bar { padding: 12px 16px; }
            .chat-header { padding: 16px; }
            
            .auth-card { padding: 30px 20px; border: none; background: transparent; box-shadow: none;}
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .animate-fade { animation: fadeIn 0.4s ease forwards; }

        /* Индикатор записи и панель звонка */
.rec-status { display: none; color: var(--danger); font-family: 'JetBrains Mono'; font-size: 12px; margin-right: 10px; align-items: center; gap: 5px; }
.rec-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: rec-pulse 1s infinite; }
@keyframes rec-pulse { 50% { opacity: 0; } }

.call-overlay { 
    display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--bg-panel); border-bottom: 1px solid var(--accent-dim);
    padding: 15px; align-items: center; justify-content: space-between; animation: slideDown 0.3s ease;
}
@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

.file-pre-view { 
    display: none; padding: 10px; background: rgba(255,255,255,0.03); 
    border-top: 1px solid var(--border-light); font-size: 12px; color: var(--accent);
}
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card animate-fade">
            <h1 style="letter-spacing: 8px; font-weight: 300; margin-bottom: 5px;">IMCHAT</h1>

            <div id="initial-connect-box">

        <main class="chat-view">

    <div id="call-info">CALLING...</div>

        <button id="answer-btn" class="icon-btn" style="display:none; color:var(--accent);" onclick="App.acceptCall()"><i class="fa-solid fa-phone"></i></button>

            <div id="empty-state" class="full-overlay">
                <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: var(--border-light); margin-bottom: 24px;"></i>

                <p style="color: var(--text-main); font-size: 15px; margin-bottom: 40px; font-family: 'JetBrains Mono'; line-height: 1.6;">

                    <span style="font-size: 12px; color: var(--text-muted); font-family: 'Inter';">Requests an encrypted E2E tunnel</span>

                    <button class="btn-action" style="flex:1; border-color: var(--danger); color: var(--danger);" onclick="App.declineHandshake()">DECLINE</button>

                <div style="display: flex; gap: 8px;">
                    <button class="icon-btn" id="stealth-toggle" onclick="App.toggleStealth()" title="Toggle Stealth (Blur)">

            <footer class="controls-bar" id="controls-bar">

</button>

<audio id="remote-audio" autoplay style="display:none;"></audio>

<script>
/**
 * ============================================================================
 * IMCHAT CORE ENGINE v5.0
 * Architecture: True P2P, EIP-6963 Discovery, Asymmetric Handshakes
 * ============================================================================
 */

// ----------------------------------------------------------------------------
// 1. EIP-6963 WALLET DISCOVERY LISTENER
// ----------------------------------------------------------------------------
const EIPProviders = {};
window.addEventListener("eip6963:announceProvider", (event) => {
    EIPProviders[event.detail.info.uuid] = event.detail;
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

// ----------------------------------------------------------------------------
// 2. CRYPTOGRAPHY ENGINE (Web Crypto API Wrapper)
// ----------------------------------------------------------------------------
const CryptoEngine = {
    async generateECDH() {
        return await crypto.subtle.generateKey(
            { name: "ECDH", namedCurve: "P-384" }, 
            true, 
            ["deriveKey"]
        );
    },
    async deriveAES(privateKey, peerPubKeyBuffer) {
        const peerPubKey = await crypto.subtle.importKey(
            "raw", 
            new Uint8Array(peerPubKeyBuffer), 
            { name: "ECDH", namedCurve: "P-384" }, 
            true, 
            []
        );
        return await crypto.subtle.deriveKey(
            { name: "ECDH", public: peerPubKey }, 
            privateKey, 
            { name: "AES-GCM", length: 256 }, 
            false, 
            ["encrypt", "decrypt"]
        );
    },
    async encryptData(aesKey, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decryptData(aesKey, encryptedObj) {
        try {
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: new Uint8Array(encryptedObj.iv) }, 
                aesKey, 
                new Uint8Array(encryptedObj.data)
            );
            return new TextDecoder().decode(decrypted);
        } catch(e) { 
            console.error("[CRYPTO] Decryption failed:", e);
            return "[CORRUPTED_PAYLOAD]"; 
        }
    }
};

// ----------------------------------------------------------------------------
// 3. GENERATIVE AVATAR ENGINE
// ----------------------------------------------------------------------------
const AvatarEngine = {
    generate(address, targetId) {
        // Enforce lowercase for consistent generation
        const hash = address.toLowerCase().replace('0x', '');
        const container = document.getElementById(targetId);
        if (!container) return;
        
        container.innerHTML = '';
        container.className = 'avatar-box';
        
        // Math to generate colors
        const hue = parseInt(hash.substring(0, 4), 16) % 360;
        const mainColor = `hsl(${hue}, 80%, 60%)`;
        const baseDark = `hsl(${hue}, 30%, 12%)`; 
        
        container.style.backgroundColor = baseDark;

        // 5x5 Mirrored Matrix
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                
                // Mirror logic to create symmetry (Space Invaders style)
                const mirrorCol = col > 2 ? 4 - col : col;
                const index = row * 3 + mirrorCol;
                
                const charCode = hash.charCodeAt(index % hash.length);
                if (charCode % 2 === 0) {
                    pixel.style.backgroundColor = mainColor;
                    pixel.style.boxShadow = `0 0 8px ${mainColor}`;
                }
                container.appendChild(pixel);
            }
        }
    }
};

    /* --- P2P NETWORK & HANDSHAKE MODULE --- */
    
    bootNode() {
        document.getElementById('auth-screen').style.display = 'none';
        
        // Generate a deterministic, lowercase Peer ID based on wallet address
        const safeHash = btoa(this.myAddress).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16);
        const nodeId = `imnode_${safeHash}`;
        
        console.log(`[P2P] Booting Node ID: ${nodeId}`);
        this.peer = new Peer(nodeId, { debug: 1 });

        this.peer.on('open', () => {
            console.log("[P2P] Node Online.");
            AvatarEngine.generate(this.myAddress, 'my-avatar');

            // Добавь это ВНУТРЬ bootNode после создания Peer
    this.peer.on('call', (call) => {
        this.currentCall = call;
        document.getElementById('call-panel').style.display = 'flex';
        document.getElementById('call-info').innerText = "ВХОДЯЩИЙ ЗВОНОК";
        document.getElementById('answer-btn').style.display = 'block';
    });
            
            
            // Format address for display (0x1234...abcd)
            const displayAddr = this.myAddress.slice(0, 6) + "..." + this.myAddress.slice(-4);
            document.getElementById('my-address-display').innerText = displayAddr;
            
            this.renderSidebar();
            
            // Start Heartbeat & Reconnection Engine
            setInterval(() => this.networkPulse(), 3000);
        });

        // Handle Incoming Connections
        this.peer.on('connection', conn => this.setupDataChannel(conn));
        
        this.peer.on('error', err => {
            console.warn("[P2P] PeerJS Warning:", err.type);
        });
    },

    

    networkPulse() {
        // Получаем список адресов через метод объекта
        const activeContacts = this.getContacts();
        
        activeContacts.forEach(addr => {
            const nodeId = "imnode_" + btoa(addr).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 15);
            const conn = this.connections[addr];

            // Проверяем: если коннекта нет или он закрыт/ошибочен — переподключаемся
            if (!conn || (conn.open === false && conn.peerConnection?.connectionState !== 'connecting')) {
                console.log("[P2P] Attempting recovery with:", addr);
                const newConn = this.peer.connect(nodeId, { reliable: true });
                this.setupDataChannel(newConn);
            }
        });
    
    
    
        
        // 1. Try to connect to offline contacts
        contacts.forEach(addr => {
            const conn = this.connections[addr];
            if (!conn || !conn.open) {
                const targetHash = btoa(addr).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16);
                const targetId = `imnode_${targetHash}`;
                const newConn = this.peer.connect(targetId, { reliable: true });
                if(newConn) this.setupDataChannel(newConn);
            }
        });

        // 2. Ping active connections & Check timeouts
        for (const [addr, conn] of Object.entries(this.connections)) {
            if (conn.open) {
                conn.send({ type: 'ping' });
                
                // If no pong received in last 12 seconds, mark offline
                if (this.lastSeen[addr] && (now - this.lastSeen[addr] > 12000)) {
                    console.log(`[P2P] Connection to ${addr} timed out.`);
                    conn.close();
                    delete this.connections[addr];
                    delete this.activeSessions[addr];
                    this.renderSidebar();
                    if (this.activePeer === addr) this.updateChatHeader();
                }
            }
        }
    },

    async setupDataChannel(conn) {
        const ecdh = await CryptoEngine.generateECDH();
        const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);

        conn.on('open', () => {
            this.pendingKeys[conn.peer] = ecdh;
            conn.send({ 
                type: 'handshake_req', 
                address: this.myAddress, 
                pub: Array.from(new Uint8Array(myPub)) 
            });
        });

        conn.on('data', async data => {
            // Присваиваем адрес из пакета или ищем по базе контактов
            if (data.address) conn.peerAddress = data.address.toLowerCase();
            
            const addr = conn.peerAddress || this.getContacts().find(a => 
                ("imnode_" + btoa(a).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 15)) === conn.peer
            );

            if (!addr) return;

            // Системные сигналы
            if (data.type === 'ping') { 
                conn.send({ type: 'pong', address: this.myAddress }); 
                return; 
            }
            if (data.type === 'pong') {
                this.lastSeen[addr] = Date.now();
                this.connections[addr] = conn;
                this.renderSidebar(); 
                this.updateChatHeader();
                return;
            }

            // Логика Handshake
            if (data.type === 'handshake_req') {
                this.connections[addr] = conn;
                this.lastSeen[addr] = Date.now();
                
                if (this.getContacts().includes(addr)) {
                    const aesKey = await CryptoEngine.deriveAES(ecdh.privateKey, data.pub);
                    this.activeSessions[addr] = aesKey;
                    conn.send({ 
                        type: 'handshake_ack', 
                        address: this.myAddress, 
                        pub: Array.from(new Uint8Array(myPub)) 
                    });
                    this.renderSidebar();
                    this.updateChatHeader();
                } else {
                    this.incomingRequests[addr] = { conn, pub: data.pub, ecdh };
                    conn.send({ type: 'handshake_pending', address: this.myAddress });
                    this.renderSidebar();
                }
            } 
            else if (data.type === 'handshake_ack') {
                const storedECDH = this.pendingKeys[conn.peer] || ecdh;
                this.activeSessions[addr] = await CryptoEngine.deriveAES(storedECDH.privateKey, data.pub);
                this.connections[addr] = conn;
                delete this.pendingKeys[conn.peer];
                this.renderSidebar();
                this.updateChatHeader();
            }
            else if (data.type === 'handshake_pending') {
                this.connections[addr] = conn;
                this.renderSidebar();
                this.updateChatHeader();
            }
            else if (data.type === 'handshake_decline') {
                conn.close();
                delete this.connections[addr];
                delete this.activeSessions[addr];
                this.renderSidebar();
            }

            // Обработка зашифрованных данных (Чат / Файлы / Войс)
            else if (data.type === 'enc') {
                const aesKey = this.activeSessions[addr];
                if (aesKey) {
                    const decrypted = await CryptoEngine.decryptData(aesKey, data.payload);
                    if (decrypted !== "[CORRUPTED_PAYLOAD]") {
                        if (this.activePeer === addr) {
                            try { this.renderMessage(JSON.parse(decrypted), 'received'); } catch(e){}
                        }
                    }
                }
            }
        });

        conn.on('close', () => {
            const closingAddr = conn.peerAddress;
            if (closingAddr) {
                delete this.connections[closingAddr];
                this.renderSidebar();
                this.updateChatHeader();
            }
        });
    },

    // --- Request Handling ---

    // 3. Полностью замени функцию acceptHandshake:
async acceptHandshake() {
    const addr = this.activePeer;
    const req = this.incomingRequests[addr];
    if (req && req.conn.open) {
        let contacts = this.getContacts();
        contacts.push(addr);
        this.setDB('contacts', contacts);

        // Используем сохраненный ecdh из объекта запроса
        this.activeSessions[addr] = await CryptoEngine.deriveAES(req.ecdh.privateKey, req.pub);
        
        const myPub = await crypto.subtle.exportKey("raw", req.ecdh.publicKey);
        req.conn.send({ 
            type: 'handshake_ack', 
            address: this.myAddress, 
            pub: Array.from(new Uint8Array(myPub)) 
        });
        
        delete this.incomingRequests[addr];
        this.renderSidebar();
        this.openChat(addr);
    }
},

    declineHandshake() {
        const addr = this.activePeer;
        const req = this.incomingRequests[addr];
        
        if (req && req.conn.open) {
            req.conn.send({ type: 'handshake_decline' });
            req.conn.close();
        }
        
        delete this.incomingRequests[addr];
        this.activePeer = null;
        
        document.getElementById('request-state').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex';
        this.renderSidebar();
    },

    renderSidebar() {
        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        
        const contacts = this.getContacts();

        }

    createContactCard(addr, isRequest) {
        // Determine Status
        const hasConn = this.connections[addr] && this.connections[addr].open;
        const isSecure = this.activeSessions[addr] !== undefined;

        if (hasConn && isSecure) statusClass = 'online';
        else if (hasConn && !isSecure) statusClass = 'pending';

        const card = document.createElement('div');
        card.className = `contact-card ${this.activePeer === addr ? 'active' : ''} ${isRequest ? 'request' : ''}`;
        card.onclick = () => this.openChat(addr, isRequest);
        
        const avId = `av_card_${addr.slice(-6)}`;
        
        card.innerHTML = `
            <div id="${avId}"></div>
            <div class="contact-info">
                <span class="contact-address">${addr.slice(0,6)}...${addr.slice(-4)}</span>
                <span class="contact-status-text">${statusClass === 'online' ? 'SECURE' : (statusClass === 'pending' ? 'LINKING...' : 'OFFLINE')}</span>
            </div>
            <div class="contact-actions">
                ${!isRequest ? `<button class="delete-btn-small" onclick="event.stopPropagation(); App.deleteContact('${addr}')"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                <div class="status-dot ${statusClass}"></div>

    updateChatHeader() {

        const hasConn = this.connections[this.activePeer] && this.connections[this.activePeer].open;
        const isSecure = this.activeSessions[this.activePeer] !== undefined;

    // --- Messaging ---

    toggleStealth() {
        this.isStealth = !this.isStealth;
        const btn = document.getElementById('stealth-toggle');
        const flow = document.getElementById('messages-flow');
        
        if (this.isStealth) {
            btn.classList.add('active');

        } else {

        }
    },

    async sendText() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !this.activePeer) return;

        const msg = { type: 'text', body: text, time: Date.now() };
        this.transmitMessage(msg);
        input.value = '';
    },

    async transmitMessage(msg) {
        if (!this.activePeer) return;
        const conn = this.connections[this.activePeer];
        const session = this.activeSessions[this.activePeer];

        // Проверяем, что канал реально открыт
        if (!conn || !conn.open) {
            console.warn("[P2P] Channel not ready. Status:", conn ? 'Connecting/Closed' : 'Null');
            return;
        }

        if (!session) {
            console.warn("[P2P] Encryption session not established.");
            return;
        }

        try {
            const encrypted = await CryptoEngine.encryptData(session, JSON.stringify(msg));
            conn.send({ type: 'enc', payload: encrypted });
            this.renderMessage(msg, 'sent');
        } catch (e) {
            console.error("[P2P] Send failed:", e);
        }
    },

    renderMessage(msg, direction) {
        const flow = document.getElementById('messages-flow');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${direction}`;
        
        let content = '';
        if (msg.type === 'text') {
            content = msg.body;
        } else if (msg.type === 'voice') {
            content = `<audio src="${msg.body}" controls style="height:35px; border-radius:10px;"></audio>`;
        } else if (msg.type === 'file') {
            content = `<a href="${msg.body}" download="${msg.name}" style="color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-file-arrow-down" style="font-size:18px;"></i> ${msg.name}</a>`;
        }

        const timeStr = new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        wrapper.innerHTML = `
            <div class="msg-bubble">${content}</div>
            <div class="msg-meta">${timeStr}</div>
        `;
        
        flow.appendChild(wrapper);
        flow.scrollTop = flow.scrollHeight;
    },

    // --- Cyber-Mic (Voice Audio Graph) ---
    
    toggleCyberMic() {
        this.isCyberMic = !this.isCyberMic;
        document.getElementById('cyber-mic-btn').classList.toggle('active', this.isCyberMic);
    },

    // Единый процессор для робо-голоса
    async getProcessedStream() {
        this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();

        const source = this.audioCtx.createMediaStreamSource(this.stream);
        const destination = this.audioCtx.createMediaStreamDestination();

        if (this.isCyberMic) {
            // Эффект "Робот/Рация"
            const filter = this.audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.value = 1000;
            filter.Q.value = 1.0;

            const dist = this.audioCtx.createWaveShaper();
            dist.curve = this.makeDistCurve(100);

            source.connect(filter);
            filter.connect(dist);
            dist.connect(destination);
        } else {
            source.connect(destination);
        }
        return destination.stream;
    },

    async startVoice() {
        this.chunks = [];
        try {
            this.stream = await this.getProcessedStream();
            // ФИКС: Указываем конкретный кодек для стабильности
            this.mediaRecorder = new MediaRecorder(this.stream, { mimeType: 'audio/webm;codecs=opus' });
            
            this.mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) this.chunks.push(e.data);
            };

            this.mediaRecorder.onstop = () => {
                const blob = new Blob(this.chunks, { type: 'audio/webm' });
                if (blob.size > 100) { // Проверка на пустой файл
                    const reader = new FileReader();
                    reader.onload = () => {
                        this.transmitMessage({ type: 'voice', body: reader.result, time: Date.now() });
                    };
                    reader.readAsDataURL(blob);
                }
            };

            this.mediaRecorder.start(200); // Собираем данные каждые 200мс
            this.isRecording = true;
            document.getElementById('rec-ui').style.display = 'flex';
            
            let sec = 0;
            this.recTimer = setInterval(() => {
                sec++;
                document.getElementById('rec-timer').innerText = 
                    `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
            }, 1000);
        } catch (err) {
            console.error("Voice start error:", err);
        }
    },

    stopVoice() {
        if (!this.isRecording) return;
        this.mediaRecorder.stop();
        this.isRecording = false;
        clearInterval(this.recTimer);
        document.getElementById('voice-toggle').style.color = "var(--text-muted)";
        document.getElementById('rec-ui').style.display = 'none';
        if(this.stream) this.stream.getTracks().forEach(t => t.stop());
    },

    async toggleCall() {
        if (this.currentCall) {
            this.currentCall.close();
            return;
        }

        const addr = this.activePeer;
        if (!this.connections[addr]) return alert("Peer offline");

        const processedStream = await this.getProcessedStream();
        const targetId = `imnode_${btoa(addr).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16)}`;
        
        const call = this.peer.call(targetId, processedStream);
        this.setupCallHandlers(call);
        document.getElementById('call-btn').style.color = "var(--success)";
    },

    setupCallHandlers(call) {
        this.currentCall = call;
        call.on('stream', remoteStream => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play();
        });
        call.on('close', () => {
            this.currentCall = null;
            document.getElementById('call-btn').style.color = "";
            if(this.stream) this.stream.getTracks().forEach(t => t.stop());
        });
    },

    
    
    makeDistortionCurve(amount) {
        let k = typeof amount === 'number' ? amount : 50,
            n_samples = 44100,
            curve = new Float32Array(n_samples),
            deg = Math.PI / 180,
            i = 0, x;
        for ( ; i < n_samples; ++i ) {
            x = i * 2 / n_samples - 1;
            curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
        }
        return curve;
    },

    // --- File Handling ---
    
    async handleFile(file) {
        if (!file) return;
        this.pendingFile = file; // Просто запоминаем файл
        const preview = document.getElementById('file-pre-view');
        if (preview) {
            preview.style.display = 'block';
            preview.innerText = "📎 " + file.name;
        }
    },

    sendText() {
        const input = document.getElementById('chat-input');
        
        // 1. Сначала проверяем, есть ли прикрепленный файл
        if (this.pendingFile) {
            const reader = new FileReader();
            reader.onload = () => {
                this.transmitMessage({ type: 'file', body: reader.result, name: this.pendingFile.name });
                this.pendingFile = null;
                document.getElementById('file-pre-view').style.display = 'none';
            };
            reader.readAsDataURL(this.pendingFile);
        }

        // 2. Потом отправляем текст
        const val = input.value.trim();
        if (val && this.activePeer) {
            this.transmitMessage({ type: 'text', body: val, time: Date.now() });
            input.value = '';
        }
    },
    async startCall() {
        if (!this.activePeer) return;
        document.getElementById('call-panel').style.display = 'flex';
        document.getElementById('call-info').innerText = "ВЫЗОВ...";
        
        // Генерация гудка
        const ac = new AudioContext();
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.frequency.value = 900; g.gain.value = 0.1;
        osc.connect(g); g.connect(ac.destination);
        osc.start(); this.osc = osc;

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Используем твой текущий метод формирования ID (не меняя его)
        const targetId = "imnode_" + btoa(this.activePeer).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 15);
        
        this.currentCall = this.peer.call(targetId, stream);
        this.currentCall.on('stream', remote => {
            this.osc.stop();
            document.getElementById('call-info').innerText = "В СЕТИ";
            const a = new Audio(); a.srcObject = remote; a.play();
        });
    },

    async acceptCall() {
        if (!this.currentCall) return;
        try {
            const stream = await this.getProcessedStream();
            this.currentCall.answer(stream);
            
            document.getElementById('answer-btn').style.display = 'none';
            document.getElementById('call-info').innerText = "В СЕТИ";

            this.currentCall.on('stream', remote => {
                this.playRemote(remote);
            });
        } catch (err) {
            console.error("Call Accept Error:", err);
        }
    },

    playRemote(stream) {
        let audio = document.getElementById('remote-audio');
        if (!audio) {
            audio = document.createElement('audio');
            audio.id = 'remote-audio';
            audio.autoplay = true;
            document.body.appendChild(audio);
        }
        audio.srcObject = stream;
        // ФИКС: Явный запуск после жеста
        audio.play().catch(e => console.log("Audio play blocked, need interaction"));
    },

    endCall() {
        if (this.currentCall) this.currentCall.close();
        if (this.osc) try { this.osc.stop(); } catch(e){}
        document.getElementById('call-panel').style.display = 'none';
    },
};
</script>
