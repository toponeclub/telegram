<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | SECURE NODE X</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-main: #050505;
            --bg-panel: #0a0a0c;
            --bg-hover: rgba(255, 255, 255, 0.04);
            --accent: #e2e2e2;
            --accent-dim: rgba(255, 255, 255, 0.1);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #e2e2e2;
            --text-muted: #666666;
            --danger: #ff4444;
            --success: #00ffaa;
            --warning: #ffbb00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; overflow: hidden; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .app-shell { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }

        /* SIDEBAR */
        .sidebar {
            width: 320px; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; 
            background: var(--bg-panel); z-index: 20; flex-shrink: 0; transition: transform 0.3s ease;
        }
        .node-header { padding: 24px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: flex-start; }
        .node-identity { display: flex; flex-direction: column; gap: 12px; }
        .node-id-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--bg-main); background: var(--accent); padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .list-section-title { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; padding: 20px 20px 10px 20px; text-transform: uppercase; }
        .contacts-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        
        .contact-card {
            padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px;
            margin-bottom: 4px; border: 1px solid transparent; position: relative; transition: all 0.2s;
        }
        .contact-card:hover { background: var(--bg-hover); }
        .contact-card.active { background: var(--accent-dim); }
        .contact-card.request { border: 1px dashed var(--warning); }
        .contact-info { display: flex; flex-direction: column; gap: 4px; }
        .contact-address { font-size: 12px; font-family: 'JetBrains Mono', monospace; }
        .contact-status-text { font-size: 10px; color: var(--text-muted); }
        .contact-actions { position: absolute; right: 12px; display: flex; align-items: center; gap: 10px; }
        
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #333; transition: 0.3s; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 8px var(--warning); }

        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-light); }

        /* CHAT VIEW */
        .chat-view { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel); z-index: 10; }
        .mobile-back-btn { display: none; color: var(--accent); background: none; border: none; font-size: 18px; cursor: pointer; margin-right: 16px; }
        
        .messages-flow { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.received { align-self: flex-start; align-items: flex-start; }
        .msg-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .msg-sent .msg-bubble { background: var(--accent); color: var(--bg-main); border-bottom-right-radius: 2px; }
        .msg-received .msg-bubble { background: #111; border: 1px solid var(--border-light); border-bottom-left-radius: 2px; }
        .msg-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

        .stealth-active .msg-bubble { filter: blur(8px); opacity: 0.3; cursor: pointer; user-select: none; }
        .stealth-active .msg-bubble:hover, .stealth-active .msg-bubble:active { filter: blur(0); opacity: 1; }

        /* CONTROLS */
        .controls-bar { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 12px; align-items: center; background: var(--bg-panel); }
        .input-field { flex: 1; background: transparent; border: 1px solid var(--border-light); border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 14px; transition: 0.2s; }
        .input-field:focus { border-color: var(--accent); }

        .icon-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: 0.2s; }
        .icon-btn:hover { color: var(--accent); background: var(--bg-hover); }
        .icon-btn.active { color: var(--bg-main); background: var(--accent); }
        .icon-btn.danger:hover { color: var(--danger); }
        
        .btn-action { background: transparent; color: var(--accent); border: 1px solid var(--border-light); padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; width: 100%; transition: 0.2s; text-align: center; }
        .btn-action:hover { border-color: var(--accent); }
        .btn-solid { background: var(--accent); color: var(--bg-main); border: none; }
        .btn-solid:hover { opacity: 0.9; }

        /* AVATARS */
        .avatar-box { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); flex-shrink: 0; }
        .pixel { width: 100%; height: 100%; }

        /* OVERLAYS */
        .full-overlay { position: absolute; inset: 0; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; padding: 20px; }
        .auth-overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 380px; text-align: center; padding: 32px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--bg-panel); }

        /* MEDIA */
        audio { height: 32px; border-radius: 4px; outline: none; }
        audio::-webkit-media-controls-panel { background-color: var(--accent-dim); }

        /* Дополнительные элементы (из ImChat.html) */
        .call-panel {
            display: none; position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px);
            padding: 12px 20px; justify-content: space-between; align-items: center; z-index: 15; border-bottom: 1px solid var(--accent-dim);
        }
        .file-preview {
            display: none; padding: 8px 24px; background: rgba(255,255,255,0.02); font-size: 12px; color: var(--accent);
            border-top: 1px solid var(--border-light);
        }
        .rec-indicator {
            display: none; align-items: center; gap: 6px; color: var(--danger); font-family: monospace; font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; border-right: none; }
            .chat-view { width: 100%; position: absolute; height: 100%; transform: translateX(100%); transition: transform 0.3s; }
            .app-shell.in-chat .sidebar { transform: translateX(-20%); opacity: 0; pointer-events: none; }
            .app-shell.in-chat .chat-view { transform: translateX(0); }
            .mobile-back-btn { display: block; }
            .msg-wrapper { max-width: 90%; }
            .auth-card { border: none; padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h1 style="letter-spacing: 6px; font-weight: 400; margin-bottom: 30px;">IMCHAT</h1>
            <div id="initial-connect-box">
                <button class="btn-action btn-solid" style="padding: 16px; font-size: 13px;" onclick="App.showWalletSelector()">
                    <i class="fa-solid fa-wallet"></i> &nbsp; CONNECT WALLET
                </button>
            </div>
            <div id="wallet-selector" style="display: none;">
                <div style="display: grid; gap: 10px;" id="detected-wallets"></div>
                <button class="icon-btn" style="margin: 16px auto 0;" onclick="App.hideWalletSelector()"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 16px; height: 14px;"></p>
        </div>
    </div>

    <div class="app-shell" id="app-shell">
        <aside class="sidebar">
            <div class="node-header">
                <div class="node-identity">
                    <div id="my-avatar"></div>
                    <div class="node-id-tag" id="my-address-display">0x...</div>
                </div>
                <button class="icon-btn" onclick="App.logout()"><i class="fa-solid fa-power-off"></i></button>
            </div>
            <div class="contacts-scroll" id="contacts-list"></div>
            <div class="sidebar-footer">
                <input type="text" id="add-peer-id" class="input-field" placeholder="Wallet 0x..." style="font-size: 12px; margin-bottom: 12px; width: 100%;">
                <button class="btn-action" onclick="App.addContact()">ADD CONTACT</button>
            </div>
        </aside>

        <main class="chat-view">
            <!-- Панель звонка -->
            <div id="call-panel" class="call-panel">
                <div id="call-info" style="font-family: monospace;">CALLING...</div>
                <div>
                    <button id="answer-btn" class="icon-btn" style="display:none;" onclick="App.acceptCall()"><i class="fa-solid fa-phone"></i></button>
                    <button class="icon-btn danger" onclick="App.endCall()"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>

            <div id="empty-state" class="full-overlay">
                <p style="color: var(--text-muted); font-size: 11px; letter-spacing: 2px;">SECURE NODE IDLE</p>
            </div>

            <div id="request-state" class="full-overlay" style="display: none; z-index: 6; background: rgba(5,5,5,0.95);">
                <div id="req-avatar" style="margin-bottom: 20px; transform: scale(1.2);"></div>
                <p style="color: var(--text-main); font-size: 13px; margin-bottom: 30px; font-family: 'JetBrains Mono';">
                    Node <span id="req-id" style="color:var(--accent);"></span><br><br>
                    <span style="font-size: 11px; color: var(--text-muted); font-family: 'Inter';">Requests P2P encryption keys</span>
                </p>
                <div style="display: flex; gap: 12px; width: 100%; max-width: 240px;">
                    <button class="btn-action btn-solid" style="flex:1;" onclick="App.acceptHandshake()">ACCEPT</button>
                    <button class="btn-action" style="flex:1; border-color: var(--danger); color: var(--danger);" onclick="App.declineHandshake()">DECLINE</button>
                </div>
            </div>

            <header class="chat-header">
                <div style="display: flex; align-items: center;">
                    <button class="mobile-back-btn" onclick="App.closeChatMobile()"><i class="fa-solid fa-chevron-left"></i></button>
                    <div id="active-avatar" style="margin-right: 12px;"></div>
                    <div>
                        <div id="active-peer-name" style="font-weight: 600; font-size: 14px; font-family: 'JetBrains Mono';">0x...</div>
                        <div style="font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px;">
                            <span class="status-dot" id="active-status-dot"></span>
                            <span id="active-status-text">DISCONNECTED</span>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="icon-btn" id="stealth-toggle" onclick="App.toggleStealth()"><i class="fa-solid fa-eye-slash"></i></button>
                    <button class="icon-btn" id="call-btn" onclick="App.startCall()"><i class="fa-solid fa-phone"></i></button>
                    <button class="icon-btn danger" onclick="App.clearChat()"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </header>

            <div class="messages-flow" id="messages-flow"></div>
            <div id="file-preview" class="file-preview"></div>

            <footer class="controls-bar" id="controls-bar">
                <input type="file" id="file-input" hidden onchange="App.handleFile(this.files[0])">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                
                <div id="rec-ui" class="rec-indicator"><span class="rec-dot" style="width:8px;height:8px;background:var(--danger);border-radius:50%;display:inline-block;margin-right:4px;"></span><span id="rec-timer">00:00</span></div>

                <button class="icon-btn" id="voice-toggle" onmousedown="App.startVoice()" onmouseup="App.stopVoice()" ontouchstart="App.startVoice()" ontouchend="App.stopVoice()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="icon-btn" id="cyber-mic-btn" onclick="App.toggleCyberMic()"><i class="fa-solid fa-robot"></i></button>

                <input type="text" id="chat-input" class="input-field" placeholder="Message..." onkeypress="if(event.key === 'Enter') App.sendText()">
                <button class="icon-btn btn-solid" style="width:44px; height:44px; border-radius:8px;" onclick="App.sendText()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </footer>
        </main>
    </div>

<script>
// ======================== WALLET DISCOVERY ========================
const EIPProviders = {};
window.addEventListener("eip6963:announceProvider", (event) => { EIPProviders[event.detail.info.uuid] = event.detail; });
window.dispatchEvent(new Event("eip6963:requestProvider"));

// ======================== CRYPTO ENGINE ========================
const CryptoEngine = {
    async generateECDH() { return await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-384" }, true, ["deriveKey"]); },
    async deriveAES(privateKey, peerPubKeyBuffer) {
        const peerPubKey = await crypto.subtle.importKey("raw", new Uint8Array(peerPubKeyBuffer), { name: "ECDH", namedCurve: "P-384" }, true, []);
        return await crypto.subtle.deriveKey({ name: "ECDH", public: peerPubKey }, privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    },
    async encryptData(aesKey, text) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, encoded);
        return { iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) };
    },
    async decryptData(aesKey, encryptedObj) {
        try {
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(encryptedObj.iv) }, aesKey, new Uint8Array(encryptedObj.data));
            return new TextDecoder().decode(decrypted);
        } catch(e) { return "[CORRUPTED_PAYLOAD]"; }
    }
};

// ======================== AVATAR ENGINE ========================
const AvatarEngine = {
    generate(address, targetId) {
        const hash = address.toLowerCase().replace('0x', '');
        const container = document.getElementById(targetId);
        if (!container) return;
        container.innerHTML = ''; container.className = 'avatar-box';
        const hue = parseInt(hash.substring(0, 4), 16) % 360;
        const mainColor = `hsl(${hue}, 60%, 50%)`;
        container.style.backgroundColor = `hsl(${hue}, 20%, 15%)`; 
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                const mirrorCol = col > 2 ? 4 - col : col;
                if (hash.charCodeAt((row * 3 + mirrorCol) % hash.length) % 2 === 0) pixel.style.backgroundColor = mainColor;
                container.appendChild(pixel);
            }
        }
    }
};

// ======================== MAIN APP ========================
const App = {
    peer: null, myAddress: null, dbPrefix: null,
    connections: {}, activeSessions: {}, incomingRequests: {}, lastSeen: {}, ecPairs: {},
    activePeer: null, isStealth: false, isCyberMic: false, isRecording: false,
    audioCtx: null, mediaRecorder: null, stream: null, recTimer: null,
    currentCall: null, pendingFile: null, fileChunks: {},
    availableProviders: {}, activeProvider: null,

    // ---------- WALLET ----------
    showWalletSelector() {
        if (window.location.protocol === 'file:') return this.showError("HTTP Server required.");
        document.getElementById('initial-connect-box').style.display = 'none';
        document.getElementById('wallet-selector').style.display = 'block';
        this.showError("");
        const list = document.getElementById('detected-wallets'); list.innerHTML = '';
        this.availableProviders = {};
        const detectedNames = new Set();
        let count = 0;
        window.dispatchEvent(new Event("eip6963:requestProvider"));
        for (const [uuid, data] of Object.entries(EIPProviders)) {
            const nameLower = data.info.name.toLowerCase();
            if (detectedNames.has(nameLower)) continue; detectedNames.add(nameLower);
            this.availableProviders[uuid] = { provider: data.provider, type: 'evm' };
            const iconHtml = data.info.icon ? `<img src="${data.info.icon}" style="width:16px; height:16px; border-radius:4px;">` : `<i class="fa-solid fa-wallet"></i>`;
            list.innerHTML += `<button class="btn-action" style="display:flex; align-items:center; justify-content:center; gap:10px;" onclick="App.login('${uuid}')">${iconHtml} <span>${data.info.name}</span></button>`;
            count++;
        }
        if (window.ethereum && window.ethereum.isMetaMask && !Array.from(detectedNames).some(n => n.includes('meta'))) {
            this.availableProviders['mm'] = { provider: window.ethereum, type: 'evm' };
            list.innerHTML += `<button class="btn-action" style="display:flex; align-items:center; gap:10px;" onclick="App.login('mm')"><i class="fa-solid fa-fox"></i> MetaMask</button>`;
            count++;
        }
        if (window.solana && window.solana.isPhantom && !Array.from(detectedNames).some(n => n.includes('phantom'))) {
            this.availableProviders['phantom'] = { provider: window.solana, type: 'solana' };
            list.innerHTML += `<button class="btn-action" style="display:flex; align-items:center; gap:10px;" onclick="App.login('phantom')"><i class="fa-solid fa-ghost"></i> Phantom</button>`;
            count++;
        }
        if (count === 0) list.innerHTML = `<div style="font-size:11px;">No wallets detected.</div>`;
    },
    hideWalletSelector() { document.getElementById('initial-connect-box').style.display = 'block'; document.getElementById('wallet-selector').style.display = 'none'; },
    showError(msg) { document.getElementById('auth-error').innerText = msg; },
    async login(id) {
        try {
            const wallet = this.availableProviders[id];
            let address = "";
            if (wallet.type === 'evm') {
                const accounts = await wallet.provider.request({ method: 'eth_requestAccounts' });
                address = accounts[0];
            } else {
                const resp = await wallet.provider.connect();
                address = resp.publicKey.toString();
            }
            this.activeProvider = wallet.provider;
            this.myAddress = address.toLowerCase();
            this.dbPrefix = `imchat_${this.myAddress}_`;
            this.bootNode();
        } catch (e) { this.showError("Connection rejected."); }
    },
    logout() { if (this.peer) this.peer.destroy(); location.reload(); },

    // ---------- STORAGE ----------
    getDB(key) { return JSON.parse(localStorage.getItem(this.dbPrefix + key) || '[]'); },
    setDB(key, arr) { localStorage.setItem(this.dbPrefix + key, JSON.stringify([...new Set(arr)])); },
    getContacts() { return this.getDB('contacts'); },

    // ---------- P2P BOOT ----------
    bootNode() {
        document.getElementById('auth-screen').style.display = 'none';
        const nodeId = `imnode_${btoa(this.myAddress).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16)}`;
        this.peer = new Peer(nodeId);
        this.peer.on('open', () => {
            AvatarEngine.generate(this.myAddress, 'my-avatar');
            document.getElementById('my-address-display').innerText = this.myAddress.slice(0,6)+"..."+this.myAddress.slice(-4);
            this.renderSidebar();
            setInterval(() => this.networkPulse(), 5000);
        });
        // Входящие звонки
        this.peer.on('call', (call) => {
            this.currentCall = call;
            document.getElementById('call-panel').style.display = 'flex';
            document.getElementById('call-info').innerText = "INCOMING CALL";
            document.getElementById('answer-btn').style.display = 'block';
        });
        this.peer.on('connection', conn => this.setupDataChannel(conn));
    },

    networkPulse() {
        this.getContacts().forEach(addr => {
            if (!this.connections[addr] || !this.connections[addr].open) {
                const targetId = `imnode_${btoa(addr).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16)}`;
                const newConn = this.peer.connect(targetId, { reliable: true });
                if(newConn) this.setupDataChannel(newConn);
            }
        });
        for (const [addr, conn] of Object.entries(this.connections)) {
            if (conn.open) {
                conn.send({ type: 'ping' });
                if (this.lastSeen[addr] && (Date.now() - this.lastSeen[addr] > 12000)) {
                    conn.close(); delete this.connections[addr]; delete this.activeSessions[addr];
                    this.renderSidebar(); if (this.activePeer === addr) this.updateChatHeader();
                }
            }
        }
    },

    async setupDataChannel(conn) {
        const ecdh = await CryptoEngine.generateECDH();
        const myPub = await crypto.subtle.exportKey("raw", ecdh.publicKey);

        conn.on('open', () => {
            this.ecPairs[conn.peer] = ecdh;
            conn.send({ type: 'handshake_req', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
        });

        conn.on('data', async data => {
            if (data.address) conn.peerAddress = data.address.toLowerCase();
            const peerAddr = conn.peerAddress;
            if (!peerAddr) return;

            if (data.type === 'ping') { conn.send({ type: 'pong', address: this.myAddress }); return; }
            if (data.type === 'pong') {
                this.lastSeen[peerAddr] = Date.now();
                if (!this.connections[peerAddr]) {
                    this.connections[peerAddr] = conn;
                    this.renderSidebar();
                    if(this.activePeer === peerAddr) this.updateChatHeader();
                } return;
            }

            // ОБМЕН КЛЮЧАМИ
            if (data.type === 'handshake_req') {
                this.connections[peerAddr] = conn; this.lastSeen[peerAddr] = Date.now();
                if (this.getContacts().includes(peerAddr)) {
                    this.ecPairs[peerAddr] = ecdh;
                    this.activeSessions[peerAddr] = await CryptoEngine.deriveAES(ecdh.privateKey, data.pub);
                    conn.send({ type: 'handshake_ack', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
                    this.renderSidebar(); if(this.activePeer === peerAddr) this.updateChatHeader();
                } else {
                    this.incomingRequests[peerAddr] = { conn, pub: data.pub, ecdh };
                    conn.send({ type: 'handshake_pending', address: this.myAddress });
                    this.renderSidebar();
                }
            } 
            else if (data.type === 'handshake_ack') {
                this.lastSeen[peerAddr] = Date.now();
                const saved = this.ecPairs[conn.peer] || ecdh;
                this.activeSessions[peerAddr] = await CryptoEngine.deriveAES(saved.privateKey, data.pub);
                this.connections[peerAddr] = conn;
                this.renderSidebar(); if(this.activePeer === peerAddr) this.updateChatHeader();
            }
            else if (data.type === 'handshake_pending') {
                this.lastSeen[peerAddr] = Date.now(); this.connections[peerAddr] = conn; this.ecPairs[peerAddr] = ecdh;
                this.renderSidebar(); if(this.activePeer === peerAddr) this.updateChatHeader();
            }
            else if (data.type === 'handshake_decline') {
                conn.close(); delete this.connections[peerAddr]; delete this.activeSessions[peerAddr];
                this.renderSidebar();
            }
            // ШИФРОВАННЫЕ ДАННЫЕ (текст, файл чанки, голос чанки)
            else if (data.type === 'enc') {
                const aesKey = this.activeSessions[peerAddr];
                if (!aesKey) return;
                const decrypted = await CryptoEngine.decryptData(aesKey, data.payload);
                if (decrypted === "[CORRUPTED_PAYLOAD]") return;
                try {
                    const msg = JSON.parse(decrypted);
                    if (msg.type === 'text') {
                        if (this.activePeer === peerAddr) this.renderMessage(msg, 'received');
                    }
                    else if (msg.type === 'file_chunk') {
                        if (!this.fileChunks) this.fileChunks = {};
                        if (!this.fileChunks[msg.id]) this.fileChunks[msg.id] = [];
                        this.fileChunks[msg.id].push(msg.data);
                        if (msg.last) {
                            const full = this.fileChunks[msg.id].join('');
                            const blob = this.b64toBlob(full);
                            const url = URL.createObjectURL(blob);
                            const fileMsg = { type: 'file', body: url, name: msg.name, time: msg.time };
                            delete this.fileChunks[msg.id];
                            if (this.activePeer === peerAddr) this.renderMessage(fileMsg, 'received');
                        }
                    }
                    else if (msg.type === 'voice_chunk') {
                        if (!this.fileChunks) this.fileChunks = {};
                        if (!this.fileChunks[msg.id]) this.fileChunks[msg.id] = [];
                        this.fileChunks[msg.id].push(msg.data);
                        if (msg.last) {
                            const full = this.fileChunks[msg.id].join('');
                            const blob = this.b64toBlob(full);
                            const url = URL.createObjectURL(blob);
                            const voiceMsg = { type: 'voice', body: url, time: msg.time };
                            delete this.fileChunks[msg.id];
                            if (this.activePeer === peerAddr) this.renderMessage(voiceMsg, 'received');
                        }
                    }
                } catch(e) {}
            }
        });
        conn.on('close', () => {
            if (conn.peerAddress) {
                delete this.connections[conn.peerAddress]; delete this.activeSessions[conn.peerAddress];
                this.renderSidebar(); if (this.activePeer === conn.peerAddress) this.updateChatHeader();
            }
        });
    },

    b64toBlob(b64) {
        const arr = b64.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const raw = atob(arr[1]);
        const ua = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) ua[i] = raw.charCodeAt(i);
        return new Blob([ua], { type: mime });
    },

    // ---------- UI / CONTACTS ----------
    addContact() {
        let addr = document.getElementById('add-peer-id').value.trim().toLowerCase();
        if (!addr || addr === this.myAddress) return;
        let c = this.getContacts(); c.push(addr); this.setDB('contacts', c);
        document.getElementById('add-peer-id').value = '';
        this.renderSidebar(); this.networkPulse();
    },
    deleteContact(addr) {
        if(this.connections[addr]) this.connections[addr].close();
        delete this.connections[addr]; delete this.activeSessions[addr];
        this.setDB('contacts', this.getContacts().filter(a => a !== addr));
        if (this.activePeer === addr) { this.activePeer = null; document.getElementById('empty-state').style.display = 'flex'; this.clearChat(); }
        this.renderSidebar();
    },
    clearChat() { document.getElementById('messages-flow').innerHTML = ''; },
    renderSidebar() {
        const list = document.getElementById('contacts-list'); list.innerHTML = '';
        const contacts = this.getContacts(); const requests = Object.keys(this.incomingRequests);
        if (requests.length) { list.innerHTML += `<div class="list-section-title">REQUESTS</div>`; requests.forEach(addr => list.appendChild(this.createCard(addr, true))); }
        if (contacts.length) { list.innerHTML += `<div class="list-section-title">NODES</div>`; contacts.forEach(addr => list.appendChild(this.createCard(addr, false))); }
    },
    createCard(addr, isReq) {
        const isOnline = this.connections[addr] && this.connections[addr].open;
        const isSecure = this.activeSessions[addr] !== undefined;
        let sClass = ''; if (isOnline && isSecure) sClass = 'online'; else if (isOnline) sClass = 'pending';
        const card = document.createElement('div');
        card.className = `contact-card ${this.activePeer === addr ? 'active' : ''} ${isReq ? 'request' : ''}`;
        card.onclick = () => this.openChat(addr, isReq);
        const avId = `av_${addr.slice(-6)}`;
        card.innerHTML = `<div id="${avId}"></div><div class="contact-info"><span class="contact-address">${addr.slice(0,6)}...${addr.slice(-4)}</span><span class="contact-status-text">${sClass === 'online' ? 'SECURE' : (sClass === 'pending' ? 'LINKING...' : 'OFFLINE')}</span></div><div class="contact-actions">${!isReq ? `<div style="color:var(--text-muted); font-size:12px;" onclick="event.stopPropagation(); App.deleteContact('${addr}')"><i class="fa-solid fa-xmark"></i></div>` : ''}<div class="status-dot ${sClass}"></div></div>`;
        setTimeout(() => AvatarEngine.generate(addr, avId), 0); return card;
    },
    openChat(addr, isReq = false) {
        this.activePeer = addr; document.getElementById('app-shell').classList.add('in-chat'); document.getElementById('empty-state').style.display = 'none';
        if (isReq) {
            document.getElementById('request-state').style.display = 'flex'; document.getElementById('req-id').innerText = addr.slice(0,10)+"...";
            AvatarEngine.generate(addr, 'req-avatar'); document.getElementById('controls-bar').style.opacity = '0.2'; document.getElementById('controls-bar').style.pointerEvents = 'none';
        } else {
            document.getElementById('request-state').style.display = 'none'; document.getElementById('controls-bar').style.opacity = '1'; document.getElementById('controls-bar').style.pointerEvents = 'auto';
            document.getElementById('active-peer-name').innerText = addr.slice(0,8)+"..."; AvatarEngine.generate(addr, 'active-avatar'); this.updateChatHeader();
        }
        this.renderSidebar();
    },
    closeChatMobile() { document.getElementById('app-shell').classList.remove('in-chat'); },
    updateChatHeader() {
        if (!this.activePeer) return;
        const isOnline = this.connections[this.activePeer] && this.connections[this.activePeer].open;
        const isSecure = this.activeSessions[this.activePeer] !== undefined;
        const dot = document.getElementById('active-status-dot'); const text = document.getElementById('active-status-text');
        if (isOnline && isSecure) { dot.className = "status-dot online"; text.innerText = "TUNNEL ACTIVE"; } 
        else if (isOnline) { dot.className = "status-dot pending"; text.innerText = "AWAITING KEY"; } 
        else { dot.className = "status-dot"; text.innerText = "OFFLINE"; }
    },
    async acceptHandshake() {
        const addr = this.activePeer; const req = this.incomingRequests[addr];
        if (req && req.conn.open) {
            let c = this.getContacts(); c.push(addr); this.setDB('contacts', c);
            this.activeSessions[addr] = await CryptoEngine.deriveAES(req.ecdh.privateKey, req.pub);
            const myPub = await crypto.subtle.exportKey("raw", req.ecdh.publicKey);
            req.conn.send({ type: 'handshake_ack', address: this.myAddress, pub: Array.from(new Uint8Array(myPub)) });
            delete this.incomingRequests[addr]; this.renderSidebar(); this.openChat(addr);
        }
    },
    declineHandshake() {
        const addr = this.activePeer; const req = this.incomingRequests[addr];
        if (req && req.conn.open) { req.conn.send({ type: 'handshake_decline' }); req.conn.close(); }
        delete this.incomingRequests[addr]; this.activePeer = null;
        document.getElementById('request-state').style.display = 'none'; document.getElementById('empty-state').style.display = 'flex'; this.renderSidebar();
    },

    // ---------- ТЕКСТ ----------
    async sendText() {
        const input = document.getElementById('chat-input'); const text = input.value.trim();
        if (!text || !this.activePeer) return;
        this.transmitMessage({ type: 'text', body: text, time: Date.now() }); input.value = '';
    },

    // ---------- ОБЩАЯ ОТПРАВКА С ЧАНКИНГОМ ----------
    async transmitMessage(msg) {
        const key = this.activeSessions[this.activePeer];
        const conn = this.connections[this.activePeer];
        if (!key || !conn || !conn.open) { console.warn("No tunnel"); return; }
        
        // Файл или голос (большие данные) – разбиваем на чанки
        if (msg.type === 'file' || msg.type === 'voice') {
            const base64 = msg.body;
            const chunkSize = 32768;
            const total = Math.ceil(base64.length / chunkSize);
            const id = Date.now() + '_' + Math.random();
            for (let i = 0; i < total; i++) {
                const chunk = base64.slice(i * chunkSize, (i+1) * chunkSize);
                const chunkMsg = { 
                    type: msg.type === 'file' ? 'file_chunk' : 'voice_chunk',
                    id, data: chunk, last: (i === total-1),
                    name: msg.name, time: msg.time
                };
                const enc = await CryptoEngine.encryptData(key, JSON.stringify(chunkMsg));
                conn.send({ type: 'enc', payload: enc });
            }
            // Показываем "отправляется" (можно визуально)
            if (msg.type === 'file') this.renderMessage({ type: 'file', body: '', name: msg.name, time: msg.time }, 'sent');
            else this.renderMessage({ type: 'voice', body: '', time: msg.time }, 'sent');
        } 
        else { // текст
            const enc = await CryptoEngine.encryptData(key, JSON.stringify(msg));
            conn.send({ type: 'enc', payload: enc });
            this.renderMessage(msg, 'sent');
        }
    },

    renderMessage(msg, dir) {
        const flow = document.getElementById('messages-flow'); const w = document.createElement('div'); w.className = `msg-wrapper ${dir}`;
        let c = '';
        if (msg.type === 'text') c = msg.body;
        else if (msg.type === 'voice') {
            c = msg.body ? `<audio src="${msg.body}" controls></audio>` : `<i class="fa-solid fa-microphone"></i> Voice (sending...)`;
        }
        else if (msg.type === 'file') {
            if (msg.body && msg.body.startsWith('blob:')) c = `<a href="${msg.body}" download="${msg.name}" style="color:inherit;"><i class="fa-solid fa-file-arrow-down"></i> ${msg.name}</a>`;
            else c = `<i class="fa-solid fa-file"></i> ${msg.name} (transfer...)`;
        }
        const time = new Date(msg.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        w.innerHTML = `<div class="msg-bubble">${c}</div><div class="msg-meta">${time}</div>`;
        flow.appendChild(w); flow.scrollTop = flow.scrollHeight;
    },

    // ---------- ГОЛОСОВАЯ ЗАПИСЬ (с робо-фильтром) ----------
    async getProcessedStream() {
        const raw = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!this.isCyberMic) return raw;
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
        const src = this.audioCtx.createMediaStreamSource(raw);
        const dst = this.audioCtx.createMediaStreamDestination();
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = "bandpass"; filter.frequency.value = 1100;
        const shaper = this.audioCtx.createWaveShaper();
        shaper.curve = (function(amt){
            let n=44100, c=new Float32Array(n), d=Math.PI/180;
            for(let i=0;i<n;i++){ let x=i*2/n-1; c[i]=(3+amt)*x*20*d/(Math.PI+amt*Math.abs(x)); }
            return c;
        })(100);
        src.connect(filter); filter.connect(shaper); shaper.connect(dst);
        return dst.stream;
    },
    async startVoice() {
        if (this.isRecording) return;
        try {
            const stream = await this.getProcessedStream();
            this.mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            this.mediaRecorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
            this.mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                if(blob.size > 500) {
                    const reader = new FileReader();
                    reader.onload = () => this.transmitMessage({ type: 'voice', body: reader.result, time: Date.now() });
                    reader.readAsDataURL(blob);
                }
                if(this.stream) this.stream.getTracks().forEach(t=>t.stop());
            };
            this.mediaRecorder.start();
            this.isRecording = true;
            document.getElementById('voice-toggle').classList.add('active');
            const recUI = document.getElementById('rec-ui'); recUI.style.display = 'flex';
            let sec = 0; this.recTimer = setInterval(()=>{
                sec++; let m=Math.floor(sec/60).toString().padStart(2,'0'), s=(sec%60).toString().padStart(2,'0');
                document.getElementById('rec-timer').innerText = `${m}:${s}`;
            }, 1000);
        } catch(e) { console.error(e); alert("Mic access denied"); }
    },
    stopVoice() {
        if(!this.isRecording) return;
        if(this.mediaRecorder) this.mediaRecorder.stop();
        clearInterval(this.recTimer);
        this.isRecording = false;
        document.getElementById('voice-toggle').classList.remove('active');
        document.getElementById('rec-ui').style.display = 'none';
        document.getElementById('rec-timer').innerText = '00:00';
    },
    toggleCyberMic() { this.isCyberMic = !this.isCyberMic; document.getElementById('cyber-mic-btn').classList.toggle('active', this.isCyberMic); },

    // ---------- ФАЙЛЫ (превью + отправка) ----------
    handleFile(file) {
        if (!file) return;
        if (file.size > 40*1024*1024) return alert("Max 40MB for stable transfer");
        this.pendingFile = file;
        const preview = document.getElementById('file-preview');
        preview.style.display = 'block';
        preview.innerHTML = `<i class="fa-solid fa-paperclip"></i> ${file.name} <span style="margin-left:10px; color:var(--accent); cursor:pointer;" onclick="App.sendPendingFile()">[SEND]</span>`;
    },
    sendPendingFile() {
        if (!this.pendingFile) return;
        const reader = new FileReader();
        reader.onload = () => {
            this.transmitMessage({ type: 'file', body: reader.result, name: this.pendingFile.name, time: Date.now() });
            this.pendingFile = null;
            document.getElementById('file-preview').style.display = 'none';
        };
        reader.readAsDataURL(this.pendingFile);
    },

    // ---------- ЗВОНКИ ----------
    async startCall() {
        if (!this.activePeer) return;
        const panel = document.getElementById('call-panel');
        panel.style.display = 'flex';
        document.getElementById('call-info').innerText = "CALLING...";
        document.getElementById('answer-btn').style.display = 'none';
        this.startRingtone();
        const stream = await this.getProcessedStream();
        const targetId = `imnode_${btoa(this.activePeer).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 16)}`;
        this.currentCall = this.peer.call(targetId, stream);
        this.currentCall.on('stream', remote => {
            this.stopRingtone();
            document.getElementById('call-info').innerText = "ON CALL";
            this.playRemote(remote);
        });
        this.currentCall.on('close', () => this.endCall());
    },
    acceptCall() {
        if (!this.currentCall) return;
        this.getProcessedStream().then(stream => {
            this.currentCall.answer(stream);
            document.getElementById('answer-btn').style.display = 'none';
            document.getElementById('call-info').innerText = "ON CALL";
            this.currentCall.on('stream', remote => this.playRemote(remote));
        }).catch(e=>console.log);
    },
    endCall() {
        if (this.currentCall) this.currentCall.close();
        this.stopRingtone();
        document.getElementById('call-panel').style.display = 'none';
        this.currentCall = null;
    },
    playRemote(stream) {
        let audio = document.getElementById('remote-audio');
        if (!audio) { audio = document.createElement('audio'); audio.id = 'remote-audio'; document.body.appendChild(audio); }
        audio.srcObject = stream; audio.play().catch(e=>console.log);
    },
    startRingtone() {
        if(this.ringCtx) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 900; gain.gain.value = 0.05;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        this.ringCtx = ctx; this.ringOsc = osc; this.ringGain = gain;
        let toggle = 0;
        this.ringInterval = setInterval(() => {
            if(this.ringGain) this.ringGain.gain.value = toggle ? 0.05 : 0;
            toggle ^= 1;
        }, 1000);
    },
    stopRingtone() {
        if(this.ringOsc) this.ringOsc.stop();
        clearInterval(this.ringInterval);
        if(this.ringCtx) this.ringCtx.close();
        this.ringCtx = null; this.ringOsc = null; this.ringGain = null;
    },

    toggleStealth() {
        this.isStealth = !this.isStealth;
        const btn = document.getElementById('stealth-toggle'); const flow = document.getElementById('messages-flow');
        if (this.isStealth) {
            btn.classList.add('active'); btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            flow.classList.add('stealth-active');
        } else {
            btn.classList.remove('active'); btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            flow.classList.remove('stealth-active');
        }
    }
};
</script>
