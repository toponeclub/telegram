<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMCHAT | BUNKER NODE v6 (Web3)</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ES Modules for Web3 (Thirdweb + XMTP) -->
    <script type="importmap">
    {
      "imports": {
        "thirdweb": "https://esm.sh/thirdweb@5.50.0",
        "thirdweb/wallets": "https://esm.sh/thirdweb@5.50.0/wallets",
        "thirdweb/storage": "https://esm.sh/thirdweb@5.50.0/storage",
        "@xmtp/xmtp-js": "https://esm.sh/@xmtp/xmtp-js@12"
      }
    }
    </script>
    <script type="module">
        import { Buffer } from "https://esm.sh/buffer@6.0.3";
        import { createThirdwebClient } from "thirdweb";
        import { inAppWallet, createWallet } from "thirdweb/wallets";
        import { upload, download } from "thirdweb/storage";
        import { Client as XMTPClient } from "@xmtp/xmtp-js";
        
        window.global = window;
        window.Buffer = window.Buffer || Buffer;
        
        window.Thirdweb = { createThirdwebClient, inAppWallet, createWallet, upload, download };
        window.XMTPClient = XMTPClient;

        window.dispatchEvent(new Event('web3-modules-loaded'));
    </script>

    <style>
        /* ==========================================================================
           CSS VARIABLES & THEME (Untouched as requested)
           ========================================================================== */
        :root {
            --bg-main: #030405;
            --bg-panel: rgba(12, 14, 18, 0.85);
            --bg-hover: rgba(255, 255, 255, 0.03);

            --accent: #00ffd5;
            --accent-dim: rgba(0, 255, 213, 0.1);
            --accent-glow: 0 0 15px rgba(0, 255, 213, 0.4);

            --border-light: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(0, 255, 213, 0.3);

            --text-main: #f0f0f0;
            --text-muted: #7a828e;

            --danger: #ff3366;
            --warning: #ffb800;
            --success: #00e676;

            --glass-blur: blur(24px);
            --anim-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app-shell {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at 50% 0%, #0d161a 0%, var(--bg-main) 80%);
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 340px;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            z-index: 20;
            flex-shrink: 0;
            transition: transform var(--anim-speed) cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .node-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .node-identity {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .node-id-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
            border: 1px solid var(--border-accent);
        }

        .list-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            padding: 20px 20px 10px 20px;
            text-transform: uppercase;
        }

        .contacts-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-card {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 6px;
            border: 1px solid transparent;
            position: relative;
            transition: all 0.2s ease;
        }

        .contact-card:hover {
            background: var(--bg-hover);
        }

        .contact-card.active {
            background: var(--accent-dim);
            border-color: var(--border-accent);
        }

        .contact-card.request {
            border: 1px dashed var(--warning);
            background: rgba(255, 184, 0, 0.05);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-address {
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .contact-status-text {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-actions {
            position: absolute;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background: var(--accent);
            box-shadow: var(--accent-glow);
        }

        .status-dot.pending {
            background: var(--warning);
            box-shadow: 0 0 10px rgba(255, 184, 0, 0.4);
        }

        .sidebar-footer {
            padding: 24px;
            border-top: 1px solid var(--border-light);
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.03)"/></svg>');
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            z-index: 10;
        }

        .mobile-back-btn {
            display: none;
            color: var(--accent);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: 20px;
            padding: 5px;
        }

        .messages-flow {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            word-break: break-word;
            transition: all var(--anim-speed) ease;
        }

        .msg-sent .msg-bubble {
            background: var(--accent-dim);
            border: 1px solid var(--border-accent);
            color: var(--accent);
            border-bottom-right-radius: 4px;
        }

        .msg-received .msg-bubble {
            background: #161920;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .msg-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .stealth-active .msg-bubble {
            filter: blur(10px);
            opacity: 0.3;
            cursor: pointer;
            user-select: none;
        }

        .stealth-active .msg-bubble:hover,
        .stealth-active .msg-bubble:active {
            filter: blur(0);
            opacity: 1;
        }

        .controls-bar {
            padding: 20px 30px;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 16px;
            align-items: center;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
        }

        .input-field {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 16px 20px;
            color: #fff;
            outline: none;
            min-width: 0;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent);
            background: var(--bg-hover);
        }

        .icon-btn.active {
            color: var(--accent);
            background: var(--accent-dim);
        }

        .icon-btn.danger:hover {
            color: var(--danger);
        }

        .btn-action {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border-accent);
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-action:hover {
            background: var(--accent-dim);
            box-shadow: var(--accent-glow);
        }

        .btn-solid {
            background: var(--accent);
            color: #000;
            border: none;
        }

        .btn-solid:hover {
            background: #00e6c0;
            box-shadow: var(--accent-glow);
        }

        .btn-send {
            background: var(--accent);
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: #00e6c0;
        }

        .avatar-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .pixel {
            width: 100%;
            height: 100%;
        }

        .full-overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 4, 5, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            text-align: center;
            padding: 20px;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            background-image: radial-gradient(circle at 50% 50%, #0a1114 0%, #030405 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                height: 100%;
                border-right: none;
            }

            .chat-view {
                width: 100%;
                position: absolute;
                height: 100%;
                transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .app-shell.in-chat .sidebar {
                transform: translateX(-20%);
                opacity: 0;
                pointer-events: none;
            }

            .app-shell.in-chat .chat-view {
                transform: translateX(0);
            }

            .mobile-back-btn {
                display: flex;
            }

            .msg-wrapper {
                max-width: 90%;
            }

            .controls-bar {
                padding: 12px 16px;
            }

            .chat-header {
                padding: 16px;
            }

            .auth-card {
                padding: 30px 20px;
                border: none;
                background: transparent;
                box-shadow: none;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease forwards;
        }

        .rec-status {
            display: none;
            color: var(--danger);
            font-family: 'JetBrains Mono';
            font-size: 12px;
            margin-right: 10px;
            align-items: center;
            gap: 5px;
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: rec-pulse 1s infinite;
        }

        @keyframes rec-pulse {
            50% {
                opacity: 0;
            }
        }

        .call-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--accent-dim);
            padding: 15px;
            align-items: center;
            justify-content: space-between;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .file-pre-view {
            display: none;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid var(--border-light);
            font-size: 12px;
            color: var(--accent);
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card animate-fade">
            <h1 style="letter-spacing: 8px; font-weight: 300; margin-bottom: 5px;">IMCHAT</h1>
            <p style="color: var(--accent); font-size: 10px; margin-bottom: 40px; font-family: 'JetBrains Mono';">
                WEB3_XMTP_NODE_v6</p>

            <div id="initial-connect-box">
                <button class="btn-action btn-solid" style="padding: 18px; font-size: 14px;"
                    onclick="App.showWalletSelector()" id="btn-connect-init" disabled>
                    <i class="fa-solid fa-spinner fa-spin"></i> &nbsp; LOADING WEB3...
                </button>
            </div>

            <div id="wallet-selector" style="display: none; animation: fadeIn 0.3s;">
                <p style="font-size: 10px; color: var(--text-muted); margin-bottom: 20px; letter-spacing: 1px;">WEB3
                    AUTHENTICATION:</p>
                <div style="display: grid; gap: 12px;" id="detected-wallets">
                    <!-- Injected dynamically via JS -->
                </div>
                <button class="icon-btn" style="margin: 20px auto 0;" onclick="App.hideWalletSelector()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>

            <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 20px; height: 15px;"></p>
        </div>
    </div>

    <div class="app-shell" id="app-shell">
        <aside class="sidebar">
            <div class="node-header">
                <div class="node-identity">
                    <div id="my-avatar"></div>
                    <div class="node-id-tag" id="my-address-display">0x...</div>
                </div>
                <button class="icon-btn" title="Disconnect Node" onclick="App.logout()">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>

            <div class="contacts-scroll" id="contacts-list"></div>

            <div class="sidebar-footer">
                <input type="text" id="add-peer-id" class="input-field" placeholder="Enter Wallet 0x..."
                    style="font-size: 12px; margin-bottom: 12px; width: 100%; background: rgba(0,0,0,0.5);">
                <button class="btn-action" onclick="App.addContact()">ADD CONTACT</button>
            </div>
        </aside>

        <main class="chat-view">
            <div id="call-panel" class="call-overlay">
                <div id="call-info">CALLING...</div>
                <div style="display: flex; gap: 10px;">
                    <button id="answer-btn" class="icon-btn" style="display:none; color:var(--accent);"
                        onclick="App.acceptCall()"><i class="fa-solid fa-phone"></i></button>
                    <button class="icon-btn" style="color:var(--danger);" onclick="App.endCall()"><i
                            class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>

            <div id="empty-state" class="full-overlay">
                <i class="fa-solid fa-shield-halved"
                    style="font-size: 48px; color: var(--border-light); margin-bottom: 24px;"></i>
                <p style="color: var(--text-muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase;">
                    Awaiting Secure Connection</p>
            </div>

            <div id="request-state" class="full-overlay"
                style="display: none; z-index: 6; background: rgba(3, 4, 5, 0.98);">
                <div id="req-avatar" style="margin-bottom: 24px; transform: scale(1.5);"></div>
                <p
                    style="color: var(--text-main); font-size: 15px; margin-bottom: 40px; font-family: 'JetBrains Mono'; line-height: 1.6;">
                    Node <span id="req-id" style="color:var(--accent);"></span><br>
                    <span style="font-size: 12px; color: var(--text-muted); font-family: 'Inter';">Requests an encrypted
                        E2E tunnel</span>
                </p>
                <div style="display: flex; gap: 16px; width: 100%; max-width: 280px;">
                    <button class="btn-action btn-solid" style="flex:1;" onclick="App.acceptHandshake()">ACCEPT</button>
                    <button class="btn-action" style="flex:1; border-color: var(--danger); color: var(--danger);"
                        onclick="App.declineHandshake()">DECLINE</button>
                </div>
            </div>

            <header class="chat-header">
                <div style="display: flex; align-items: center;">
                    <button class="mobile-back-btn" onclick="App.closeChatMobile()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="active-avatar" style="margin-right: 16px;"></div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <div id="active-peer-name"
                            style="font-weight: 700; font-size: 15px; font-family: 'JetBrains Mono';">Unknown_Node</div>
                        <div
                            style="font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
                            <span class="status-dot" id="active-status-dot"></span>
                            <span id="active-status-text">DISCONNECTED</span>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <button class="icon-btn" id="stealth-toggle" onclick="App.toggleStealth()"
                        title="Toggle Stealth (Blur)">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                    <button class="icon-btn" title="Send Crypto (Soon)">
                        <i class="fa-solid fa-wallet"></i>
                    </button>
                    <button class="icon-btn danger" title="Clear Chat History" onclick="App.clearChat()">
                        <i class="fa-solid fa-broom"></i>
                    </button>
                </div>
            </header>

            <div class="messages-flow" id="messages-flow"></div>
            <div id="file-pre-view" class="file-pre-view"></div>

            <footer class="controls-bar" id="controls-bar">
                <div id="rec-ui" class="rec-status">
                    <div class="rec-dot"></div><span id="rec-timer">00:00</span>
                </div>
                <input type="file" id="file-input" hidden onchange="App.handleFile(this.files[0])">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Send File">
                    <i class="fa-solid fa-paperclip"></i>
                </button>

                <button class="icon-btn" id="voice-toggle" onmousedown="App.startVoice()" onmouseup="App.stopVoice()"
                    title="Hold to Record">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <button class="icon-btn" id="cyber-mic-btn" onclick="App.toggleCyberMic()" title="Cyber-Mic Distortion">
                    <i class="fa-solid fa-robot"></i>
                </button>

                <button class="icon-btn" id="call-btn" onclick="App.toggleCall()" title="P2P Voice Call">
                    <i class="fa-solid fa-phone"></i>
                </button>

                <audio id="remote-audio" autoplay style="display:none;"></audio>

                <input type="text" id="chat-input" class="input-field" placeholder="Transmit secure message..."
                    onkeypress="if(event.key === 'Enter') App.sendText()">

                <button class="icon-btn btn-send" onclick="App.sendText()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </footer>
        </main>
    </div>

    <script>
        /**
         * ============================================================================
         * IMCHAT WEB3 ENGINE v6.0
         * Architecture: XMTP (Messaging), IPFS (Storage), WebRTC (Calls)
         * ============================================================================
         */

        // ----------------------------------------------------------------------------
        // 1. EIP-6963 WALLET DISCOVERY LISTENER
        // ----------------------------------------------------------------------------
        const EIPProviders = {};
        window.addEventListener("eip6963:announceProvider", (event) => {
            EIPProviders[event.detail.info.uuid] = event.detail;
        });
        window.dispatchEvent(new Event("eip6963:requestProvider"));

        // ----------------------------------------------------------------------------
        // 2. GENERATIVE AVATAR ENGINE
        // ----------------------------------------------------------------------------
        const AvatarEngine = {
            generate(address, targetId) {
                const hash = address.toLowerCase().replace('0x', '');
                const container = document.getElementById(targetId);
                if (!container) return;

                container.innerHTML = '';
                container.className = 'avatar-box';

                const hue = parseInt(hash.substring(0, 4), 16) % 360;
                const mainColor = `hsl(${hue}, 80%, 60%)`;
                const baseDark = `hsl(${hue}, 30%, 12%)`;

                container.style.backgroundColor = baseDark;

                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 5; col++) {
                        const pixel = document.createElement('div');
                        pixel.className = 'pixel';
                        const mirrorCol = col > 2 ? 4 - col : col;
                        const index = row * 3 + mirrorCol;

                        if (hash.charCodeAt(index % hash.length) % 2 === 0) {
                            pixel.style.backgroundColor = mainColor;
                            pixel.style.boxShadow = `0 0 8px ${mainColor}`;
                        }

                            let msgHex;
                            if (typeof message === 'string') {

                                    msgHex = message;
                                } else {
                                    msgHex = '0x' + Array.from(new TextEncoder().encode(message))
                                        .map(b => b.toString(16).padStart(2, '0')).join('');
                                }
                            } else {
                                msgHex = '0x' + Array.from(message).map(b => b.toString(16).padStart(2, '0')).join('');

                            return await wallet.provider.request({
                                method: 'personal_sign',
                                params: [msgHex, address]

            /* --- ISOLATED STORAGE & IPFS METADATA --- */

            getDB(key) { return JSON.parse(localStorage.getItem(this.dbPrefix + key) || '[]'); },

            removeContactFromDB(addr) {

            async saveContactsToIPFS() {
                try {
                    const data = JSON.stringify(this.getContacts());
                    const fileKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, fileKey, new TextEncoder().encode(data));

                    const blob = new Blob([encrypted]);
                    const uri = await window.Thirdweb.upload({ client: this.client, files: [new File([blob], "contacts.json")] });

                    const exportedKey = await crypto.subtle.exportKey("raw", fileKey);
                    const metadata = { uri: uri, iv: Array.from(iv), key: Array.from(new Uint8Array(exportedKey)) };

                    // Simulating Contract Metadata pointer with localStorage
                    localStorage.setItem(this.myAddress + "_contract_metadata", JSON.stringify(metadata));
                    console.log("[IPFS] Contacts synced to decentralized storage");
                } catch (e) { console.error("Contacts sync failed", e); }
            },

            async loadContactsFromIPFS() {
                const metaStr = localStorage.getItem(this.myAddress + "_contract_metadata");
                if (!metaStr) return;
                try {
                    const meta = JSON.parse(metaStr);
                    const res = await window.Thirdweb.download({ client: this.client, uri: meta.uri });
                    const blob = await res.blob();
                    const buffer = await blob.arrayBuffer();

                    const importedKey = await crypto.subtle.importKey("raw", new Uint8Array(meta.key), { name: "AES-GCM" }, false, ["decrypt"]);
                    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(meta.iv) }, importedKey, buffer);

                    const contacts = JSON.parse(new TextDecoder().decode(decrypted));
                    this.setDB('contacts', contacts);
                    console.log("[IPFS] Contacts loaded from decentralized storage");
                } catch (e) { console.error("Failed to load contacts from IPFS", e); }
            },

            /* --- XMTP DECENTRALIZED MESSAGING --- */

            async listenToXMTP() {
                const stream = await this.xmtp.conversations.streamAllMessages();
                for await (const message of stream) {
                    if (message.senderAddress.toLowerCase() === this.myAddress) continue;
                    const sender = message.senderAddress.toLowerCase();
                    const isKnown = this.getContacts().includes(sender);

                    if (!isKnown) {
                        if (!this.incomingRequests[sender]) this.incomingRequests[sender] = [];
                        this.incomingRequests[sender].push(message);
                        this.renderSidebar();
                    } else {
                        this.processMessage(sender, message.content, message.sent);
                    }
                }
            },

            async processMessage(sender, contentStr, time) {
                let msg = contentStr;
                if (typeof contentStr === 'string') {
                    try { msg = JSON.parse(contentStr); }
                    catch (e) { msg = { type: 'text', body: contentStr }; }
                }

                // WebRTC Signaling over XMTP
                if (msg.type === 'rtc_offer') {
                    this.incomingCallOffer = msg.offer;
                    this.incomingCallAddr = sender;
                    document.getElementById('call-panel').style.display = 'flex';
                    document.getElementById('answer-btn').style.display = 'inline-flex';
                    document.getElementById('call-info').innerText = "INCOMING CALL...";
                    return;
                }
                if (msg.type === 'rtc_answer') {
                    const pc = this.rtcConnections[sender];
                    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
                    return;
                }
                if (msg.type === 'rtc_candidate') {
                    const pc = this.rtcConnections[sender];
                    if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    return;
                }
                if (msg.type === 'rtc_hangup') {
                    this.endCall();
                    return;
                }

                // IPFS File Decryption
                if (msg.type === 'file' || msg.type === 'voice') {
                    try {
                        const res = await window.Thirdweb.download({ client: this.client, uri: msg.uri });
                        const blob = await res.blob();
                        const buffer = await blob.arrayBuffer();

                        const importedKey = await crypto.subtle.importKey("raw", new Uint8Array(msg.key), { name: "AES-GCM" }, false, ["decrypt"]);
                        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(msg.iv) }, importedKey, buffer);

                        const decBlob = new Blob([decrypted]);
                        msg.body = URL.createObjectURL(decBlob);
                    } catch (e) {
                        console.error("File decryption failed:", e);
                        msg.body = "[Encrypted File - Decryption Failed]";
                    }
                }

                if (this.activePeer === sender) {
                    this.renderMessage(msg, 'received', time || Date.now());
                }
            },

            async sendDirectXMTP(addr, payload) {
                if (!this.xmtp) return;
                try {
                    const conversation = await this.xmtp.conversations.newConversation(addr);
                    const textStr = typeof payload === 'string' ? payload : JSON.stringify(payload);
                    await conversation.send(textStr);
                } catch (e) { console.error("XMTP send error:", e); }
            },

            async acceptHandshake() {

            toggleStealth() {

                if (this.isStealth) {

            async sendText() {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text || !this.activePeer) return;

                const msg = { type: 'text', body: text, time: Date.now() };

            renderMessage(msg, direction, timeStr) {
                const flow = document.getElementById('messages-flow');
                const wrapper = document.createElement('div');
                wrapper.className = `msg-wrapper ${direction}`;

                let content = '';
                if (msg.type === 'text') { content = msg.body; }
                else if (msg.type === 'voice') { content = `<audio src="${msg.body}" controls style="height:35px; border-radius:10px;"></audio>`; }
                else if (msg.type === 'file') { content = `<a href="${msg.body}" download="${msg.name}" style="color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-file-arrow-down" style="font-size:18px;"></i> ${msg.name}</a>`; }

                const timeFormat = new Date(timeStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                wrapper.innerHTML = `
            <div class="msg-bubble">${content}</div>
            <div class="msg-meta">${timeFormat}</div>
        `;
                flow.appendChild(wrapper);
                flow.scrollTop = flow.scrollHeight;
            },

            // --- Files & IPFS ---

            async uploadToIPFSAndSend(fileBlob, name, type) {
                const fileKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const buffer = await fileBlob.arrayBuffer();
                const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, fileKey, buffer);

                const blob = new Blob([encrypted]);
                const uri = await window.Thirdweb.upload({ client: this.client, files: [new File([blob], name)] });

                const exportedKey = await crypto.subtle.exportKey("raw", fileKey);

                const payload = {
                    type: type,
                    name: name,
                    uri: uri,
                    iv: Array.from(iv),
                    key: Array.from(new Uint8Array(exportedKey)),
                    time: Date.now()
                };

                await this.sendDirectXMTP(this.activePeer, payload);
                const displayMsg = { ...payload, body: URL.createObjectURL(fileBlob) };
                this.renderMessage(displayMsg, 'sent', Date.now());
            },

            async handleFile(f) {
                if (!f || !this.activePeer) return;
                if (f.size > 1000 * 1024 * 1024) return alert("Max 1GB allowed");

                document.getElementById('file-pre-view').innerText = `Encrypting and uploading ${f.name} to IPFS...`;
                document.getElementById('file-pre-view').style.display = 'block';
                try {
                    await this.uploadToIPFSAndSend(f, f.name, 'file');
                } catch (e) { alert("Upload failed: " + e.message); }
                document.getElementById('file-pre-view').style.display = 'none';
            },

            // --- Voice Audio & Cyber-Mic ---

            toggleCyberMic() {
                this.isCyberMic = !this.isCyberMic;
                document.getElementById('cyber-mic-btn').classList.toggle('active', this.isCyberMic);
            },

            makeDistCurve(amount) {
                let k = amount || 50, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180, x;
                for (let i = 0; i < n_samples; ++i) {
                    x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
                return curve;
            },

            async getProcessedStream() {
                this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();

                const source = this.audioCtx.createMediaStreamSource(this.stream);
                const destination = this.audioCtx.createMediaStreamDestination();

                if (this.isCyberMic) {
                    const filter = this.audioCtx.createBiquadFilter();
                    filter.type = "bandpass";
                    filter.frequency.value = 1000;
                    filter.Q.value = 1.0;
                    const dist = this.audioCtx.createWaveShaper();
                    dist.curve = this.makeDistCurve(100);
                    source.connect(filter);
                    filter.connect(dist);
                    dist.connect(destination);
                } else {
                    source.connect(destination);
                }
                return destination.stream;
            },

            async startVoice(e) {
                if (e) e.preventDefault();
                try {
                    const processedStream = await this.getProcessedStream();
                    this.mediaRecorder = new MediaRecorder(processedStream, { mimeType: 'audio/webm' });
                    let chunks = [];
                    this.mediaRecorder.ondataavailable = ev => chunks.push(ev.data);
                    this.mediaRecorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        if (blob.size > 500) {
                            document.getElementById('file-pre-view').innerText = `Uploading Voice to IPFS...`;
                            document.getElementById('file-pre-view').style.display = 'block';
                            await this.uploadToIPFSAndSend(blob, "voice.webm", 'voice');
                            document.getElementById('file-pre-view').style.display = 'none';
                        }
                        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                    };
                    this.mediaRecorder.start();
                    this.isRecording = true;
                    document.getElementById('voice-toggle').style.color = "var(--danger)";
                } catch (err) { console.error("Mic error:", err); }
            },

            stopVoice(e) {
                if (e) e.preventDefault();
                if (this.mediaRecorder && this.isRecording) {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    document.getElementById('voice-toggle').style.color = "";
                }
            },

            // --- WebRTC Calls over XMTP Signaling ---

            async toggleCall() {
                const addr = this.activePeer;
                if (!addr) return;

                if (this.rtcConnections[addr]) {
                    this.endCall();
                    return;
                }

                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                this.rtcConnections[addr] = pc;
                this.setupRtcEvents(pc, addr);

                try {
                    const stream = await this.getProcessedStream();
                    stream.getTracks().forEach(t => pc.addTrack(t, stream));

                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);

                    await this.sendDirectXMTP(addr, { type: 'rtc_offer', offer });

                    document.getElementById('call-btn').style.color = "var(--success)";
                    document.getElementById('call-panel').style.display = 'flex';
                    document.getElementById('call-info').innerText = "CALLING...";
                    document.getElementById('answer-btn').style.display = 'none';
                } catch (e) {
                    console.error("Call error:", e);
                    this.endCall();
                }
            },

            setupRtcEvents(pc, addr) {
                pc.ontrack = e => {
                    const audio = document.getElementById('remote-audio');
                    audio.srcObject = e.streams[0];
                    audio.play();
                    document.getElementById('call-info').innerText = "CONNECTED";
                };
                pc.onicecandidate = e => {
                    if (e.candidate) {
                        this.sendDirectXMTP(addr, { type: 'rtc_candidate', candidate: e.candidate });
                    }
                };
                pc.oniceconnectionstatechange = () => {
                    if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                        this.endCall();
                    }
                };
            },

            async acceptCall() {
                document.getElementById('answer-btn').style.display = 'none';
                const addr = this.incomingCallAddr;
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                this.rtcConnections[addr] = pc;
                this.setupRtcEvents(pc, addr);

                try {
                    const stream = await this.getProcessedStream();
                    stream.getTracks().forEach(t => pc.addTrack(t, stream));

                    await pc.setRemoteDescription(new RTCSessionDescription(this.incomingCallOffer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);

                    await this.sendDirectXMTP(addr, { type: 'rtc_answer', answer });
                    document.getElementById('call-btn').style.color = "var(--success)";
                    document.getElementById('call-info').innerText = "CONNECTING...";
                } catch (e) {
                    console.error("Accept call error:", e);
                    this.endCall();
                }
            },

            endCall() {
                for (const addr in this.rtcConnections) {
                    this.rtcConnections[addr].close();
                    delete this.rtcConnections[addr];
                }
                if (this.stream) {
                    this.stream.getTracks().forEach(t => t.stop());
                    this.stream = null;
                }
                document.getElementById('call-panel').style.display = 'none';
                document.getElementById('call-btn').style.color = "";

                if (this.activePeer) this.sendDirectXMTP(this.activePeer, { type: 'rtc_hangup' });
            }
        };

        window.addEventListener('web3-modules-loaded', () => App.initModules());
    </script>
</body>
